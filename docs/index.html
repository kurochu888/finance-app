<script>
/* Firebase 是 module script,一定比 app 晚執行;
   先放一個 promise 佔位,讓 app 啟動時就有東西可以等。 */
window.FinanceCloud = {};
window.FinanceCloud.ready = new Promise(resolve => {
  let settled = false;
  window.__financeCloudResolve = v => { if (!settled){ settled = true; resolve(v); } };
  // 離線或載入失敗時別讓 app 一直等
  setTimeout(() => window.__financeCloudResolve(null), 15000);
});
</script>

<script>
/* ===================== 小工具 ===================== */
const uid = () => Math.random().toString(36).slice(2,9);
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const fmt = n => (Math.round(n) || 0).toLocaleString('zh-Hant-TW');
const fmtPct = n => (n >= 0 ? '+' : '') + n.toFixed(1) + '%';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad2 = n => String(n).padStart(2, '0');
function todayISO(){ const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
const thisMonth = () => todayISO().slice(0,7);
function monthLabel(m){ const p = m.split('-'); return p[0] + '年' + Number(p[1]) + '月'; }
function shortMonth(m){ return Number(m.split('-')[1]) + '月'; }
function shiftMonth(m, delta){
  const y = Number(m.slice(0,4)), mo = Number(m.slice(5,7)) - 1 + delta;
  const d = new Date(y, mo, 1);
  return d.getFullYear() + '-' + pad2(d.getMonth()+1);
}
function daysSince(dateStr){
  if (!dateStr) return 0;
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d.getTime())) return 0;
  return Math.max(0, (Date.now() - d.getTime()) / 86400000);
}
function canon(v){
  if (Array.isArray(v)) return '[' + v.map(canon).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
  return JSON.stringify(v === undefined ? null : v);
}
const SERIES = ['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)','var(--s6)','var(--s7)','var(--s8)'];
const seriesColor = i => i < SERIES.length ? SERIES[i] : 'var(--s9)';

/* ===================== 預設狀態 ===================== */
const DEFAULT_LEVERAGE = {
  shares675L:0, price675L:0, shares631L:0, price631L:0,
  marketHigh:0, marketCurrent:0, historicalHighValue:0,
  stressDeclinePct:20, creditLimit:5000000, annualRate:2.6, autoHigh:true,
  autoInterest:true, interestPosted:[], quoteDate:'',
  tranches:[
    { id:'t1', label:'第一桶金', thresholdPct:-20, amount:1000000, useDate:'' },
    { id:'t2', label:'第二桶金', thresholdPct:-32, amount:1000000, useDate:'' },
    { id:'t3', label:'第三桶金', thresholdPct:-45, amount:1000000, useDate:'' }
  ],
  core:{ label:'長期投資部位', amount:2000000, useDate:'' }
};
const DEFAULT_BUDGETS = ['房貸 / 房租','餐飲','交通','娛樂','其他'];

function emptyState(){
  return {
    version:2,
    assets:[], liabilities:[], trades:[],
    budgets: DEFAULT_BUDGETS.map(n => ({ id:uid(), name:n, budget:0 })),
    transactions:[], netWorthHistory:[],
    leverage: JSON.parse(JSON.stringify(DEFAULT_LEVERAGE))
  };
}

function normalize(raw){
  const s = emptyState();
  if (!raw || typeof raw !== 'object') return s;
  const arr = v => Array.isArray(v) ? v : [];
  s.assets = arr(raw.assets).map(a => ({ id:a.id||uid(), name:String(a.name||''), amount:num(a.amount) }));
  s.liabilities = arr(raw.liabilities).map(a => ({ id:a.id||uid(), name:String(a.name||''), amount:num(a.amount) }));
  if (Array.isArray(raw.budgets)) s.budgets = raw.budgets.map(b => ({ id:b.id||uid(), name:String(b.name||''), budget:num(b.budget) }));
  s.trades = arr(raw.trades).map(t => ({
    id: t.id || uid(),
    date: String(t.date || todayISO()).slice(0, 10),
    symbol: String(t.symbol || '00631L'),
    action: t.action === 'sell' ? 'sell' : 'buy',
    shares: num(t.shares),
    price: num(t.price),
    fee: num(t.fee),
    source: t.source === 'loan' ? 'loan' : 'cash',
    note: String(t.note || '')
  }));
  s.transactions = arr(raw.transactions).map(t => ({
    id:t.id||uid(), date:String(t.date||todayISO()).slice(0,10),
    cat:String(t.cat||'其他'), desc:String(t.desc||''), amount:num(t.amount)
  }));
  s.netWorthHistory = arr(raw.netWorthHistory)
    .map(h => ({
      id: h.id || uid(),
      m: String(h.m || '').slice(0, 7),
      v: num(h.v),
      pv: h.pv === undefined ? null : num(h.pv),      // 部位市值
      pnl: h.pnl === undefined ? null : num(h.pnl),   // 整體損益
      loan: h.loan === undefined ? null : num(h.loan),// 借款餘額
      auto: h.auto !== false                           // 手動改過的不再被自動覆蓋
    }))
    .filter(h => /^\d{4}-\d{2}$/.test(h.m));
  const L = raw.leverage && typeof raw.leverage === 'object' ? raw.leverage : {};
  const base = s.leverage;
  ['shares675L','price675L','shares631L','price631L','marketHigh','marketCurrent',
   'historicalHighValue','stressDeclinePct','creditLimit','annualRate'].forEach(k => {
    if (L[k] !== undefined) base[k] = num(L[k]);
  });
  if (Array.isArray(L.tranches) && L.tranches.length){
    base.tranches = L.tranches.map((t, i) => ({
      id: t.id || ('t' + (i+1)),
      label: String(t.label || ('第' + (i+1) + '桶金')),
      thresholdPct: num(t.thresholdPct),
      amount: num(t.amount),
      useDate: String(t.useDate || ''),
      useIndex: num(t.useIndex),
      note: String(t.note || '')
    }));
  }
  base.autoHigh = L.autoHigh !== false;       // 舊資料沒有這些欄位時給預設值
  base.autoInterest = L.autoInterest !== false;
  base.interestPosted = Array.isArray(L.interestPosted) ? L.interestPosted.map(String) : [];
  base.quoteDate = String(L.quoteDate || '');
  if (L.core && typeof L.core === 'object'){
    base.core = { label:String(L.core.label || '長期投資部位'), amount:num(L.core.amount), useDate:String(L.core.useDate || '') };
  }
  return s;
}

/* 舊版(只有槓桿頁)的存檔搬過來 */
function fromLegacy(old){
  const s = emptyState();
  const L = s.leverage;
  ['shares675L','price675L','shares631L','price631L','marketHigh','marketCurrent',
   'historicalHighValue','stressDeclinePct'].forEach(k => { if (old[k] !== undefined) L[k] = num(old[k]); });
  const dates = old.trancheDates || {};
  L.tranches.forEach(t => { if (dates[t.id]) t.useDate = String(dates[t.id]); });
  if (old.coreUseDate) L.core.useDate = String(old.coreUseDate);
  return s;
}

let state = emptyState();

/* ===================== 存檔:雲端 + 本機備份 =====================
   兩種雲端來源,誰在就用誰:
     · Claude Artifact  → 平台內建的 db,開網址即同步
     · 網頁版           → Firebase Firestore,需用 Google 帳號登入
   兩者都沒有時就只存本機 localStorage,功能完全不受影響。      */
const STORAGE_NOTE = '資料存在這台裝置的瀏覽器裡,不會上傳到任何地方,也不需要登入。';
const DOC_PATH = 'state/finance';
const LEGACY_DOC_PATH = 'state/leverage';
const STORAGE_KEY = 'financeAppState_v2';
const LEGACY_KEY = 'financeAppLeverageData_v1';

let storageMode = 'local';   // 'cloud' | 'local' | 'none'
let cloud = null;            // { get, set, onChange } — 已連上的雲端
let cloudKind = 'none';      // 'claude' | 'firebase' | 'none'
let authUser = null;         // Firebase 已登入的帳號
let authBusy = false;
let downloadsNs = null;
let lastPushed = '';
let pendingRemote = null;
let saveTimer = null;

function readLocal(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
    const legacy = localStorage.getItem(LEGACY_KEY);
    if (legacy) return fromLegacy(JSON.parse(legacy));
    return null;
  }catch(e){ return null; }
}
function writeLocal(data){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); return true; }
  catch(e){ return false; }
}
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 400);
}
async function save(){
  const data = JSON.parse(JSON.stringify(state));
  const ok = writeLocal(data);
  if (cloud){
    try{
      lastPushed = canon(data);
      await cloud.set(data);
      storageMode = 'cloud';
      updateStorageStatus();
      return;
    }catch(e){ /* 雲端寫入失敗就靠本機,下次編輯會再試 */ }
  }
  storageMode = ok ? 'local' : 'none';
  updateStorageStatus();
}
function updateStorageStatus(){
  const el = document.getElementById('storageStatus');
  if (!el) return;
  if (storageMode === 'cloud'){
    el.textContent = cloudKind === 'firebase' && authUser
      ? '☁️ 已同步到 ' + authUser.email + ' — 其他裝置登入同一帳號就看得到'
      : '☁️ 已存到雲端 — 手機、電腦開同一個網址都看得到';

/* 收到雲端資料:正在打字就先擱著,等游標離開欄位再套用 */
function onRemote(data){
  if (!data) return;
  if (canon(data) === lastPushed) return;
  if (document.activeElement && document.activeElement.tagName === 'INPUT'){
    pendingRemote = data;
    return;
  }
  applyRemote(data);
}
function applyRemote(data){
  state = normalize(data);
  lastPushed = canon(JSON.parse(JSON.stringify(state)));
  writeLocal(state);
  renderAll();
}

/* 第一次連上雲端:雲端有資料就拉下來,沒有就把本機的推上去 */
async function syncFirstTime(){
  try{
    const remote = await cloud.get();
    storageMode = 'cloud';
    if (remote){
      applyRemote(remote);
    }else{
      await save();
    }
    cloud.onChange(onRemote);
    updateStorageStatus();
    if (maybePostInterest() || maybeSnapshot()) renderAll();
    maybeBackup();
  }catch(e){
    cloud = null;
    storageMode = 'local';
    updateStorageStatus();
  }
}

async function connectCloud(){
  // 1) Claude Artifact:平台內建的資料庫
  if (window.claude && typeof window.claude.use === 'function'){
    try{
      const db = await window.claude.use('db');
      if (db){
        const ref = db.doc(DOC_PATH);
        cloudKind = 'claude';
        cloud = {
          get: async () => {
            const snap = await ref.get();
            if (snap.exists) return snap.data();
            // 第一次上雲時,把舊版只有槓桿頁的存檔帶過來
            if (!readLocal()){
              try{
                const old = await db.doc(LEGACY_DOC_PATH).get();
                if (old.exists) return fromLegacy(old.data());
              }catch(e){ /* 沒有舊資料 */ }
            }
            return null;
          },
          set: d => ref.set(d),
          onChange: cb => ref.onSnapshot(s => { if (s.exists) cb(s.data()); }, () => {}),
          backups: {
            list: async () => {
              const snap = await db.collection('backups').get();
              return snap.docs.map(d => d.id).sort().reverse();
            },
            get: async id => {
              const s2 = await db.doc('backups/' + id).get();
              return s2.exists ? s2.data() : null;
            },
            put: (id, data) => db.doc('backups/' + id).set(data),
            del: id => db.doc('backups/' + id).delete()
          }
        };
        await syncFirstTime();
        return;
      }
    }catch(e){ /* 不是在 Artifact 裡,往下試 Firebase */ }
  }

  // 2) 網頁版:Firebase,登入後才有雲端
  if (window.FinanceCloud){
    try{
      const fb = await window.FinanceCloud.ready;
      if (!fb) return;               // 還沒設定 Firebase,維持本機模式
      cloudKind = 'firebase';
      updateStorageStatus();
      fb.onAuth(user => {
        authUser = user;
        authBusy = false;
        if (user){
          cloud = fb.docApi();
          syncFirstTime();
        }else{
          cloud = null;
          storageMode = 'local';
          updateStorageStatus();
        }
        renderAll();
      });
    }catch(e){ /* 載入失敗:維持本機模式 */ }
  }
}

/* ===================== 每日備份 =====================
   雲端可用時存在雲端的 backups 集合,否則存本機。每天一份,保留 30 天。 */
const BACKUP_KEEP = 30;
const BACKUP_PREFIX = 'financeBackup_';
const BACKUP_TS_KEY = 'financeLastBackup';

let backupOpen = false;
let backupList = null;     // null = 還沒讀 / 讀取中

function localBackupApi(){
  return {
    list: async () => {
      const ids = [];
      for (let i = 0; i < localStorage.length; i++){
        const k = localStorage.key(i);
        if (k && k.startsWith(BACKUP_PREFIX)) ids.push(k.slice(BACKUP_PREFIX.length));
      }
      return ids.sort().reverse();
    },
    get: async id => {
      const raw = localStorage.getItem(BACKUP_PREFIX + id);
      return raw ? JSON.parse(raw) : null;
    },
    put: async (id, data) => localStorage.setItem(BACKUP_PREFIX + id, JSON.stringify(data)),
    del: async id => localStorage.removeItem(BACKUP_PREFIX + id)
  };
}
function backupApi(){
  return (cloud && cloud.backups) ? cloud.backups : localBackupApi();
}
async function maybeBackup(){
  const today = todayISO();
  try{ if (localStorage.getItem(BACKUP_TS_KEY) === today) return; }catch(e){}
  const api = backupApi();
  try{
    await api.put(today, JSON.parse(JSON.stringify(state)));
    try{ localStorage.setItem(BACKUP_TS_KEY, today); }catch(e){}
    const ids = await api.list();
    for (const id of ids.slice(BACKUP_KEEP)) await api.del(id);
  }catch(e){ /* 備份失敗不影響使用 */ }
}
async function loadBackups(){
  backupOpen = true;
  backupList = null;
  renderAll();
  try{ backupList = await backupApi().list(); }
  catch(e){ backupList = []; }
  renderAll();
}
async function restoreBackup(id){
  try{
    const data = await backupApi().get(id);
    if (!data){ dataMsg = '這份備份讀不到'; renderAll(); return; }
    state = normalize(data);
    viewMonth = thisMonth();
    backupOpen = false;
    dataMsg = '已還原到 ' + id + ' 的版本';
    await save();
    renderAll();
  }catch(e){
    dataMsg = '還原失敗,請再試一次';
    renderAll();
  }
}

/* ===================== 衍生計算 ===================== */
const sum = (list, f) => list.reduce((s, x) => s + f(x), 0);
const totalAssets = () => sum(state.assets, a => a.amount);
const totalLiab = () => sum(state.liabilities, l => l.amount);
const netWorth = () => totalAssets() - totalLiab();
const txOfMonth = m => state.transactions.filter(t => t.date.slice(0,7) === m);
function monthFlow(m){
  const tx = txOfMonth(m);
  const income = sum(tx.filter(t => t.amount > 0), t => t.amount);
  const expense = sum(tx.filter(t => t.amount < 0), t => -t.amount);
  return { income, expense, balance: income - expense };
}
function spentByCat(m){
  const map = {};
  txOfMonth(m).filter(t => t.amount < 0).forEach(t => { map[t.cat] = (map[t.cat] || 0) + (-t.amount); });
  return map;
}
function knownCats(){
  const set = new Set();
  state.budgets.forEach(b => { if (b.name) set.add(b.name); });
  state.transactions.forEach(t => { if (t.cat) set.add(t.cat); });
  return Array.from(set);
}

/* ===================== 證交所報價 =====================
   資料來源:臺灣證券交易所公開資訊,取的是「最近一個交易日收盤價」,
   不是即時報價。Artifact 版的 CSP 擋外部請求,該版本不提供這個功能。 */
const QUOTES_ENABLED = true;
const TWSE_STOCK = 'https://www.twse.com.tw/exchangeReport/STOCK_DAY?response=json&stockNo=';
const TWSE_INDEX = 'https://www.twse.com.tw/indicesReport/MI_5MINS_HIST?response=json';
const QUOTE_TS_KEY = 'financeQuoteFetchedAt';

let quoteBusy = false;
let quoteMsg = '';

const cleanNum = v => num(String(v).replace(/,/g, ''));
function rocToISO(s){                       // '115/09/04' → '2026-09-04'
  const p = String(s).split('/');
  return p.length === 3 ? (Number(p[0]) + 1911) + '-' + p[1] + '-' + p[2] : '';
}
function monthParam(offset){
  const d = new Date();
  d.setDate(1);
  d.setMonth(d.getMonth() + offset);
  return d.getFullYear() + pad2(d.getMonth() + 1) + '01';
}
async function twseRows(url){
  // 月初當月可能還沒有資料,退回上個月再試一次
  for (const m of [monthParam(0), monthParam(-1)]){
    try{
      const res = await fetch(url + '&date=' + m);
      if (!res.ok) continue;
      const j = await res.json();
      if (j.stat === 'OK' && Array.isArray(j.data) && j.data.length) return j.data;
    }catch(e){ /* 換下一個月 */ }
  }
  return null;
}
async function fetchQuotes(manual){
  if (!QUOTES_ENABLED || quoteBusy) return;
  quoteBusy = true;
  quoteMsg = '更新報價中…';
  if (manual) renderAll();
  try{
    const [r631, r675, rIdx] = await Promise.all([
      twseRows(TWSE_STOCK + '00631L'),
      twseRows(TWSE_STOCK + '00675L'),
      twseRows(TWSE_INDEX)
    ]);
    const L = state.leverage;
    let date = '';
    if (r631 && r631.length){ const row = r631[r631.length-1]; L.price631L = cleanNum(row[6]); date = rocToISO(row[0]); }
    if (r675 && r675.length){ const row = r675[r675.length-1]; L.price675L = cleanNum(row[6]); date = rocToISO(row[0]) || date; }
    if (rIdx && rIdx.length){ const row = rIdx[rIdx.length-1]; L.marketCurrent = cleanNum(row[4]); date = rocToISO(row[0]) || date; }
    if (date){
      L.quoteDate = date;
      quoteMsg = '';
      try{ localStorage.setItem(QUOTE_TS_KEY, String(Date.now())); }catch(e){}
      scheduleSave();
    }else{
      quoteMsg = '抓不到報價,維持原本的數字';
    }
  }catch(e){
    quoteMsg = '抓不到報價(可能沒有網路),維持原本的數字';
  }
  quoteBusy = false;
  // 自動抓取可能在使用者打字時完成,別把游標和輸入到一半的內容洗掉
  if (document.activeElement && document.activeElement.tagName === 'INPUT'){
    if (currentTab === 'leverage') refreshLeverage();
  }else{
    renderAll();
  }
}
function maybeAutoQuote(){
  if (!QUOTES_ENABLED) return;
  let last = 0;
  try{ last = Number(localStorage.getItem(QUOTE_TS_KEY)) || 0; }catch(e){}
  if (Date.now() - last > 3600000) fetchQuotes(false);   // 一小時內不重覆抓
}

/* ===================== 部位損益 =====================
   買賣紀錄用加權平均成本法。整體損益要扣掉借款的累積利息,
   否則槓桿部位看起來永遠比實際好。 */
const SYMBOLS = [
  { id:'00631L', name:'元大台灣50正2' },
  { id:'00675L', name:'富邦臺灣加權正2' }
];
const symbolName = id => (SYMBOLS.find(s => s.id === id) || {}).name || id;
function symbolPrice(sym){
  const L = state.leverage;
  return sym === '00631L' ? L.price631L : sym === '00675L' ? L.price675L : 0;
}
const hasTrades = () => state.trades.length > 0;
function heldShares(sym){
  let n = 0;
  state.trades.forEach(t => { if (t.symbol === sym) n += (t.action === 'sell' ? -t.shares : t.shares); });
  return Math.max(0, n);
}
/* 手續費 0.1425%(最低 20 元),賣出另加 0.1% 證交稅 */
function defaultFee(action, gross){
  if (!(gross > 0)) return 0;
  const broker = Math.max(20, gross * 0.001425);
  return Math.round(action === 'sell' ? broker + gross * 0.001 : broker);
}
/* 已動用的房貸,從動用日算到今天的累積利息 */
function accruedInterest(){
  const L = state.leverage;
  let total = 0;
  L.tranches.forEach(t => {
    if (t.useDate) total += t.amount * (L.annualRate / 100) * (daysSince(t.useDate) / 365.25);
  });
  if (L.core.useDate) total += L.core.amount * (L.annualRate / 100) * (daysSince(L.core.useDate) / 365.25);
  return total;
}
function computePosition(){
  const lots = {};
  let buyCash = 0, buyLoan = 0, sellNet = 0, realized = 0, fees = 0;
  const sorted = state.trades.slice().sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  sorted.forEach(t => {
    const lot = lots[t.symbol] || (lots[t.symbol] = { shares:0, cost:0 });
    const gross = t.shares * t.price;
    fees += t.fee;
    if (t.action === 'sell'){
      const avg = lot.shares > 0 ? lot.cost / lot.shares : 0;
      const qty = Math.min(t.shares, lot.shares);
      const costOut = avg * qty;
      realized += (gross - t.fee) - costOut;
      sellNet += gross - t.fee;
      lot.shares -= qty;
      lot.cost -= costOut;
    }else{
      lot.shares += t.shares;
      lot.cost += gross + t.fee;
      if (t.source === 'loan') buyLoan += gross + t.fee; else buyCash += gross + t.fee;
    }
  });
  let marketValue = 0, remainCost = 0;
  Object.keys(lots).forEach(sym => {
    marketValue += lots[sym].shares * symbolPrice(sym);
    remainCost += lots[sym].cost;
  });
  const unrealized = marketValue - remainCost;
  const interest = accruedInterest();
  const total = unrealized + realized - interest;
  const invested = buyCash + buyLoan;
  const years = sorted.length ? Math.max(daysSince(sorted[0].date) / 365.25, 0) : 0;
  return {
    lots, buyCash, buyLoan, invested, sellNet, realized, unrealized, interest, total,
    marketValue, remainCost, fees, years,
    hasData: sorted.length > 0,
    returnOnCash: buyCash > 0 ? total / buyCash * 100 : 0,
    returnOnAll: invested > 0 ? total / invested * 100 : 0,
    annualized: (invested > 0 && years > 0.08) ? (total / invested * 100) / years : null
  };
}

/* ===================== 曝險與風險 =====================
   00631L / 00675L 是正2 ETF,本身就有 2 倍槓桿;
   再用房貸借錢買,實際市場曝險是「部位市值 × 2」。 */
function computeRisk(){
  const p = computePosition();
  const r = computeLeverage();
  const pv = p.hasData ? p.marketValue : r.totalValue;
  const loan = r.usedAmount;
  const equity = pv - loan;
  const nw = netWorth();
  const exposure = pv * 2;                       // 正2 → 實質跟著大盤跑的金額
  // 分母 = 自己的錢 + 房貸總額度。用部位淨值而非部位市值,
  // 否則已動用的部分會同時被算進部位與額度裡,比例失真偏樂觀。
  const capacity = equity + state.leverage.creditLimit;
  return {
    pv, loan, equity, nw, exposure, capacity,
    creditLimit: state.leverage.creditLimit,
    invested: p.invested, pnl: p.total, hasTrades: p.hasData,
    leverage: equity > 0 ? pv / equity : 0,
    exposureRatio: capacity > 0 ? exposure / capacity * 100 : 0,
    monthlyInterest: r.monthlyInterest
  };
}

/* 每月快照:第一次開啟該月時自動記一筆,之後每次開啟更新到最新。
   使用者手動改過的那一筆(auto:false)不會被覆蓋。 */
function maybeSnapshot(){
  const p = computePosition();
  const r = computeLeverage();
  const nw = netWorth();
  if (!nw && !p.hasData && !r.totalValue) return false;
  const m = thisMonth();
  const found = state.netWorthHistory.find(h => h.m === m);
  if (found && !found.auto) return false;
  const snap = {
    v: Math.round(nw),
    pv: Math.round(p.hasData ? p.marketValue : r.totalValue),
    pnl: p.hasData ? Math.round(p.total) : null,
    loan: Math.round(r.usedAmount),
    auto: true
  };
  if (found){
    if (found.v === snap.v && found.pv === snap.pv && found.pnl === snap.pnl && found.loan === snap.loan) return false;
    Object.assign(found, snap);
  }else{
    state.netWorthHistory.push(Object.assign({ id: uid(), m }, snap));
  }
  scheduleSave();
  return true;
}

/* ===================== 總覽 ===================== */
function sparkline(hist){
  const w = 320, h = 96, padX = 10, padT = 12, padB = 18;
  const vals = hist.map(d => d.v);
  const maxV = Math.max(...vals), minV = Math.min(...vals);
  const span = maxV - minV;
  const y = v => span === 0 ? (h - padB + padT) / 2 : (h - padB) - (v - minV) / span * (h - padB - padT);
  const x = i => padX + i * (w - 2*padX) / Math.max(1, hist.length - 1);
  const pts = hist.map((d, i) => x(i).toFixed(1) + ',' + y(d.v).toFixed(1));
  const area = `M ${x(0).toFixed(1)},${(h - padB).toFixed(1)} L ` + pts.join(' L ') + ` L ${x(hist.length-1).toFixed(1)},${(h - padB).toFixed(1)} Z`;
  const last = hist[hist.length - 1];
  return `
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;margin-top:6px;" role="img" aria-label="淨資產走勢">
      <path d="${area}" fill="var(--accent-soft)" stroke="none"/>
      <polyline points="${pts.join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${x(hist.length-1).toFixed(1)}" cy="${y(last.v).toFixed(1)}" r="4" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>
      <text x="${padX}" y="${h - 4}" fill="var(--sub)" font-size="11">${esc(shortMonth(hist[0].m))}</text>
      <text x="${w - padX}" y="${h - 4}" fill="var(--sub)" font-size="11" text-anchor="end">${esc(shortMonth(last.m))}</text>
    </svg>
    <div class="row"><span class="muted">區間最低 NT$ ${fmt(minV)}</span><span class="muted">最高 NT$ ${fmt(maxV)}</span></div>`;
}

/* ===================== 槓桿 ===================== */
function computeLeverage(){
  const L = state.leverage;
  // 有買賣紀錄就以紀錄為準,否則用手填的股數
  const sh675 = hasTrades() ? heldShares('00675L') : L.shares675L;
  const sh631 = hasTrades() ? heldShares('00631L') : L.shares631L;
  const value675L = sh675 * L.price675L;
  const value631L = sh631 * L.price631L;
  const totalValue = value675L + value631L;

  const tranches = L.tranches.map(t => {
    const triggerLevel = L.marketHigh * (1 + t.thresholdPct/100);
    const triggered = L.marketHigh > 0 && L.marketCurrent > 0 && L.marketCurrent <= triggerLevel;
    const used = !!t.useDate;
    return { ...t, triggerLevel, triggered, used, yearsUsed: daysSince(t.useDate)/365.25 };
  });

  const usedTranches = tranches.filter(t => t.used);
  let usedAmount = sum(usedTranches, t => t.amount);
  const coreUsed = !!L.core.useDate;
  if (coreUsed) usedAmount += L.core.amount;

  const monthlyInterest = usedAmount * (L.annualRate/100) / 12;
  const exitThreshold = L.historicalHighValue + sum(usedTranches, t => t.amount * t.yearsUsed * 0.08);
  // 沒有動用任何一桶就沒有槓桿要撤,不論市值多高都不該亮燈
  const anyUsed = usedTranches.length > 0;
  const exitReached = anyUsed && L.historicalHighValue > 0 && totalValue >= exitThreshold;

  const positionDeclinePct = L.stressDeclinePct * 2;
  const lossAmount = totalValue * positionDeclinePct/100;

  return { value675L, value631L, sh675, sh631, totalValue, tranches, usedAmount, coreUsed, monthlyInterest,
           exitThreshold, exitReached, anyUsed, positionDeclinePct, lossAmount,
           remainingNetWorth: netWorth() - lossAmount };
}

/* 自動記錄看過的最高總市值。只在欄位輸入完成(change)或重畫時檢查,
   避免打字打到一半的中間值被記成新高。 */
function exitBadge(r){
  if (!r.anyUsed) return `<div class="badge gray">尚未動用桶金,暫不適用</div>`;
  return r.exitReached
    ? `<div class="badge red">已達撤退門檻,可開始慢慢減碼</div>`
    : `<div class="badge gray">尚未達撤退門檻</div>`;
}

/* 動用桶金之前持續記錄新高;一旦動用就凍結 —— 撤退要比的是「下跌前的高點」,
   高點若跟著現價跑,門檻永遠追不上,訊號就永遠不會亮。 */
function maybeUpdateHigh(){
  const L = state.leverage;
  if (!L.autoHigh) return false;
  const r = computeLeverage();
  if (r.anyUsed) return false;          // 已動用:凍結為撤退目標
  if (r.totalValue > 0 && r.totalValue > L.historicalHighValue + 0.5){
    L.historicalHighValue = Math.round(r.totalValue);
    scheduleSave();
    return true;
  }
  return false;
}

/* 通用折線圖。series: [{name, color, values}],values 對齊 labels,可含 null。
   兩條以上一定畫圖例,末端直接標數字,座標文字都用主題色。 */
function lineChart(labels, series, opts){
  const o = Object.assign({ height:130, zero:false, fmtVal: v => 'NT$ ' + fmt(v) }, opts || {});
  const w = 320, h = o.height, padL = 8, padR = 8, padT = 14, padB = 20;
  const all = [];
  series.forEach(s2 => s2.values.forEach(v => { if (v !== null && v !== undefined) all.push(v); }));
  if (all.length < 2) return '';
  let lo = Math.min(...all), hi = Math.max(...all);
  if (o.zero){ lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
  if (hi === lo){ hi = lo + Math.abs(lo || 1) * 0.1; lo = lo - Math.abs(lo || 1) * 0.1; }
  const x = i => padL + i * (w - padL - padR) / Math.max(1, labels.length - 1);
  const y = v => (h - padB) - (v - lo) / (hi - lo) * (h - padB - padT);
  const zeroY = y(0);

  const paths = series.map(s2 => {
    let d = '', started = false;
    s2.values.forEach((v, i) => {
      if (v === null || v === undefined){ started = false; return; }
      d += (started ? ' L ' : ' M ') + x(i).toFixed(1) + ',' + y(v).toFixed(1);
      started = true;
    });
    return d ? `<path d="${d}" fill="none" stroke="${s2.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` : '';
  }).join('');

  const ends = series.map(s2 => {
    let li = -1;
    s2.values.forEach((v, i) => { if (v !== null && v !== undefined) li = i; });
    if (li < 0) return '';
    return `<circle cx="${x(li).toFixed(1)}" cy="${y(s2.values[li]).toFixed(1)}" r="3.5" fill="${s2.color}" stroke="var(--card)" stroke-width="2"/>`;
  }).join('');

  return `
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;margin-top:4px;" role="img" aria-label="${esc(o.label || '走勢')}">
      ${o.zero ? `<line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${w - padR}" y2="${zeroY.toFixed(1)}" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 3"/>` : ''}
      ${paths}${ends}
      <text x="${padL}" y="${h - 5}" fill="var(--sub)" font-size="10">${esc(labels[0])}</text>
      <text x="${w - padR}" y="${h - 5}" fill="var(--sub)" font-size="10" text-anchor="end">${esc(labels[labels.length - 1])}</text>
    </svg>
    <div class="row" style="flex-wrap:wrap; gap:4px 14px;">
      ${series.map(s2 => {
        let li = -1;
        s2.values.forEach((v, i) => { if (v !== null && v !== undefined) li = i; });
        return `<span class="muted"><span class="legend-dot" style="background:${s2.color}"></span>${esc(s2.name)} ${li >= 0 ? o.fmtVal(s2.values[li]) : '—'}</span>`;
      }).join('')}
    </div>`;
}

function renderRisk(){
  const k = computeRisk();
  if (!(k.pv > 0)) return '';
  const expPct = Math.min(100, k.exposureRatio);
  const heavy = k.exposureRatio > 100;
  const hist = state.netWorthHistory.slice().sort((a, b) => a.m < b.m ? -1 : 1).slice(-12);
  const labels = hist.map(h => shortMonth(h.m));
  const pnlChart = lineChart(labels, [
    { name:'整體損益', color:'var(--s1)', values: hist.map(h => h.pnl === null || h.pnl === undefined ? null : h.pnl) }
  ], { zero:true, label:'整體損益走勢', height:120,
       fmtVal: v => (v >= 0 ? '+' : '−') + 'NT$ ' + fmt(Math.abs(v)) });
  const posChart = lineChart(labels, [
    { name:'部位市值', color:'var(--s1)', values: hist.map(h => h.pv === null || h.pv === undefined ? null : h.pv) },
    { name:'借款餘額', color:'var(--s2)', values: hist.map(h => h.loan === null || h.loan === undefined ? null : h.loan) }
  ], { label:'部位市值與借款', height:120 });

  return `
    <div class="card">
      <h3>曝險</h3>
      <div class="big-num ${heavy ? 'neg' : ''}">${k.capacity > 0 ? k.exposureRatio.toFixed(0) + '%' : '—'}</div>
      <div class="big-sub">實質市場曝險 ÷(部位淨值 + 房貸總額度)</div>
      <div class="bar-track"><div class="bar-fill ${heavy ? 'over' : ''}" style="width:${expPct.toFixed(1)}%"></div></div>
      <div class="row" style="margin-top:10px;"><span class="label">部位市值</span><span class="val">NT$ ${fmt(k.pv)}</span></div>
      <div class="row"><span class="label">實質市場曝險(正2 ×2)</span><span class="val">NT$ ${fmt(k.exposure)}</span></div>
      <div class="row" style="border-top:1px solid var(--line); padding-top:8px; margin-top:8px;">
        <span class="label">部位淨值(自己的錢)</span><span class="val">NT$ ${fmt(k.equity)}</span></div>
      <div class="row"><span class="label">＋ 房貸總額度</span><span class="val">NT$ ${fmt(k.creditLimit)}</span></div>
      <div class="row"><span class="label" style="font-weight:700;">分母合計</span><span class="val" style="font-weight:800;">NT$ ${fmt(k.capacity)}</span></div>
      <div class="muted">分母用部位淨值,不用部位市值 — 已借出的錢同時在部位裡也在額度裡,算兩次會讓比例看起來比實際安全。</div>
      <div class="muted" style="margin-top:4px;">大盤每動 1%,部位市值大約跟著動 2%。額度用得越多,分母越接近你自己的錢,比例會誠實地升高。</div>
    </div>

    <div class="card">
      <h3>部位組成</h3>
      <div class="big-num">${k.leverage ? k.leverage.toFixed(2) + ' 倍' : '—'}</div>
      <div class="big-sub">部位槓桿倍數(部位市值 ÷ 自己的錢)</div>
      <div class="row"><span class="label">部位市值</span><span class="val">NT$ ${fmt(k.pv)}</span></div>
      <div class="row"><span class="label">借款餘額</span><span class="val neg">−NT$ ${fmt(k.loan)}</span></div>
      <div class="row"><span class="label" style="font-weight:700;">部位淨值(自己的錢)</span><span class="val ${k.equity >= 0 ? '' : 'neg'}" style="font-weight:800;">NT$ ${fmt(k.equity)}</span></div>
    </div>

    ${pnlChart ? `
    <div class="card">
      <h3>整體損益走勢</h3>
      ${pnlChart}
      <div class="muted">每月第一次開啟 app 時自動記錄。虛線是損益兩平。</div>
    </div>` : ''}

    ${posChart ? `
    <div class="card">
      <h3>部位市值與借款</h3>
      ${posChart}
      <div class="muted">兩條線的距離就是你自己的錢。距離擴大代表在賺,縮小代表在賠。</div>
    </div>` : ''}`;
}

function renderPnL(){
  const p = computePosition();
  if (!p.hasData){
    return `
      <div class="card">
        <h3>部位損益</h3>
        <div class="empty">還沒有買賣紀錄,所以算不出賺賠。<br>在下面「買賣紀錄」記下每次進場,這裡就會顯示成本與損益。</div>
      </div>`;
  }
  const sign = n => (n >= 0 ? '+' : '−') + 'NT$ ' + fmt(Math.abs(n));
  const cls = n => n >= 0 ? 'pos' : 'neg';
  return `
    <div class="card">
      <h3>部位損益</h3>
      <div class="big-num ${cls(p.total)}">${sign(p.total)}</div>
      <div class="big-sub">扣掉借款利息後的整體損益${p.buyCash > 0 ? ' · 自有資金報酬率 ' + fmtPct(p.returnOnCash) : ''}</div>
      <div class="row"><span class="label">目前市值</span><span class="val">NT$ ${fmt(p.marketValue)}</span></div>
      <div class="row"><span class="label">持股成本</span><span class="val">NT$ ${fmt(p.remainCost)}</span></div>
      <div class="row"><span class="label">未實現損益</span><span class="val ${cls(p.unrealized)}">${sign(p.unrealized)}</span></div>
      ${p.realized ? `<div class="row"><span class="label">已實現損益</span><span class="val ${cls(p.realized)}">${sign(p.realized)}</span></div>` : ''}
      <div class="row"><span class="label">累積借款利息</span><span class="val neg">−NT$ ${fmt(p.interest)}</span></div>
      <div class="row" style="border-top:1px solid var(--line); padding-top:8px; margin-top:8px;">
        <span class="label" style="font-weight:700; color:var(--text);">整體損益</span>
        <span class="val ${cls(p.total)}" style="font-weight:800;">${sign(p.total)}</span>
      </div>
    </div>

    <div class="card">
      <h3>投入的錢</h3>
      <div class="row"><span class="label">自有資金(薪水 / 獎金)</span><span class="val">NT$ ${fmt(p.buyCash)}</span></div>
      <div class="row"><span class="label">房貸借款</span><span class="val">NT$ ${fmt(p.buyLoan)}</span></div>
      <div class="row"><span class="label" style="font-weight:700;">合計投入</span><span class="val" style="font-weight:800;">NT$ ${fmt(p.invested)}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${p.invested ? (p.buyCash / p.invested * 100).toFixed(1) : 0}%"></div></div>
      <div class="muted">藍色是自有資金佔比 ${p.invested ? (p.buyCash / p.invested * 100).toFixed(0) : 0}%</div>
      <div class="row" style="margin-top:10px;"><span class="label">對自有資金報酬率</span><span class="val ${cls(p.total)}">${p.buyCash > 0 ? fmtPct(p.returnOnCash) : '—'}</span></div>
      <div class="row"><span class="label">對總投入報酬率</span><span class="val ${cls(p.total)}">${p.invested > 0 ? fmtPct(p.returnOnAll) : '—'}</span></div>
      ${p.annualized !== null ? `<div class="row"><span class="label">粗估年化(${p.years.toFixed(1)} 年)</span><span class="val ${cls(p.annualized)}">${fmtPct(p.annualized)}</span></div>` : ''}
      <div class="notice">槓桿的意義就在這兩個報酬率的差距:借來的錢放大了自有資金的成敗,漲的時候好看,跌的時候一樣被放大。</div>
    </div>`;
}

function renderTrades(){
  const trades = state.trades.slice().sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
  const d = tradeDraft;
  const gross = num(d.shares) * num(d.price);
  return `
    <div class="card">
      <h3>記一筆買賣</h3>
      <div class="seg">
        ${SYMBOLS.map(sy => `<button class="seg-btn ${d.symbol === sy.id ? 'on' : ''}" data-act="draft-symbol" data-v="${sy.id}">${sy.id}</button>`).join('')}
      </div>
      <div class="seg" style="margin-top:8px;">
        <button class="seg-btn ${d.action === 'buy' ? 'on' : ''}" data-act="draft-action" data-v="buy">買進</button>
        <button class="seg-btn ${d.action === 'sell' ? 'on' : ''}" data-act="draft-action" data-v="sell">賣出</button>
      </div>
      ${d.action === 'buy' ? `
      <div class="seg" style="margin-top:8px;">
        <button class="seg-btn ${d.source === 'cash' ? 'on' : ''}" data-act="draft-source" data-v="cash">自有資金</button>
        <button class="seg-btn ${d.source === 'loan' ? 'on' : ''}" data-act="draft-source" data-v="loan">房貸借款</button>
      </div>` : ''}
      <div class="grid2" style="margin-top:9px;">
        <div class="field"><label>日期</label><input type="date" data-k="pd-date" value="${esc(d.date)}"></div>
        <div class="field"><label>股數</label><input type="number" inputmode="decimal" data-k="pd-shares" value="${esc(d.shares)}" placeholder="0"></div>
        <div class="field"><label>成交價</label><input type="number" inputmode="decimal" step="0.01" data-k="pd-price" value="${esc(d.price)}" placeholder="${symbolPrice(d.symbol) || '0'}"></div>
        <div class="field"><label>手續費(可空)</label><input type="number" inputmode="decimal" data-k="pd-fee" value="${esc(d.fee)}" placeholder="${gross ? fmt(defaultFee(d.action, gross)) : '自動'}"></div>
      </div>
      <div class="field"><label>備註(可空)</label><input data-k="pd-note" value="${esc(d.note)}" placeholder="例如:年終獎金加碼"></div>
      ${gross ? `<div class="muted" style="margin-bottom:8px;">成交金額 NT$ ${fmt(gross)}${d.fee === '' ? ' · 手續費預估 NT$ ' + fmt(defaultFee(d.action, gross)) : ''}</div>` : ''}
      <button class="btn solid" data-act="add-trade">新增紀錄</button>
      ${tradeError ? `<div class="muted neg" style="text-align:center; margin-top:8px;">${esc(tradeError)}</div>` : ''}
    </div>

    <div class="card">
      <h3>買賣紀錄</h3>
      ${trades.length ? trades.map(t => t.id === editingTrade ? `
        <div class="tx-edit">
          <div class="grid2">
            <div class="field"><label>日期</label><input type="date" data-k="pt-date-${t.id}" value="${esc(t.date)}"></div>
            <div class="field"><label>股數</label><input type="number" inputmode="decimal" data-k="pt-shares-${t.id}" value="${t.shares || ''}"></div>
            <div class="field"><label>成交價</label><input type="number" inputmode="decimal" step="0.01" data-k="pt-price-${t.id}" value="${t.price || ''}"></div>
            <div class="field"><label>手續費</label><input type="number" inputmode="decimal" data-k="pt-fee-${t.id}" value="${t.fee || ''}"></div>
          </div>
          <div class="field"><label>備註</label><input data-k="pt-note-${t.id}" value="${esc(t.note)}"></div>
          <div class="btn-row">
            <button class="btn quiet" data-act="close-trade">完成</button>
            <button class="btn danger" data-act="del-trade" data-id="${t.id}">${pendingConfirm === 'del-trade:' + t.id ? '⚠️ 再按一次刪除' : '刪除這筆'}</button>
          </div>
        </div>` : `
        <div class="tx" data-act="edit-trade" data-id="${t.id}">
          <div>
            <div class="tx-cat">${t.action === 'sell' ? '賣出' : '買進'} ${esc(t.symbol)}
              ${t.action === 'buy' ? `<span class="badge ${t.source === 'loan' ? 'amber' : 'gray'}" style="margin-left:4px;">${t.source === 'loan' ? '房貸' : '自有'}</span>` : ''}</div>
            <div class="tx-desc">${esc(t.date)} · ${fmt(t.shares)} 股 @ ${t.price}${t.note ? ' · ' + esc(t.note) : ''}</div>
          </div>
          <div class="tx-amt ${t.action === 'sell' ? 'income' : ''}">${t.action === 'sell' ? '+' : '−'}${fmt(t.shares * t.price + (t.action === 'sell' ? -t.fee : t.fee))}</div>
        </div>`).join('') : `<div class="empty">還沒有紀錄。<br>每次用薪水、獎金或房貸進場都記一筆,損益就會自動算。</div>`}
      ${trades.length ? `<div class="notice">點任一筆可以修改或刪除。持股股數會由這些紀錄自動加總。</div>` : ''}
    </div>`;
}

  return `

      ${QUOTES_ENABLED ? `

    <div class="card">

      <div class="row"><span class="label">正2部位跌幅</span><span class="val" id="out-positionDeclinePct">${fmtPct(-r.positionDeclinePct)}</span></div>
      <div class="row"><span class="label">虧損金額</span><span class="val neg" id="out-lossAmount">NT$ ${fmt(r.lossAmount)}</span></div>
      <div class="row"><span class="label" style="font-weight:700;">剩餘淨資產</span><span class="val" id="out-remainingNetWorth" style="font-weight:800;">NT$ ${fmt(r.remainingNetWorth)}</span></div>
      <div class="notice">剩餘淨資產用「資產」分頁的淨資產減去虧損。此為簡化估算,未計入正2 ETF 的波動耗損與追蹤誤差。</div>
    </div>

    <div class="notice">
      用房屋擔保額度做槓桿投資,會把投資虧損直接連到房子與每月現金流。以上都是簡化試算,不構成投資或貸款建議,實際動用前請與銀行確認條件。
    </div>`;
}

function refreshLeverage(){
  const L = state.leverage;
  const r = computeLeverage();
  const set = (id, text) => { const el = document.getElementById(id); if (el) el.textContent = text; };
  set('out-value675L', 'NT$ ' + fmt(r.value675L));
  set('out-value631L', 'NT$ ' + fmt(r.value631L));
  set('out-totalValue', 'NT$ ' + fmt(r.totalValue));
  r.tranches.forEach(t => {
    const badge = document.getElementById('out-status-' + t.id);
    if (badge){
      badge.textContent = t.triggered ? '已觸發' : '未觸發';
      badge.className = 'badge ' + (t.triggered ? 'red' : 'gray');
    }
    set('out-trigger-' + t.id, t.triggerLevel ? fmt(t.triggerLevel) : '—');
  });
  set('out-usedAmount', 'NT$ ' + fmt(r.usedAmount));
  const bar = document.getElementById('out-usedBar');
  if (bar) bar.style.width = (L.creditLimit ? Math.min(100, r.usedAmount / L.creditLimit * 100) : 0).toFixed(1) + '%';
  set('out-remainingLine', 'NT$ ' + fmt(Math.max(0, L.creditLimit - r.usedAmount)));
  set('out-monthlyInterest', 'NT$ ' + fmt(r.monthlyInterest));
  set('out-exitThreshold', 'NT$ ' + fmt(r.exitThreshold));
  set('out-exitCurrent', 'NT$ ' + fmt(r.totalValue));
  const wrap = document.getElementById('out-exitBadgeWrap');
  if (wrap) wrap.innerHTML = exitBadge(r);
  set('out-positionDeclinePct', fmtPct(-r.positionDeclinePct));
  set('out-lossAmount', 'NT$ ' + fmt(r.lossAmount));
  set('out-remainingNetWorth', 'NT$ ' + fmt(r.remainingNetWorth));
}

/* 每月把槓桿利息記成一筆支出。已記過的月份會留在 interestPosted,
   所以你把那筆刪掉之後不會又被加回來。 */
function maybePostInterest(){
  const L = state.leverage;
  if (!L.autoInterest) return false;
  const r = computeLeverage();
  if (!(r.monthlyInterest > 0)) return false;
  const m = thisMonth();
  if (L.interestPosted.includes(m)) return false;
  state.transactions.push({
    id: uid(),
    date: m + '-01',
    cat: '房貸利息',
    desc: '槓桿借款利息(自動記入)',
    amount: -Math.round(r.monthlyInterest)
  });
  L.interestPosted.push(m);
  scheduleSave();
  return true;
}

/* ===================== 輸入處理 ===================== */
const findById = (list, id) => list.find(x => x.id === id);

function onField(key, el){
  const dash = key.indexOf('-');
  const kind = key.slice(0, dash);
  const rest = key.slice(dash + 1);
  let structural = false;

  if (kind === 'bn'){ const b = findById(state.budgets, rest); if (b) b.name = el.value; }
  else if (kind === 'ba'){ const b = findById(state.budgets, rest); if (b) b.budget = num(el.value); }
  else if (kind === 'an'){ const a = findById(state.assets, rest); if (a) a.name = el.value; }
  else if (kind === 'aa'){ const a = findById(state.assets, rest); if (a) a.amount = num(el.value); }
  else if (kind === 'ln'){ const l = findById(state.liabilities, rest); if (l) l.name = el.value; }
  else if (kind === 'la'){ const l = findById(state.liabilities, rest); if (l) l.amount = num(el.value); }
  else if (kind === 'nh'){
    const h = findById(state.netWorthHistory, rest);
    if (h){ h.v = num(el.value); h.auto = false; }   // 自己改過就不再被自動快照覆寫
  }
  else if (kind === 'lev'){ state.leverage[rest] = num(el.value); }
  else if (kind === 'tr'){
    const p = rest.indexOf('-');
    const what = rest.slice(0, p), id = rest.slice(p + 1);
    const t = findById(state.leverage.tranches, id);
    if (t){
      if (what === 'pct') t.thresholdPct = num(el.value);
      else if (what === 'amt') t.amount = num(el.value);
      else if (what === 'idx') t.useIndex = num(el.value);
      else if (what === 'note') t.note = el.value;
      else t.useDate = el.value;
    }
  }
  else if (kind === 'core'){
    if (rest === 'amt') state.leverage.core.amount = num(el.value);
    else state.leverage.core.useDate = el.value;
  }
  else if (kind === 'd'){ draft[rest] = el.value; return; }        // 草稿不入庫
  else if (kind === 'pd'){                                          // 買賣草稿
    tradeDraft[rest] = el.value;
    if (rest === 'shares' || rest === 'price') renderAll();          // 更新成交金額預估
    return;
  }
  else if (kind === 'pt'){                                          // 修改既有買賣紀錄
    const cut = rest.indexOf('-');
    const what = rest.slice(0, cut), tid = rest.slice(cut + 1);
    const t = findById(state.trades, tid);
    if (t){
      if (what === 'date') t.date = el.value || todayISO();
      else if (what === 'note') t.note = el.value;
      else t[what] = num(el.value);
    }
    structural = true;
  }
  else if (kind === 'tdate' || kind === 'tamt' || kind === 'tcat' || kind === 'tdesc'){
    const t = findById(state.transactions, rest);
    if (t){
      if (kind === 'tdate') t.date = el.value || todayISO();
      else if (kind === 'tamt') t.amount = num(el.value);
      else if (kind === 'tcat') t.cat = el.value;
      else t.desc = el.value;
    }
    structural = true;
  }

  scheduleSave();
  if (kind === 'tr' && rest.startsWith('date-')){
    maybePostInterest();
    renderAll();                                // 動用日期會長出/收起動用紀錄欄位
    return;
  }
  if (structural) return;                       // 交易編輯:離開欄位時才重畫
  if (currentTab === 'budget') refreshBudget();
  else if (currentTab === 'assets') refreshAssets();
  else if (currentTab === 'leverage') refreshLeverage();
}

function needsConfirm(token){
  if (pendingConfirm === token){ pendingConfirm = null; return false; }
  pendingConfirm = token;
  renderAll();
  return true;
}

function stateJSON(){ return JSON.stringify(state, null, 2); }

async function exportJSON(){
  const filename = 'finance-' + todayISO() + '.json';
  const text = stateJSON();
  if (downloadsNs){
    try{
      const r = await downloadsNs.save({ filename, data: text });
      dataMsg = r && r.status === 'delivered' ? '已送出備份' : '已匯出 ' + filename;
      renderAll();
      return;
    }catch(e){
      if (e && e.code === 'cancelled'){ return; }
    }
  }
  try{
    const url = URL.createObjectURL(new Blob([text], { type:'application/json' }));
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    dataMsg = '已匯出 ' + filename;
  }catch(e){
    dataMsg = '這個瀏覽器擋下了下載,請改用「複製成文字」';
  }
  renderAll();
}

function importJSON(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      state = normalize(JSON.parse(String(reader.result)));
      viewMonth = thisMonth();
      dataMsg = '已匯入 ' + file.name;
      save();
      renderAll();
    }catch(e){
      dataMsg = '這個檔案讀不出來,請確認是本 app 匯出的 JSON';
      renderAll();
    }
  };
  reader.onerror = () => { dataMsg = '讀取檔案失敗'; renderAll(); };
  reader.readAsText(file);
}

async function copyJSON(){
  const text = stateJSON();
  try{
    await navigator.clipboard.writeText(text);
    dataMsg = '已複製,貼到備忘錄或訊息就是一份備份';
  }catch(e){
    dataMsg = '複製失敗,請改用「匯出備份」';
  }
  renderAll();
}

function onClick(el){
  const act = el.dataset.act;
  const id = el.dataset.id;
  let rerender = true;
  if (!['load-sample', 'clear-all', 'del-tx', 'del-trade', 'restore'].includes(act)) pendingConfirm = null;
  if (act !== 'export' && act !== 'import' && act !== 'copy-json') dataMsg = '';

  switch (act){
    case 'month': viewMonth = shiftMonth(viewMonth, Number(el.dataset.v)); break;
    case 'go': switchTab(el.dataset.v); return;
    case 'add-budget': state.budgets.push({ id:uid(), name:'', budget:0 }); break;
    case 'del-budget': state.budgets = state.budgets.filter(b => b.id !== id); break;
    case 'add-asset': state.assets.push({ id:uid(), name:'', amount:0 }); break;
    case 'del-asset': state.assets = state.assets.filter(a => a.id !== id); break;
    case 'add-liab': state.liabilities.push({ id:uid(), name:'', amount:0 }); break;
    case 'del-liab': state.liabilities = state.liabilities.filter(l => l.id !== id); break;
    case 'del-hist': state.netWorthHistory = state.netWorthHistory.filter(h => h.id !== id); break;
    case 'snap-networth': {
      const m = thisMonth();
      const found = state.netWorthHistory.find(h => h.m === m);
      if (found) found.auto = true;      // 允許這次覆寫成目前數字
      maybeSnapshot();
      break;
    }
    case 'export': exportJSON(); return;
    case 'import': {
      const f = document.getElementById('importFile');
      if (f) f.click();
      return;
    }
    case 'copy-json': copyJSON(); return;
    case 'draft-symbol': tradeDraft.symbol = el.dataset.v; break;
    case 'draft-action': tradeDraft.action = el.dataset.v; break;
    case 'draft-source': tradeDraft.source = el.dataset.v; break;
    case 'add-trade': {
      const shares = Math.abs(num(tradeDraft.shares));
      const price = Math.abs(num(tradeDraft.price));
      if (!shares || !price){ tradeError = '請填股數與成交價'; renderAll(); return; }
      const gross = shares * price;
      state.trades.push({
        id: uid(),
        date: tradeDraft.date || todayISO(),
        symbol: tradeDraft.symbol,
        action: tradeDraft.action,
        shares, price,
        fee: tradeDraft.fee === '' ? defaultFee(tradeDraft.action, gross) : Math.abs(num(tradeDraft.fee)),
        source: tradeDraft.action === 'sell' ? 'cash' : tradeDraft.source,
        note: tradeDraft.note.trim()
      });
      tradeError = '';
      tradeDraft = { date: tradeDraft.date, symbol: tradeDraft.symbol, action: tradeDraft.action,
                     source: tradeDraft.source, shares:'', price:'', fee:'', note:'' };
      break;
    }
    case 'edit-trade': editingTrade = id; break;
    case 'close-trade': editingTrade = null; break;
    case 'del-trade':
      if (needsConfirm('del-trade:' + id)) return;
      state.trades = state.trades.filter(t => t.id !== id);
      editingTrade = null;
      break;
    case 'fetch-quotes': fetchQuotes(true); return;
    case 'show-backups':
      if (backupOpen){ backupOpen = false; break; }
      loadBackups();
      return;
    case 'restore':
      if (needsConfirm('restore:' + id)) return;
      restoreBackup(id);
      return;
    case 'toggle-autointerest':
      state.leverage.autoInterest = !state.leverage.autoInterest;
      if (state.leverage.autoInterest) maybePostInterest();
      break;
    case 'toggle-autohigh':
      state.leverage.autoHigh = !state.leverage.autoHigh;
      if (state.leverage.autoHigh) maybeUpdateHigh();
      break;
    case 'sign-in': signInCloud(); return;
    case 'sign-out': signOutCloud(); return;
    case 'draft-type': draft.type = el.dataset.v; break;
    case 'add-tx': {
      const amt = Math.abs(num(draft.amount));
      if (!amt){ draftError = '請先填金額'; renderAll(); return; }
      draftError = '';
      state.transactions.push({
        id:uid(),
        date: draft.date || todayISO(),
        cat: (draft.cat || '').trim() || (draft.type === 'income' ? '收入' : '其他'),
        desc: draft.desc.trim(),
        amount: draft.type === 'income' ? amt : -amt
      });
      viewMonth = (draft.date || todayISO()).slice(0,7);
      draft = { date: draft.date || todayISO(), type: draft.type, cat:'', desc:'', amount:'' };
      break;
    }
    case 'edit-tx': editingTx = id; break;
    case 'close-tx': editingTx = null; break;
    case 'del-tx':
      if (needsConfirm('del-tx:' + id)) return;
      state.transactions = state.transactions.filter(t => t.id !== id);
      editingTx = null;
      break;
    case 'load-sample':
      if (needsConfirm('load-sample')) return;
      state = sampleData();
      viewMonth = thisMonth();
      break;
    case 'clear-all':
      if (needsConfirm('clear-all')) return;
      state = emptyState();
      viewMonth = thisMonth();
      break;
    default: rerender = false;
  }
  if (!['month', 'edit-tx', 'close-tx', 'edit-trade', 'close-trade'].includes(act)) scheduleSave();
  if (rerender) renderAll();
}

/* ===================== 啟動 ===================== */
function init(){
  const d = new Date();
  // 分頁列旁邊只放短日期,免得窄螢幕擠不下
  document.getElementById('todayDate').textContent = (d.getMonth()+1) + '/' + d.getDate();

  const local = readLocal();
  if (local) state = normalize(local);

  const content = document.getElementById('content');
  content.addEventListener('input', e => {
    const k = e.target.dataset && e.target.dataset.k;
    if (k) onField(k, e.target);
  });
  content.addEventListener('change', e => {
    if (e.target.id === 'importFile' && e.target.files && e.target.files[0]){
      importJSON(e.target.files[0]);
      e.target.value = '';
      return;
    }
    // 欄位輸入結束才檢查新高,避免記到打字中的中間值
    if (e.target.dataset && e.target.dataset.k && currentTab === 'leverage'){
      if (maybeUpdateHigh()) syncHighInput();
      refreshLeverage();
      // 損益卡不是靠 id 局部更新的,沒有游標停在欄位上時整頁重畫一次
      if (!(document.activeElement && document.activeElement.tagName === 'INPUT')) renderAll();
    }
  });
  content.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (el) onClick(el);
  });
  content.addEventListener('focusout', () => {
    setTimeout(() => {
      if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
      if (pendingRemote){ const d2 = pendingRemote; pendingRemote = null; applyRemote(d2); }
      else if (editingTx || editingTrade) renderAll();
    }, 60);
  });
  document.querySelectorAll('[data-tab]').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  storageMode = 'local';
  maybePostInterest();
  maybeSnapshot();
  renderAll();
  maybeAutoQuote();
  connectCloud();   // 連上雲端後會自動接手並更新畫面
  setTimeout(maybeBackup, 4000);   // 讓畫面與雲端先就緒
  if (window.claude && typeof window.claude.use === 'function'){
    window.claude.use('downloads').then(ns => { downloadsNs = ns; }).catch(() => {});
  }
}

init();
