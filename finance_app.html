<title>槓桿投資儀表板</title>
<style>
  :root{
    --bg:#f2f4f7; --card:#ffffff; --raised:#f7f8fa; --text:#1b1f27; --sub:#6b7280;
    --line:#e5e7eb; --accent:#2563eb; --accent-soft:#dbeafe; --accent-ink:#ffffff;
    --green:#15803d; --green-soft:#dcfce7;
    --red:#b91c1c; --red-soft:#fee2e2;
    --amber:#b45309; --amber-soft:#fef3c7;
    --bar-track:#e8eaee;
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
    --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948; --s9:#9aa1ac;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1115; --card:#1a1d24; --raised:#22262f; --text:#e8eaed; --sub:#9aa1ac;
      --line:#2a2e37; --accent:#4d8dff; --accent-soft:#1c2c4a; --accent-ink:#0f1115;
      --green:#3ecf6a; --green-soft:#123a20;
      --red:#f87171; --red-soft:#3f1717;
      --amber:#f2b23a; --amber-soft:#3f2f0e;
      --bar-track:#2a2e37;
      --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
      --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s9:#6b7280;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1115; --card:#1a1d24; --raised:#22262f; --text:#e8eaed; --sub:#9aa1ac;
    --line:#2a2e37; --accent:#4d8dff; --accent-soft:#1c2c4a; --accent-ink:#0f1115;
    --green:#3ecf6a; --green-soft:#123a20;
    --red:#f87171; --red-soft:#3f1717;
    --amber:#f2b23a; --amber-soft:#3f2f0e;
    --bar-track:#2a2e37;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s9:#6b7280;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    display:flex; justify-content:center; padding:16px 10px;
    height:100vh; height:100dvh; overflow:hidden;
    font-variant-numeric:tabular-nums;
  }
  /* 框本身不長高,只有中間的內容捲動,上下兩排分頁列永遠看得到 */
  .phone{
    width:100%; max-width:430px; height:100%; background:var(--card);
    border-radius:24px; box-shadow:0 8px 32px rgba(15,20,35,.14);
    overflow:hidden; display:flex; flex-direction:column;
    border:1px solid var(--line);
  }
  @media (max-height: 560px){ body{padding:0;} .phone{border-radius:0; border:none;} }
  .topbar{
    flex:0 0 auto; padding:10px 6px 0; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:6px;
  }
  .toptabs{
    flex:1 1 auto; display:flex; gap:2px; overflow-x:auto; scrollbar-width:none;
  }
  .toptabs::-webkit-scrollbar{display:none;}
  .top-tab{
    flex:1 0 auto; padding:8px 9px 9px; border:none; background:none; cursor:pointer;
    color:var(--sub); font-size:14px; font-family:inherit; white-space:nowrap;
    border-bottom:2px solid transparent; margin-bottom:-1px;
  }
  .top-tab.active{color:var(--accent); font-weight:700; border-bottom-color:var(--accent);}
  .topbar .date{flex:0 0 auto; font-size:11px; color:var(--sub); padding:0 8px 8px 2px;}
  .content{
    flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:14px; padding-bottom:10px; overscroll-behavior:contain; overflow-x:hidden;
  }
  .tabbar{flex:0 0 auto; display:flex; border-top:1px solid var(--line); background:var(--card);}
  .tab-btn{
    flex:1; background:none; border:none; padding:9px 2px 11px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    color:var(--sub); font-size:11px; font-family:inherit;
  }
  .tab-btn .ic{font-size:17px; line-height:1.2;}
  .tab-btn.active{color:var(--accent); font-weight:700;}
  button:focus-visible, input:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:14px; margin-bottom:12px;
  }
  .card h3{
    margin:0 0 10px; font-size:12px; color:var(--sub); font-weight:700;
    letter-spacing:.04em;
  }
  .big-num{font-size:26px; font-weight:800; margin:2px 0; letter-spacing:-.02em;}
  .big-sub{font-size:12px; color:var(--sub); margin-bottom:6px;}
  .row{display:flex; justify-content:space-between; align-items:center; gap:10px; margin:6px 0;}

  <header class="topbar">

    <button class="tab-btn active" data-tab="overview"><span class="ic">📊</span><span>總覽</span></button>

    <button class="tab-btn" data-tab="leverage"><span class="ic">⚡</span><span>槓桿</span></button>
    <button class="tab-btn" data-tab="ledger"><span class="ic">📒</span><span>記帳</span></button>
  </nav>
</div>

<script>
/* ===================== 小工具 ===================== */
const uid = () => Math.random().toString(36).slice(2,9);
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const fmt = n => (Math.round(n) || 0).toLocaleString('zh-Hant-TW');
const fmtPct = n => (n >= 0 ? '+' : '') + n.toFixed(1) + '%';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad2 = n => String(n).padStart(2, '0');
function todayISO(){ const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
const thisMonth = () => todayISO().slice(0,7);
function monthLabel(m){ const p = m.split('-'); return p[0] + '年' + Number(p[1]) + '月'; }
function shortMonth(m){ return Number(m.split('-')[1]) + '月'; }
function shiftMonth(m, delta){
  const y = Number(m.slice(0,4)), mo = Number(m.slice(5,7)) - 1 + delta;
  const d = new Date(y, mo, 1);
  return d.getFullYear() + '-' + pad2(d.getMonth()+1);
}
function daysBetweenISO(a, b){
  const d1 = new Date(a + 'T00:00:00'), d2 = new Date(b + 'T00:00:00');
  if (isNaN(d1.getTime()) || isNaN(d2.getTime())) return 0;
  return Math.max(0, (d2 - d1) / 86400000);
}
function daysSince(dateStr){
  if (!dateStr) return 0;
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d.getTime())) return 0;
  return Math.max(0, (Date.now() - d.getTime()) / 86400000);
}
function canon(v){
  if (Array.isArray(v)) return '[' + v.map(canon).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
  return JSON.stringify(v === undefined ? null : v);
}
const SERIES = ['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)','var(--s6)','var(--s7)','var(--s8)'];
const seriesColor = i => i < SERIES.length ? SERIES[i] : 'var(--s9)';

/* ===================== 預設狀態 ===================== */
const DEFAULT_LEVERAGE = {
  shares675L:0, price675L:0, shares631L:0, price631L:0,
  marketHigh:0, marketCurrent:0, historicalHighValue:0,
  stressDeclinePct:20, creditLimit:5000000, annualRate:2.6, autoHigh:true,
  autoInterest:true, interestPosted:[], quoteDate:'',
  tranches:[
    { id:'t1', label:'第一桶金', thresholdPct:-20, amount:1000000, useDate:'', repayments:[] },
    { id:'t2', label:'第二桶金', thresholdPct:-32, amount:1000000, useDate:'', repayments:[] },
    { id:'t3', label:'第三桶金', thresholdPct:-45, amount:1000000, useDate:'', repayments:[] }
  ],
  core:{ label:'長期投資部位', amount:2000000, useDate:'', repayments:[] }
};
/* 記帳的預設類別。之後在記帳頁選「新增類別…」加的,會經由交易紀錄進入清單 */
const DEFAULT_CATEGORIES = ['房貸 / 房租','餐飲','交通','娛樂','其他','房貸利息'];
/* key 是內部識別碼,id 是股票代號 —— 代號可能空白或重複,不能拿來當 key */
const DEFAULT_INSTRUMENTS = [
  { id:'00631L', name:'元大台灣50正2',   leverage:2, price:0, shares:0, auto:true },
  { id:'00675L', name:'富邦臺灣加權正2', leverage:2, price:0, shares:0, auto:true }
];
const newInstruments = () => DEFAULT_INSTRUMENTS.map(x => Object.assign({ key: uid() }, x));

function emptyState(){
  return {
    version:2,
    assets:[], liabilities:[], trades:[],
    instruments: newInstruments(),
    budgets: DEFAULT_CATEGORIES.map(n => ({ id:uid(), name:n, budget:0 })),   // 類別清單
    transactions:[], netWorthHistory:[],
    leverage: JSON.parse(JSON.stringify(DEFAULT_LEVERAGE))
  };
}

function normalize(raw){
  const s = emptyState();
  if (!raw || typeof raw !== 'object') return s;
  const arr = v => Array.isArray(v) ? v : [];
  s.assets = arr(raw.assets).map(a => ({ id:a.id||uid(), name:String(a.name||''), amount:num(a.amount) }));
  s.liabilities = arr(raw.liabilities).map(a => ({ id:a.id||uid(), name:String(a.name||''), amount:num(a.amount) }));
  // budgets 現在只當作記帳的類別清單(預算頁已移除,欄位保留以免舊資料的類別消失)
  if (Array.isArray(raw.budgets)) s.budgets = raw.budgets.map(b => ({ id:b.id||uid(), name:String(b.name||''), budget:num(b.budget) }));
  if (Array.isArray(raw.instruments) && raw.instruments.length){
    s.instruments = raw.instruments.map(x => ({
      key: String(x.key || '') || uid(),
      id: String(x.id || '').trim(),          // 代號可以先留空,不要亂數化
      name: String(x.name || ''),
      leverage: x.leverage === undefined ? 1 : num(x.leverage),
      price: Math.max(0, num(x.price)),
      shares: Math.max(0, num(x.shares)),
      auto: x.auto !== false
    }));
  }
  s.trades = arr(raw.trades).map(t => ({
    id: t.id || uid(),
    date: String(t.date || todayISO()).slice(0, 10),
    symbol: String(t.symbol || '00631L'),
    action: ['sell', 'dividend'].includes(t.action) ? t.action : 'buy',
    shares: Math.max(0, num(t.shares)),
    price: Math.max(0, num(t.price)),
    amount: Math.max(0, num(t.amount)),      // 配息領到的金額
    fee: Math.max(0, num(t.fee)),
    source: t.source === 'loan' ? 'loan' : 'cash',
    note: String(t.note || '')
  }));
  s.transactions = arr(raw.transactions).map(t => ({
    id:t.id||uid(), date:String(t.date||todayISO()).slice(0,10),
    cat:String(t.cat||'其他'), desc:String(t.desc||''), amount:num(t.amount)
  }));
  s.netWorthHistory = arr(raw.netWorthHistory)
    .map(h => ({
      id: h.id || uid(),
      m: String(h.m || '').slice(0, 7),
      v: num(h.v),
      pv: h.pv === undefined ? null : num(h.pv),      // 部位市值
      pnl: h.pnl === undefined ? null : num(h.pnl),   // 整體損益
      loan: h.loan === undefined ? null : num(h.loan),// 借款餘額
      auto: h.auto !== false                           // 手動改過的不再被自動覆蓋
    }))
    .filter(h => /^\d{4}-\d{2}$/.test(h.m));
  const L = raw.leverage && typeof raw.leverage === 'object' ? raw.leverage : {};
  const base = s.leverage;
  ['shares675L','price675L','shares631L','price631L','marketHigh','marketCurrent',
   'historicalHighValue','stressDeclinePct','creditLimit','annualRate'].forEach(k => {
    if (L[k] !== undefined) base[k] = Math.max(0, num(L[k]));   // 這些欄位沒有負值的意義
  });
  if (Array.isArray(L.tranches) && L.tranches.length){
    base.tranches = L.tranches.map((t, i) => ({
      id: t.id || ('t' + (i+1)),
      label: String(t.label || ('第' + (i+1) + '桶金')),
      thresholdPct: num(t.thresholdPct),
      amount: Math.max(0, num(t.amount)),
      useDate: String(t.useDate || ''),
      useIndex: num(t.useIndex),
      note: String(t.note || ''),
      repayments: (Array.isArray(t.repayments) ? t.repayments : [])
        .map(x => ({ id: x.id || uid(), date: String(x.date || '').slice(0, 10), amount: Math.max(0, num(x.amount)) }))
    }));
  }
  base.autoHigh = L.autoHigh !== false;       // 舊資料沒有這些欄位時給預設值
  base.autoInterest = L.autoInterest !== false;
  base.interestPosted = Array.isArray(L.interestPosted) ? L.interestPosted.map(String) : [];
  base.quoteDate = String(L.quoteDate || '');
  // 舊版把兩檔的股數與股價放在 leverage 底下,搬進標的清單
  [['00631L', 'shares631L', 'price631L'], ['00675L', 'shares675L', 'price675L']].forEach(([id, sk, pk]) => {
    const it = s.instruments.find(x => x.id === id);
    if (!it) return;
    if (!it.shares && num(L[sk])) it.shares = num(L[sk]);
    if (!it.price && num(L[pk])) it.price = num(L[pk]);
  });
  if (L.core && typeof L.core === 'object'){
    base.core = {
      label: String(L.core.label || '長期投資部位'),
      amount: num(L.core.amount),
      useDate: String(L.core.useDate || ''),
      repayments: (Array.isArray(L.core.repayments) ? L.core.repayments : [])
        .map(x => ({ id: x.id || uid(), date: String(x.date || '').slice(0, 10), amount: Math.max(0, num(x.amount)) }))
    };
  }
  return s;
}

/* 舊版(只有槓桿頁)的存檔搬過來 */
function fromLegacy(old){
  const s = emptyState();
  const L = s.leverage;
  ['shares675L','price675L','shares631L','price631L','marketHigh','marketCurrent',
   'historicalHighValue','stressDeclinePct'].forEach(k => { if (old[k] !== undefined) L[k] = num(old[k]); });
  const dates = old.trancheDates || {};
  L.tranches.forEach(t => { if (dates[t.id]) t.useDate = String(dates[t.id]); });
  if (old.coreUseDate) L.core.useDate = String(old.coreUseDate);
  return s;
}

let state = emptyState();

/* ===================== 存檔:雲端 + 本機備份 =====================
   兩種雲端來源,誰在就用誰:
     · Claude Artifact  → 平台內建的 db,開網址即同步
     · 網頁版           → Firebase Firestore,需用 Google 帳號登入
   兩者都沒有時就只存本機 localStorage,功能完全不受影響。      */
const STORAGE_NOTE = '資料存在這台裝置的瀏覽器裡,不會上傳到任何地方,也不需要登入。';
const DOC_PATH = 'state/finance';
const LEGACY_DOC_PATH = 'state/leverage';
const STORAGE_KEY = 'financeAppState_v2';
const LEGACY_KEY = 'financeAppLeverageData_v1';

let storageMode = 'local';   // 'cloud' | 'local' | 'none'
let cloud = null;            // { get, set, onChange } — 已連上的雲端
let cloudKind = 'none';      // 'claude' | 'firebase' | 'none'
let authUser = null;         // Firebase 已登入的帳號
let authBusy = false;
let downloadsNs = null;
let lastPushed = '';
let pendingRemote = null;
let saveTimer = null;

function readLocal(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
    const legacy = localStorage.getItem(LEGACY_KEY);
    if (legacy) return fromLegacy(JSON.parse(legacy));
    return null;
  }catch(e){ return null; }
}
function writeLocal(data){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); return true; }
  catch(e){ return false; }
}
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 400);
}
async function save(){
  const data = JSON.parse(JSON.stringify(state));
  const ok = writeLocal(data);
  if (cloud){
    try{
      lastPushed = canon(data);
      await cloud.set(data);
      storageMode = 'cloud';
      updateStorageStatus();
      return;
    }catch(e){ /* 雲端寫入失敗就靠本機,下次編輯會再試 */ }
  }
  storageMode = ok ? 'local' : 'none';
  updateStorageStatus();
}
function updateStorageStatus(){
  const el = document.getElementById('storageStatus');
  if (!el) return;
  if (storageMode === 'cloud'){
    el.textContent = cloudKind === 'firebase' && authUser
      ? '☁️ 已同步到 ' + authUser.email + ' — 其他裝置登入同一帳號就看得到'
      : '☁️ 已存到雲端 — 手機、電腦開同一個網址都看得到';
  }else if (storageMode === 'local'){
    el.textContent = cloudKind === 'firebase'
      ? '💾 只存在這台裝置 — 登入 Google 帳號即可同步到其他裝置'
      : '💾 只存在這台裝置的瀏覽器 — 換裝置或清資料會消失';
  }else{
    el.textContent = '⚠️ 無法存檔(此瀏覽器不允許儲存)';
  }
}

/* 收到雲端資料:正在打字就先擱著,等游標離開欄位再套用 */
function onRemote(data){
  if (!data) return;
  if (canon(data) === lastPushed) return;
  if (document.activeElement && document.activeElement.tagName === 'INPUT'){
    pendingRemote = data;
    return;
  }
  applyRemote(data);
}
function applyRemote(data){
  state = normalize(data);
  lastPushed = canon(JSON.parse(JSON.stringify(state)));
  writeLocal(state);
  renderAll();
}

/* 第一次連上雲端:雲端有資料就拉下來,沒有就把本機的推上去 */
async function syncFirstTime(){
  try{
    const remote = await cloud.get();
    storageMode = 'cloud';
    if (remote){
      applyRemote(remote);
    }else{
      await save();
    }
    cloud.onChange(onRemote);
    updateStorageStatus();
    if (maybePostInterest() || maybeSnapshot()) renderAll();
    maybeBackup();
  }catch(e){
    cloud = null;
    storageMode = 'local';
    updateStorageStatus();
  }
}

async function connectCloud(){
  // 1) Claude Artifact:平台內建的資料庫
  if (window.claude && typeof window.claude.use === 'function'){
    try{
      const db = await window.claude.use('db');
      if (db){
        const ref = db.doc(DOC_PATH);
        cloudKind = 'claude';
        cloud = {
          get: async () => {
            const snap = await ref.get();
            if (snap.exists) return snap.data();
            // 第一次上雲時,把舊版只有槓桿頁的存檔帶過來
            if (!readLocal()){
              try{
                const old = await db.doc(LEGACY_DOC_PATH).get();
                if (old.exists) return fromLegacy(old.data());
              }catch(e){ /* 沒有舊資料 */ }
            }

   雲端可用時存在雲端的 backups 集合,否則存本機。每天一份,保留 30 天。 */

function localBackupApi(){
  return {

/* ===================== 衍生計算 ===================== */
const sum = (list, f) => list.reduce((s, x) => s + f(x), 0);
const totalAssets = () => sum(state.assets, a => a.amount);
const totalLiab = () => sum(state.liabilities, l => l.amount);
const netWorth = () => totalAssets() - totalLiab();
const txOfMonth = m => state.transactions.filter(t => t.date.slice(0,7) === m);
function monthFlow(m){
  const tx = txOfMonth(m);
  const income = sum(tx.filter(t => t.amount > 0), t => t.amount);
  const expense = sum(tx.filter(t => t.amount < 0), t => -t.amount);
  return { income, expense, balance: income - expense };
}
function spentByCat(m){
  const map = {};
  txOfMonth(m).filter(t => t.amount < 0).forEach(t => { map[t.cat] = (map[t.cat] || 0) + (-t.amount); });
  return map;
}
/* 預設類別排前面,再接上交易紀錄裡用過的 */
function knownCats(){
  const list = [];
  const seen = new Set();
  const add = c => { const v = String(c || '').trim(); if (v && !seen.has(v)){ seen.add(v); list.push(v); } };
  state.budgets.forEach(b => add(b.name));
  state.transactions.forEach(t => add(t.cat));
  if (!list.length) add('其他');
  return list;
}

/* ===================== 證交所報價 =====================
   資料來源:臺灣證券交易所公開資訊,取的是「最近一個交易日收盤價」,
   不是即時報價。Artifact 版的 CSP 擋外部請求,該版本不提供這個功能。 */
const QUOTES_ENABLED = true;
const TWSE_STOCK = 'https://www.twse.com.tw/exchangeReport/STOCK_DAY?response=json&stockNo=';
const TWSE_INDEX = 'https://www.twse.com.tw/indicesReport/MI_5MINS_HIST?response=json';
const QUOTE_TS_KEY = 'financeQuoteFetchedAt';

let quoteBusy = false;
let quoteMsg = '';
let levMsg = '';      // 持股與報價卡的提示

const cleanNum = v => num(String(v).replace(/,/g, ''));
function rocToISO(s){                       // '115/09/04' → '2026-09-04'
  const p = String(s).split('/');
  return p.length === 3 ? (Number(p[0]) + 1911) + '-' + p[1] + '-' + p[2] : '';
}
function monthParam(offset){
  const d = new Date();
  d.setDate(1);
  d.setMonth(d.getMonth() + offset);
  return d.getFullYear() + pad2(d.getMonth() + 1) + '01';
}
async function twseRows(url){
  // 月初當月可能還沒有資料,退回上個月再試一次
  for (const m of [monthParam(0), monthParam(-1)]){
    try{
      const res = await fetch(url + '&date=' + m);
      if (!res.ok) continue;
      const j = await res.json();
      if (j.stat === 'OK' && Array.isArray(j.data) && j.data.length) return j.data;
    }catch(e){ /* 換下一個月 */ }
  }
  return null;
}
async function fetchQuotes(manual){
  if (!QUOTES_ENABLED || quoteBusy) return;
  quoteBusy = true;
  quoteMsg = '更新報價中…';
  if (manual) renderAll();
  try{
    const targets = state.instruments.filter(it => it.auto && /^[0-9A-Za-z]{3,8}$/.test(it.id));
    const results = await Promise.all([
      ...targets.map(it => twseRows(TWSE_STOCK + encodeURIComponent(it.id))),
      twseRows(TWSE_INDEX)
    ]);
    const idxRows = results[results.length - 1];
    let date = '', got = 0, missed = [];
    targets.forEach((it, i) => {
      const rows = results[i];
      if (rows && rows.length){
        const row = rows[rows.length - 1];
        it.price = cleanNum(row[6]);      // 收盤價
        date = rocToISO(row[0]) || date;
        got++;
      }else{
        missed.push(it.id);
      }
    });
    if (idxRows && idxRows.length){
      const row = idxRows[idxRows.length - 1];
      state.leverage.marketCurrent = cleanNum(row[4]);
      date = rocToISO(row[0]) || date;
    }
    if (got || (idxRows && idxRows.length)){
      if (date) state.leverage.quoteDate = date;
      quoteMsg = missed.length ? '查不到:' + missed.join('、') + '(代號是否正確?)' : '';
      try{ localStorage.setItem(QUOTE_TS_KEY, String(Date.now())); }catch(e){}
      scheduleSave();
    }else{
      quoteMsg = '抓不到報價,維持原本的數字';
    }
  }catch(e){
    quoteMsg = '抓不到報價(可能沒有網路),維持原本的數字';
  }
  quoteBusy = false;
  // 自動抓取可能在使用者打字時完成,別把游標和輸入到一半的內容洗掉
  if (document.activeElement && document.activeElement.tagName === 'INPUT'){
    if (currentTab === 'leverage') refreshLeverage();
  }else{
    renderAll();
  }
}

  if (!QUOTES_ENABLED) return;
  let last = 0;
  try{ last = Number(localStorage.getItem(QUOTE_TS_KEY)) || 0; }catch(e){}

}

/* ===================== 部位損益 =====================
   買賣紀錄用加權平均成本法。整體損益要扣掉借款的累積利息,
   否則槓桿部位看起來永遠比實際好。 */
const findInstrument = id => state.instruments.find(x => x.id === id);
const findInstrumentByKey = k => state.instruments.find(x => x.key === k);
const symbolName = id => (findInstrument(id) || {}).name || id;
function symbolPrice(sym){
  const it = findInstrument(sym);
  return it ? it.price : 0;
}
/* 槓桿倍數:正2 填 2,一般股票 1,反1 填 -1。用來算實質市場曝險。 */
function symbolLeverage(sym){
  const it = findInstrument(sym);
  return it && it.leverage !== 0 ? it.leverage : 1;
}
const hasTrades = () => state.trades.length > 0;
function heldShares(sym){
  let n = 0;
  state.trades.forEach(t => {
    if (t.symbol !== sym || t.action === 'dividend') return;
    n += (t.action === 'sell' ? -t.shares : t.shares);
  });
  return Math.max(0, n);
}
/* 手續費 0.1425%(最低 20 元),賣出另加 0.1% 證交稅 */
function defaultFee(action, gross){
  if (!(gross > 0)) return 0;
  const broker = Math.max(20, gross * 0.001425);
  return Math.round(action === 'sell' ? broker + gross * 0.001 : broker);
}
/* 一筆借款從動用日到今天,依「實際餘額」分段累積。
   還款之後只對剩下的餘額繼續算,利息與撤退門檻都用這個。 */
function accrue(item, annualPct){
  if (!item.useDate) return 0;
  const today = todayISO();
  const events = effectiveRepayments(item);
  let balance = item.amount;
  let cursor = item.useDate;
  let total = 0;
  events.forEach(r => {
    if (r.date > cursor){
      total += balance * (annualPct / 100) * (daysBetweenISO(cursor, r.date) / 365.25);
      cursor = r.date;
    }
    balance = Math.max(0, balance - r.amount);
  });
  total += balance * (annualPct / 100) * (daysBetweenISO(cursor, today) / 365.25);
  return total;
}
/* 只認動用日之後、今天以前的還款 —— 未來日期的還款不能讓餘額先歸零,
   否則餘額和利息會對不起來 */
function effectiveRepayments(item){
  if (!item || !item.useDate) return [];
  const today = todayISO();
  return (item.repayments || [])
    .filter(r => r.date && r.date >= item.useDate && r.date <= today)
    .sort((a, b) => a.date < b.date ? -1 : 1);
}
const repaidOf = item => Math.min(item.amount, sum(effectiveRepayments(item), r => r.amount));
function outstanding(item){
  if (!item.useDate) return 0;
  return Math.max(0, item.amount - repaidOf(item));
}

/* 已動用的房貸,從動用日算到今天的累積利息 */
function accruedInterest(){
  const L = state.leverage;
  return sum(L.tranches, t => accrue(t, L.annualRate)) + accrue(L.core, L.annualRate);
}
function computePosition(){
  const lots = {};
  let buyCash = 0, buyLoan = 0, sellNet = 0, realized = 0, fees = 0, dividends = 0, oversold = false;
  const sorted = state.trades.slice().sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  sorted.forEach(t => {
    const lot = lots[t.symbol] || (lots[t.symbol] = { shares:0, cost:0 });
    const gross = t.shares * t.price;
    fees += t.fee;
    if (t.action === 'dividend'){
      // 配息當成已實現收益,不動持股成本
      realized += t.amount - t.fee;
      dividends += t.amount - t.fee;
    }else if (t.action === 'sell'){
      const avg = lot.shares > 0 ? lot.cost / lot.shares : 0;
      const qty = Math.min(t.shares, lot.shares);      // 賣超過持有的部分不計,否則會憑空變成獲利
      if (qty < t.shares) oversold = true;
      const soldGross = qty * t.price;
      const costOut = avg * qty;
      realized += (soldGross - t.fee) - costOut;
      sellNet += soldGross - t.fee;
      lot.shares -= qty;
      lot.cost -= costOut;
    }else{
      lot.shares += t.shares;
      lot.cost += gross + t.fee;
      if (t.source === 'loan') buyLoan += gross + t.fee; else buyCash += gross + t.fee;
    }
  });
  let marketValue = 0, remainCost = 0;
  Object.keys(lots).forEach(sym => {
    marketValue += lots[sym].shares * symbolPrice(sym);
    remainCost += lots[sym].cost;
  });
  const unrealized = marketValue - remainCost;
  const interest = accruedInterest();
  const total = unrealized + realized - interest;
  const invested = buyCash + buyLoan;
  const years = sorted.length ? Math.max(daysSince(sorted[0].date) / 365.25, 0) : 0;
  return {
    lots, buyCash, buyLoan, invested, sellNet, realized, dividends, unrealized, interest, total, oversold,
    marketValue, remainCost, fees, years,
    hasData: sorted.length > 0,
    returnOnCash: buyCash > 0 ? total / buyCash * 100 : 0,
    returnOnAll: invested > 0 ? total / invested * 100 : 0,
    annualized: (invested > 0 && years > 0.08) ? (total / invested * 100) / years : null
  };
}

/* ===================== 曝險與風險 =====================
   00631L / 00675L 是正2 ETF,本身就有 2 倍槓桿;
   再用房貸借錢買,實際市場曝險是「部位市值 × 2」。 */
function computeRisk(){
  const p = computePosition();
  const r = computeLeverage();
  const pv = p.hasData ? p.marketValue : r.totalValue;
  const loan = r.usedAmount;
  const equity = pv - loan;
  const nw = netWorth();
  // 實質曝險:每檔各自乘上自己的槓桿倍數(正2 = 2,一般股票 = 1)
  const exposure = sum(r.holdings, h => h.value * (h.leverage || 1));
  // 分母 = 自己的錢 + 房貸總額度。用部位淨值而非部位市值,
  // 否則已動用的部分會同時被算進部位與額度裡,比例失真偏樂觀。
  const capacity = equity + state.leverage.creditLimit;
  return {
    pv, loan, equity, nw, exposure, capacity,
    creditLimit: state.leverage.creditLimit,
    invested: p.invested, pnl: p.total, hasTrades: p.hasData,
    leverage: equity > 0 ? pv / equity : 0,
    exposureRatio: capacity > 0 ? exposure / capacity * 100 : 0,
    monthlyInterest: r.monthlyInterest
  };
}

/* 每月快照:第一次開啟該月時自動記一筆,之後每次開啟更新到最新。
   使用者手動改過的那一筆(auto:false)不會被覆蓋。 */
function maybeSnapshot(){
  const p = computePosition();
  const r = computeLeverage();
  const nw = netWorth();
  if (!nw && !p.hasData && !r.totalValue) return false;
  const m = thisMonth();
  const found = state.netWorthHistory.find(h => h.m === m);
  if (found && !found.auto) return false;
  const snap = {
    v: Math.round(nw),
    pv: Math.round(p.hasData ? p.marketValue : r.totalValue),
    pnl: p.hasData ? Math.round(p.total) : null,
    loan: Math.round(r.usedAmount),
    auto: true
  };
  if (found){
    if (found.v === snap.v && found.pv === snap.pv && found.pnl === snap.pnl && found.loan === snap.loan) return false;
    Object.assign(found, snap);
  }else{
    state.netWorthHistory.push(Object.assign({ id: uid(), m }, snap));
  }
  scheduleSave();
  return true;
}

/* 壓力測試:大盤跌 d% 時,各標的照自己的槓桿倍數換算 */
function computeStress(d){
  const decline = num(d);
  const k = computeRisk();
  const r = computeLeverage();
  const L = state.leverage;
  if (!(k.pv > 0) || !decline) return null;

  let newPv = 0;
  r.holdings.forEach(h => {
    const shares = hasTrades() ? heldShares(h.id) : h.shares;
    const drop = decline * (h.leverage || 1) / 100;
    newPv += shares * h.price * Math.max(0, 1 - drop);
  });
  const loss = k.pv - newPv;
  const newEquity = newPv - k.loan;
  const newExposure = (() => {
    let e = 0;
    r.holdings.forEach(h => {
      const shares = hasTrades() ? heldShares(h.id) : h.shares;
      const drop = decline * (h.leverage || 1) / 100;
      e += shares * h.price * Math.max(0, 1 - drop) * (h.leverage || 1);
    });
    return e;
  })();
  const newCapacity = newEquity + L.creditLimit;

  const index = L.marketCurrent;
  const newIndex = index ? index * (1 - decline / 100) : 0;
  const wouldTrigger = (newIndex && L.marketHigh)
    ? r.tranches.filter(t => !t.used && newIndex <= t.triggerLevel)
    : [];
  const needCash = sum(wouldTrigger, t => t.amount);
  const newInterest = (k.loan + needCash) * (L.annualRate / 100) / 12;

  return {
    decline, pv: k.pv, newPv, loss, equity: k.equity, newEquity,
    ratio: k.exposureRatio, newRatio: newCapacity > 0 ? newExposure / newCapacity * 100 : 0,
    index, newIndex,
    wouldTrigger, needCash, interest: k.monthlyInterest, newInterest
  };
}

/* ===================== 總覽 ===================== */
function sparkline(hist){
  const w = 320, h = 96, padX = 10, padT = 12, padB = 18;
  const vals = hist.map(d => d.v);
  const maxV = Math.max(...vals), minV = Math.min(...vals);
  const span = maxV - minV;
  const y = v => span === 0 ? (h - padB + padT) / 2 : (h - padB) - (v - minV) / span * (h - padB - padT);
  const x = i => padX + i * (w - 2*padX) / Math.max(1, hist.length - 1);
  const pts = hist.map((d, i) => x(i).toFixed(1) + ',' + y(d.v).toFixed(1));
  const area = `M ${x(0).toFixed(1)},${(h - padB).toFixed(1)} L ` + pts.join(' L ') + ` L ${x(hist.length-1).toFixed(1)},${(h - padB).toFixed(1)} Z`;
  const last = hist[hist.length - 1];
  return `
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;margin-top:6px;" role="img" aria-label="淨資產走勢">
      <path d="${area}" fill="var(--accent-soft)" stroke="none"/>
      <polyline points="${pts.join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${x(hist.length-1).toFixed(1)}" cy="${y(last.v).toFixed(1)}" r="4" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>
      <text x="${padX}" y="${h - 4}" fill="var(--sub)" font-size="11">${esc(shortMonth(hist[0].m))}</text>
      <text x="${w - padX}" y="${h - 4}" fill="var(--sub)" font-size="11" text-anchor="end">${esc(shortMonth(last.m))}</text>
    </svg>
    <div class="row"><span class="muted">區間最低 NT$ ${fmt(minV)}</span><span class="muted">最高 NT$ ${fmt(maxV)}</span></div>`;
}

function renderOverview(){

/* ===================== 槓桿 ===================== */
function computeLeverage(){
  const L = state.leverage;
  // 有買賣紀錄就以紀錄為準,否則用標的清單裡手填的股數
  // 代號重複時只有第一列計入,否則買賣紀錄會被算兩次
  const seenIds = new Set();
  const holdings = state.instruments.map(it => {
    const dup = it.id && seenIds.has(it.id);
    if (it.id) seenIds.add(it.id);
    const shares = dup ? 0 : (hasTrades() ? heldShares(it.id) : it.shares);
    return { key:it.key, id:it.id, name:it.name, leverage:it.leverage, price:it.price,
             shares, value: shares * it.price, dup };
  });
  const totalValue = sum(holdings, h => h.value);

  const tranches = L.tranches.map(t => {
    const triggerLevel = L.marketHigh * (1 + t.thresholdPct/100);
    const triggered = L.marketHigh > 0 && L.marketCurrent > 0 && L.marketCurrent <= triggerLevel;
    return {
      ...t,
      triggerLevel, triggered,
      used: !!t.useDate,
      repaid: repaidOf(t),
      balance: outstanding(t),
      yearsUsed: daysSince(t.useDate)/365.25
    };
  });

  const usedTranches = tranches.filter(t => t.used);
  const coreBalance = outstanding(L.core);
  const usedAmount = sum(tranches, t => t.balance) + coreBalance;   // 還欠銀行多少
  const drawnAmount = sum(usedTranches, t => t.amount) + (L.core.useDate ? L.core.amount : 0);
  const coreUsed = !!L.core.useDate;

  const monthlyInterest = usedAmount * (L.annualRate/100) / 12;
  // 撤退門檻的 8% 也依實際餘額累積,還款之後不再照原始金額計算
  const exitThreshold = L.historicalHighValue + sum(L.tranches, t => accrue(t, 8));
  // 沒有還在欠的借款就沒有槓桿要撤,不論市值多高都不該亮燈
  const anyUsed = usedAmount > 0;
  const exitReached = anyUsed && L.historicalHighValue > 0 && totalValue >= exitThreshold;

  const positionDeclinePct = L.stressDeclinePct * 2;
  const lossAmount = totalValue * positionDeclinePct/100;

  return { holdings, totalValue, tranches, usedAmount, drawnAmount, coreBalance, coreUsed, monthlyInterest,
           exitThreshold, exitReached, anyUsed, positionDeclinePct, lossAmount,
           remainingNetWorth: netWorth() - lossAmount };
}

/* 自動記錄看過的最高總市值。只在欄位輸入完成(change)或重畫時檢查,
   避免打字打到一半的中間值被記成新高。 */
function exitBadge(r){
  if (!r.anyUsed) return `<div class="badge gray">尚未動用桶金,暫不適用</div>`;
  return r.exitReached
    ? `<div class="badge red">已達撤退門檻,可開始慢慢減碼</div>`
    : `<div class="badge gray">尚未達撤退門檻</div>`;
}

/* 動用桶金之前持續記錄新高;一旦動用就凍結 —— 撤退要比的是「下跌前的高點」,
   高點若跟著現價跑,門檻永遠追不上,訊號就永遠不會亮。 */
function maybeUpdateHigh(){
  const L = state.leverage;
  if (!L.autoHigh) return false;
  const r = computeLeverage();
  if (r.anyUsed) return false;          // 已動用:凍結為撤退目標
  if (r.totalValue > 0 && r.totalValue > L.historicalHighValue + 0.5){
    L.historicalHighValue = Math.round(r.totalValue);
    scheduleSave();
    return true;
  }
  return false;
}

/* 通用折線圖。series: [{name, color, values}],values 對齊 labels,可含 null。
   兩條以上一定畫圖例,末端直接標數字,座標文字都用主題色。 */
const chartData = {};   // 圖表資料暫存,點擊時查得到數值

function lineChart(key, labels, series, opts){
  const o = Object.assign({ height:130, zero:false, fmtVal: v => 'NT$ ' + fmt(v) }, opts || {});
  const w = 320, h = o.height, padL = 8, padR = 8, padT = 14, padB = 20;
  const all = [];
  series.forEach(s2 => s2.values.forEach(v => { if (v !== null && v !== undefined) all.push(v); }));
  if (all.length < 2) return '';
  let lo = Math.min(...all), hi = Math.max(...all);
  if (o.zero){ lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
  if (hi === lo){ hi = lo + Math.abs(lo || 1) * 0.1; lo = lo - Math.abs(lo || 1) * 0.1; }
  const x = i => padL + i * (w - padL - padR) / Math.max(1, labels.length - 1);
  const y = v => (h - padB) - (v - lo) / (hi - lo) * (h - padB - padT);

  chartData[key] = { labels, series, fmtVal: o.fmtVal, x: labels.map((_, i) => x(i)) };

  const paths = series.map(s2 => {
    let d = '', started = false;
    s2.values.forEach((v, i) => {
      if (v === null || v === undefined){ started = false; return; }
      d += (started ? ' L ' : ' M ') + x(i).toFixed(1) + ',' + y(v).toFixed(1);
      started = true;
    });
    return d ? `<path d="${d}" fill="none" stroke="${s2.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` : '';
  }).join('');

  const dots = series.map((s2, si) => s2.values.map((v, i) =>
    (v === null || v === undefined) ? '' :
    `<circle class="pt-${key}-${si}" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${i === labels.length - 1 ? 3.5 : 0}" fill="${s2.color}" stroke="var(--card)" stroke-width="2"/>`
  ).join('')).join('');

  // 整欄都可以點,手指好按
  const hits = labels.map((_, i) => {
    const half = (w - padL - padR) / Math.max(1, labels.length - 1) / 2;
    const x0 = Math.max(0, x(i) - half), x1 = Math.min(w, x(i) + half);
    return `<rect x="${x0.toFixed(1)}" y="0" width="${(x1 - x0).toFixed(1)}" height="${h}" fill="transparent" style="cursor:pointer" data-act="chart" data-key="${key}" data-i="${i}"></rect>`;
  }).join('');

  const zeroY = y(0);
  return `
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;margin-top:4px;touch-action:manipulation;" role="img" aria-label="${esc(o.label || '走勢')}">
      ${o.zero ? `<line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${w - padR}" y2="${zeroY.toFixed(1)}" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 3"/>` : ''}
      <line id="mk-${key}" x1="0" y1="${padT - 6}" x2="0" y2="${h - padB}" stroke="var(--sub)" stroke-width="1" stroke-dasharray="2 2" opacity="0"/>
      ${paths}${dots}${hits}
      <text x="${padL}" y="${h - 5}" fill="var(--sub)" font-size="10">${esc(labels[0])}</text>
      <text x="${w - padR}" y="${h - 5}" fill="var(--sub)" font-size="10" text-anchor="end">${esc(labels[labels.length - 1])}</text>
    </svg>
    <div class="row" id="cap-${key}" style="flex-wrap:wrap; gap:4px 14px;">${chartCaption(key, labels.length - 1)}</div>
    <div class="muted" style="font-size:11px;">點圖上任一處看該月數字</div>`;
}

/* 說明列:月份 + 每條線在該點的數值 */
function chartCaption(key, i){
  const d = chartData[key];
  if (!d) return '';
  const parts = d.series.map(s2 => {
    const v = s2.values[i];
    return `<span class="muted"><span class="legend-dot" style="background:${s2.color}"></span>${esc(s2.name)} ${(v === null || v === undefined) ? '—' : d.fmtVal(v)}</span>`;
  }).join('');
  return `<span class="muted" style="font-weight:700; color:var(--text);">${esc(d.labels[i])}</span>${parts}`;
}

/* 點圖:只動說明列與游標線,不整頁重畫 */
function pickChartPoint(key, i){
  const d = chartData[key];
  if (!d) return;
  const cap = document.getElementById('cap-' + key);
  if (cap) cap.innerHTML = chartCaption(key, i);
  const mk = document.getElementById('mk-' + key);
  if (mk){
    mk.setAttribute('x1', d.x[i].toFixed(1));
    mk.setAttribute('x2', d.x[i].toFixed(1));
    mk.setAttribute('opacity', '1');
  }
  d.series.forEach((s2, si) => {
    document.querySelectorAll('.pt-' + key + '-' + si).forEach((el, idx) => {
      el.setAttribute('r', idx === i ? '4' : '0');
    });
  });
}

function renderRisk(){

  const expPct = Math.min(100, k.exposureRatio);

  const labels = hist.map(h => shortMonth(h.m));
  const posChart = lineChart('pos', labels, [
    { name:'部位市值', color:'var(--s1)', values: hist.map(h => h.pv === null || h.pv === undefined ? null : h.pv) },

    <div class="card">

      <div class="bar-track"><div class="bar-fill ${heavy ? 'over' : ''}" style="width:${expPct.toFixed(1)}%"></div></div>

        <span class="label">部位淨值(自己的錢)</span><span class="val">NT$ ${fmt(k.equity)}</span></div>
      <div class="row"><span class="label">＋ 房貸總額度</span><span class="val">NT$ ${fmt(k.creditLimit)}</span></div>
      <div class="row"><span class="label" style="font-weight:700;">分母合計</span><span class="val" style="font-weight:800;">NT$ ${fmt(k.capacity)}</span></div>
      <div class="muted">分母用部位淨值,不用部位市值 — 已借出的錢同時在部位裡也在額度裡,算兩次會讓比例看起來比實際安全。</div>
      <div class="muted" style="margin-top:4px;">大盤每動 1%,部位市值大約跟著動 2%。額度用得越多,分母越接近你自己的錢,比例會誠實地升高。</div>
      <div class="row" style="border-top:1px solid var(--line); padding-top:10px; margin-top:12px;">

      <div class="row"><span class="label">借款餘額</span><span class="val neg">−NT$ ${fmt(k.loan)}</span></div>
    ${posChart ? `
      <div style="margin-top:14px; padding-top:12px; border-top:1px solid var(--line);">
        <h3 style="margin-bottom:6px;">部位市值與借款</h3>

/* 損益走勢圖給部位損益卡用 */
function pnlChartBlock(){
  const hist = state.netWorthHistory.slice().sort((a, b) => a.m < b.m ? -1 : 1).slice(-12);
  const chart = lineChart('pnl', hist.map(h => shortMonth(h.m)), [
    { name:'整體損益', color:'var(--s1)', values: hist.map(h => h.pnl === null || h.pnl === undefined ? null : h.pnl) }
  ], { zero:true, label:'整體損益走勢', height:120,
       fmtVal: v => (v >= 0 ? '+' : '−') + 'NT$ ' + fmt(Math.abs(v)) });
  return chart ? `
    <div style="margin-top:14px; padding-top:12px; border-top:1px solid var(--line);">
      ${chart}
      <div class="muted">每月第一次開啟時自動記錄。虛線是損益兩平。</div>
    </div>` : '';
}

function refreshLeverage(){
  const L = state.leverage;
  const r = computeLeverage();
  const set = (id, text) => { const el = document.getElementById(id); if (el) el.textContent = text; };
  r.holdings.forEach(h => set('out-val-' + h.key, 'NT$ ' + fmt(h.value)));
  set('out-totalValue', 'NT$ ' + fmt(r.totalValue));
  r.tranches.forEach(t => {
    const badge = document.getElementById('out-status-' + t.id);
    if (badge){
      badge.textContent = t.triggered ? '已觸發' : '未觸發';
      badge.className = 'badge ' + (t.triggered ? 'red' : 'gray');
    }
    set('out-trigger-' + t.id, t.triggerLevel ? fmt(t.triggerLevel) : '—');
  });
  set('out-usedAmount', 'NT$ ' + fmt(r.usedAmount));
  const bar = document.getElementById('out-usedBar');
  if (bar) bar.style.width = (L.creditLimit ? Math.min(100, r.usedAmount / L.creditLimit * 100) : 0).toFixed(1) + '%';
  set('out-remainingLine', 'NT$ ' + fmt(Math.max(0, L.creditLimit - r.usedAmount)));
  set('out-monthlyInterest', 'NT$ ' + fmt(r.monthlyInterest));
  set('out-exitThreshold', 'NT$ ' + fmt(r.exitThreshold));
  set('out-exitCurrent', 'NT$ ' + fmt(r.totalValue));
  const wrap = document.getElementById('out-exitBadgeWrap');
  if (wrap) wrap.innerHTML = exitBadge(r);
  set('out-positionDeclinePct', fmtPct(-r.positionDeclinePct));
  set('out-lossAmount', 'NT$ ' + fmt(r.lossAmount));
  set('out-remainingNetWorth', 'NT$ ' + fmt(r.remainingNetWorth));
}

/* 每月把槓桿利息記成一筆支出。已記過的月份會留在 interestPosted,
   所以你把那筆刪掉之後不會又被加回來。 */
function maybePostInterest(){
  const L = state.leverage;
  if (!L.autoInterest) return false;
  const r = computeLeverage();
  if (!(r.monthlyInterest > 0)) return false;
  const m = thisMonth();
  if (L.interestPosted.includes(m)) return false;
  state.transactions.push({
    id: uid(),
    date: m + '-01',
    cat: '房貸利息',
    desc: '槓桿借款利息(自動記入)',
    amount: -Math.round(r.monthlyInterest)
  });
  L.interestPosted.push(m);
  scheduleSave();
  return true;
}

/* ===================== 輸入處理 ===================== */
const findById = (list, id) => list.find(x => x.id === id);

function onField(key, el){
  const dash = key.indexOf('-');
  const kind = key.slice(0, dash);
  const rest = key.slice(dash + 1);
  let structural = false;

  if (kind === 'an'){ const a = findById(state.assets, rest); if (a) a.name = el.value; }
  else if (kind === 'aa'){ const a = findById(state.assets, rest); if (a) a.amount = Math.max(0, num(el.value)); }
  else if (kind === 'ln'){ const l = findById(state.liabilities, rest); if (l) l.name = el.value; }
  else if (kind === 'la'){ const l = findById(state.liabilities, rest); if (l) l.amount = Math.max(0, num(el.value)); }
  else if (kind === 'nh'){
    const h = findById(state.netWorthHistory, rest);
    if (h){ h.v = num(el.value); h.auto = false; }   // 自己改過就不再被自動快照覆寫
  }
  else if (kind === 'lev'){ state.leverage[rest] = Math.max(0, num(el.value)); }
  else if (kind === 'in'){                       // 標的清單,用內部 key 定位
    const cut = rest.indexOf('-');
    const what = rest.slice(0, cut), ikey = rest.slice(cut + 1);
    const it = findInstrumentByKey(ikey);
    if (it){
      if (what === 'id'){
        const next = el.value.trim();
        const taken = state.instruments.some(x => x.key !== it.key && x.id === next);
        if (next && !taken){
          const prev = it.id;
          state.trades.forEach(t => { if (t.symbol === prev) t.symbol = next; });
          if (tradeDraft.symbol === prev) tradeDraft.symbol = next;
          it.id = next;
          levMsg = '';
          structural = true;
        }else if (taken){
          levMsg = '代號「' + next + '」已經有了。';
        }
      }
      else if (what === 'name') it.name = el.value;
      else if (what === 'lev') it.leverage = num(el.value);
      else if (what === 'price') it.price = Math.max(0, num(el.value));
      else if (what === 'shares') it.shares = Math.max(0, num(el.value));
    }
  }
  else if (kind === 'tr'){
    const p = rest.indexOf('-');
    const what = rest.slice(0, p), id = rest.slice(p + 1);
    const t = findById(state.leverage.tranches, id);
    if (t){
      if (what === 'pct') t.thresholdPct = num(el.value);      // 跌幅門檻本來就是負數
      else if (what === 'amt') t.amount = Math.max(0, num(el.value));
      else if (what === 'idx') t.useIndex = num(el.value);
      else if (what === 'note') t.note = el.value;
      else t.useDate = el.value;
    }
  }
  else if (kind === 'rp'){                       // 還款紀錄 rp-<what>-<桶id>-<還款id>
    const bits = rest.split('-');
    const what = bits[0], rid = bits[bits.length - 1], tid = bits.slice(1, -1).join('-');
    const target = tid === 'core' ? state.leverage.core : findById(state.leverage.tranches, tid);
    const rp = target && (target.repayments || []).find(x => x.id === rid);
    if (rp){
      if (what === 'date') rp.date = el.value;
      else rp.amount = Math.max(0, num(el.value));
    }
  }
  else if (kind === 'core'){
    if (rest === 'amt') state.leverage.core.amount = Math.max(0, num(el.value));
    else state.leverage.core.useDate = el.value;
  }
  else if (kind === 'd'){
    if (rest === 'cat' && el.value === '__new__'){   // 下拉選到「新增類別…」
      draft.cat = '';
      draft.newCat = true;
      renderAll();
      return;
    }
    draft[rest] = el.value;
    return;                                          // 草稿不入庫
  }
  else if (kind === 'pd'){                                          // 買賣草稿
    tradeDraft[rest] = el.value;
    if (rest === 'shares' || rest === 'price') renderAll();          // 更新成交金額預估
    return;
  }
  else if (kind === 'pt'){                                          // 修改既有買賣紀錄
    const cut = rest.indexOf('-');
    const what = rest.slice(0, cut), tid = rest.slice(cut + 1);
    const t = findById(state.trades, tid);
    if (t){
      if (what === 'date') t.date = el.value || todayISO();
      else if (what === 'note') t.note = el.value;
      else t[what] = Math.max(0, num(el.value));   // 股數、價格、費用都不會是負的
    }
    structural = true;
  }
  else if (kind === 'tdate' || kind === 'tamt' || kind === 'tcat' || kind === 'tdesc'){
    const t = findById(state.transactions, rest);
    if (t){
      if (kind === 'tdate') t.date = el.value || todayISO();
      else if (kind === 'tamt') t.amount = num(el.value);
      else if (kind === 'tcat') t.cat = el.value;
      else t.desc = el.value;
    }
    structural = true;
  }

  scheduleSave();
  if (kind === 'tr' && rest.startsWith('date-')){
    maybePostInterest();
    renderAll();                                // 動用日期會長出/收起動用紀錄欄位
    return;
  }
  if (structural) return;                       // 交易編輯:離開欄位時才重畫
  if (currentTab === 'assets') refreshAssets();
  else if (currentTab === 'leverage') refreshLeverage();
}

/* 匯出成 CSV 給 Excel。多張表放同一個檔,以空行和標題分隔。
   開頭加 BOM,Excel 開繁中才不會變亂碼。 */
function csvCell(v){
  const t = String(v === null || v === undefined ? '' : v);
  return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
}
function csvTable(title, headers, rows){
  if (!rows.length) return '';
  return title + '\n' + headers.join(',') + '\n'
    + rows.map(r => r.map(csvCell).join(',')).join('\n') + '\n\n';
}
function stateCSV(){
  const L = state.leverage;
  let out = '';

  out += csvTable('# 交易紀錄', ['日期', '類別', '說明', '金額'],
    state.transactions.slice().sort((a, b) => a.date < b.date ? 1 : -1)
      .map(t => [t.date, t.cat, t.desc, t.amount]));

  out += csvTable('# 買賣紀錄',
    ['日期', '標的', '動作', '股數', '成交價', '手續費', '配息金額', '資金來源', '備註'],
    state.trades.slice().sort((a, b) => a.date < b.date ? 1 : -1)
      .map(t => [t.date, t.symbol,
                 t.action === 'sell' ? '賣出' : t.action === 'dividend' ? '配息' : '買進',
                 t.shares, t.price, t.fee, t.amount,
                 t.action === 'buy' ? (t.source === 'loan' ? '房貸借款' : '自有資金') : '',
                 t.note]));

  out += csvTable('# 持股', ['代號', '名稱', '槓桿倍數', '股數', '股價', '市值'],
    state.instruments.map(it => {
      const sh = hasTrades() ? heldShares(it.id) : it.shares;
      return [it.id, it.name, it.leverage, sh, it.price, Math.round(sh * it.price)];
    }));

  const r = computeLeverage();
  out += csvTable('# 房貸動用',
    ['項目', '動用日期', '動用金額', '已還', '餘額', '動用時大盤點位', '備註'],
    r.tranches.filter(t => t.useDate)
      .map(t => [t.label, t.useDate, t.amount, t.repaid, t.balance, t.useIndex || '', t.note])
      .concat(L.core.useDate
        ? [[L.core.label, L.core.useDate, L.core.amount, repaidOf(L.core), r.coreBalance, '', '']]
        : []));

  const repays = [];
  L.tranches.concat([L.core]).forEach(t => {
    (t.repayments || []).forEach(rp => { if (rp.date) repays.push([t.label, rp.date, rp.amount]); });
  });
  out += csvTable('# 還款紀錄', ['項目', '日期', '金額'],
    repays.sort((a, b) => a[1] < b[1] ? 1 : -1));

  out += csvTable('# 資產', ['名稱', '金額'], state.assets.map(a => [a.name, a.amount]));
  out += csvTable('# 負債', ['名稱', '金額'], state.liabilities.map(l => [l.name, l.amount]));

  out += csvTable('# 每月快照', ['月份', '淨資產', '部位市值', '借款餘額', '整體損益'],
    state.netWorthHistory.slice().sort((a, b) => a.m < b.m ? 1 : -1)
      .map(h => [h.m, h.v, h.pv === null ? '' : h.pv, h.loan === null ? '' : h.loan, h.pnl === null ? '' : h.pnl]));

  const p = computePosition();
  out += csvTable('# 目前損益', ['項目', '金額'], [
    ['目前市值', Math.round(p.marketValue)],
    ['持股成本', Math.round(p.remainCost)],
    ['未實現損益', Math.round(p.unrealized)],
    ['已實現損益(含配息)', Math.round(p.realized)],
    ['其中配息', Math.round(p.dividends)],
    ['累積借款利息', Math.round(p.interest)],
    ['整體損益', Math.round(p.total)],
    ['自有資金投入', Math.round(p.buyCash)],
    ['房貸投入', Math.round(p.buyLoan)]
  ]);

  return '\ufeff' + out;
}

async function saveFile(filename, text, mime){
  if (downloadsNs){
    try{
      const res = await downloadsNs.save({ filename, data: text });
      dataMsg = res && res.status === 'delivered' ? '已送出 ' + filename : '已匯出 ' + filename;
      renderAll();
      return;
    }catch(e){
      if (e && e.code === 'cancelled') return;
    }
  }
  try{
    const url = URL.createObjectURL(new Blob([text], { type: mime }));
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    dataMsg = '已匯出 ' + filename;
  }catch(e){
    dataMsg = '這個瀏覽器擋下了下載,請改用「複製成文字」';
  }
  renderAll();
}

async function exportJSON(){
  await saveFile('finance-' + todayISO() + '.json', stateJSON(), 'application/json');
}
async function exportCSV(){
  await saveFile('finance-' + todayISO() + '.csv', stateCSV(), 'text/csv;charset=utf-8');
}

function importJSON(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      state = normalize(JSON.parse(String(reader.result)));
      viewMonth = thisMonth();
      dataMsg = '已匯入 ' + file.name;
      save();
      renderAll();
    }catch(e){
      dataMsg = '這個檔案讀不出來,請確認是本 app 匯出的 JSON';
      renderAll();
    }
  };
  reader.onerror = () => { dataMsg = '讀取檔案失敗'; renderAll(); };
  reader.readAsText(file);
}

async function copyJSON(){
  const text = stateJSON();
  try{
    await navigator.clipboard.writeText(text);
    dataMsg = '已複製,貼到備忘錄或訊息就是一份備份';
  }catch(e){
    dataMsg = '複製失敗,請改用「匯出備份」';
  }
  renderAll();
}

function onClick(el){
  const act = el.dataset.act;
  const id = el.dataset.id;
  let rerender = true;
  if (!['load-sample', 'clear-all', 'del-tx', 'del-trade', 'restore'].includes(act)) pendingConfirm = null;
  if (!['export', 'export-csv', 'import', 'copy-json'].includes(act)) dataMsg = '';

  switch (act){
    case 'month': viewMonth = shiftMonth(viewMonth, Number(el.dataset.v)); break;
    case 'go': switchTab(el.dataset.v); return;
    case 'add-asset': state.assets.push({ id:uid(), name:'', amount:0 }); break;
    case 'del-asset': state.assets = state.assets.filter(a => a.id !== id); break;
    case 'add-liab': state.liabilities.push({ id:uid(), name:'', amount:0 }); break;
    case 'del-liab': state.liabilities = state.liabilities.filter(l => l.id !== id); break;
    case 'del-hist': state.netWorthHistory = state.netWorthHistory.filter(h => h.id !== id); break;
    case 'snap-networth': {
      const m = thisMonth();
      const found = state.netWorthHistory.find(h => h.m === m);
      if (found) found.auto = true;      // 允許這次覆寫成目前數字
      maybeSnapshot();
      break;
    }
    case 'export': exportJSON(); return;
    case 'import': {
      const f = document.getElementById('importFile');
      if (f) f.click();
      return;
    }
    case 'copy-json': copyJSON(); return;
    case 'export-csv': exportCSV(); return;
    case 'add-repay': {
      const target = id === 'core' ? state.leverage.core : findById(state.leverage.tranches, id);
      if (target){
        if (!Array.isArray(target.repayments)) target.repayments = [];
        target.repayments.push({ id: uid(), date: todayISO(), amount: 0 });
      }
      break;
    }
    case 'del-repay': {
      const [tid, rid] = String(id).split(':');
      const target = tid === 'core' ? state.leverage.core : findById(state.leverage.tranches, tid);
      if (target) target.repayments = (target.repayments || []).filter(x => x.id !== rid);
      break;
    }
    case 'add-instrument':
      state.instruments.push({ key: uid(), id:'', name:'', leverage:1, price:0, shares:0, auto:true });
      levMsg = '新的一列請填股票代號,填了才抓得到報價。';
      break;
    case 'del-instrument': {
      const it = findInstrumentByKey(id);
      if (!it) break;
      const used = state.trades.filter(t => t.symbol === it.id).length;
      if (used){
        levMsg = '「' + (it.id || '未命名') + '」還有 ' + used + ' 筆買賣紀錄,先把那些紀錄刪掉或改成別的代號。';
        break;
      }
      state.instruments = state.instruments.filter(x => x.key !== id);
      break;
    }
    case 'draft-action': tradeDraft.action = el.dataset.v; break;
    case 'cat-pick': draft.newCat = false; draft.cat = knownCats()[0] || ''; break;
    case 'draft-source': tradeDraft.source = el.dataset.v; break;
    case 'add-trade': {
      const d0 = tradeDraft;
      const base = {
        id: uid(),
        date: d0.date || todayISO(),
        symbol: d0.symbol,
        action: d0.action,
        note: d0.note.trim(),
        source: d0.action === 'buy' ? d0.source : 'cash'
      };
      if (d0.action === 'dividend'){
        const amount = Math.abs(num(d0.amount));
        if (!amount){ tradeError = '請填領到的金額'; renderAll(); return; }
        state.trades.push(Object.assign(base, { shares:0, price:0, amount, fee: Math.abs(num(d0.fee)) }));
      }else{
        const shares = Math.abs(num(d0.shares));
        const price = Math.abs(num(d0.price));
        if (!shares || !price){ tradeError = '請填股數與成交價'; renderAll(); return; }
        const gross = shares * price;
        state.trades.push(Object.assign(base, {
          shares, price, amount: 0,
          fee: d0.fee === '' ? defaultFee(d0.action, gross) : Math.abs(num(d0.fee))
        }));
      }
      tradeError = '';
      tradeDraft = { date: d0.date, symbol: d0.symbol, action: d0.action, source: d0.source,
                     shares:'', price:'', amount:'', fee:'', note:'' };
      break;
    }
    case 'edit-trade': editingTrade = id; break;
    case 'close-trade': editingTrade = null; break;
    case 'del-trade':
      if (needsConfirm('del-trade:' + id)) return;
      state.trades = state.trades.filter(t => t.id !== id);
      editingTrade = null;
      break;
    case 'chart': pickChartPoint(el.dataset.key, Number(el.dataset.i)); return;
    case 'fetch-quotes': fetchQuotes(true); return;
    case 'show-backups':
      if (backupOpen){ backupOpen = false; break; }
      loadBackups();
      return;
    case 'restore':
      if (needsConfirm('restore:' + id)) return;
      restoreBackup(id);
      return;
    case 'toggle-autointerest':
      state.leverage.autoInterest = !state.leverage.autoInterest;
      if (state.leverage.autoInterest) maybePostInterest();
      break;
    case 'toggle-autohigh':
      state.leverage.autoHigh = !state.leverage.autoHigh;
      if (state.leverage.autoHigh) maybeUpdateHigh();
      break;
    case 'sign-in': signInCloud(); return;
    case 'sign-out': signOutCloud(); return;
    case 'draft-type': draft.type = el.dataset.v; break;
    case 'add-tx': {
      const amt = Math.abs(num(draft.amount));
      if (!amt){ draftError = '請先填金額'; renderAll(); return; }
      draftError = '';
      state.transactions.push({
        id:uid(),
        date: draft.date || todayISO(),
        cat: (draft.cat || '').trim() || knownCats()[0] || (draft.type === 'income' ? '收入' : '其他'),
        desc: draft.desc.trim(),
        amount: draft.type === 'income' ? amt : -amt
      });
      viewMonth = (draft.date || todayISO()).slice(0,7);
      draft = { date: draft.date || todayISO(), type: draft.type, cat: draft.cat, desc:'', amount:'', newCat:false };
      break;
    }
    case 'edit-tx': editingTx = id; break;
    case 'close-tx': editingTx = null; break;
    case 'del-tx':
      if (needsConfirm('del-tx:' + id)) return;
      state.transactions = state.transactions.filter(t => t.id !== id);
      editingTx = null;
      break;
    case 'load-sample':
      if (needsConfirm('load-sample')) return;
      state = sampleData();
      viewMonth = thisMonth();
      break;
    case 'clear-all':
      if (needsConfirm('clear-all')) return;
      state = emptyState();
      viewMonth = thisMonth();
      break;
    default: rerender = false;
  }
  if (!['month', 'edit-tx', 'close-tx', 'edit-trade', 'close-trade'].includes(act)) scheduleSave();
  if (rerender) renderAll();
}

/* ===================== 啟動 ===================== */
function init(){
  const d = new Date();
  // 分頁列旁邊只放短日期,免得窄螢幕擠不下
  document.getElementById('todayDate').textContent = (d.getMonth()+1) + '/' + d.getDate();

  const local = readLocal();
  if (local) state = normalize(local);

  const content = document.getElementById('content');
  content.addEventListener('input', e => {
    const k = e.target.dataset && e.target.dataset.k;
    if (k) onField(k, e.target);
  });
  content.addEventListener('change', e => {
    if (e.target.id === 'importFile' && e.target.files && e.target.files[0]){
      importJSON(e.target.files[0]);
      e.target.value = '';
      return;
    }
    // 欄位輸入結束才檢查新高,避免記到打字中的中間值
    if (e.target.dataset && e.target.dataset.k && currentTab === 'leverage'){
      if (maybeUpdateHigh()) syncHighInput();
      refreshLeverage();
      // 損益卡不是靠 id 局部更新的,沒有游標停在欄位上時整頁重畫一次
      if (!(document.activeElement && document.activeElement.tagName === 'INPUT')) renderAll();
    }
  });
  content.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (el) onClick(el);
  });
  content.addEventListener('focusout', () => {
    setTimeout(() => {
      if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
      if (pendingRemote){ const d2 = pendingRemote; pendingRemote = null; applyRemote(d2); }
      else if (editingTx || editingTrade) renderAll();
    }, 60);
  });
  document.querySelectorAll('[data-tab]').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  storageMode = 'local';
  maybePostInterest();
  maybeSnapshot();
  renderAll();
  maybeAutoQuote();
  connectCloud();   // 連上雲端後會自動接手並更新畫面
  setTimeout(maybeBackup, 4000);   // 讓畫面與雲端先就緒
  if (window.claude && typeof window.claude.use === 'function'){
    window.claude.use('downloads').then(ns => { downloadsNs = ns; }).catch(() => {});
  }
}

init();
</script>
