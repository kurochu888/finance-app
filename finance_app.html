<title>槓桿投資儀表板</title>
<style>
  :root{
    --bg:#e8ebf0; --card:#ffffff; --raised:#f4f6f9; --text:#1b1f27; --sub:#69707c;
    --line:#dfe3ea; --accent:#2563eb; --accent-soft:#dbeafe; --accent-ink:#ffffff;
    --green:#15803d; --green-soft:#dcfce7;
    --red:#b91c1c; --red-soft:#fee2e2;
    --amber:#b45309; --amber-soft:#fef3c7;
    --bar-track:#dde1e8;
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
    --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948; --s9:#9aa1ac;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b0d11; --card:#1c2029; --raised:#252a34; --text:#e8eaed; --sub:#9aa1ac;
      --line:#30353f; --accent:#4d8dff; --accent-soft:#1c2c4a; --accent-ink:#0b0d11;
      --green:#3ecf6a; --green-soft:#123a20;
      --red:#f87171; --red-soft:#3f1717;
      --amber:#f2b23a; --amber-soft:#3f2f0e;
      --bar-track:#2a2e37;
      --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
      --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s9:#6b7280;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b0d11; --card:#1c2029; --raised:#252a34; --text:#e8eaed; --sub:#9aa1ac;
    --line:#30353f; --accent:#4d8dff; --accent-soft:#1c2c4a; --accent-ink:#0b0d11;
    --green:#3ecf6a; --green-soft:#123a20;
    --red:#f87171; --red-soft:#3f1717;
    --amber:#f2b23a; --amber-soft:#3f2f0e;
    --bar-track:#2a2e37;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s9:#6b7280;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    display:flex; justify-content:center; padding:16px 10px;
    height:100vh; height:100dvh; overflow:hidden;
    font-variant-numeric:tabular-nums;
  }
  /* 框本身不長高,只有中間的內容捲動,上下兩排分頁列永遠看得到 */
  .phone{
    width:100%; max-width:430px; height:100%; background:var(--bg);
    border-radius:24px; box-shadow:0 8px 32px rgba(15,20,35,.14);
    overflow:hidden; display:flex; flex-direction:column;
    border:1px solid var(--line);
  }
  @media (max-height: 560px){ body{padding:0;} .phone{border-radius:0; border:none;} }
  @media (max-width: 359px){
    .erow{flex-wrap:wrap;}
    .erow .f-name, .erow .f-title{flex:1 1 100%;}
    .erow .f-amt{flex:1 1 auto; max-width:none;}
  }
  .topbar{
    flex:0 0 auto; padding:10px 6px 0; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:6px; background:var(--card);
  }
  .toptabs{
    flex:1 1 auto; display:flex; gap:2px; overflow-x:auto; scrollbar-width:none;
  }
  .toptabs::-webkit-scrollbar{display:none;}
  .top-tab{
    flex:1 0 auto; padding:8px 9px 9px; border:none; background:none; cursor:pointer;
    color:var(--sub); font-size:14px; font-family:inherit; white-space:nowrap;
    border-bottom:2px solid transparent; margin-bottom:-1px;
  }
  .top-tab.active{color:var(--accent); font-weight:700; border-bottom-color:var(--accent);}
  .topbar .date{flex:0 0 auto; font-size:11px; color:var(--sub); padding:0 8px 8px 2px;}
  .content{
    flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:14px; padding-bottom:10px; overscroll-behavior:contain; overflow-x:hidden;
  }
  .tabbar{flex:0 0 auto; display:flex; border-top:1px solid var(--line); background:var(--card);}
  .tab-btn{
    flex:1; background:none; border:none; padding:9px 2px 11px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    color:var(--sub); font-size:11px; font-family:inherit;
  }
  .tab-btn .ic{font-size:17px; line-height:1.2;}
  .tab-btn.active{color:var(--accent); font-weight:700;}
  button:focus-visible, input:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:16px 15px; margin-bottom:14px;
    box-shadow:0 1px 2px rgba(15,20,35,.06), 0 8px 18px -14px rgba(15,20,35,.35);
  }
  .card h3{
    margin:0 0 12px; font-size:12px; color:var(--sub); font-weight:700;

<div class="phone">

    <button class="tab-btn" data-tab="leverage"><span class="ic">⚡</span><span>槓桿</span></button>
    <button class="tab-btn" data-tab="ledger"><span class="ic">📒</span><span>記帳</span></button>
    <button class="tab-btn" data-tab="help"><span class="ic">📖</span><span>說明</span></button>
  </nav>

<script>
/* ===================== 小工具 ===================== */
const uid = () => Math.random().toString(36).slice(2,9);
// 非有限值(NaN、Infinity、超出範圍的 1e309)一律當 0。以前只擋 NaN,隨機壓測抓到在淨資產歷史填 1e309
// 會把 Infinity 存進 state,整條走勢跟淨資產計算都壞掉;程式裡沒有任何欄位需要 Infinity,所以直接在這裡擋。
// 另外夾在 ±1 兆以內:1e308 這種有限但極大的值,乘上股數/槓桿就溢位成 Infinity,畫面出現「NaN%」
// (型別錯亂隨機測試抓到)。1 兆元/股遠超過任何實際數字,兩個相乘也不會溢位。
const NUM_MAX = 1e12;
const num = v => { const n = parseFloat(v); return Number.isFinite(n) ? Math.max(-NUM_MAX, Math.min(NUM_MAX, n)) : 0; };
// 快照裡存的是加總出來的值(淨資產、市值…),由已經夾過的輸入算出來,本身不會溢位,但可能超過 1 兆(負債填 1 兆
// 再加別的項目);讀回來時如果用 1 兆再夾一次,當下跟重新整理後的數字就對不起來。這些欄位用寬很多的 ±1000 兆:
// 輸入都在 1 兆以內,要上千項都填滿上限才碰得到;又不會讓匯入的 1e308 把走勢圖的範圍算成 Infinity、座標變 NaN。
const finNum = v => { const n = parseFloat(v); return Number.isFinite(n) ? Math.max(-1e15, Math.min(1e15, n)) : 0; };
// finiteNum:同上,但可以指定不合法時的預設值(normalize() 補均線參數這類欄位用)。
const finiteNum = (v, fallback) => { const n = num(v); return Number.isFinite(n) ? n : fallback; };
const fmt = n => (Math.round(n) || 0).toLocaleString('zh-Hant-TW');
const money = v => (v < 0 ? '−' : '') + 'NT$ ' + fmt(Math.abs(v));   // 負數寫成「−NT$ 400,000」,不是「NT$ -400,000」
const fmtPct = n => (n >= 0 ? '+' : '') + n.toFixed(1) + '%';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad2 = n => String(n).padStart(2, '0');
function todayISO(){ const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
/* 合法的 YYYY-MM-DD 才收(2 月 30 日這種不存在的日期也擋),不合法就回傳 fallback。手機的日期選擇器本身
   打不出亂碼,但匯入的備份檔、雲端同步來的資料可能帶進任何字串;壞掉的日期會讓記帳的月份分組、
   利息天數算出 NaN(隨機壓測抓到「<b>x</b>年NaN月」),所以所有寫入日期的地方都先過這一關。 */
function isoDate(v, fallback = ''){
  const str = String(v == null ? '' : v).trim().slice(0, 10);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(str)) return fallback;
  const d = new Date(str + 'T00:00:00');
  if (isNaN(d.getTime())) return fallback;
  return (d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate())) === str ? str : fallback;
}
const thisMonth = () => todayISO().slice(0,7);
function monthLabel(m){ const p = m.split('-'); return p[0] + '年' + Number(p[1]) + '月'; }
function shortMonth(m){ return Number(m.split('-')[1]) + '月'; }
function shiftMonth(m, delta){
  const y = Number(m.slice(0,4)), mo = Number(m.slice(5,7)) - 1 + delta;
  const d = new Date(y, mo, 1);
  return d.getFullYear() + '-' + pad2(d.getMonth()+1);
}
function daysBetweenISO(a, b){
  const d1 = new Date(a + 'T00:00:00'), d2 = new Date(b + 'T00:00:00');
  if (isNaN(d1.getTime()) || isNaN(d2.getTime())) return 0;
  return Math.max(0, (d2 - d1) / 86400000);
}
function daysSince(dateStr){
  if (!dateStr) return 0;
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d.getTime())) return 0;
  return Math.max(0, (Date.now() - d.getTime()) / 86400000);
}
function canon(v){
  if (Array.isArray(v)) return '[' + v.map(canon).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
  return JSON.stringify(v === undefined ? null : v);
}
const SERIES = ['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)','var(--s6)','var(--s7)','var(--s8)'];
const seriesColor = i => i < SERIES.length ? SERIES[i] : 'var(--s9)';

/* ===================== 預設狀態 ===================== */
const DEFAULT_LEVERAGE = {
  shares675L:0, price675L:0, shares631L:0, price631L:0,
  // marketHigh/marketCurrent/historicalHighValue/autoHigh:舊的跌幅觸發判斷用的欄位,
  // 那套邏輯已經拿掉,現在沒有任何 UI 讀寫它們(只是讓舊存檔資料讀得進來不出錯)。
  marketHigh:0, marketCurrent:0, historicalHighValue:0,
  stressDeclinePct:20, creditLimit:5000000, annualRate:2.6, autoHigh:true,
  autoInterest:true, interestPosted:[], quoteDate:'',
  draws:[],
  /* 正2(槓桿2倍)曝險目標:byLayer[i] = 加碼第 i+1 層的目標曝險比例(%),
     hold = 兩檔都確認 HOLD 時的目標,跟最後一層的目標可以一樣也可以不一樣。
     跟均線趨勢訊號的加碼層數(pyramidLevels)搭配用,見 computeExposurePlan()。 */
  exposureTargets: { byLayer:[65, 130], hold:130 }
};
/* 記帳的預設類別。之後在記帳頁選「新增類別…」加的,會經由交易紀錄進入清單 */
const DEFAULT_CATEGORIES = ['餐飲','房貸 / 房租','交通','娛樂','其他','房貸利息'];
/* 均線趨勢訊號的參數預設值:槓桿倍數 >=2(正2類)用較慢、較寬鬆的組合,
   避免被槓桿本身的波動洗出場;1倍(0050類)用稍快一點的組合。
   這兩組是使用者自己長期在用、驗證過樣本外表現的參數,不是隨便挑的。 */
function defaultTrendParams(leverage){
  const base = (num(leverage) >= 2)
    ? { maFast:120, maSlow:240, exitBuffer:0.90, recoverSlopeThreshold:1.002, recoverStrongRebound:1.03, pyramidGap:0.15, pyramidLevels:2 }
    : { maFast:100, maSlow:200, exitBuffer:0.95, recoverSlopeThreshold:1.002, recoverStrongRebound:1.03, pyramidGap:0.15, pyramidLevels:1 };
  return Object.assign(base, { lastSeenStatus:'', lastSeenLayers:-1, lastSeenDate:'' });   // 欄位順序跟 normalize() 一致,存檔往返才不會多出差異
}
const PRICE_HIST_KEEP = 1000;   // 約 4 年份,遠超過 240 日均線需要的長度

/* key 是內部識別碼,id 是股票代號 —— 代號可能空白或重複,不能拿來當 key */
const DEFAULT_INSTRUMENTS = [
  { id:'00631L', name:'元大台灣50正2',   leverage:2, price:0, shares:0, auto:true, trend:defaultTrendParams(2), priceHistory:[], splits:[] },
  { id:'00675L', name:'富邦臺灣加權正2', leverage:2, price:0, shares:0, auto:true, trend:defaultTrendParams(2), priceHistory:[], splits:[] }
];
// trend/priceHistory 是巢狀物件,Object.assign 只會淺拷貝參照 —— 每個新 instrument
// 都要有自己獨立的 trend/priceHistory,不能共用同一份 DEFAULT_INSTRUMENTS 底下的物件,
// 不然改一個標的的均線參數會意外改到共用預設值,下次重置資料就跑掉。
const newInstruments = () => DEFAULT_INSTRUMENTS.map(x => Object.assign({ key: uid() }, JSON.parse(JSON.stringify(x))));

function emptyState(){
  return {
    version:2,
    assets:[], liabilities:[], trades:[], dailyHistory:[],
    instruments: newInstruments(),
    budgets: DEFAULT_CATEGORIES.map(n => ({ id:uid(), name:n, budget:0 })),   // 類別清單
    transactions:[], netWorthHistory:[],
    leverage: JSON.parse(JSON.stringify(DEFAULT_LEVERAGE))
  };
}

/* 內部 id/key 只收英數、底線、減號(app 自己產生的 uid() 跟舊版的 't1'、'core' 都符合)。
   id 會原樣放進 HTML 屬性(data-id="…"、data-k="aa-…"),匯入的備份檔或雲端資料如果帶了
   `"><img onerror=…>` 這種 id 就能在頁面裡執行程式——實測過 8 種 id 都能觸發,所以在這一關統一擋掉,
   不合格的換成新的 uid()。顯示給人看的文字(名稱、備註…)本來就都有 esc(),不受影響。 */
const safeId = v => { const str = String(v == null ? '' : v); return /^[A-Za-z0-9_-]{1,64}$/.test(str) ? str : uid(); };

function normalize(raw){
  const s = emptyState();
  if (!raw || typeof raw !== 'object') return s;
  const arr = v => Array.isArray(v) ? v : [];
  // 清單裡只收物件:匯入的備份檔/雲端資料只要有一筆是 null 或字串,以前讀 x.id 就丟例外,整份資料讀不進來
  // (型別錯亂隨機測試抓到);文字欄位只收字串或數字,不然物件會變成畫面上的「[object Object]」
  const objs = v => arr(v).filter(x => x && typeof x === 'object' && !Array.isArray(x));
  const str = v => typeof v === 'string' ? v : (typeof v === 'number' && Number.isFinite(v)) ? String(v) : '';
  s.assets = objs(raw.assets).map(a => ({ id:safeId(a.id), name:str(a.name), amount:num(a.amount) }));
  s.liabilities = objs(raw.liabilities).map(a => ({ id:safeId(a.id), name:str(a.name), amount:num(a.amount) }));
  // budgets 現在只當作記帳的類別清單(預算頁已移除,欄位保留以免舊資料的類別消失)
  if (Array.isArray(raw.budgets)) s.budgets = objs(raw.budgets).map(b => ({ id:safeId(b.id), name:str(b.name), budget:num(b.budget) }));
  // 有這個欄位就照收(包括使用者自己刪光的空清單);只有舊資料完全沒有這個欄位才補預設的兩檔。
  // 以前空清單也補預設,刪光標的之後重新整理又冒出 00631L/00675L(壓測比對「當下 vs 重新整理後」抓到的)
  if (Array.isArray(raw.instruments)){
    s.instruments = objs(raw.instruments).map(x => {
      const leverage = x.leverage === undefined ? 1 : num(x.leverage);
      const def = defaultTrendParams(leverage);
      const t = x.trend && typeof x.trend === 'object' ? x.trend : {};
      const out = {
        key: safeId(x.key),
        id: str(x.id).trim(),          // 代號可以先留空,不要亂數化
        name: str(x.name),
        leverage,
        price: Math.max(0, num(x.price)),
        shares: Math.max(0, num(x.shares)),
        auto: x.auto !== false,
        trend: {
          maFast: Math.max(1, Math.round(finiteNum(t.maFast, 0)) || def.maFast),   // 天數取整數,跟設定欄位一致
          maSlow: Math.max(1, Math.round(finiteNum(t.maSlow, 0)) || def.maSlow),
          exitBuffer: finiteNum(t.exitBuffer, 0) > 0 ? finiteNum(t.exitBuffer, def.exitBuffer) : def.exitBuffer,
          recoverSlopeThreshold: finiteNum(t.recoverSlopeThreshold, 0) > 0 ? finiteNum(t.recoverSlopeThreshold, def.recoverSlopeThreshold) : def.recoverSlopeThreshold,
          recoverStrongRebound: finiteNum(t.recoverStrongRebound, 0) > 0 ? finiteNum(t.recoverStrongRebound, def.recoverStrongRebound) : def.recoverStrongRebound,
          pyramidGap: finiteNum(t.pyramidGap, 0) > 0 ? finiteNum(t.pyramidGap, def.pyramidGap) : def.pyramidGap,
          pyramidLevels: Math.max(1, Math.round(finiteNum(t.pyramidLevels, 0) || def.pyramidLevels)),
          lastSeenStatus: str(t.lastSeenStatus),
          // 看過的時候已經接刀加碼到第幾層(-1 = 還沒記過)。只記狀態的話,接刀中從第 1 層加到第 2 層狀態都是
          // WAIT_RECOVER,提醒不會跳——照 🔔 執行的話兩次加碼都會漏掉
          lastSeenLayers: Number.isInteger(t.lastSeenLayers) && t.lastSeenLayers >= 0 ? t.lastSeenLayers : -1,
          lastSeenDate: str(t.lastSeenDate)
        },
        // 沒有 splits 欄位 = 舊版存下來的歷史:舊版逐月回補時會把分割前每個月的交界誤判成分割、
        // 抹掉那一天的真實漲跌(見 adjustForSplits),資料已經歪了又無從還原,只能清掉讓它自動重抓。
        priceHistory: objs(Array.isArray(x.splits) || x.auto === false ? x.priceHistory : [])
          .map(h => ({ d: isoDate(str(h.d), ''), c: Math.max(0, finiteNum(h.c, 0)) }))
          .filter(h => /^\d{4}-\d{2}-\d{2}$/.test(h.d) && h.c > 0 && Number.isFinite(h.c))
          .sort((a, b) => a.d < b.d ? -1 : (a.d > b.d ? 1 : 0))
          .filter((h, i, arr) => i === arr.length - 1 || h.d !== arr[i + 1].d)   // 同一天重複只留最後一筆
          .slice(-PRICE_HIST_KEEP),
        splits: normalizeSplits(x.splits)
      };
      applyKnownSplitRatios(out.id, out.priceHistory, out.splits);   // 反推比例存下來的舊歷史改成公告比例
      return out;
    });
  }
  s.trades = objs(raw.trades).map(t => ({
    id: safeId(t.id),
    date: isoDate(t.date, todayISO()),
    symbol: str(t.symbol) || '00631L',
    action: ['sell', 'dividend'].includes(t.action) ? t.action : 'buy',
    shares: Math.max(0, num(t.shares)),
    price: Math.max(0, num(t.price)),
    amount: Math.max(0, num(t.amount)),      // 配息領到的金額
    fee: Math.max(0, num(t.fee)),
    source: t.source === 'loan' ? 'loan' : 'cash',
    note: str(t.note)
  }));
  s.transactions = objs(raw.transactions).map(t => ({
    id:safeId(t.id), date:isoDate(t.date, todayISO()),
    cat:str(t.cat) || '其他', desc:str(t.desc), amount:num(t.amount)
  }));
  s.dailyHistory = objs(raw.dailyHistory)
    .map(h => ({
      d: isoDate(str(h.d), ''),
      pv: finNum(h.pv), loan: finNum(h.loan), eq: finNum(h.eq),
      pnl: h.pnl === undefined || h.pnl === null ? null : finNum(h.pnl)
    }))
    .filter(h => /^\d{4}-\d{2}-\d{2}$/.test(h.d))
    .sort((a, b) => a.d < b.d ? -1 : 1);
  s.netWorthHistory = objs(raw.netWorthHistory)
    .map(h => ({
      id: safeId(h.id),
      m: str(h.m).slice(0, 7),
      v: finNum(h.v),
      // 沒有資料是 null(存檔後就是 JSON 的 null,不是 undefined)——以前只認 undefined,重新整理後 null 變 0,
      // 走勢圖上沒有損益的月份變成一條 0 的線(隨機壓測比對「當下 vs 重新整理後」抓到的)
      pv: h.pv == null ? null : finNum(h.pv),        // 部位市值
      pnl: h.pnl == null ? null : finNum(h.pnl),     // 整體損益
      loan: h.loan == null ? null : finNum(h.loan),  // 借款餘額
      // 當月資產/負債細項(2026-09 起才有;更早的月份沒存過,是空陣列)。id 對應 assets/liabilities 的 id,
      // 改名也接得起來;t:'a' 資產、'l' 負債。
      items: objs(h.items).filter(it => /^[A-Za-z0-9_-]{1,64}$/.test(str(it.id))).map(it => ({ id: str(it.id), name: str(it.name), amount: num(it.amount), t: it.t === 'l' ? 'l' : 'a' }))
        .filter(it => it.id),
      auto: h.auto !== false                           // 手動改過的不再被自動覆蓋
    }))
    .filter(h => isoDate(h.m + '-01', ''));   // 2026-13 這種月份不收
  const L = raw.leverage && typeof raw.leverage === 'object' ? raw.leverage : {};
  const base = s.leverage;
  ['shares675L','price675L','shares631L','price631L','marketHigh','marketCurrent',
   'historicalHighValue','stressDeclinePct','creditLimit','annualRate'].forEach(k => {
    if (L[k] !== undefined) base[k] = Math.max(0, num(L[k]));   // 這些欄位沒有負值的意義
  });
  {
    const mapDraw = d => ({
      id: safeId(d.id),          // 新格式跟舊格式(tranches/core)兩條路都會經過這裡,id 檢查放這才不會漏

      label: typeof d.label === 'string' ? d.label : '動用記錄',   // 使用者清空的名稱就保持空白,不要重新整理後又冒出預設名
      amount: Math.max(0, num(d.amount)),
      useDate: isoDate(d.useDate, ''),
      note: str(d.note),
      repayments: objs(d.repayments)
        .map(x => ({ id: safeId(x.id), date: isoDate(x.date, ''), amount: Math.max(0, num(x.amount)) }))
    });
    if (Array.isArray(L.draws) && L.draws.length){
      base.draws = objs(L.draws).map(d => mapDraw({ ...d, id: safeId(d.id) }));
    } else {
      // 舊格式(tranches+core)搬過來:id 沿用舊 id,同一份舊資料重覆呼叫 normalize() 也會得到
      // 相同 id,避免存檔前 id 一直飄動。只搬「真的動用過」(有 useDate)的,從沒填過的預設
      // 空桶本來就沒帶任何使用者資料,遷移時直接捨棄。
      const legacy = [];
      if (Array.isArray(L.tranches)) legacy.push(...objs(L.tranches).map((t, i) => ({ ...t, id: t.id || ('t' + (i+1)) })));
      if (L.core && typeof L.core === 'object') legacy.push({ ...L.core, id: 'core' });
      base.draws = legacy.filter(d => d.useDate).map(mapDraw);
    }
  }
  base.autoHigh = L.autoHigh !== false;       // 舊資料沒有這些欄位時給預設值
  base.autoInterest = L.autoInterest !== false;
  base.interestPosted = arr(L.interestPosted).map(str).filter(m => isoDate(m + '-01', ''));
  base.quoteDate = str(L.quoteDate);
  {
    // num() 把缺值/NaN 都收斂成 0,單獨用 finiteNum 沒辦法分辨「欄位不存在」跟「真的填了 0」——
    // 這裡的目標曝險是百分比,0 本來就不是有意義的設定值,乾脆兩種情況都當「沒填,用預設」處理,
    // 跟其他趨勢參數(exitBuffer 等)用 >0 判斷的既有寫法一致。
    const posNum = (v, fallback) => { const n = finiteNum(v, 0); return n > 0 ? n : fallback; };
    const ET = L.exposureTargets && typeof L.exposureTargets === 'object' ? L.exposureTargets : {};
    const defByLayer = DEFAULT_LEVERAGE.exposureTargets.byLayer;
    const byLayer = (Array.isArray(ET.byLayer) ? ET.byLayer : [])
      .map((v, i) => posNum(v, defByLayer[i] ?? defByLayer[defByLayer.length - 1]));
    base.exposureTargets = {
      byLayer: byLayer.length ? byLayer : defByLayer.slice(),
      hold: posNum(ET.hold, DEFAULT_LEVERAGE.exposureTargets.hold)
    };
  }
  // 同一份清單裡 id 重複(匯入的備份檔、手動改過的資料)的話,後面那筆換新 id:刪除是用 id 過濾,會把兩筆一起刪掉;
  // 編輯是找第一筆,改第二筆其實改到第一筆(壓測抓到)。資產跟負債一起查,每月細項靠 id 對應這兩張清單。
  const dedupe = (list, field = 'id', seen = new Set()) => { list.forEach(x => { while (seen.has(x[field])) x[field] = uid(); seen.add(x[field]); }); };
  const itemIds = new Set();
  dedupe(s.assets, 'id', itemIds); dedupe(s.liabilities, 'id', itemIds);
  dedupe(s.transactions); dedupe(s.trades); dedupe(s.netWorthHistory); dedupe(s.budgets);
  dedupe(s.instruments, 'key'); dedupe(base.draws);
  base.draws.forEach(d => dedupe(d.repayments));
  // 舊版把兩檔的股數與股價放在 leverage 底下,搬進標的清單
  [['00631L', 'shares631L', 'price631L'], ['00675L', 'shares675L', 'price675L']].forEach(([id, sk, pk]) => {
    const it = s.instruments.find(x => x.id === id);
    if (!it) return;
    if (!it.shares && num(L[sk])) it.shares = num(L[sk]);
    if (!it.price && num(L[pk])) it.price = num(L[pk]);
  });
  return s;
}

/* 舊版(只有槓桿頁)的存檔搬過來 */
function fromLegacy(old){
  const s = emptyState();
  const L = s.leverage;
  ['shares675L','price675L','shares631L','price631L','marketHigh','marketCurrent',
   'historicalHighValue','stressDeclinePct'].forEach(k => { if (old[k] !== undefined) L[k] = num(old[k]); });
  const dates = old.trancheDates || {};
  Object.keys(dates).forEach((id, i) => {
    if (dates[id]) L.draws.push({ id: safeId(id || ('t' + (i+1))), label: '動用記錄', amount: 0, useDate: isoDate(dates[id], ''), note: '', repayments: [] });
  });
  if (old.coreUseDate) L.draws.push({ id: 'core', label: '長期投資部位', amount: 0, useDate: isoDate(old.coreUseDate, ''), note: '', repayments: [] });
  return s;
}

let state = emptyState();

/* ===================== 存檔:雲端 + 本機備份 =====================
   兩種雲端來源,誰在就用誰:
     · Claude Artifact  → 平台內建的 db,開網址即同步
     · 網頁版           → Firebase Firestore,需用 Google 帳號登入
   兩者都沒有時就只存本機 localStorage,功能完全不受影響。      */
const STORAGE_NOTE = '資料存在這台裝置的瀏覽器裡,不會上傳到任何地方,也不需要登入。';
const BUILD_VERSION = '2026-09-25 · ada037e258';
const BUILD_HASH = 'ada037e258';
const DOC_PATH = 'state/finance';
const LEGACY_DOC_PATH = 'state/leverage';
const BACKTEST_DOC_PATH = 'state/backtestHistory';   // Claude Artifact 版用,跟主資料分開的獨立文件
const STORAGE_KEY = 'financeAppState_v2';
const LEGACY_KEY = 'financeAppLeverageData_v1';

let storageMode = 'local';   // 'cloud' | 'local' | 'none'
let cloud = null;            // { get, set, onChange } — 已連上的雲端
let cloudBacktestDoc = null; // { get, set } — 回測完整歷史的獨立雲端文件,跟主資料 cloud 分開存
let cloudKind = 'none';      // 'claude' | 'firebase' | 'none'
let authUser = null;         // Firebase 已登入的帳號
let authBusy = false;
let downloadsNs = null;
let lastPushed = '';
/* 最近幾次自己推上去的內容。雲端的回音不一定照順序、也不一定馬上到:連續存了 A、B,A 的回音晚到的話,
   只比對「最後一次」會把它當成別台裝置的改動套用,狀態倒回 A、B 的修改就丟了(壓測抓到)。 */
let recentPushed = [];
let pendingRemote = null;
let saveTimer = null;
/* 上一次確認「本機跟雲端一致」的內容(canon 字串):成功推上去、或套用了雲端那份之後才更新。
   收到別台的改動時拿它當共同基準,判斷本機有哪些還沒推上去的修改(見 mergeLocalEdits)。
   跟 lastPushed 分開:lastPushed 在推之前就先設(為了認得回音),推失敗時它並不代表雲端有這份。 */
let syncBase = '';
/* 本機有還沒推上去的修改時,把當時的 syncBase 存進 localStorage(推成功就刪),下次打開時拿來當合併基準。
   以前 syncBase 只在記憶體裡:離線時記的帳存進了本機、推不上去(Firestore 沒開離線持久化,待送的寫入關掉就沒了),
   下次打開第一次同步是「雲端那份整份蓋掉本機」,離線記的就不見了(壓測重現)。記下帳號,換帳號登入時不套用。 */
const SYNC_BASE_KEY = 'financeSyncBase';
let cloudUid = '';
function rememberPendingBase(){
  if (!syncBase) return;
  try{ if (!localStorage.getItem(SYNC_BASE_KEY)) localStorage.setItem(SYNC_BASE_KEY, JSON.stringify({ uid: cloudUid, base: syncBase })); }catch(e){}
}
function forgetPendingBase(){ try{ localStorage.removeItem(SYNC_BASE_KEY); }catch(e){} }
function loadPendingBase(){
  try{
    const p = JSON.parse(localStorage.getItem(SYNC_BASE_KEY) || 'null');
    return p && p.uid === cloudUid && typeof p.base === 'string' ? p.base : '';
  }catch(e){ return ''; }
}

function readLocal(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
    const legacy = localStorage.getItem(LEGACY_KEY);
    if (legacy) return fromLegacy(JSON.parse(legacy));
    return null;
  }catch(e){ return null; }
}
function writeLocal(data){
  const json = JSON.stringify(data);
  try{
    localStorage.setItem(STORAGE_KEY, json);
    return true;
  }catch(e){
    // 空間不夠時,主資料一定要存得進去。先清可以重抓的回測完整歷史快取(雲端也有一份,記憶體裡這次也還在),
    // 再犧牲最舊的本機備份——以前只會刪備份,壓測看到主資料一大就把唯一一份備份刪掉、回測快取卻還佔著幾百 KB
    try{
      localStorage.removeItem(BACKTEST_HIST_KEY);
      localStorage.removeItem(INDEX_SIM_KEY);   // 加權指數模擬的快取也可以重抓(可拆)
      localStorage.setItem(STORAGE_KEY, json);
      return true;
    }catch(eBt){ /* 還是不夠,繼續刪備份 */ }
    try{
      const keys = [];
      for (let i = 0; i < localStorage.length; i++){
        const k = localStorage.key(i);
        if (k && k.indexOf(BACKUP_PREFIX) === 0) keys.push(k);
      }
      keys.sort();
      while (keys.length){
        localStorage.removeItem(keys.shift());
        try{ localStorage.setItem(STORAGE_KEY, json); return true; }catch(e2){ /* 再砍一份 */ }
      }
      // 最後才放掉離線修改的合併基準(見 SYNC_BASE_KEY):放掉的話下次打開是雲端整份蓋過來,但主資料這次一定要存得住
      localStorage.removeItem(SYNC_BASE_KEY);
      localStorage.setItem(STORAGE_KEY, json);
      return true;
    }catch(e3){ /* 連清都清不了 */ }
    return false;
  }
}
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 400);
}
async function save(){
  const data = JSON.parse(JSON.stringify(state));
  if (canon(data) !== syncBase) rememberPendingBase();   // 推成功之前,這份修改只在本機
  const ok = writeLocal(data);
  if (cloud){
    try{
      lastPushed = canon(data);
      recentPushed = recentPushed.concat(lastPushed).slice(-8);
      const pushing = lastPushed;
      await cloud.set(data);
      syncBase = pushing;
      if (canon(JSON.parse(JSON.stringify(state))) === pushing) forgetPendingBase();   // 推上去之後又改了的話先留著
      storageMode = 'cloud';
      updateStorageStatus();
      return;
    }catch(e){ /* 雲端寫入失敗就靠本機,下次編輯會再試 */ }
  }
  storageMode = ok ? 'local' : 'none';
  updateStorageStatus();
}
/* 主資料本身佔了多少空間(同樣粗估)。超過一半左右時,主資料加一份一樣大的備份就放不下了——
   這時存檔會把備份刪光來保住主資料,總用量反而掉回五成多,「快滿了」的提醒就不見了,
   使用者卻已經完全沒有本機備份(壓測看到的),所以要另外看這個比例。 */
function mainDataRatio(){
  try{ return ((localStorage.getItem(STORAGE_KEY) || '').length + STORAGE_KEY.length) * 2 / (5 * 1024 * 1024); }
  catch(e){ return 0; }
}
/* 本機空間用了多少(粗估,UTF-16 一個字兩個位元組) */
function localUsageRatio(){
  try{
    let chars = 0;
    for (let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      chars += k.length + (localStorage.getItem(k) || '').length;
    }
    return chars * 2 / (5 * 1024 * 1024);
  }catch(e){ return 0; }
}

function updateStorageStatus(){
  const el = document.getElementById('storageStatus');
  if (!el) return;
  if (storageMode === 'cloud'){
    el.textContent = cloudKind === 'firebase' && authUser
      ? '☁️ 已同步到 ' + authUser.email + ' — 其他裝置登入同一帳號就看得到'
      : '☁️ 已存到雲端 — 手機、電腦開同一個網址都看得到';
  }else if (storageMode === 'local'){
    el.textContent = cloudKind === 'firebase'
      ? '💾 只存在這台裝置 — 登入 Google 帳號即可同步到其他裝置'
      : '💾 只存在這台裝置的瀏覽器 — 換裝置或清資料會消失';
  }else{
    el.textContent = '⚠️ 無法存檔(此瀏覽器不允許儲存)';
  }
}

/* 收到雲端資料:正在打字就先擱著,等游標離開欄位再套用 */
function onRemote(data){
  if (!data || !looksLikeState(data)) return;   // 壞掉的雲端資料不要拿來蓋本機
  const c = canon(data);
  if (c === lastPushed || recentPushed.includes(c)) return;   // 自己的回音(包括晚到的舊回音)
  if (document.activeElement && document.activeElement.tagName === 'INPUT'){
    pendingRemote = data;
    return;
  }
  applyRemote(data);
}
function applyRemote(data){
  clearPosMemo();
  const prev = state;
  state = normalize(data);
  const restored = keepFieldsOldVersionsDrop(prev, data, state);
  const remoteC = canon(JSON.parse(JSON.stringify(state)));
  const kept = mergeLocalEdits(prev, state);
  syncBase = remoteC;
  if (!kept) forgetPendingBase();   // 本機沒有另外的修改了,這份就是雲端那份
  lastPushed = kept ? lastPushed : remoteC;
  writeLocal(state);
  if (restored || kept) scheduleSave();   // 補回來的東西/本機還沒推上去的修改推回雲端
  renderAll();
}
/* 收到別台裝置的改動時,本機可能有還沒推上去的修改:打字中收到的會先擱著、離開欄位才套用(那時剛打的字
   已經在 state 裡,但存檔還在 400ms 延遲裡),或是按鈕剛按完就收到。以前整份換成雲端那份,這些修改就不見了。
   以 syncBase(上次兩邊一致的內容)當共同基準做三方合併(merge3):只有本機改的用本機、只有雲端改的用雲端;
   清單逐筆用 id 對應(本機新增/修改/刪除的照本機,雲端新增/修改的照雲端),兩邊改到同一個值時以眼前這台為準。
   不能整個清單二選一:別台自動記的房貸利息(交易 + interestPosted)會被這台剛新增的交易整批蓋掉,
   interestPosted 卻留著,那筆利息就永遠不會再補記。回傳有沒有留下本機的東西。 */
function mergeLocalEdits(local, next){
  if (!syncBase || !local) return false;
  const localData = JSON.parse(JSON.stringify(local));
  if (canon(localData) === syncBase) return false;   // 本機沒有未推上去的修改
  let base;
  try{ base = JSON.parse(syncBase); }catch(e){ return false; }
  const remoteData = JSON.parse(JSON.stringify(next));
  const merged = merge3(localData, base, remoteData);
  if (canon(merged) === canon(remoteData)) return false;
  const norm = normalize(merged);
  Object.keys(next).forEach(k => delete next[k]);
  Object.assign(next, norm);
  return true;
}
const mergeKey = x => (x && typeof x === 'object' && !Array.isArray(x))
  ? (x.id != null ? 'i:' + x.id : x.key != null ? 'k:' + x.key : x.d != null ? 'd:' + x.d : x.m != null ? 'm:' + x.m : null)
  : typeof x === 'string' ? 's:' + x : null;
function merge3(local, base, remote){
  const cl = canon(local), cb = canon(base), cr = canon(remote);
  if (cl === cb || cl === cr) return remote;
  if (cr === cb) return local;
  const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
  if (Array.isArray(local) && Array.isArray(remote)){
    const b = Array.isArray(base) ? base : [];
    const all = local.concat(remote, b);
    const keys = all.map(mergeKey);
    // 每一筆都認得出身分(id/key/日期/月份,或字串清單)才逐筆合併;數字清單(例如各層曝險目標)是照位置的,以本機為準
    if (!all.length || keys.some(k => k === null)) return local;
    const L = new Map(local.map(x => [mergeKey(x), x])), B = new Map(b.map(x => [mergeKey(x), x]));
    const out = [], seen = new Set();
    remote.forEach(r => {
      const k = mergeKey(r);
      if (seen.has(k)) return;
      seen.add(k);
      if (L.has(k)) out.push(B.has(k) ? merge3(L.get(k), B.get(k), r) : L.get(k));
      else if (!B.has(k)) out.push(r);            // 雲端新增的
      /* 本機刪掉的:不放回來 */
    });
    local.forEach(x => {
      const k = mergeKey(x);
      if (!seen.has(k) && !B.has(k)){ seen.add(k); out.push(x); }   // 本機新增的
    });
    return out;
  }
  if (isObj(local) && isObj(remote)){
    const b = isObj(base) ? base : {};
    const out = {};
    new Set([...Object.keys(remote), ...Object.keys(local)]).forEach(k => {
      if (!(k in local)) { if (!(k in b)) out[k] = remote[k]; return; }
      if (!(k in remote)) { if (!(k in b)) out[k] = local[k]; else if (canon(local[k]) !== canon(b[k])) out[k] = local[k]; return; }
      out[k] = merge3(local[k], b[k], remote[k]);
    });
    return out;
  }
  return local;
}
/* 還開著的舊版分頁存檔時,會把它不認得的欄位整個丟掉再寫回雲端(見 CLAUDE.md「常見的坑」)。
   每月快照的細項(items)丟了就補不回來,分割記錄(splits)丟了新版會把歷史價格清掉重抓——
   所以收到雲端資料時,如果某個欄位在雲端那份「根本不存在」(不是空的,是沒有這個欄位,只有舊版會這樣寫),
   而本機有,就保留本機的。新版寫出去的資料一定帶著這些欄位(normalize 會補),不會誤觸。回傳有沒有補。 */
function keepFieldsOldVersionsDrop(prev, raw, next){
  if (!prev || !raw) return false;
  let restored = false;
  const rawHist = Array.isArray(raw.netWorthHistory) ? raw.netWorthHistory : [];
  const remoteHasItems = new Set(rawHist.filter(h => h && Array.isArray(h.items)).map(h => String(h.m || '').slice(0, 7)));
  const prevItems = new Map((prev.netWorthHistory || []).filter(h => h.items && h.items.length).map(h => [h.m, h.items]));
  next.netWorthHistory.forEach(h => {
    if (!remoteHasItems.has(h.m) && prevItems.has(h.m)){
      h.items = JSON.parse(JSON.stringify(prevItems.get(h.m)));
      restored = true;
    }
  });
  const rawInst = new Map((Array.isArray(raw.instruments) ? raw.instruments : []).filter(x => x).map(x => [String(x.key || ''), x]));
  next.instruments.forEach(it => {
    const r = rawInst.get(it.key), p = (prev.instruments || []).find(x => x.key === it.key);
    if (r && !Array.isArray(r.splits) && p && p.id === it.id && Array.isArray(p.splits) && p.priceHistory && p.priceHistory.length){
      it.splits = JSON.parse(JSON.stringify(p.splits));
      it.priceHistory = JSON.parse(JSON.stringify(p.priceHistory));
      restored = true;
    }
  });
  return restored;
}

/* 第一次連上雲端:雲端有資料就拉下來,沒有就把本機的推上去 */
async function syncFirstTime(){
  try{
    if (!syncBase) syncBase = loadPendingBase();   // 上次關掉前有沒推上去的修改:拿當時的基準合併,不要整份被雲端蓋掉
    const remote = await cloud.get();
    storageMode = 'cloud';
    if (remote && !looksLikeState(remote)){
      await save();                              // 雲端那份不像本 app 的資料,用本機的覆蓋回去
    }else if (remote){
      applyRemote(remote);
    }else{
      await save();
    }
    cloud.onChange(onRemote);
    updateStorageStatus();
    maybeDailySnapshot();
    if (maybePostInterest() || maybeSnapshot()) renderAll();
    maybeBackup();
  }catch(e){
    cloud = null;
    storageMode = 'local';
    updateStorageStatus();
  }
  pullBacktestHistoryFromCloud();   // 跟主資料同步失敗與否無關,單獨試,失敗就算了
}

/* 回測完整歷史只在本機沒資料時才從雲端拉——本機已經有(不管是抓過還是剛從雲端拉過)
   就不覆蓋,避免拿舊的雲端資料蓋掉這台裝置剛抓好的新資料。 */
async function pullBacktestHistoryFromCloud(){
  if (!cloudBacktestDoc || Object.keys(backtestFullHistory).length) return;
  try{
    const remote = await cloudBacktestDoc.get();
    // 等雲端回應的這段時間使用者可能已經按了「抓完整歷史」:不能拿雲端那份把抓到一半的資料跟分割記錄換掉
    if (backtestHistBusy || Object.keys(backtestFullHistory).length) return;
    if (remote && remote.v === BACKTEST_HIST_VERSION && remote.data && Object.keys(remote.data).length){
      backtestFullHistory = remote.data;
      backtestSplits = remote.splits || {};
      backtestListedFrom = remote.listedFrom || {};
      applyBacktestKnownSplits();
      saveBacktestHistoryCache();
      backtestHistMsg = '已從雲端帶入其他裝置抓過的完整歷史,不用重抓。';
    }else if (remote && remote.data){
      backtestHistMsg = '雲端存的是舊版抓的完整歷史(分割前的價格有誤,回測數字會失真),請按下面的按鈕重新抓一次。';
    }else{
      backtestHistMsg = '雲端還沒有存過完整歷史(可能是還沒有任何裝置成功按過「抓完整歷史」並推上雲端),請按下面的按鈕抓一次。';
    }
  }catch(e){
    backtestHistMsg = '讀取雲端完整歷史失敗(' + (e && e.message ? e.message : '未知錯誤') + '),請按下面的按鈕直接重新抓取。';

}

async function connectCloud(){
  // 1) Claude Artifact:平台內建的資料庫
  if (window.claude && typeof window.claude.use === 'function'){
    try{
      const db = await window.claude.use('db');
      if (db){
        const ref = db.doc(DOC_PATH);
        cloudKind = 'claude';
        cloud = {
          get: async () => {
            const snap = await ref.get();
            if (snap.exists) return snap.data();
            // 第一次上雲時,把舊版只有槓桿頁的存檔帶過來
            if (!readLocal()){
              try{
                const old = await db.doc(LEGACY_DOC_PATH).get();
                if (old.exists) return fromLegacy(old.data());
              }catch(e){ /* 沒有舊資料 */ }
            }
            return null;
          },
          set: d => ref.set(d),
          onChange: cb => ref.onSnapshot(s => { if (s.exists) cb(s.data()); }, () => {}),
          backups: {
            list: async () => {
              const snap = await db.collection('backups').get();
              return snap.docs.map(d => d.id).sort().reverse();
            },
            get: async id => {
              const s2 = await db.doc('backups/' + id).get();
              return s2.exists ? s2.data() : null;
            },
            put: (id, data) => db.doc('backups/' + id).set(data),
            del: id => db.doc('backups/' + id).delete()
          }
        };
        const btRef = db.doc(BACKTEST_DOC_PATH);
        cloudBacktestDoc = {
          get: async () => { const s2 = await btRef.get(); return s2.exists ? s2.data() : null; },
          set: d => btRef.set(d)
        };
        await syncFirstTime();
        return;
      }
    }catch(e){ /* 不是在 Artifact 裡,往下試 Firebase */ }
  }

  // 2) 網頁版:Firebase,登入後才有雲端
  if (window.FinanceCloud){
    try{
      const fb = await window.FinanceCloud.ready;
      if (!fb) return;               // 還沒設定 Firebase,維持本機模式
      cloudKind = 'firebase';
      updateStorageStatus();
      fb.onAuth(user => {
        authUser = user;
        authBusy = false;
        if (user){
          if (cloudUid && cloudUid !== user.uid) syncBase = '';   // 換了帳號:上一個帳號的基準不能拿來合併
          cloudUid = user.uid;
          cloud = fb.docApi();
          cloudBacktestDoc = fb.namedDoc('backtestHistory');
          syncFirstTime();
        }else{
          cloud = null;
          cloudBacktestDoc = null;
          storageMode = 'local';
          updateStorageStatus();
        }
        renderAll();
      });
    }catch(e){ /* 載入失敗:維持本機模式 */ }
  }
}

/* ===================== 每日備份 =====================
   雲端可用時存在雲端的 backups 集合,否則存本機。每天一份,保留 30 天。 */
const BACKUP_KEEP = 30;        // 雲端
const LOCAL_BACKUP_KEEP = 7;   // 本機 localStorage 只有幾 MB,備份不能佔太多
const BACKUP_PREFIX = 'financeBackup_';
const BACKUP_TS_KEY = 'financeLastBackup';

let levTab = 'overview';      // 槓桿頁的小分頁

let repayError = '';

let backupList = null;     // null = 還沒讀 / 讀取中

function localBackupApi(){
  return {
    list: async () => {
      const ids = [];
      for (let i = 0; i < localStorage.length; i++){
        const k = localStorage.key(i);
        if (k && k.startsWith(BACKUP_PREFIX)) ids.push(k.slice(BACKUP_PREFIX.length));
      }
      return ids.sort().reverse();
    },
    get: async id => {
      const raw = localStorage.getItem(BACKUP_PREFIX + id);
      return raw ? JSON.parse(raw) : null;
    },
    put: async (id, data) => localStorage.setItem(BACKUP_PREFIX + id, JSON.stringify(data)),
    del: async id => localStorage.removeItem(BACKUP_PREFIX + id)
  };
}
function backupApi(){
  return (cloud && cloud.backups) ? cloud.backups : localBackupApi();
}
async function maybeBackup(){
  const today = todayISO();
  // 本機跟雲端分開記「今天做過了沒」:開 app 4 秒後就會先備份一次,雲端登入比較慢的話那時還沒連上,
  // 存成本機備份並記下今天做過了,連上雲端後的那次就被跳過——那天雲端完全沒有備份
  const tsKey = (cloud && cloud.backups) ? BACKUP_TS_KEY + '_cloud' : BACKUP_TS_KEY;
  try{ if (localStorage.getItem(tsKey) === today) return; }catch(e){}
  const api = backupApi();
  try{
    // 本機空間有限,資料越大留越少份,免得把主資料的位子吃掉
    const sizeKB = JSON.stringify(state).length / 1024;
    const keep = (cloud && cloud.backups) ? BACKUP_KEEP
               : (sizeKB > 300 ? 3 : sizeKB > 150 ? 5 : LOCAL_BACKUP_KEEP);
    // 先清舊的再寫新的,免得寫的當下就把空間塞爆
    const before = await api.list();
    for (const id of before.slice(Math.max(0, keep - 1))) await api.del(id);
    await api.put(today, JSON.parse(JSON.stringify(state)));
    try{ localStorage.setItem(tsKey, today); }catch(e){}
  }catch(e){ /* 備份失敗不影響使用 */ }
}

/* ===================== 衍生計算 ===================== */
const sum = (list, f) => list.reduce((s, x) => s + f(x), 0);
const totalAssets = () => sum(state.assets, a => a.amount);
const totalLiab = () => sum(state.liabilities, l => l.amount);
const netWorth = () => totalAssets() - totalLiab();
const txOfMonth = m => state.transactions.filter(t => t.date.slice(0,7) === m);
function monthFlow(m){
  const tx = txOfMonth(m);
  const income = sum(tx.filter(t => t.amount > 0), t => t.amount);
  const expense = sum(tx.filter(t => t.amount < 0), t => -t.amount);
  return { income, expense, balance: income - expense };
}
function spentByCat(m){
  const map = {};
  txOfMonth(m).filter(t => t.amount < 0).forEach(t => { map[t.cat] = (map[t.cat] || 0) + (-t.amount); });
  return map;
}
/* 預設類別排前面,再接上交易紀錄裡用過的 */
function knownCats(){
  const list = [];
  const seen = new Set();
  const add = c => { const v = String(c || '').trim(); if (v && !seen.has(v)){ seen.add(v); list.push(v); } };
  state.budgets.forEach(b => add(b.name));
  state.transactions.forEach(t => add(t.cat));
  if (!list.length) add('其他');
  return list;
}

function rocToISO(s){                       // '115/09/04' → '2026-09-04'
  const p = String(s).trim().split('/');
  if (p.length !== 3 || p.some(x => !/^\d+$/.test(x))) return '';

/* ===================== 新版提示 =====================
   GitHub Pages 版每次 build 都會附一份 version.json(內容是這次 build 的 hash)。
   導覽是 network-first,重新整理就拿得到新版——問題是開著不關的分頁(尤其手機 PWA
   一直留在背景)永遠不會重新整理,舊版程式會繼續拿舊的資料格式寫回雲端,

   以及開著的時候每隔一段時間,問一下線上是不是已經換版,是的話在最上面跳一條提示讓使用者點。
   不自動重新整理:使用者可能正在輸入,由他自己決定什麼時候換。
   單檔版(file://)沒有 version.json 可以問、Artifact 版不能連外,這兩個版本不檢查。 */
const UPDATE_CHECK_ENABLED = QUOTES_ENABLED && typeof location !== 'undefined' && location.protocol === 'https:';
const UPDATE_CHECK_GAP_MS = 60000;   // 只是抓一個幾十 byte 的檔,10 分鐘太久:部署前剛檢查過的話,切回來要等很久才看到提示
let lastUpdateCheck = 0;
async function checkForUpdate(){
  if (!UPDATE_CHECK_ENABLED || Date.now() - lastUpdateCheck < UPDATE_CHECK_GAP_MS) return;
  lastUpdateCheck = Date.now();
  try{
    const res = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;
    const j = await res.json();
    if (j && j.hash && j.hash !== BUILD_HASH) document.getElementById('updateBanner').hidden = false;
  }catch(e){ /* 離線或暫時連不上,下次再問 */ }
}
async function applyUpdate(){
  // 還在 400ms 延遲裡沒存出去的編輯,先存完再重新整理,不要因為換版掉資料
  clearTimeout(saveTimer);
  try{ await save(); }catch(e){}
  // 換一個網址載入,不走 location.reload():還沒換成新 service worker 的分頁,reload 可能拿到瀏覽器快取裡的舊版
  location.replace(location.pathname + '?v=' + Date.now());
}

/* ===================== 證交所請求節流 =====================
   證交所會擋短時間內大量的請求(網路上常見的說法是大約每 5 秒 3 個),被擋之後這台裝置
   要等一段時間才會恢復。以前每個請求只隔 0.3 秒,第一次抓完整歷史要發 270 個請求,
   幾乎一定會撞上。所以所有對證交所的請求(更新報價、兩種回補)一律走 twseJson():
   - 全部排成一列依序發,每個間隔 TWSE_GAP_MS,不管是誰發的都不會疊在一起;
   - 連續 TWSE_FAIL_LIMIT 次失敗(網路例外、非 200、回來的不是 JSON——被擋時常見的樣子)
     就當成被擋了,記下冷卻到期時間(存 localStorage,重新整理也記得),冷卻期間不再發任何請求,
     直接丟 TwseBlocked,讓呼叫端停下來、把「幾分鐘後再試」告訴使用者。
   伺服器有正常回 JSON(就算是「查無資料」)不算失敗。 */
const TWSE_GAP_MS = 2000;
const TWSE_FAIL_LIMIT = 5;
const TWSE_COOLDOWN_MS = 20 * 60000;
const TWSE_COOLDOWN_KEY = 'financeTwseCooldownUntil';
class TwseBlocked extends Error{}
let twseQueue = Promise.resolve();
let twseLastAt = 0;
let twseFails = 0;
function twseCooldownLeft(){
  try{ return Math.max(0, (Number(localStorage.getItem(TWSE_COOLDOWN_KEY)) || 0) - Date.now()); }catch(e){ return 0; }
}
function twseCooldownMsg(){
  return `證交所暫時擋住了這台裝置的請求,已經自動停下來,請約 ${Math.max(1, Math.ceil(twseCooldownLeft() / 60000))} 分鐘後再試。`;
}
function twseJson(url){
  const run = async () => {
    if (twseCooldownLeft() > 0) throw new TwseBlocked(twseCooldownMsg());
    const wait = twseLastAt + TWSE_GAP_MS - Date.now();
    if (wait > 0) await sleep(Math.min(wait, TWSE_GAP_MS));
    twseLastAt = Date.now();
    try{
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const j = await res.json();
      twseFails = 0;
      return j;
    }catch(e){
      if (++twseFails >= TWSE_FAIL_LIMIT){
        twseFails = 0;
        try{ localStorage.setItem(TWSE_COOLDOWN_KEY, String(Date.now() + TWSE_COOLDOWN_MS)); }catch(_){}
        throw new TwseBlocked(twseCooldownMsg());
      }
      throw e;
    }
  };
  const p = twseQueue.then(run, run);
  twseQueue = p.catch(() => {});
  return p;
}
async function twseRows(url){
  // 月初當月可能還沒有資料,退回上個月再試一次
  for (const m of [monthParam(0), monthParam(-1)]){
    try{
      const j = await twseJson(url + '&date=' + m);
      if (j.stat === 'OK' && Array.isArray(j.data) && j.data.length) return j.data;
    }catch(e){ /* 換下一個月 */ }
  }
  return null;
}
/* 把 TWSE STOCK_DAY 一個月的資料列併入某標的的歷史收盤價:
   日期去重(同一天多次抓到,後寫入的蓋掉前面的)、依日期排序、裁切到 PRICE_HIST_KEEP。
   回補(backfillHistory)跟每次抓報價(fetchQuotes)都呼叫這個,不重複寫合併邏輯。 */
/* 證交所 STOCK_DAY 給的是原始收盤價,沒有還原分割/反分割。正2 ETF 漲多了常會
   分割降低單位淨值(00631L 就在 2026-03 分割過,一天內從 443 掉到 19,比例 0.0435)。
   2 倍槓桿在最誇張的單日崩盤大概也不會腰斬到剩 4 成,所以拿「單日變動超過 40%」
   當門檻夠安全,不會誤判成真的行情;抓到就把斷點之前的價格全部按同一個比例換算,
   接成連續序列,不然均線會被這種假斷崖整個帶歪。

   2026-09 這輪抓到一個活生生的反例:回補歷史如果中間曾經缺過幾個月(逐月回補失敗
   時就會發生),陣列裡「相鄰」的兩筆其實隔了大半年,2 倍槓桿股價半年內漲跌超過
   40% 很正常,會被誤判成分割,把更早的資料全部錯誤打折——而且錯誤一旦發生,
   之後補齊缺口也不會自動修正回來。所以前後兩筆的「實際日期」隔太久時,不當成分割處理,
   寧可漏抓真分割也不要誤傷正常缺口——門檻跟 findHistoryGap() 共用同一個
   HISTORY_GAP_DAYS,兩處判斷「正常間斷 vs 真的斷了」的標準要一致。 */
/* 2026-09 又抓到一個更根本的問題:回補是從最新的月份往回逐月合併,已經還原過的歷史(分割後
   尺度,例如 1.3)旁邊接上一個剛抓來、還沒還原的分割前原始月份(例如 30)——月份交界看起來
   就像又分割了一次,於是用「這個月最後一天 → 下個月第一天」的比例把舊資料換算過去,
   等於把每個月交界那天的真實漲跌抹成 0。00631L 分割前有 130 幾個月,回測就少了 130 幾天的
   報酬,整條淨值曲線歪掉。

   所以偵測到的分割要記下來(splits:[{d: 分割後第一天, ratio}]),之後從證交所抓進來的
   原始價格一律先用記下的比例換算成同一個尺度再合併,月份交界就不會再出現假斷崖。
   偵測只負責「第一次」看到某個分割;已記錄的分割不重複記。存起來的歷史永遠滿足
   「價格 = 原始收盤 × 該日之後所有已記錄分割的比例」,不管抓的順序、重抓幾次都一樣。 */
const HISTORY_GAP_DAYS = 16;   // 比農曆年封關(約 9-10 天)還寬鬆,不會誤判正常長假
/* 已知分割的公告比例。偵測到的比例是「分割前一天 → 分割當天」的收盤價比,會把分割當天
   的真實漲跌一起吃掉(那天在還原後的序列裡漲跌變 0);比例對得上公告值(差距在正2 單日
   漲跌範圍內)就改用公告值,分割當天的漲跌就保留下來。只寫比例不寫日期——日期還是靠偵測。 */
const KNOWN_SPLIT_RATIOS = { '00631L': 1 / 22 };
function exactSplitRatio(id, observed){
  const k = KNOWN_SPLIT_RATIOS[id];
  return k && Math.abs(observed / k - 1) < 0.25 ? k : observed;
}
/* 已經存下來、用反推比例還原的歷史,換成公告比例:分割日之前的價格整段乘上(公告/反推),
   記錄的比例改成公告值。改完之後再跑一次就是 no-op,可以放心每次載入都呼叫。回傳有沒有改到。 */
function applyKnownSplitRatios(id, hist, splits){
  let changed = false;
  (splits || []).forEach(sp => {
    const exact = exactSplitRatio(id, sp.ratio);
    if (exact === sp.ratio) return;
    const f = exact / sp.ratio;
    (hist || []).forEach(h => { if (h.d < sp.d) h.c = Math.round(h.c * f * 10000) / 10000; });
    sp.ratio = exact;
    changed = true;
  });
  return changed;
}
function adjustForSplits(rows, splits = null, id = ''){
  for (let i = 1; i < rows.length; i++){
    const dayGap = (new Date(rows[i].d) - new Date(rows[i - 1].d)) / 86400000;
    if (dayGap > HISTORY_GAP_DAYS) continue;   // 中間隔太久,大波動是真實累積漲跌或資料缺口,不是分割
    const observed = rows[i - 1].c > 0 ? rows[i].c / rows[i - 1].c : 1;
    if (observed > 0 && (observed < 0.6 || observed > 1.6)){
      const ratio = exactSplitRatio(id, observed);
      for (let j = 0; j < i; j++) rows[j].c = Math.round(rows[j].c * ratio * 10000) / 10000;
      if (splits && !splits.some(sp => sp.d === rows[i].d)) splits.push({ d: rows[i].d, ratio });
    }
  }
  return rows;
}
function splitFactor(d, splits){
  let f = 1;
  (splits || []).forEach(sp => { if (d < sp.d) f *= sp.ratio; });
  return f;
}
function normalizeSplits(v){
  return (Array.isArray(v) ? v : [])
    .map(sp => ({ d: String((sp && sp.d) || '').slice(0, 10), ratio: finiteNum(sp && sp.ratio, 0) }))
    .filter(sp => /^\d{4}-\d{2}-\d{2}$/.test(sp.d) && sp.ratio > 0);
}
/* splits 傳入時會被就地更新(偵測到新的分割就記進去),呼叫端要把它存回去。 */
function mergeHistory(hist, rows, keep = PRICE_HIST_KEEP, splits = null, id = ''){
  const byDate = new Map((hist || []).map(h => [h.d, h.c]));
  (Array.isArray(rows) ? rows : []).forEach(row => {
    if (!Array.isArray(row)) return;
    const d = rocToISO(row[0]);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return;
    const raw = cleanNum(row[6]), f = splitFactor(d, splits);
    // 收盤價解析不出正數(證交所當天沒成交給「--」、回應欄位不齊)就略過這一列——以前會用 0 蓋掉
    // 已經存好的正確收盤價,接著又因為 ≤0 被濾掉,等於一次殘缺的回應就把好資料刪掉(壓測看到歷史從 226 天掉到 145 天)
    if (!(raw > 0)) return;
    byDate.set(d, f === 1 ? raw : Math.round(raw * f * 10000) / 10000);
  });
  const merged = [...byDate.entries()]
    .map(([d, c]) => ({ d, c }))
    .filter(h => /^\d{4}-\d{2}-\d{2}$/.test(h.d) && h.c > 0)
    .sort((a, b) => a.d < b.d ? -1 : (a.d > b.d ? 1 : 0));
  return adjustForSplits(merged, splits, id).slice(-keep);
}
/* 有沒有標的的歷史價格還不夠算慢線——不夠的話,更新收盤價順便自動回補,
   使用者不用記得另外跑去「訊號」分頁按「回補歷史價格」。 */
function needsBackfill(){
  return state.instruments.some(it => {
    if (!it.auto || !/^[0-9A-Za-z]{3,8}$/.test(it.id)) return false;
    const t = computeTrend(it);
    return t.barsAvailable < t.barsNeeded || !!trendHistoryGap(it);
  });
}
/* 均線用得到的那段歷史中間有沒有缺一段。更新報價只抓「這個月」,一個多月沒開 app 的話中間那個月就不見了;
   sma() 照筆數算,缺口前後會被硬接在一起,快慢線跟訊號都會錯(壓測重現:8 月沒開,9 月打開缺 32 天)。
   有缺口就當成歷史不夠:自動回補(不受一天一次的限制)、訊號分頁不給訊號也不跳提醒。 */
function trendHistoryGap(it){
  const p = it.trend || defaultTrendParams(it.leverage);
  const need = Math.max(p.maFast, p.maSlow) + 1;
  return findHistoryGap((it.priceHistory || []).slice(-need));
}
async function fetchQuotes(manual){
  if (!QUOTES_ENABLED || quoteBusy) return;
  if (twseCooldownLeft() > 0){
    if (manual){ quoteMsg = twseCooldownMsg(); renderAll(); }
    return;
  }
  quoteBusy = true;
  quoteMsg = '更新報價中…';
  if (manual) renderAll();
  try{
    // 跟 backfillHistory 一樣只記 key:排隊抓要好幾秒,這段時間雲端同步可能把 state.instruments 整個換掉,
    // 抓著舊物件寫進去的股價會跟著孤兒物件一起消失(壓測重現過)
    const targets = state.instruments.filter(it => it.auto && /^[0-9A-Za-z]{3,8}$/.test(it.id))
      .map(it => ({ key: it.key, id: it.id }));
    const results = await Promise.all([
      ...targets.map(t => twseRows(TWSE_STOCK + encodeURIComponent(t.id))),
      twseRows(TWSE_INDEX)
    ]);
    const idxRows = results[results.length - 1];
    let date = '', got = 0, missed = [];
    targets.forEach((t, i) => {
      const it = findInstrumentByKey(t.key);
      // 最後一列收盤價是「--」(當天沒成交)時往前找最近一個有成交的,不然股價會被寫成 0、市值歸零
      const row = (results[i] || []).slice().reverse().find(r => Array.isArray(r) && cleanNum(r[6]) > 0);
      if (!it) return;                    // 抓的途中被刪掉了
      if (row){
        it.price = cleanNum(row[6]);      // 收盤價
        it.priceHistory = mergeHistory(it.priceHistory, results[i], PRICE_HIST_KEEP, it.splits || (it.splits = []), it.id);   // 順便把整月資料併進歷史,累積均線用的資料
        date = rocToISO(row[0]) || date;
        got++;
      }else{
        missed.push(t.id);
      }
    });
    if (idxRows && idxRows.length){
      // 大盤點位本身現在沒有任何 UI 在用(舊的跌幅觸發判斷已經拿掉),
      // 抓這組資料純粹是為了在個股都查不到時還有日期可以定錨。
      const row = idxRows[idxRows.length - 1];
      date = rocToISO(row[0]) || date;
    }
    if (got || (idxRows && idxRows.length)){
      if (date) state.leverage.quoteDate = date;
      maybeDailySnapshot();          // 按更新報價就留下今天這一筆
      quoteMsg = missed.length ? '查不到:' + missed.join('、') + '(代號是否正確?)' : '';
      try{ localStorage.setItem(QUOTE_TS_KEY, String(Date.now())); }catch(e){}
      scheduleSave();
    }else{
      quoteMsg = '抓不到報價,維持原本的數字';
    }
  }catch(e){
    quoteMsg = '抓不到報價(可能沒有網路),維持原本的數字';
  }
  quoteBusy = false;
  // 自動補一天最多一次:剛上市幾個月的標的、或快線/慢線設得比 14 個月還長,補完歷史還是不夠,
  // 以前每小時更新報價就再補一次 14 個月(每次十幾個請求、一半是「查無資料」)。手動按回補不受限。
  let autoDay = '';
  try{ autoDay = localStorage.getItem(AUTO_BACKFILL_KEY) || ''; }catch(e){}
  const gapNow = state.instruments.some(it => it.auto && /^[0-9A-Za-z]{3,8}$/.test(it.id) && trendHistoryGap(it));   // 缺口關係到訊號對不對,不受一天一次限制
  if (needsBackfill() && !backfillBusy && (manual || gapNow || autoDay !== todayISO())){
    try{ localStorage.setItem(AUTO_BACKFILL_KEY, todayISO()); }catch(e){}
    await backfillHistory();   // 歷史不夠就順便補,不用再多按一次
    // 這是在「設定」分頁按的,回補結果原本只會顯示在「訊號」分頁,這裡順便帶一份過來
    if (backfillMsg && backfillMsg !== '回補完成'){
      quoteMsg = quoteMsg ? quoteMsg + ';歷史' + backfillMsg : '歷史' + backfillMsg;
    }
  }
  // 自動抓取可能在使用者打字時完成,別把游標和輸入到一半的內容洗掉
  if (document.activeElement && document.activeElement.tagName === 'INPUT'){
    if (currentTab === 'leverage') refreshLeverage();
  }else{
    renderAll();
  }
}
function maybeAutoQuote(){
  if (!QUOTES_ENABLED) return;
  let last = 0;
  try{ last = Number(localStorage.getItem(QUOTE_TS_KEY)) || 0; }catch(e){}
  if (Date.now() - last > 3600000 && !twseCooldownLeft()) fetchQuotes(false);   // 一小時內不重覆抓;被擋冷卻中也不抓
}

/* 回補約 14 個月(涵蓋 240 日均線)的歷史收盤價,給趨勢訊號用。
   刻意逐月「依序」抓、每次間隔一下,不要 Promise.all 對證交所同時發一串請求。
   單一月份抓失敗就跳過繼續,不中止整個回補;最後回報哪些標的/月份沒抓到。 */
const BACKFILL_MONTHS = 14;
const AUTO_BACKFILL_KEY = 'financeAutoBackfillDay';   // 更新報價時順便自動回補,最後一次是哪天
async function backfillHistory(){
  if (!QUOTES_ENABLED || backfillBusy) return;
  backfillBusy = true;
  // 只記 key/id,不要抓著 instrument 物件參照不放——回補一輪要跑十幾秒到幾十秒,
  // 這段時間如果雲端同步收到遠端更新,applyRemote() 會把整個 state.instruments 換掉,
  // 抓著舊物件參照的話,後面寫入的都是沒人在用的孤兒物件,畫面看起來跑完了但其實沒真的存進去。
  // 每次要寫入前都用 key 重新查一次「現在活著」的物件,才不會被雲端同步蓋掉。
  const targets = state.instruments.filter(it => it.auto && /^[0-9A-Za-z]{3,8}$/.test(it.id))
    .map(it => ({ key: it.key, id: it.id }));
  const incomplete = [];
  let blocked = null;
  for (const target of targets){
    let monthsOk = 0;
    for (let offset = 0; offset > -BACKFILL_MONTHS; offset--){
      backfillMsg = `回補中…${target.id} ${-offset + 1}/${BACKFILL_MONTHS} 個月(每個月間隔 ${TWSE_GAP_MS / 1000} 秒,避免被證交所擋)`;
      renderAll();
      try{
        const j = await twseJson(TWSE_STOCK + encodeURIComponent(target.id) + '&date=' + monthParam(offset));
        if (j.stat === 'OK' && Array.isArray(j.data) && j.data.length){
          const live = findInstrumentByKey(target.key);
          if (live) live.priceHistory = mergeHistory(live.priceHistory, j.data, PRICE_HIST_KEEP, live.splits || (live.splits = []), live.id);
          monthsOk++;
        }
      }catch(e){
        if (e instanceof TwseBlocked){ blocked = e; break; }   // 被擋了就整個停下來,不要繼續硬撞
        /* 其他錯誤:這個月抓不到就跳過,繼續抓下一個月 */
      }
    }
    scheduleSave();   // 抓完一檔就存一次,不要等全部做完才存,縮短被雲端同步蓋掉的時間窗
    if (blocked) break;
    if (monthsOk < BACKFILL_MONTHS) incomplete.push(target.id + '(' + monthsOk + '/' + BACKFILL_MONTHS + ' 個月)');
  }
  backfillMsg = blocked ? blocked.message
    : (incomplete.length ? '部分月份沒抓到:' + incomplete.join('、') : '回補完成');
  backfillBusy = false;
  renderAll();
}

function loadBacktestHistoryCache(){
  try{
    localStorage.removeItem('financeBacktestHistory_v1');   // 舊版資料已經歪了,留著只是佔空間
    const raw = JSON.parse(localStorage.getItem(BACKTEST_HIST_KEY)) || {};
    backtestFullHistory = raw.hist || {};
    backtestSplits = raw.splits || {};
    backtestListedFrom = raw.listedFrom || {};
    if (applyBacktestKnownSplits()) saveBacktestHistoryCache();
  }catch(e){ backtestFullHistory = {}; backtestSplits = {}; backtestListedFrom = {}; }
}
function applyBacktestKnownSplits(){
  let changed = false;
  Object.keys(backtestSplits).forEach(id => {
    if (applyKnownSplitRatios(id, backtestFullHistory[id], backtestSplits[id])) changed = true;
  });
  return changed;
}
function saveBacktestHistoryCache(){
  try{ localStorage.setItem(BACKTEST_HIST_KEY, JSON.stringify({ hist: backtestFullHistory, splits: backtestSplits, listedFrom: backtestListedFrom })); }catch(e){ /* 存不下就算了,下次按重抓 */ }
}

/* 「抓完整歷史」可以跳過哪些月份。光看「這個月有沒有資料」不夠:上次按的時候還沒過完的
   那個月只抓到當天為止,之後它變成「兩個月前」就會被當成已經有資料而跳過,剩下的交易日
   永遠補不回來——findHistoryGap() 會一直報缺口,使用者怎麼重按都一樣卡住。所以只有
   (1) 比已存資料最新那筆所在月份更早(那個月一定是在它過完之後才被抓的),而且
   (2) 不是缺口兩端的月份(舊版已經留下的半個月,用同一個 HISTORY_GAP_DAYS 門檻判斷)
   才算抓齊。 */
function completeHistoryMonths(hist){
  const done = new Set();
  if (!hist || !hist.length) return done;
  const latestYm = hist[hist.length - 1].d.slice(0, 7);
  hist.forEach(h => { const ym = h.d.slice(0, 7); if (ym < latestYm) done.add(ym); });
  for (let i = 1; i < hist.length; i++){
    const days = (new Date(hist[i].d) - new Date(hist[i - 1].d)) / 86400000;
    if (days > HISTORY_GAP_DAYS){
      done.delete(hist[i - 1].d.slice(0, 7));
      done.delete(hist[i].d.slice(0, 7));
    }
  }
  return done;
}

/* 回測要看的歷史比「訊號」用的 14 個月長得多,從 BACKTEST_FROM 那個月開始逐月往回抓到現在,
   一樣逐月序列、每次間隔一下,不要一次對證交所發一串請求。抓完一檔就存一次,中途中斷
   (使用者切分頁、關頁面)也不會整包資料不見。 */
async function backfillFullHistory(){
  if (!QUOTES_ENABLED || backtestHistBusy) return;
  backtestHistBusy = true;
  const targets = state.instruments.filter(it => it.auto && /^[0-9A-Za-z]{3,8}$/.test(it.id)).map(it => it.id);
  const incomplete = [];
  let blocked = null;
  if (twseCooldownLeft() > 0) blocked = new TwseBlocked(twseCooldownMsg());
  for (const tid of blocked ? [] : targets){
    let hist = backtestFullHistory[tid] || [];
    // 已經抓齊的月份不用重抓——不然每次按都要重新跑一次完整 130 幾個月,跟第一次一樣久。
    // 當月跟上個月永遠重抓(可能還有新收盤價),更舊的月份要 completeHistoryMonths() 認定抓齊了才跳過。
    const doneMonths = completeHistoryMonths(hist);
    const months = [];   // 新→舊
    for (let offset = 0; offset > -260; offset--){
      const m = monthParam(offset);
      if (m < BACKTEST_FROM) break;
      const ym = m.slice(0, 4) + '-' + m.slice(4, 6);
      months.push({ m, skip: offset <= -2 && (doneMonths.has(ym) || (backtestListedFrom[tid] && ym < backtestListedFrom[tid])) });
    }
    const toFetch = months.filter(x => !x.skip).length;
    let fetched = 0;
    const monthLog = [];   // 依時間新→舊記録每個月有沒有抓到,新到舊排(offset 0 → 最舊)
    const emptyMonths = new Set();   // 證交所正常回應但查無資料的月份(還沒上市),跟抓失敗分開
    for (const { m, skip } of months){
      if (skip){ monthLog.push(true); continue; }
      fetched++;
      const leftMin = Math.ceil((toFetch - fetched) * TWSE_GAP_MS / 60000);
      backtestHistMsg = `回補完整歷史中…${tid} ${fetched}/${toFetch} 個月` + (leftMin > 1 ? `(這檔還要約 ${leftMin} 分鐘)` : '')
        + `——每個月間隔 ${TWSE_GAP_MS / 1000} 秒,避免被證交所擋,可以先切去別的分頁,不要關掉 app。`;
      renderAll();
      let ok = false;
      try{
        const j = await twseJson(TWSE_STOCK + encodeURIComponent(tid) + '&date=' + m);
        if (j.stat === 'OK' && Array.isArray(j.data) && j.data.length){
          hist = mergeHistory(hist, j.data, Infinity, backtestSplits[tid] || (backtestSplits[tid] = []), tid);
          ok = true;
        }else{
          emptyMonths.add(m);
        }
      }catch(e){
        // 被擋了(twseJson 連續失敗好幾次、進入冷卻)就整個停下來,不要把剩下上百個月硬發完。
        if (e instanceof TwseBlocked){ blocked = e; break; }
      }
      monthLog.push(ok);
    }
    backtestFullHistory[tid] = hist;
    // 最舊那筆資料之前的月份,如果證交所每個都明確回「查無資料」(不是抓失敗),代表那時還沒上市,
    // 記下來,之後更新不用每次再花 2 秒一個月去問(00675L 就有 16 個月這種)。
    if (!blocked && hist.length){
      const firstYm = hist[0].d.slice(0, 7);
      const older = months.filter(x => (x.m.slice(0, 4) + '-' + x.m.slice(4, 6)) < firstYm);
      if (older.every(x => x.skip || emptyMonths.has(x.m))) backtestListedFrom[tid] = firstYm;
    }
    saveBacktestHistoryCache();
    if (blocked) break;
    // monthLog 是新→舊。「最舊的那次成功」之前(更舊)如果也抓不到,代表那時候這標的
    // 還沒上市,是預期中的事,不算異常(00675L 2016 年 10 月才掛牌,更早的月份本來就查無資料)。
    // 只有「最舊成功月」之後(較新)出現的空月,才是真的漏抓——那段時間標的明明已經在交易了。
    const oldestOkIdx = monthLog.lastIndexOf(true);
    const realGaps = oldestOkIdx <= 0 ? 0 : monthLog.slice(0, oldestOkIdx).filter(v => !v).length;
    if (realGaps > 0) incomplete.push(tid + '(' + realGaps + ' 個月沒抓到,可以再按一次重試)');
  }
  backtestHistMsg = blocked
    ? blocked.message + '已經抓到的月份都有存起來,下次按會從沒抓到的地方接著抓。'
    : (incomplete.length ? '部分月份沒抓到:' + incomplete.join('、') : '完整歷史回補完成');
  // 推一份到雲端,其他裝置下次打開就能直接讀,不用再等一次逐月抓。失敗(沒登入/沒網路)就算了,
  // 本機的資料不受影響,不影響這次回補的結果。
  if (cloudBacktestDoc){
    try{ await cloudBacktestDoc.set({ v: BACKTEST_HIST_VERSION, data: backtestFullHistory, splits: backtestSplits, listedFrom: backtestListedFrom, updatedAt: Date.now() }); }catch(e){ /* 推不上去,本機還是有資料 */ }
  }
  backtestHistBusy = false;
  renderAll();
}

/* ===================== 部位損益 =====================
   買賣紀錄用加權平均成本法。整體損益要扣掉借款的累積利息,
   否則槓桿部位看起來永遠比實際好。 */
const findInstrument = id => state.instruments.find(x => x.id === id);
const findInstrumentByKey = k => state.instruments.find(x => x.key === k);
const symbolName = id => (findInstrument(id) || {}).name || id;
function symbolPrice(sym){
  const it = findInstrument(sym);
  return it ? it.price : 0;
}
/* 槓桿倍數:正2 填 2,一般股票 1,反1 填 -1。用來算實質市場曝險。 */
function symbolLeverage(sym){
  const it = findInstrument(sym);
  return it && it.leverage !== 0 ? it.leverage : 1;
}
const hasTrades = () => state.trades.length > 0;
function heldShares(sym){
  // 賣出只扣實際賣得掉的股數(soldQtyById),跟損益的回放一致。以前直接買減賣,
  // 「先記了一筆超賣、之後才買」會算成 0 股,損益卻說持有,市值/曝險/報酬率各算各的
  const sold = soldQtyById();
  let n = 0;
  state.trades.forEach(t => {
    if (t.symbol !== sym || t.action === 'dividend') return;
    n += (t.action === 'sell' ? -(sold[t.id] ?? t.shares) : t.shares);
  });
  return Math.max(0, n);
}
/* 手續費 0.1425%(最低 20 元),賣出另加 0.1% 證交稅 */
function defaultFee(action, gross){
  if (!(gross > 0)) return 0;
  const broker = Math.max(20, gross * 0.001425);
  return Math.round(action === 'sell' ? broker + gross * 0.001 : broker);
}
/* 一筆借款從動用日到 until(預設今天),依「實際餘額」分段累積。
   還款之後只對剩下的餘額繼續算。 */
function accrue(item, annualPct, until = todayISO()){
  if (!item.useDate || until <= item.useDate) return 0;
  const today = until;
  const events = effectiveRepayments(item).filter(r => r.date <= until);
  let balance = item.amount;
  let cursor = item.useDate;
  let total = 0;
  events.forEach(r => {
    if (r.date > cursor){
      total += balance * (annualPct / 100) * (daysBetweenISO(cursor, r.date) / 365.25);
      cursor = r.date;
    }
    balance = Math.max(0, balance - r.amount);
  });
  total += balance * (annualPct / 100) * (daysBetweenISO(cursor, today) / 365.25);
  return total;
}
/* 只認動用日之後、今天以前的還款 —— 未來日期的還款不能讓餘額先歸零,
   否則餘額和利息會對不起來 */
function effectiveRepayments(item){
  if (!item || !item.useDate) return [];
  const today = todayISO();
  return (item.repayments || [])
    .filter(r => r.date && r.date >= item.useDate && r.date <= today)
    .sort((a, b) => a.date < b.date ? -1 : 1);
}
const repaidOf = item => Math.min(item.amount, sum(effectiveRepayments(item), r => r.amount));
function outstanding(item){
  // 動用日期在未來(先記下預定要借的)到那天才算借款——跟未來日期的還款一樣。以前當下就算進餘額,
  // 當月還照整筆記一筆房貸利息,錢還沒借就先付利息;accrue()/balanceAt() 本來就是從動用日才開始算
  if (!item.useDate || item.useDate > todayISO()) return 0;
  return Math.max(0, item.amount - repaidOf(item));
}

/* 已動用的房貸,從動用日算到今天的累積利息 */
function accruedInterest(){
  const L = state.leverage;
  return sum(L.draws, t => accrue(t, L.annualRate));
}
/* 某一天當下,這筆借款還欠多少 */
function balanceAt(item, dateISO){
  if (!item || !item.useDate || dateISO < item.useDate) return 0;
  const repaid = sum((item.repayments || [])
    .filter(r => r.date && r.date >= item.useDate && r.date <= dateISO), r => r.amount);
  return Math.max(0, item.amount - repaid);
}
function monthEndISO(m){
  const y = Number(m.slice(0, 4)), mo = Number(m.slice(5, 7));
  const d = new Date(y, mo, 0);          // 該月最後一天
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

/* 以「自己的錢」為視角的現金流,拿來算 XIRR:
     自有資金買進 → 流出        房貸買進 → 0(錢是銀行出的)
     賣出、配息   → 流入        還款、利息 → 流出
     最後加上今天結清的價值:市值 − 借款餘額 */
function cashFlows(merge = true){   // merge=false 回傳合併前的明細(測試核對利息用)
  const L = state.leverage;
  const today = todayISO();
  const flows = [];
  const add = (date, amount) => { if (date && amount) flows.push({ date, amount }); };

  // 賣超過當時持股的部分,損益那邊不計(computePositionUncached),這裡也只算實際賣得掉的股數——
  // 以前照整筆算成流入,損益說「沒有計入」、報酬率卻算進去了,兩邊對不起來(先賣後買時 XIRR 變 0%)
  const sellQty = soldQtyById();
  state.trades.forEach(t => {
    if (t.action === 'dividend') add(t.date, t.amount - t.fee);
    else if (t.action === 'sell') add(t.date, (sellQty[t.id] ?? t.shares) * t.price - t.fee);
    else if (t.source !== 'loan') add(t.date, -(t.shares * t.price + t.fee));
  });

  const loans = L.draws;
  loans.forEach(item => {
    if (!item.useDate) return;
    (item.repayments || []).forEach(r => {
      if (r.date && r.date >= item.useDate && r.date <= today) add(r.date, -r.amount);
    });
    // 利息按月流出,金額跟「借款利息」同一套算法(照天數、照當時的餘額):每個月付的是
    // 「到月底為止累積的利息 − 到上個月底為止累積的利息」。以前用「月底餘額 × 年利率 / 12」,
    // 月中才動用、或當月才過一半,都會被算成一整個月,XIRR 會被低估。
    let cursor = item.useDate.slice(0, 7), paid = 0;
    for (let guard = 0; cursor <= thisMonth() && guard < 600; guard++){
      const end = monthEndISO(cursor), upTo = end > today ? today : end;
      const acc = accrue(item, L.annualRate, upTo);
      add(upTo, -(acc - paid));
      paid = acc;
      cursor = shiftMonth(cursor, 1);
    }
  });

  const p = positionValueNow();
  const owed = sum(loans, item => balanceAt(item, today));
  add(today, p - owed);                  // 今天結清可以拿回的錢
  if (!merge) return flows.sort((a, b) => a.date < b.date ? -1 : 1);
  // 同一天的現金流先合併:借款多時每筆每月一筆利息,幾千筆現金流其實只有一百多個日期,
  // XIRR 每一輪都要對每筆算一次次方,合併後快很多,結果完全一樣
  const byDate = new Map();
  flows.forEach(f => byDate.set(f.date, (byDate.get(f.date) || 0) + f.amount));
  return [...byDate.entries()].filter(([, a]) => a).map(([date, amount]) => ({ date, amount }))
    .sort((a, b) => a.date < b.date ? -1 : 1);
}
function positionValueNow(){
  const seen = new Set();
  let v = 0;
  state.instruments.forEach(it => {
    if (it.id && seen.has(it.id)) return;   // 代號重複只算一次
    if (it.id) seen.add(it.id);
    const shares = hasTrades() ? heldShares(it.id) : it.shares;
    v += shares * it.price;
  });
  return v;
}

/* XIRR:用二分法解 NPV = 0,比牛頓法慢但不會發散 */
function xirr(flows){
  if (!flows || flows.length < 2) return null;
  if (!flows.some(f => f.amount > 0) || !flows.some(f => f.amount < 0)) return null;
  const t0 = new Date(flows[0].date + 'T00:00:00').getTime();
  const yearsOf = f => (new Date(f.date + 'T00:00:00').getTime() - t0) / (365.25 * 86400000);
  const npv = r => flows.reduce((acc, f) => acc + f.amount / Math.pow(1 + r, yearsOf(f)), 0);
  let lo = -0.999999, hi = 10;   // 幾乎全賠時答案會逼近 −100%,下界要夠低
  let flo = npv(lo), fhi = npv(hi);
  if (!isFinite(flo) || !isFinite(fhi) || flo * fhi > 0) return null;
  for (let i = 0; i < 200 && hi - lo > 1e-13; i++){   // 區間小到 1e-13 就夠了(約 47 輪),不用跑滿 200 輪
    const mid = (lo + hi) / 2;
    const fm = npv(mid);
    if (!isFinite(fm)) return null;
    if (Math.abs(fm) < 1e-6) return mid;
    if (flo * fm < 0){ hi = mid; fhi = fm; } else { lo = mid; flo = fm; }
  }
  return (lo + hi) / 2;
}

/* 一次重畫會呼叫 computePosition 三到四次(損益卡、曝險、買賣紀錄、壓力測試),
   每次都要跑一遍 XIRR 的二分法。資料多了以後很有感,所以記住上一次的結果;
   靠下面 posSignature() 判斷資料有沒有變,不用在重畫/存檔時清。整份 state 被換掉(雲端同步)時才清。 */
let posMemo = null, posMemoKey = '';
const clearPosMemo = () => { posMemo = null; };

/* 快取的鑰匙:所有會影響損益的東西(買賣紀錄、標的的代號/股價/股數/槓桿、動用與還款、利率、今天日期)
   原樣序列化。以前是把這些加總成一個數字,會撞:例如把買賣日期的「月份」改掉簽章完全不變,只好在每次
   重畫跟存檔都清快取保險,結果每次重畫都重算一次 XIRR(1000 筆買賣時一次 70ms,手機上打字會卡)。
   序列化 1000 筆買賣只要約 1ms,而且不會撞,所以不用再靠呼叫端清快取。 */
function posSignature(){
  const L = state.leverage;
  return JSON.stringify([
    state.trades,
    state.instruments.map(it => [it.id, it.price, it.shares, it.leverage]),
    L.draws, L.annualRate, todayISO()
  ]);
}

function computePosition(){
  const key = posSignature();
  if (posMemo && posMemoKey === key) return posMemo;
  posMemo = computePositionUncached();
  posMemoKey = key;
  return posMemo;
}

/* 買賣紀錄的回放順序:依日期,同一天之內先買進、再配息、最後賣出(不可能先賣掉還沒買的股票)。
   以前只照日期排,同一天就照輸入順序,當沖或事後改日期時先記了賣出,會被判成賣超過持股(隨機測試抓到)。 */
const tradeDayOrder = t => t.action === 'sell' ? 2 : t.action === 'dividend' ? 1 : 0;
const sortedTrades = () => state.trades.slice()
  .sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : tradeDayOrder(a) - tradeDayOrder(b));
/* 每筆賣出實際賣得掉的股數(賣超過當時持股的部分不算),損益跟現金流共用 */
function soldQtyById(){
  const held = {}, out = {};
  sortedTrades().forEach(t => {
    if (t.action === 'buy') held[t.symbol] = (held[t.symbol] || 0) + t.shares;
    else if (t.action === 'sell'){
      out[t.id] = Math.min(t.shares, Math.max(0, held[t.symbol] || 0));
      held[t.symbol] = (held[t.symbol] || 0) - out[t.id];
    }
  });
  return out;
}
function computePositionUncached(){
  const lots = {};
  let buyCash = 0, buyLoan = 0, sellNet = 0, realized = 0, fees = 0, dividends = 0, oversold = false;
  const sorted = sortedTrades();   // 同一天先買、再配息、最後賣,見 sortedTrades
  sorted.forEach(t => {
    const lot = lots[t.symbol] || (lots[t.symbol] = { shares:0, cost:0 });
    const gross = t.shares * t.price;
    fees += t.fee;
    if (t.action === 'dividend'){
      // 配息當成已實現收益,不動持股成本
      realized += t.amount - t.fee;
      dividends += t.amount - t.fee;
    }else if (t.action === 'sell'){
      const avg = lot.shares > 0 ? lot.cost / lot.shares : 0;
      const qty = Math.min(t.shares, lot.shares);      // 賣超過持有的部分不計,否則會憑空變成獲利
      if (qty < t.shares) oversold = true;
      const soldGross = qty * t.price;
      const costOut = avg * qty;
      realized += (soldGross - t.fee) - costOut;
      sellNet += soldGross - t.fee;
      lot.shares -= qty;
      lot.cost -= costOut;
    }else{
      lot.shares += t.shares;
      lot.cost += gross + t.fee;
      if (t.source === 'loan') buyLoan += gross + t.fee; else buyCash += gross + t.fee;
    }
  });
  let marketValue = 0, remainCost = 0;
  Object.keys(lots).forEach(sym => {
    marketValue += lots[sym].shares * symbolPrice(sym);
    remainCost += lots[sym].cost;
  });
  const unrealized = marketValue - remainCost;
  const interest = accruedInterest();
  const total = unrealized + realized - interest;
  const invested = buyCash + buyLoan;
  // 賣出所得與配息是拿回來的錢,要從「還放在裡面的自有資金」扣掉
  const netCash = buyCash - sellNet - dividends;
  const years = sorted.length ? Math.max(daysSince(sorted[0].date) / 365.25, 0) : 0;
  const rate = xirr(cashFlows());
  return {
    lots, buyCash, buyLoan, invested, netCash, sellNet, realized, dividends, unrealized, interest, total, oversold,
    xirr: rate === null ? null : rate * 100,
    marketValue, remainCost, fees, years,
    hasData: sorted.length > 0,
    returnOnCash: buyCash > 0 ? total / buyCash * 100 : 0,
    returnOnAll: invested > 0 ? total / invested * 100 : 0
  };
}

/* ===================== 曝險與風險 =====================
   00631L / 00675L 是正2 ETF,本身就有 2 倍槓桿;
   再用房貸借錢買,實際市場曝險是「部位市值 × 2」。 */
function computeRisk(){
  const p = computePosition();
  const r = computeLeverage();
  const pv = p.hasData ? p.marketValue : r.totalValue;
  const loan = r.usedAmount;
  const equity = pv - loan;
  const nw = netWorth();
  // 實質曝險:每檔各自乘上自己的槓桿倍數(正2 = 2,一般股票 = 1)
  const exposure = sum(r.holdings, h => h.value * (h.leverage || 1));
  // 分母 = 自己的錢 + 房貸總額度。用部位淨值而非部位市值,
  // 否則已動用的部分會同時被算進部位與額度裡,比例失真偏樂觀。
  const capacity = equity + state.leverage.creditLimit;
  return {
    pv, loan, equity, nw, exposure, capacity,
    creditLimit: state.leverage.creditLimit,
    invested: p.invested, pnl: p.total, hasTrades: p.hasData,
    leverage: equity > 0 ? pv / equity : 0,
    exposureRatio: capacity > 0 ? exposure / capacity * 100 : 0,
    monthlyInterest: r.monthlyInterest
  };
}

/* 每月快照:第一次開啟該月時自動記一筆,之後每次開啟(或改資產/負債細項時)更新到最新。
   使用者手動改過的那一筆(auto:false)不會被覆蓋。過了這個月就固定下來,
   連同當時每一筆資產/負債的金額(items),才看得到「哪一項每個月怎麼變」。 */
const currentItems = () => [
  ...state.assets.map(a => ({ id: a.id, name: a.name, amount: Math.round(a.amount), t: 'a' })),
  ...state.liabilities.map(l => ({ id: l.id, name: l.name, amount: Math.round(l.amount), t: 'l' })),
];
/* 某一項在上一個「有細項紀錄」的月份是多少(本月之前最近的一筆快照),沒有就回傳 null */
function prevItemAmount(id){
  const m = thisMonth();
  const prev = state.netWorthHistory
    .filter(h => h.m < m && h.items && h.items.length)
    .sort((a, b) => a.m < b.m ? 1 : -1)[0];
  if (!prev) return null;
  const it = prev.items.find(x => x.id === id);
  return it ? { m: prev.m, amount: it.amount } : { m: prev.m, amount: null };
}
/* 某一項歷來每個月的金額(只有存過細項的月份) */
function itemHistory(id){
  return state.netWorthHistory
    .filter(h => h.items && h.items.some(x => x.id === id))
    .sort((a, b) => a.m < b.m ? -1 : 1)
    .map(h => ({ m: h.m, amount: h.items.find(x => x.id === id).amount }));
}
function maybeSnapshot(){
  const p = computePosition();
  const r = computeLeverage();
  const nw = netWorth();
  if (!nw && !p.hasData && !r.totalValue) return false;
  const m = thisMonth();
  // 已經有比「這個月」還新的快照 = 手機時間被往回調了(或時區跑掉)。這時候照寫會用現在的數字
  // 蓋掉已經固定的過去月份(壓測看到 10 月調回 9 月,9 月的淨資產跟細項都被改掉),所以什麼都不寫。
  if (state.netWorthHistory.some(h => h.m > m)) return false;
  const found = state.netWorthHistory.find(h => h.m === m);
  if (found && !found.auto) return false;
  const snap = {
    v: Math.round(nw),
    pv: Math.round(p.hasData ? p.marketValue : r.totalValue),
    pnl: p.hasData ? Math.round(p.total) : null,
    loan: Math.round(r.usedAmount),
    items: currentItems(),
    auto: true
  };
  if (found){
    if (found.v === snap.v && found.pv === snap.pv && found.pnl === snap.pnl && found.loan === snap.loan
        && JSON.stringify(found.items || []) === JSON.stringify(snap.items)) return false;
    Object.assign(found, snap);
  }else{
    state.netWorthHistory.push(Object.assign({ id: uid(), m }, snap));
  }
  scheduleSave();
  return true;
}

/* 壓力測試:大盤跌 d% 時,各標的照自己的槓桿倍數換算 */
function computeStress(d){
  const decline = num(d);
  const k = computeRisk();
  const r = computeLeverage();
  const L = state.leverage;
  if (!(k.pv > 0) || !decline) return null;

  // 用 holdings 算好的 value:代號重複的那列 computeLeverage 已經算成 0 股,這裡自己重算 heldShares 的話
  // 會把同一批持股算兩次(以前兩列同代號時,跌 20% 反而顯示賺錢)
  let newPv = 0, newExposure = 0;
  r.holdings.forEach(h => {
    const drop = decline * (h.leverage || 1) / 100;
    const v = h.value * Math.max(0, 1 - drop);
    newPv += v;
    newExposure += v * (h.leverage || 1);
  });
  const loss = k.pv - newPv;
  const newEquity = newPv - k.loan;
  const newCapacity = newEquity + L.creditLimit;

  return {
    decline, pv: k.pv, newPv, loss, equity: k.equity, newEquity,
    ratio: k.exposureRatio, newRatio: newCapacity > 0 ? newExposure / newCapacity * 100 : 0,
    capacity: k.capacity, newCapacity    // ≤ 0 時比例沒有意義(借款已經超過市值 + 額度),畫面要另外說明
  };
}

/* 每日快照:每天第一次開啟(或按更新報價)記一筆,同一天會更新到最新。
   保留最近 1000 個交易日,約四年;更久以前看每月快照。 */
const DAILY_KEEP = 1000;
function maybeDailySnapshot(){
  const p = computePosition();
  const r = computeLeverage();
  const pv = p.hasData ? p.marketValue : r.totalValue;
  if (!pv && !r.usedAmount) return false;
  const today = todayISO();
  const rec = {
    d: today,
    pv: Math.round(pv),
    loan: Math.round(r.usedAmount),
    eq: Math.round(r.equityValue),
    pnl: p.hasData ? Math.round(p.total) : null
  };
  const list = state.dailyHistory;
  const last = list.length ? list[list.length - 1] : null;
  if (last && last.d === today){
    if (last.pv === rec.pv && last.loan === rec.loan && last.eq === rec.eq && last.pnl === rec.pnl) return false;
    Object.assign(last, rec);
  }else{
    list.push(rec);
    if (list.length > DAILY_KEEP) state.dailyHistory = list.slice(-DAILY_KEEP);
  }
  scheduleSave();
  return true;
}
/* 範圍照日期算,不是「最後 N 筆」:每日快照只有打開 app/更新報價那天才記,一週開兩次的話
   「最後 30 筆」其實是三個多月,標籤寫「1 個月」卻畫了一整季(壓測抓到) */
const RANGE_DAYS = { 30: 31, 90: 92, 250: 366 };
function dailySlice(){
  const list = state.dailyHistory.slice().sort((a, b) => a.d < b.d ? -1 : 1);
  if (!(chartRange > 0)) return list;
  const d = new Date(todayISO() + 'T00:00:00');
  d.setDate(d.getDate() - (RANGE_DAYS[chartRange] || chartRange));
  const cutoff = d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  return list.filter(h => h.d >= cutoff);
}
/* 選的範圍裡不到兩筆:保留範圍切換,不要退回每月圖(以前退回之後範圍按鈕跟著消失,切不回「全部」) */
const rangeTooShort = n => `<div class="empty">這段期間只有 ${n} 筆每日紀錄(打開 app 或更新報價的那天才會記一筆),選長一點的範圍。</div>`;
const dayLabel = d => Number(d.slice(5, 7)) + '/' + Number(d.slice(8, 10));

/* 把快照補成連續的月份 —— 中間沒開過 app 的月份留空,
   否則兩點之間的間隔會被畫成一樣寬,斜率就騙人了 */
function monthlyHistory(maxMonths){
  const hist = state.netWorthHistory.slice().sort((a, b) => a.m < b.m ? -1 : 1);
  if (!hist.length) return [];
  const byMonth = {};
  hist.forEach(h => { byMonth[h.m] = h; });
  const last = hist[hist.length - 1].m > thisMonth() ? hist[hist.length - 1].m : thisMonth();
  const months = [];
  let cursor = hist[0].m;
  for (let guard = 0; cursor <= last && guard < 600; guard++){
    months.push(cursor);
    cursor = shiftMonth(cursor, 1);
  }
  return months.slice(-maxMonths).map(m => byMonth[m] || { m, v:null, pv:null, pnl:null, loan:null });
}

/* 狀態改變提醒要有「上次看過的狀態」當比較基準,但以前只有按提醒上的「知道了」才會寫入,提醒又要有基準才會出現
   ——雞生蛋,基準永遠是空的,提醒從來沒出現過(壓測時追到 55aae11 加這個功能起就是這樣)。
   第一次算得出某檔的訊號時,安靜地把目前狀態記成基準(不跳提醒),之後狀態一變就會提醒。
   已經有基準的(按過「知道了」或「已調整完成」)不動。回傳有沒有寫入。 */
/* 把目前的狀態記成「看過了」。歷史還不夠算慢線時算出來的 WATCH 不是真的狀態,不記——以前按「已調整完成」
   時某檔歷史還沒補齊,就記成 WATCH,補齊後跳「狀態從 WATCH 變成 HOLD」的假提醒(跟 seedTrendBaselines 同一條規則) */
function ackTrend(it){
  if (!it || !it.trend) return;
  const t = computeTrend(it);
  if (t.barsAvailable < t.barsNeeded || trendHistoryGap(it)) return;
  it.trend.lastSeenStatus = t.status;
  it.trend.lastSeenLayers = t.pyramidCount;
  it.trend.lastSeenDate = todayISO();
}
function seedTrendBaselines(){
  let changed = false;
  state.instruments.forEach(it => {
    if (!it.trend) return;
    const seedStatus = !it.trend.lastSeenStatus;
    // 舊資料只記了狀態、沒記層數:狀態跟現在一樣的話,安靜補上現在的層數(不跳提醒);狀態不一樣的話提醒本來就會跳,按知道了時一起記
    const seedLayers = !seedStatus && !(it.trend.lastSeenLayers >= 0);
    if (!seedStatus && !seedLayers) return;
    const t = computeTrend(it);
    if (t.barsAvailable < t.barsNeeded || trendHistoryGap(it)) return;       // 歷史還不夠/有缺口,算出來的狀態不算數
    if (seedStatus){
      it.trend.lastSeenStatus = t.status;
      it.trend.lastSeenLayers = t.pyramidCount;
      it.trend.lastSeenDate = todayISO();
      changed = true;
    }else if (it.trend.lastSeenStatus === t.status){
      it.trend.lastSeenLayers = t.pyramidCount;
      changed = true;
    }
  });
  return changed;
}

let itemHistOpen = '';   // 資產頁目前展開「每月紀錄」的那一項 id
function itemDeltaText(id, amount){
  const prev = prevItemAmount(id);
  if (!prev) return '';
  if (prev.amount === null) return `${monthLabel(prev.m)}還沒有這項`;
  const d = Math.round(amount) - prev.amount;
  // 上一筆有細項的月份不一定是上個月(中間可能有沒開 app 的月份),不是的話寫出是跟哪個月比
  const vs = prev.m === shiftMonth(thisMonth(), -1) ? '比上月' : `比${monthLabel(prev.m)}`;
  return d === 0 ? `${vs} 持平` : `${vs} ${d > 0 ? '+' : '−'}${fmt(Math.abs(d))}`;
}
function itemDeltaClass(id, amount, isLiab){
  const prev = prevItemAmount(id);
  if (!prev || prev.amount === null) return 'muted';
  const d = Math.round(amount) - prev.amount;
  if (d === 0) return 'muted';
  return (d > 0) !== !!isLiab ? 'pos' : 'neg';   // 負債變多是壞事,顏色反過來
}
function itemRowExtras(x, isLiab, color){
  const open = itemHistOpen === x.id;
  const hist = open ? itemHistory(x.id) : [];
  return `
    <div class="row"><button class="linkish" data-act="item-hist" data-id="${x.id}" style="padding:0;">
        <span class="${itemDeltaClass(x.id, x.amount, isLiab)}" id="${isLiab ? 'l' : 'a'}-delta-${x.id}">${itemDeltaText(x.id, x.amount) || '還沒有上月紀錄'}</span></button>
      <button class="linkish muted" data-act="item-hist" data-id="${x.id}" style="padding:0;">${open ? '收起 ▾' : '每月紀錄 ▸'}</button></div>
    ${open ? (hist.length ? `
      ${lineChart('item-' + x.id, hist.map(h => h.m), [{ name: x.name || '這一項', color: color || 'var(--s1)', values: hist.map(h => h.amount) }], { height:110 })}
      <div style="margin-top:4px;">${hist.slice().reverse().map((h, i, arr) => {
        const older = arr[i + 1];
        const d = older ? h.amount - older.amount : null;
        return `<div class="row sub"><span class="label">${esc(monthLabel(h.m))}</span><span class="val">NT$ ${fmt(h.amount)}${d === null ? '' : `(${d >= 0 ? '+' : '−'}${fmt(Math.abs(d))})`}</span></div>`;
      }).join('')}</div>` : `<div class="muted" style="font-size:12px;">還沒有每月紀錄——從這個月開始,每個月會自動記下這一項的金額。</div>`) : ''}`;
}

function refreshAssets(){
  const tA = totalAssets(), tL = totalLiab();
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  set('a-networth', money(tA - tL));
  set('a-total', 'NT$ ' + fmt(tA));
  set('l-total', 'NT$ ' + fmt(tL));
  state.assets.forEach(a => {
    const pct = tA ? a.amount / tA * 100 : 0;
    set('a-pct-' + a.id, pct.toFixed(1) + '%');
    const bar = document.getElementById('a-bar-' + a.id);
    if (bar) bar.style.width = pct.toFixed(1) + '%';
  });
  // 「比上月」跟著打字即時更新,不整頁重畫(整頁重畫會讓正在打的欄位失焦)
  [[state.assets, 'a', false], [state.liabilities, 'l', true]].forEach(([list, pre, isLiab]) => list.forEach(x => {
    const el = document.getElementById(pre + '-delta-' + x.id);
    if (el){ el.textContent = itemDeltaText(x.id, x.amount) || '還沒有上月紀錄'; el.className = itemDeltaClass(x.id, x.amount, isLiab); }
  }));
}

const draftPrice = d => Math.abs(num(d.price)) || (String(d.price).trim() === '' ? symbolPrice(d.symbol) : 0);

function refreshTradeDraft(){
  const d = tradeDraft;
  const gross = num(d.shares) * draftPrice(d);
  const box = document.getElementById('pd-gross');
  if (box){
    box.style.display = (gross && d.action !== 'dividend') ? '' : 'none';

  const feeInput = document.getElementById('pd-fee-input');
  if (feeInput) feeInput.placeholder = gross ? fmt(defaultFee(d.action, gross)) : '自動';
}
