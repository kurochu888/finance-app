<title>槓桿投資儀表板</title>
<style>
  :root{
    --bg:#e8ebf0; --card:#ffffff; --raised:#f4f6f9; --text:#1b1f27; --sub:#69707c;
    --line:#dfe3ea; --accent:#2563eb; --accent-soft:#dbeafe; --accent-ink:#ffffff;
    --green:#15803d; --green-soft:#dcfce7;
    --red:#b91c1c; --red-soft:#fee2e2;
    --amber:#b45309; --amber-soft:#fef3c7;
    --bar-track:#dde1e8;
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
    --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948; --s9:#9aa1ac;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b0d11; --card:#1c2029; --raised:#252a34; --text:#e8eaed; --sub:#9aa1ac;
      --line:#30353f; --accent:#4d8dff; --accent-soft:#1c2c4a; --accent-ink:#0b0d11;
      --green:#3ecf6a; --green-soft:#123a20;
      --red:#f87171; --red-soft:#3f1717;
      --amber:#f2b23a; --amber-soft:#3f2f0e;
      --bar-track:#2a2e37;
      --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
      --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s9:#6b7280;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b0d11; --card:#1c2029; --raised:#252a34; --text:#e8eaed; --sub:#9aa1ac;
    --line:#30353f; --accent:#4d8dff; --accent-soft:#1c2c4a; --accent-ink:#0b0d11;
    --green:#3ecf6a; --green-soft:#123a20;
    --red:#f87171; --red-soft:#3f1717;
    --amber:#f2b23a; --amber-soft:#3f2f0e;
    --bar-track:#2a2e37;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s9:#6b7280;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    display:flex; justify-content:center; padding:16px 10px;
    height:100vh; height:100dvh; overflow:hidden;
    font-variant-numeric:tabular-nums;
  }
  /* 框本身不長高,只有中間的內容捲動,上下兩排分頁列永遠看得到 */
  .phone{
    width:100%; max-width:430px; height:100%; background:var(--bg);
    border-radius:24px; box-shadow:0 8px 32px rgba(15,20,35,.14);
    overflow:hidden; display:flex; flex-direction:column;
    border:1px solid var(--line);
  }
  @media (max-height: 560px){ body{padding:0;} .phone{border-radius:0; border:none;} }
  @media (max-width: 359px){
    .erow{flex-wrap:wrap;}
    .erow .f-name, .erow .f-title{flex:1 1 100%;}
    .erow .f-amt{flex:1 1 auto; max-width:none;}
  }
  .topbar{
    flex:0 0 auto; padding:10px 6px 0; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:6px; background:var(--card);
  }
  .toptabs{
    flex:1 1 auto; display:flex; gap:2px; overflow-x:auto; scrollbar-width:none;
  }
  .toptabs::-webkit-scrollbar{display:none;}
  .top-tab{
    flex:1 0 auto; padding:8px 9px 9px; border:none; background:none; cursor:pointer;
    color:var(--sub); font-size:14px; font-family:inherit; white-space:nowrap;
    border-bottom:2px solid transparent; margin-bottom:-1px;
  }
  .top-tab.active{color:var(--accent); font-weight:700; border-bottom-color:var(--accent);}
  .topbar .date{flex:0 0 auto; font-size:11px; color:var(--sub); padding:0 8px 8px 2px;}
  .content{
    flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:14px; padding-bottom:10px; overscroll-behavior:contain; overflow-x:hidden;
  }
  .tabbar{flex:0 0 auto; display:flex; border-top:1px solid var(--line); background:var(--card);}
  .tab-btn{
    flex:1; background:none; border:none; padding:9px 2px 11px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    color:var(--sub); font-size:11px; font-family:inherit;
  }
  .tab-btn .ic{font-size:17px; line-height:1.2;}
  .tab-btn.active{color:var(--accent); font-weight:700;}
  button:focus-visible, input:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:16px 15px; margin-bottom:14px;
    box-shadow:0 1px 2px rgba(15,20,35,.06), 0 8px 18px -14px rgba(15,20,35,.35);
  }
  .card h3{
    margin:0 0 12px; font-size:12px; color:var(--sub); font-weight:700;

<script>
/* ===================== 小工具 ===================== */
const uid = () => Math.random().toString(36).slice(2,9);
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
// num() 只擋 NaN,擋不住 Infinity/-Infinity(parseFloat('Infinity') 合法)——
// 均線參數跟歷史收盤價這些會拿去做除法、比較大小的欄位,混進 Infinity 會讓算式整個壞掉,
// 用這個在 normalize() 裡多擋一層,不改 num() 本身以免影響其他既有欄位的行為。
const finiteNum = (v, fallback) => { const n = num(v); return Number.isFinite(n) ? n : fallback; };
const fmt = n => (Math.round(n) || 0).toLocaleString('zh-Hant-TW');
const fmtPct = n => (n >= 0 ? '+' : '') + n.toFixed(1) + '%';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad2 = n => String(n).padStart(2, '0');
function todayISO(){ const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
const thisMonth = () => todayISO().slice(0,7);
function monthLabel(m){ const p = m.split('-'); return p[0] + '年' + Number(p[1]) + '月'; }
function shortMonth(m){ return Number(m.split('-')[1]) + '月'; }
function shiftMonth(m, delta){
  const y = Number(m.slice(0,4)), mo = Number(m.slice(5,7)) - 1 + delta;
  const d = new Date(y, mo, 1);
  return d.getFullYear() + '-' + pad2(d.getMonth()+1);
}
function daysBetweenISO(a, b){
  const d1 = new Date(a + 'T00:00:00'), d2 = new Date(b + 'T00:00:00');
  if (isNaN(d1.getTime()) || isNaN(d2.getTime())) return 0;
  return Math.max(0, (d2 - d1) / 86400000);
}
function daysSince(dateStr){
  if (!dateStr) return 0;
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d.getTime())) return 0;
  return Math.max(0, (Date.now() - d.getTime()) / 86400000);
}
function canon(v){
  if (Array.isArray(v)) return '[' + v.map(canon).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
  return JSON.stringify(v === undefined ? null : v);
}
const SERIES = ['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)','var(--s6)','var(--s7)','var(--s8)'];
const seriesColor = i => i < SERIES.length ? SERIES[i] : 'var(--s9)';

/* ===================== 預設狀態 ===================== */
const DEFAULT_LEVERAGE = {
  shares675L:0, price675L:0, shares631L:0, price631L:0,
  // marketHigh/marketCurrent/historicalHighValue/autoHigh:舊的跌幅觸發判斷用的欄位,
  // 那套邏輯已經拿掉,現在沒有任何 UI 讀寫它們(只是讓舊存檔資料讀得進來不出錯)。
  marketHigh:0, marketCurrent:0, historicalHighValue:0,
  stressDeclinePct:20, creditLimit:5000000, annualRate:2.6, autoHigh:true,
  autoInterest:true, interestPosted:[], quoteDate:'',
  draws:[],
  /* 正2(槓桿2倍)曝險目標:byLayer[i] = 加碼第 i+1 層的目標曝險比例(%),
     hold = 兩檔都確認 HOLD 時的目標,跟最後一層的目標可以一樣也可以不一樣。
     跟均線趨勢訊號的加碼層數(pyramidLevels)搭配用,見 computeExposurePlan()。 */
  exposureTargets: { byLayer:[65, 130], hold:130 }
};
/* 記帳的預設類別。之後在記帳頁選「新增類別…」加的,會經由交易紀錄進入清單 */
const DEFAULT_CATEGORIES = ['房貸 / 房租','餐飲','交通','娛樂','其他','房貸利息'];
/* 均線趨勢訊號的參數預設值:槓桿倍數 >=2(正2類)用較慢、較寬鬆的組合,
   避免被槓桿本身的波動洗出場;1倍(0050類)用稍快一點的組合。
   這兩組是使用者自己長期在用、驗證過樣本外表現的參數,不是隨便挑的。 */
function defaultTrendParams(leverage){
  const base = (num(leverage) >= 2)
    ? { maFast:120, maSlow:240, exitBuffer:0.90, recoverSlopeThreshold:1.002, recoverStrongRebound:1.03, pyramidGap:0.15, pyramidLevels:2 }
    : { maFast:100, maSlow:200, exitBuffer:0.95, recoverSlopeThreshold:1.002, recoverStrongRebound:1.03, pyramidGap:0.15, pyramidLevels:1 };
  return Object.assign(base, { lastSeenStatus:'', lastSeenDate:'' });
}
const PRICE_HIST_KEEP = 1000;   // 約 4 年份,遠超過 240 日均線需要的長度

/* key 是內部識別碼,id 是股票代號 —— 代號可能空白或重複,不能拿來當 key */
const DEFAULT_INSTRUMENTS = [
  { id:'00631L', name:'元大台灣50正2',   leverage:2, price:0, shares:0, auto:true, trend:defaultTrendParams(2), priceHistory:[] },
  { id:'00675L', name:'富邦臺灣加權正2', leverage:2, price:0, shares:0, auto:true, trend:defaultTrendParams(2), priceHistory:[] }
];
// trend/priceHistory 是巢狀物件,Object.assign 只會淺拷貝參照 —— 每個新 instrument
// 都要有自己獨立的 trend/priceHistory,不能共用同一份 DEFAULT_INSTRUMENTS 底下的物件,
// 不然改一個標的的均線參數會意外改到共用預設值,下次重置資料就跑掉。
const newInstruments = () => DEFAULT_INSTRUMENTS.map(x => Object.assign({ key: uid() }, JSON.parse(JSON.stringify(x))));

function emptyState(){
  return {
    version:2,
    assets:[], liabilities:[], trades:[], dailyHistory:[],
    instruments: newInstruments(),
    budgets: DEFAULT_CATEGORIES.map(n => ({ id:uid(), name:n, budget:0 })),   // 類別清單
    transactions:[], netWorthHistory:[],
    leverage: JSON.parse(JSON.stringify(DEFAULT_LEVERAGE))
  };
}

function normalize(raw){
  const s = emptyState();
  if (!raw || typeof raw !== 'object') return s;
  const arr = v => Array.isArray(v) ? v : [];
  s.assets = arr(raw.assets).map(a => ({ id:a.id||uid(), name:String(a.name||''), amount:num(a.amount) }));
  s.liabilities = arr(raw.liabilities).map(a => ({ id:a.id||uid(), name:String(a.name||''), amount:num(a.amount) }));
  // budgets 現在只當作記帳的類別清單(預算頁已移除,欄位保留以免舊資料的類別消失)
  if (Array.isArray(raw.budgets)) s.budgets = raw.budgets.map(b => ({ id:b.id||uid(), name:String(b.name||''), budget:num(b.budget) }));
  if (Array.isArray(raw.instruments) && raw.instruments.length){
    s.instruments = raw.instruments.map(x => {
      const leverage = x.leverage === undefined ? 1 : num(x.leverage);
      const def = defaultTrendParams(leverage);
      const t = x.trend && typeof x.trend === 'object' ? x.trend : {};
      return {
        key: String(x.key || '') || uid(),
        id: String(x.id || '').trim(),          // 代號可以先留空,不要亂數化
        name: String(x.name || ''),
        leverage,
        price: Math.max(0, num(x.price)),
        shares: Math.max(0, num(x.shares)),
        auto: x.auto !== false,
        trend: {
          maFast: Math.max(1, finiteNum(t.maFast, 0) || def.maFast),
          maSlow: Math.max(1, finiteNum(t.maSlow, 0) || def.maSlow),
          exitBuffer: finiteNum(t.exitBuffer, 0) > 0 ? finiteNum(t.exitBuffer, def.exitBuffer) : def.exitBuffer,
          recoverSlopeThreshold: finiteNum(t.recoverSlopeThreshold, 0) > 0 ? finiteNum(t.recoverSlopeThreshold, def.recoverSlopeThreshold) : def.recoverSlopeThreshold,
          recoverStrongRebound: finiteNum(t.recoverStrongRebound, 0) > 0 ? finiteNum(t.recoverStrongRebound, def.recoverStrongRebound) : def.recoverStrongRebound,
          pyramidGap: finiteNum(t.pyramidGap, 0) > 0 ? finiteNum(t.pyramidGap, def.pyramidGap) : def.pyramidGap,
          pyramidLevels: Math.max(1, Math.round(finiteNum(t.pyramidLevels, 0) || def.pyramidLevels)),
          lastSeenStatus: String(t.lastSeenStatus || ''),
          lastSeenDate: String(t.lastSeenDate || '')
        },
        priceHistory: (Array.isArray(x.priceHistory) ? x.priceHistory : [])
          .map(h => ({ d: String(h.d || '').slice(0, 10), c: Math.max(0, finiteNum(h.c, 0)) }))
          .filter(h => /^\d{4}-\d{2}-\d{2}$/.test(h.d) && h.c > 0 && Number.isFinite(h.c))
          .sort((a, b) => a.d < b.d ? -1 : (a.d > b.d ? 1 : 0))
          .filter((h, i, arr) => i === arr.length - 1 || h.d !== arr[i + 1].d)   // 同一天重複只留最後一筆
          .slice(-PRICE_HIST_KEEP)
      };
    });
  }
  s.trades = arr(raw.trades).map(t => ({
    id: t.id || uid(),
    date: String(t.date || todayISO()).slice(0, 10),
    symbol: String(t.symbol || '00631L'),
    action: ['sell', 'dividend'].includes(t.action) ? t.action : 'buy',
    shares: Math.max(0, num(t.shares)),
    price: Math.max(0, num(t.price)),
    amount: Math.max(0, num(t.amount)),      // 配息領到的金額
    fee: Math.max(0, num(t.fee)),
    source: t.source === 'loan' ? 'loan' : 'cash',
    note: String(t.note || '')
  }));
  s.transactions = arr(raw.transactions).map(t => ({
    id:t.id||uid(), date:String(t.date||todayISO()).slice(0,10),
    cat:String(t.cat||'其他'), desc:String(t.desc||''), amount:num(t.amount)
  }));
  s.dailyHistory = arr(raw.dailyHistory)
    .map(h => ({
      d: String(h.d || '').slice(0, 10),
      pv: num(h.pv), loan: num(h.loan), eq: num(h.eq),
      pnl: h.pnl === undefined || h.pnl === null ? null : num(h.pnl)
    }))
    .filter(h => /^\d{4}-\d{2}-\d{2}$/.test(h.d))
    .sort((a, b) => a.d < b.d ? -1 : 1);
  s.netWorthHistory = arr(raw.netWorthHistory)
    .map(h => ({
      id: h.id || uid(),
      m: String(h.m || '').slice(0, 7),
      v: num(h.v),
      pv: h.pv === undefined ? null : num(h.pv),      // 部位市值
      pnl: h.pnl === undefined ? null : num(h.pnl),   // 整體損益
      loan: h.loan === undefined ? null : num(h.loan),// 借款餘額
      auto: h.auto !== false                           // 手動改過的不再被自動覆蓋
    }))
    .filter(h => /^\d{4}-\d{2}$/.test(h.m));
  const L = raw.leverage && typeof raw.leverage === 'object' ? raw.leverage : {};
  const base = s.leverage;
  ['shares675L','price675L','shares631L','price631L','marketHigh','marketCurrent',
   'historicalHighValue','stressDeclinePct','creditLimit','annualRate'].forEach(k => {
    if (L[k] !== undefined) base[k] = Math.max(0, num(L[k]));   // 這些欄位沒有負值的意義
  });
  {
    const mapDraw = d => ({
      id: d.id,
      label: String(d.label || '動用記錄'),
      amount: Math.max(0, num(d.amount)),
      useDate: String(d.useDate || ''),
      note: String(d.note || ''),
      repayments: (Array.isArray(d.repayments) ? d.repayments : [])
        .map(x => ({ id: x.id || uid(), date: String(x.date || '').slice(0, 10), amount: Math.max(0, num(x.amount)) }))
    });
    if (Array.isArray(L.draws) && L.draws.length){
      base.draws = L.draws.map(d => mapDraw({ ...d, id: d.id || uid() }));
    } else {
      // 舊格式(tranches+core)搬過來:id 沿用舊 id,同一份舊資料重覆呼叫 normalize() 也會得到
      // 相同 id,避免存檔前 id 一直飄動。只搬「真的動用過」(有 useDate)的,從沒填過的預設
      // 空桶本來就沒帶任何使用者資料,遷移時直接捨棄。
      const legacy = [];
      if (Array.isArray(L.tranches)) legacy.push(...L.tranches.map((t, i) => ({ ...t, id: t.id || ('t' + (i+1)) })));
      if (L.core && typeof L.core === 'object') legacy.push({ ...L.core, id: 'core' });
      base.draws = legacy.filter(d => d.useDate).map(mapDraw);
    }
  }
  base.autoHigh = L.autoHigh !== false;       // 舊資料沒有這些欄位時給預設值
  base.autoInterest = L.autoInterest !== false;
  base.interestPosted = Array.isArray(L.interestPosted) ? L.interestPosted.map(String) : [];
  base.quoteDate = String(L.quoteDate || '');
  {
    // num() 把缺值/NaN 都收斂成 0,單獨用 finiteNum 沒辦法分辨「欄位不存在」跟「真的填了 0」——
    // 這裡的目標曝險是百分比,0 本來就不是有意義的設定值,乾脆兩種情況都當「沒填,用預設」處理,
    // 跟其他趨勢參數(exitBuffer 等)用 >0 判斷的既有寫法一致。
    const posNum = (v, fallback) => { const n = finiteNum(v, 0); return n > 0 ? n : fallback; };
    const ET = L.exposureTargets && typeof L.exposureTargets === 'object' ? L.exposureTargets : {};
    const defByLayer = DEFAULT_LEVERAGE.exposureTargets.byLayer;
    const byLayer = (Array.isArray(ET.byLayer) ? ET.byLayer : [])
      .map((v, i) => posNum(v, defByLayer[i] ?? defByLayer[defByLayer.length - 1]));
    base.exposureTargets = {
      byLayer: byLayer.length ? byLayer : defByLayer.slice(),
      hold: posNum(ET.hold, DEFAULT_LEVERAGE.exposureTargets.hold)
    };
  }
  // 舊版把兩檔的股數與股價放在 leverage 底下,搬進標的清單
  [['00631L', 'shares631L', 'price631L'], ['00675L', 'shares675L', 'price675L']].forEach(([id, sk, pk]) => {
    const it = s.instruments.find(x => x.id === id);
    if (!it) return;
    if (!it.shares && num(L[sk])) it.shares = num(L[sk]);
    if (!it.price && num(L[pk])) it.price = num(L[pk]);
  });
  return s;
}

/* 舊版(只有槓桿頁)的存檔搬過來 */
function fromLegacy(old){
  const s = emptyState();
  const L = s.leverage;
  ['shares675L','price675L','shares631L','price631L','marketHigh','marketCurrent',
   'historicalHighValue','stressDeclinePct'].forEach(k => { if (old[k] !== undefined) L[k] = num(old[k]); });
  const dates = old.trancheDates || {};
  Object.keys(dates).forEach((id, i) => {
    if (dates[id]) L.draws.push({ id: id || ('t' + (i+1)), label: '動用記錄', amount: 0, useDate: String(dates[id]), note: '', repayments: [] });
  });
  if (old.coreUseDate) L.draws.push({ id: 'core', label: '長期投資部位', amount: 0, useDate: String(old.coreUseDate), note: '', repayments: [] });
  return s;
}

let state = emptyState();

/* ===================== 存檔:雲端 + 本機備份 =====================
   兩種雲端來源,誰在就用誰:
     · Claude Artifact  → 平台內建的 db,開網址即同步
     · 網頁版           → Firebase Firestore,需用 Google 帳號登入
   兩者都沒有時就只存本機 localStorage,功能完全不受影響。      */
const STORAGE_NOTE = '資料存在這台裝置的瀏覽器裡,不會上傳到任何地方,也不需要登入。';
const DOC_PATH = 'state/finance';
const LEGACY_DOC_PATH = 'state/leverage';
const STORAGE_KEY = 'financeAppState_v2';
const LEGACY_KEY = 'financeAppLeverageData_v1';

let storageMode = 'local';   // 'cloud' | 'local' | 'none'
let cloud = null;            // { get, set, onChange } — 已連上的雲端
let cloudKind = 'none';      // 'claude' | 'firebase' | 'none'
let authUser = null;         // Firebase 已登入的帳號
let authBusy = false;
let downloadsNs = null;
let lastPushed = '';
let pendingRemote = null;
let saveTimer = null;

function readLocal(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
    const legacy = localStorage.getItem(LEGACY_KEY);
    if (legacy) return fromLegacy(JSON.parse(legacy));
    return null;
  }catch(e){ return null; }
}
function writeLocal(data){
  const json = JSON.stringify(data);
  try{
    localStorage.setItem(STORAGE_KEY, json);
    return true;
  }catch(e){
    // 空間不夠時先犧牲最舊的本機備份,主資料一定要存得進去
    try{
      const keys = [];
      for (let i = 0; i < localStorage.length; i++){
        const k = localStorage.key(i);
        if (k && k.indexOf(BACKUP_PREFIX) === 0) keys.push(k);
      }
      keys.sort();
      while (keys.length){
        localStorage.removeItem(keys.shift());
        try{ localStorage.setItem(STORAGE_KEY, json); return true; }catch(e2){ /* 再砍一份 */ }
      }
    }catch(e3){ /* 連清都清不了 */ }
    return false;
  }
}
function scheduleSave(){
  clearPosMemo();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 400);
}
async function save(){
  const data = JSON.parse(JSON.stringify(state));
  const ok = writeLocal(data);
  if (cloud){
    try{
      lastPushed = canon(data);
      await cloud.set(data);
      storageMode = 'cloud';
      updateStorageStatus();
      return;
    }catch(e){ /* 雲端寫入失敗就靠本機,下次編輯會再試 */ }
  }
  storageMode = ok ? 'local' : 'none';
  updateStorageStatus();
}
/* 本機空間用了多少(粗估,UTF-16 一個字兩個位元組) */
function localUsageRatio(){
  try{
    let chars = 0;
    for (let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      chars += k.length + (localStorage.getItem(k) || '').length;
    }
    return chars * 2 / (5 * 1024 * 1024);
  }catch(e){ return 0; }
}

function updateStorageStatus(){
  const el = document.getElementById('storageStatus');
  if (!el) return;
  if (storageMode === 'cloud'){
    el.textContent = cloudKind === 'firebase' && authUser
      ? '☁️ 已同步到 ' + authUser.email + ' — 其他裝置登入同一帳號就看得到'
      : '☁️ 已存到雲端 — 手機、電腦開同一個網址都看得到';
  }else if (storageMode === 'local'){
    el.textContent = cloudKind === 'firebase'
      ? '💾 只存在這台裝置 — 登入 Google 帳號即可同步到其他裝置'
      : '💾 只存在這台裝置的瀏覽器 — 換裝置或清資料會消失';
  }else{

/* 收到雲端資料:正在打字就先擱著,等游標離開欄位再套用 */
function onRemote(data){
  if (!data || !looksLikeState(data)) return;   // 壞掉的雲端資料不要拿來蓋本機
  if (canon(data) === lastPushed) return;
  if (document.activeElement && document.activeElement.tagName === 'INPUT'){
    pendingRemote = data;
    return;
  }
  applyRemote(data);
}
function applyRemote(data){
  clearPosMemo();
  state = normalize(data);
  lastPushed = canon(JSON.parse(JSON.stringify(state)));
  writeLocal(state);
  renderAll();
}

/* 第一次連上雲端:雲端有資料就拉下來,沒有就把本機的推上去 */
async function syncFirstTime(){
  try{
    const remote = await cloud.get();
    storageMode = 'cloud';
    if (remote && !looksLikeState(remote)){
      await save();                              // 雲端那份不像本 app 的資料,用本機的覆蓋回去
    }else if (remote){
      applyRemote(remote);
    }else{
      await save();
    }
    cloud.onChange(onRemote);
    updateStorageStatus();
    maybeDailySnapshot();
    if (maybePostInterest() || maybeSnapshot()) renderAll();
    maybeBackup();
  }catch(e){
    cloud = null;
    storageMode = 'local';
    updateStorageStatus();
  }
}

async function connectCloud(){
  // 1) Claude Artifact:平台內建的資料庫
  if (window.claude && typeof window.claude.use === 'function'){
    try{
      const db = await window.claude.use('db');
      if (db){
        const ref = db.doc(DOC_PATH);
        cloudKind = 'claude';
        cloud = {
          get: async () => {
            const snap = await ref.get();
            if (snap.exists) return snap.data();
            // 第一次上雲時,把舊版只有槓桿頁的存檔帶過來
            if (!readLocal()){
              try{
                const old = await db.doc(LEGACY_DOC_PATH).get();
                if (old.exists) return fromLegacy(old.data());
              }catch(e){ /* 沒有舊資料 */ }
            }
            return null;
          },
          set: d => ref.set(d),
          onChange: cb => ref.onSnapshot(s => { if (s.exists) cb(s.data()); }, () => {}),
          backups: {
            list: async () => {
              const snap = await db.collection('backups').get();
              return snap.docs.map(d => d.id).sort().reverse();
            },
            get: async id => {
              const s2 = await db.doc('backups/' + id).get();
              return s2.exists ? s2.data() : null;
            },
            put: (id, data) => db.doc('backups/' + id).set(data),
            del: id => db.doc('backups/' + id).delete()
          }
        };
        await syncFirstTime();
        return;
      }
    }catch(e){ /* 不是在 Artifact 裡,往下試 Firebase */ }
  }

  // 2) 網頁版:Firebase,登入後才有雲端
  if (window.FinanceCloud){
    try{
      const fb = await window.FinanceCloud.ready;
      if (!fb) return;               // 還沒設定 Firebase,維持本機模式
      cloudKind = 'firebase';
      updateStorageStatus();
      fb.onAuth(user => {
        authUser = user;
        authBusy = false;
        if (user){
          cloud = fb.docApi();
          syncFirstTime();
        }else{
          cloud = null;
          storageMode = 'local';
          updateStorageStatus();
        }
        renderAll();
      });
    }catch(e){ /* 載入失敗:維持本機模式 */ }
  }
}

/* ===================== 每日備份 =====================
   雲端可用時存在雲端的 backups 集合,否則存本機。每天一份,保留 30 天。 */
const BACKUP_KEEP = 30;        // 雲端
const LOCAL_BACKUP_KEEP = 7;   // 本機 localStorage 只有幾 MB,備份不能佔太多
const BACKUP_PREFIX = 'financeBackup_';
const BACKUP_TS_KEY = 'financeLastBackup';

let levTab = 'overview';      // 槓桿頁的小分頁
let repayDraft = { target:'', date: todayISO(), amount:'' };
let repayError = '';
let chartRange = 90;          // 每日走勢圖顯示最近幾個交易日,0 = 全部
let backupOpen = false;
let backupList = null;     // null = 還沒讀 / 讀取中

function localBackupApi(){
  return {
    list: async () => {
      const ids = [];
      for (let i = 0; i < localStorage.length; i++){
        const k = localStorage.key(i);
        if (k && k.startsWith(BACKUP_PREFIX)) ids.push(k.slice(BACKUP_PREFIX.length));
      }
      return ids.sort().reverse();
    },
    get: async id => {
      const raw = localStorage.getItem(BACKUP_PREFIX + id);
      return raw ? JSON.parse(raw) : null;
    },
    put: async (id, data) => localStorage.setItem(BACKUP_PREFIX + id, JSON.stringify(data)),
    del: async id => localStorage.removeItem(BACKUP_PREFIX + id)
  };
}
function backupApi(){
  return (cloud && cloud.backups) ? cloud.backups : localBackupApi();
}
async function maybeBackup(){
  const today = todayISO();
  try{ if (localStorage.getItem(BACKUP_TS_KEY) === today) return; }catch(e){}
  const api = backupApi();
  try{
    // 本機空間有限,資料越大留越少份,免得把主資料的位子吃掉
    const sizeKB = JSON.stringify(state).length / 1024;
    const keep = (cloud && cloud.backups) ? BACKUP_KEEP
               : (sizeKB > 300 ? 3 : sizeKB > 150 ? 5 : LOCAL_BACKUP_KEEP);
    // 先清舊的再寫新的,免得寫的當下就把空間塞爆
    const before = await api.list();
    for (const id of before.slice(Math.max(0, keep - 1))) await api.del(id);
    await api.put(today, JSON.parse(JSON.stringify(state)));
    try{ localStorage.setItem(BACKUP_TS_KEY, today); }catch(e){}
  }catch(e){ /* 備份失敗不影響使用 */ }
}
async function loadBackups(){

  renderAll();

/* ===================== 衍生計算 ===================== */
const sum = (list, f) => list.reduce((s, x) => s + f(x), 0);
const totalAssets = () => sum(state.assets, a => a.amount);
const totalLiab = () => sum(state.liabilities, l => l.amount);
const netWorth = () => totalAssets() - totalLiab();
const txOfMonth = m => state.transactions.filter(t => t.date.slice(0,7) === m);
function monthFlow(m){
  const tx = txOfMonth(m);
  const income = sum(tx.filter(t => t.amount > 0), t => t.amount);
  const expense = sum(tx.filter(t => t.amount < 0), t => -t.amount);
  return { income, expense, balance: income - expense };
}
function spentByCat(m){
  const map = {};
  txOfMonth(m).filter(t => t.amount < 0).forEach(t => { map[t.cat] = (map[t.cat] || 0) + (-t.amount); });
  return map;
}
/* 預設類別排前面,再接上交易紀錄裡用過的 */
function knownCats(){
  const list = [];
  const seen = new Set();
  const add = c => { const v = String(c || '').trim(); if (v && !seen.has(v)){ seen.add(v); list.push(v); } };
  state.budgets.forEach(b => add(b.name));
  state.transactions.forEach(t => add(t.cat));
  if (!list.length) add('其他');
  return list;
}

/* ===================== 證交所報價 =====================
   資料來源:臺灣證券交易所公開資訊,取的是「最近一個交易日收盤價」,
   不是即時報價。Artifact 版的 CSP 擋外部請求,該版本不提供這個功能。 */
const QUOTES_ENABLED = true;
const TWSE_STOCK = 'https://www.twse.com.tw/exchangeReport/STOCK_DAY?response=json&stockNo=';
const TWSE_INDEX = 'https://www.twse.com.tw/indicesReport/MI_5MINS_HIST?response=json';
const QUOTE_TS_KEY = 'financeQuoteFetchedAt';

let quoteBusy = false;
let quoteMsg = '';
let levMsg = '';      // 持股與報價卡的提示
let backfillBusy = false;
let backfillMsg = '';

const sleep = ms => new Promise(r => setTimeout(r, ms));
const cleanNum = v => num(String(v).replace(/,/g, ''));
function rocToISO(s){                       // '115/09/04' → '2026-09-04'
  const p = String(s).split('/');
  return p.length === 3 ? (Number(p[0]) + 1911) + '-' + p[1] + '-' + p[2] : '';
}
function monthParam(offset){
  const d = new Date();
  d.setDate(1);
  d.setMonth(d.getMonth() + offset);
  return d.getFullYear() + pad2(d.getMonth() + 1) + '01';
}
async function twseRows(url){
  // 月初當月可能還沒有資料,退回上個月再試一次
  for (const m of [monthParam(0), monthParam(-1)]){
    try{
      const res = await fetch(url + '&date=' + m);
      if (!res.ok) continue;
      const j = await res.json();
      if (j.stat === 'OK' && Array.isArray(j.data) && j.data.length) return j.data;
    }catch(e){ /* 換下一個月 */ }
  }
  return null;
}
/* 把 TWSE STOCK_DAY 一個月的資料列併入某標的的歷史收盤價:
   日期去重(同一天多次抓到,後寫入的蓋掉前面的)、依日期排序、裁切到 PRICE_HIST_KEEP。
   回補(backfillHistory)跟每次抓報價(fetchQuotes)都呼叫這個,不重複寫合併邏輯。 */
/* 證交所 STOCK_DAY 給的是原始收盤價,沒有還原分割/反分割。正2 ETF 漲多了常會
   分割降低單位淨值(00631L 就在 2026-03 分割過,一天內從 443 掉到 19,比例 0.0435)。
   2 倍槓桿在最誇張的單日崩盤大概也不會腰斬到剩 4 成,所以拿「單日變動超過 40%」
   當門檻夠安全,不會誤判成真的行情;抓到就把斷點之前的價格全部按同一個比例換算,
   接成連續序列,不然均線會被這種假斷崖整個帶歪。 */
function adjustForSplits(rows){
  for (let i = 1; i < rows.length; i++){
    const ratio = rows[i - 1].c > 0 ? rows[i].c / rows[i - 1].c : 1;
    if (ratio > 0 && (ratio < 0.6 || ratio > 1.6)){
      for (let j = 0; j < i; j++) rows[j].c = Math.round(rows[j].c * ratio * 10000) / 10000;
    }
  }
  return rows;
}
function mergeHistory(hist, rows){
  const byDate = new Map((hist || []).map(h => [h.d, h.c]));
  (rows || []).forEach(row => {
    const d = rocToISO(row[0]);
    if (d) byDate.set(d, cleanNum(row[6]));
  });
  const merged = [...byDate.entries()]
    .map(([d, c]) => ({ d, c }))
    .filter(h => /^\d{4}-\d{2}-\d{2}$/.test(h.d) && h.c > 0)
    .sort((a, b) => a.d < b.d ? -1 : (a.d > b.d ? 1 : 0));
  return adjustForSplits(merged).slice(-PRICE_HIST_KEEP);
}
async function fetchQuotes(manual){
  if (!QUOTES_ENABLED || quoteBusy) return;
  quoteBusy = true;
  quoteMsg = '更新報價中…';
  if (manual) renderAll();
  try{
    const targets = state.instruments.filter(it => it.auto && /^[0-9A-Za-z]{3,8}$/.test(it.id));
    const results = await Promise.all([
      ...targets.map(it => twseRows(TWSE_STOCK + encodeURIComponent(it.id))),
      twseRows(TWSE_INDEX)
    ]);
    const idxRows = results[results.length - 1];
    let date = '', got = 0, missed = [];
    targets.forEach((it, i) => {
      const rows = results[i];
      if (rows && rows.length){
        const row = rows[rows.length - 1];
        it.price = cleanNum(row[6]);      // 收盤價
        it.priceHistory = mergeHistory(it.priceHistory, rows);   // 順便把整月資料併進歷史,累積均線用的資料
        date = rocToISO(row[0]) || date;
        got++;
      }else{
        missed.push(it.id);
      }
    });
    if (idxRows && idxRows.length){
      // 大盤點位本身現在沒有任何 UI 在用(舊的跌幅觸發判斷已經拿掉),
      // 抓這組資料純粹是為了在個股都查不到時還有日期可以定錨。
      const row = idxRows[idxRows.length - 1];

    }
    if (got || (idxRows && idxRows.length)){
      if (date) state.leverage.quoteDate = date;
      maybeDailySnapshot();          // 按更新報價就留下今天這一筆
      quoteMsg = missed.length ? '查不到:' + missed.join('、') + '(代號是否正確?)' : '';
      try{ localStorage.setItem(QUOTE_TS_KEY, String(Date.now())); }catch(e){}

}
function maybeAutoQuote(){

/* 回補約 14 個月(涵蓋 240 日均線)的歷史收盤價,給趨勢訊號用。
   刻意逐月「依序」抓、每次間隔一下,不要 Promise.all 對證交所同時發一串請求。
   單一月份抓失敗就跳過繼續,不中止整個回補;最後回報哪些標的/月份沒抓到。 */
const BACKFILL_MONTHS = 14;
async function backfillHistory(){
  if (!QUOTES_ENABLED || backfillBusy) return;
  backfillBusy = true;
  // 只記 key/id,不要抓著 instrument 物件參照不放——回補一輪要跑十幾秒到幾十秒,
  // 這段時間如果雲端同步收到遠端更新,applyRemote() 會把整個 state.instruments 換掉,
  // 抓著舊物件參照的話,後面寫入的都是沒人在用的孤兒物件,畫面看起來跑完了但其實沒真的存進去。
  // 每次要寫入前都用 key 重新查一次「現在活著」的物件,才不會被雲端同步蓋掉。
  const targets = state.instruments.filter(it => it.auto && /^[0-9A-Za-z]{3,8}$/.test(it.id))
    .map(it => ({ key: it.key, id: it.id }));
  const incomplete = [];
  for (const target of targets){
    backfillMsg = `回補中…${target.id}`;
    renderAll();
    let monthsOk = 0;
    for (let offset = 0; offset > -BACKFILL_MONTHS; offset--){
      try{
        const m = monthParam(offset);
        const res = await fetch(TWSE_STOCK + encodeURIComponent(target.id) + '&date=' + m);
        if (res.ok){
          const j = await res.json();
          if (j.stat === 'OK' && Array.isArray(j.data) && j.data.length){
            const live = findInstrumentByKey(target.key);
            if (live) live.priceHistory = mergeHistory(live.priceHistory, j.data);
            monthsOk++;
          }
        }
      }catch(e){ /* 這個月抓不到就跳過,繼續抓下一個月 */ }
      await sleep(300);
    }
    if (monthsOk < BACKFILL_MONTHS) incomplete.push(target.id + '(' + monthsOk + '/' + BACKFILL_MONTHS + ' 個月)');
    scheduleSave();   // 抓完一檔就存一次,不要等全部做完才存,縮短被雲端同步蓋掉的時間窗
  }
  backfillMsg = incomplete.length ? '部分月份沒抓到:' + incomplete.join('、') : '回補完成';
  backfillBusy = false;
  renderAll();
}

/* ===================== 部位損益 =====================
   買賣紀錄用加權平均成本法。整體損益要扣掉借款的累積利息,
   否則槓桿部位看起來永遠比實際好。 */
const findInstrument = id => state.instruments.find(x => x.id === id);
const findInstrumentByKey = k => state.instruments.find(x => x.key === k);
const symbolName = id => (findInstrument(id) || {}).name || id;
function symbolPrice(sym){
  const it = findInstrument(sym);
  return it ? it.price : 0;
}
/* 槓桿倍數:正2 填 2,一般股票 1,反1 填 -1。用來算實質市場曝險。 */
function symbolLeverage(sym){
  const it = findInstrument(sym);
  return it && it.leverage !== 0 ? it.leverage : 1;
}
const hasTrades = () => state.trades.length > 0;
function heldShares(sym){
  let n = 0;
  state.trades.forEach(t => {
    if (t.symbol !== sym || t.action === 'dividend') return;
    n += (t.action === 'sell' ? -t.shares : t.shares);
  });
  return Math.max(0, n);
}
/* 手續費 0.1425%(最低 20 元),賣出另加 0.1% 證交稅 */
function defaultFee(action, gross){
  if (!(gross > 0)) return 0;
  const broker = Math.max(20, gross * 0.001425);
  return Math.round(action === 'sell' ? broker + gross * 0.001 : broker);
}
/* 一筆借款從動用日到今天,依「實際餘額」分段累積。
   還款之後只對剩下的餘額繼續算。 */
function accrue(item, annualPct){
  if (!item.useDate) return 0;
  const today = todayISO();
  const events = effectiveRepayments(item);
  let balance = item.amount;
  let cursor = item.useDate;
  let total = 0;
  events.forEach(r => {
    if (r.date > cursor){
      total += balance * (annualPct / 100) * (daysBetweenISO(cursor, r.date) / 365.25);
      cursor = r.date;
    }
    balance = Math.max(0, balance - r.amount);
  });
  total += balance * (annualPct / 100) * (daysBetweenISO(cursor, today) / 365.25);
  return total;
}
/* 只認動用日之後、今天以前的還款 —— 未來日期的還款不能讓餘額先歸零,
   否則餘額和利息會對不起來 */
function effectiveRepayments(item){
  if (!item || !item.useDate) return [];
  const today = todayISO();
  return (item.repayments || [])
    .filter(r => r.date && r.date >= item.useDate && r.date <= today)
    .sort((a, b) => a.date < b.date ? -1 : 1);
}
const repaidOf = item => Math.min(item.amount, sum(effectiveRepayments(item), r => r.amount));
function outstanding(item){
  if (!item.useDate) return 0;
  return Math.max(0, item.amount - repaidOf(item));
}

/* 已動用的房貸,從動用日算到今天的累積利息 */
function accruedInterest(){
  const L = state.leverage;
  return sum(L.draws, t => accrue(t, L.annualRate));
}
/* 某一天當下,這筆借款還欠多少 */
function balanceAt(item, dateISO){
  if (!item || !item.useDate || dateISO < item.useDate) return 0;
  const repaid = sum((item.repayments || [])
    .filter(r => r.date && r.date >= item.useDate && r.date <= dateISO), r => r.amount);
  return Math.max(0, item.amount - repaid);
}
function monthEndISO(m){
  const y = Number(m.slice(0, 4)), mo = Number(m.slice(5, 7));
  const d = new Date(y, mo, 0);          // 該月最後一天
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

/* 以「自己的錢」為視角的現金流,拿來算 XIRR:
     自有資金買進 → 流出        房貸買進 → 0(錢是銀行出的)
     賣出、配息   → 流入        還款、利息 → 流出
     最後加上今天結清的價值:市值 − 借款餘額 */
function cashFlows(){
  const L = state.leverage;
  const today = todayISO();
  const flows = [];
  const add = (date, amount) => { if (date && amount) flows.push({ date, amount }); };

  state.trades.forEach(t => {
    if (t.action === 'dividend') add(t.date, t.amount - t.fee);
    else if (t.action === 'sell') add(t.date, t.shares * t.price - t.fee);
    else if (t.source !== 'loan') add(t.date, -(t.shares * t.price + t.fee));
  });

  const loans = L.draws;
  loans.forEach(item => {
    if (!item.useDate) return;
    (item.repayments || []).forEach(r => {
      if (r.date && r.date >= item.useDate && r.date <= today) add(r.date, -r.amount);
    });
    // 利息按月流出,以當月底的餘額計算
    let cursor = item.useDate.slice(0, 7);
    for (let guard = 0; cursor <= thisMonth() && guard < 600; guard++){
      const end = monthEndISO(cursor);
      const bal = balanceAt(item, end > today ? today : end);
      add(end > today ? today : end, -(bal * (L.annualRate / 100) / 12));
      cursor = shiftMonth(cursor, 1);
    }
  });

  const p = positionValueNow();
  const owed = sum(loans, item => balanceAt(item, today));
  add(today, p - owed);                  // 今天結清可以拿回的錢
  return flows.sort((a, b) => a.date < b.date ? -1 : 1);
}
function positionValueNow(){
  const seen = new Set();
  let v = 0;
  state.instruments.forEach(it => {
    if (it.id && seen.has(it.id)) return;   // 代號重複只算一次
    if (it.id) seen.add(it.id);
    const shares = hasTrades() ? heldShares(it.id) : it.shares;
    v += shares * it.price;
  });
  return v;
}

/* XIRR:用二分法解 NPV = 0,比牛頓法慢但不會發散 */
function xirr(flows){
  if (!flows || flows.length < 2) return null;
  if (!flows.some(f => f.amount > 0) || !flows.some(f => f.amount < 0)) return null;
  const t0 = new Date(flows[0].date + 'T00:00:00').getTime();
  const yearsOf = f => (new Date(f.date + 'T00:00:00').getTime() - t0) / (365.25 * 86400000);
  const npv = r => flows.reduce((acc, f) => acc + f.amount / Math.pow(1 + r, yearsOf(f)), 0);
  let lo = -0.999999, hi = 10;   // 幾乎全賠時答案會逼近 −100%,下界要夠低
  let flo = npv(lo), fhi = npv(hi);
  if (!isFinite(flo) || !isFinite(fhi) || flo * fhi > 0) return null;
  for (let i = 0; i < 200; i++){
    const mid = (lo + hi) / 2;
    const fm = npv(mid);
    if (!isFinite(fm)) return null;
    if (Math.abs(fm) < 1e-6) return mid;
    if (flo * fm < 0){ hi = mid; fhi = fm; } else { lo = mid; flo = fm; }
  }
  return (lo + hi) / 2;
}

/* 一次重畫會呼叫 computePosition 三到四次(損益卡、曝險、買賣紀錄、壓力測試),
   每次都要跑一遍 XIRR 的二分法。資料多了以後很有感,所以記住上一次的結果,
   任何會改到狀態的動作都會清掉。 */
let posMemo = null, posMemoKey = '';
const clearPosMemo = () => { posMemo = null; };

/* 只要影響損益的東西有變,簽章就會變 —— 不必仰賴每個呼叫端記得清快取 */
function posSignature(){
  const L = state.leverage;
  // 任何一項是 undefined/NaN 都會讓整個簽章變成 NaN,兩組不同的資料就會被當成一樣
  const n = v => (typeof v === 'number' && isFinite(v)) ? v : 0;
  const dc = (str, i) => { const c = String(str || '').charCodeAt(i); return isFinite(c) ? c : 0; };
  let h = state.trades.length * 31;
  state.trades.forEach(t => {
    h += n(t.shares) + n(t.price) * 7 + n(t.fee) + n(t.amount)
       + (t.action === 'sell' ? 1 : t.action === 'dividend' ? 2 : 3)
       + (t.source === 'loan' ? 11 : 0) + dc(t.date, 8) + dc(t.date, 9) + String(t.symbol || '').length;
  });
  state.instruments.forEach(it => {
    h += n(it.price) * 13 + n(it.shares) + n(it.leverage) + String(it.id || '').length;
  });
  L.draws.forEach(t => {
    h += n(t.amount) / 7 + (t.useDate ? dc(t.useDate, 9) + String(t.useDate).length : 0);
    (t.repayments || []).forEach(r => { h += n(r.amount) / 3 + dc(r.date, 9); });
  });
  if (!isFinite(h)) return 'nocache:' + Math.random();   // 保險:算不出簽章就不要用快取
  return h + '|' + n(L.annualRate) + '|' + state.trades.length + '|' + todayISO();
}

function computePosition(){
  const key = posSignature();
  if (posMemo && posMemoKey === key) return posMemo;
  posMemo = computePositionUncached();
  posMemoKey = key;
  return posMemo;
}

function computePositionUncached(){
  const lots = {};
  let buyCash = 0, buyLoan = 0, sellNet = 0, realized = 0, fees = 0, dividends = 0, oversold = false;
  const sorted = state.trades.slice().sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  sorted.forEach(t => {
    const lot = lots[t.symbol] || (lots[t.symbol] = { shares:0, cost:0 });
    const gross = t.shares * t.price;
    fees += t.fee;
    if (t.action === 'dividend'){
      // 配息當成已實現收益,不動持股成本
      realized += t.amount - t.fee;
      dividends += t.amount - t.fee;
    }else if (t.action === 'sell'){
      const avg = lot.shares > 0 ? lot.cost / lot.shares : 0;
      const qty = Math.min(t.shares, lot.shares);      // 賣超過持有的部分不計,否則會憑空變成獲利
      if (qty < t.shares) oversold = true;
      const soldGross = qty * t.price;
      const costOut = avg * qty;
      realized += (soldGross - t.fee) - costOut;
      sellNet += soldGross - t.fee;
      lot.shares -= qty;
      lot.cost -= costOut;
    }else{
      lot.shares += t.shares;
      lot.cost += gross + t.fee;
      if (t.source === 'loan') buyLoan += gross + t.fee; else buyCash += gross + t.fee;
    }
  });
  let marketValue = 0, remainCost = 0;
  Object.keys(lots).forEach(sym => {
    marketValue += lots[sym].shares * symbolPrice(sym);
    remainCost += lots[sym].cost;
  });
  const unrealized = marketValue - remainCost;
  const interest = accruedInterest();
  const total = unrealized + realized - interest;
  const invested = buyCash + buyLoan;
  // 賣出所得與配息是拿回來的錢,要從「還放在裡面的自有資金」扣掉
  const netCash = buyCash - sellNet - dividends;
  const years = sorted.length ? Math.max(daysSince(sorted[0].date) / 365.25, 0) : 0;
  const rate = xirr(cashFlows());
  return {
    lots, buyCash, buyLoan, invested, netCash, sellNet, realized, dividends, unrealized, interest, total, oversold,
    xirr: rate === null ? null : rate * 100,
    marketValue, remainCost, fees, years,
    hasData: sorted.length > 0,
    returnOnCash: buyCash > 0 ? total / buyCash * 100 : 0,
    returnOnAll: invested > 0 ? total / invested * 100 : 0
  };
}

/* ===================== 曝險與風險 =====================
   00631L / 00675L 是正2 ETF,本身就有 2 倍槓桿;
   再用房貸借錢買,實際市場曝險是「部位市值 × 2」。 */
function computeRisk(){
  const p = computePosition();
  const r = computeLeverage();
  const pv = p.hasData ? p.marketValue : r.totalValue;
  const loan = r.usedAmount;
  const equity = pv - loan;
  const nw = netWorth();
  // 實質曝險:每檔各自乘上自己的槓桿倍數(正2 = 2,一般股票 = 1)
  const exposure = sum(r.holdings, h => h.value * (h.leverage || 1));
  // 分母 = 自己的錢 + 房貸總額度。用部位淨值而非部位市值,
  // 否則已動用的部分會同時被算進部位與額度裡,比例失真偏樂觀。
  const capacity = equity + state.leverage.creditLimit;
  return {
    pv, loan, equity, nw, exposure, capacity,
    creditLimit: state.leverage.creditLimit,
    invested: p.invested, pnl: p.total, hasTrades: p.hasData,
    leverage: equity > 0 ? pv / equity : 0,
    exposureRatio: capacity > 0 ? exposure / capacity * 100 : 0,
    monthlyInterest: r.monthlyInterest
  };
}

/* 每月快照:第一次開啟該月時自動記一筆,之後每次開啟更新到最新。
   使用者手動改過的那一筆(auto:false)不會被覆蓋。 */
function maybeSnapshot(){
  const p = computePosition();
  const r = computeLeverage();
  const nw = netWorth();
  if (!nw && !p.hasData && !r.totalValue) return false;
  const m = thisMonth();
  const found = state.netWorthHistory.find(h => h.m === m);
  if (found && !found.auto) return false;
  const snap = {
    v: Math.round(nw),
    pv: Math.round(p.hasData ? p.marketValue : r.totalValue),
    pnl: p.hasData ? Math.round(p.total) : null,
    loan: Math.round(r.usedAmount),
    auto: true
  };
  if (found){
    if (found.v === snap.v && found.pv === snap.pv && found.pnl === snap.pnl && found.loan === snap.loan) return false;
    Object.assign(found, snap);
  }else{
    state.netWorthHistory.push(Object.assign({ id: uid(), m }, snap));
  }
  scheduleSave();
  return true;
}

/* 壓力測試:大盤跌 d% 時,各標的照自己的槓桿倍數換算 */
function computeStress(d){
  const decline = num(d);
  const k = computeRisk();
  const r = computeLeverage();
  const L = state.leverage;
  if (!(k.pv > 0) || !decline) return null;

  let newPv = 0;
  r.holdings.forEach(h => {
    const shares = hasTrades() ? heldShares(h.id) : h.shares;
    const drop = decline * (h.leverage || 1) / 100;
    newPv += shares * h.price * Math.max(0, 1 - drop);
  });
  const loss = k.pv - newPv;
  const newEquity = newPv - k.loan;
  const newExposure = (() => {
    let e = 0;
    r.holdings.forEach(h => {
      const shares = hasTrades() ? heldShares(h.id) : h.shares;
      const drop = decline * (h.leverage || 1) / 100;
      e += shares * h.price * Math.max(0, 1 - drop) * (h.leverage || 1);
    });
    return e;
  })();
  const newCapacity = newEquity + L.creditLimit;

  return {
    decline, pv: k.pv, newPv, loss, equity: k.equity, newEquity,
    ratio: k.exposureRatio, newRatio: newCapacity > 0 ? newExposure / newCapacity * 100 : 0
  };
}

/* 每日快照:每天第一次開啟(或按更新報價)記一筆,同一天會更新到最新。
   保留最近 1000 個交易日,約四年;更久以前看每月快照。 */
const DAILY_KEEP = 1000;
function maybeDailySnapshot(){
  const p = computePosition();
  const r = computeLeverage();
  const pv = p.hasData ? p.marketValue : r.totalValue;
  if (!pv && !r.usedAmount) return false;
  const today = todayISO();
  const rec = {
    d: today,
    pv: Math.round(pv),
    loan: Math.round(r.usedAmount),
    eq: Math.round(r.equityValue),
    pnl: p.hasData ? Math.round(p.total) : null
  };
  const list = state.dailyHistory;
  const last = list.length ? list[list.length - 1] : null;
  if (last && last.d === today){
    if (last.pv === rec.pv && last.loan === rec.loan && last.eq === rec.eq && last.pnl === rec.pnl) return false;
    Object.assign(last, rec);
  }else{
    list.push(rec);
    if (list.length > DAILY_KEEP) state.dailyHistory = list.slice(-DAILY_KEEP);
  }
  scheduleSave();
  return true;
}
function dailySlice(){
  const list = state.dailyHistory.slice().sort((a, b) => a.d < b.d ? -1 : 1);
  return chartRange > 0 ? list.slice(-chartRange) : list;
}
const dayLabel = d => Number(d.slice(5, 7)) + '/' + Number(d.slice(8, 10));

/* 把快照補成連續的月份 —— 中間沒開過 app 的月份留空,
   否則兩點之間的間隔會被畫成一樣寬,斜率就騙人了 */
function monthlyHistory(maxMonths){
  const hist = state.netWorthHistory.slice().sort((a, b) => a.m < b.m ? -1 : 1);
  if (!hist.length) return [];
  const byMonth = {};
  hist.forEach(h => { byMonth[h.m] = h; });
  const last = hist[hist.length - 1].m > thisMonth() ? hist[hist.length - 1].m : thisMonth();
  const months = [];
  let cursor = hist[0].m;
  for (let guard = 0; cursor <= last && guard < 600; guard++){
    months.push(cursor);
    cursor = shiftMonth(cursor, 1);
  }
  return months.slice(-maxMonths).map(m => byMonth[m] || { m, v:null, pv:null, pnl:null, loan:null });
}

  else if (currentTab === 'assets') c.innerHTML = renderAssets();
  else if (currentTab === 'ledger') c.innerHTML = renderLedger();
  else if (currentTab === 'help') c.innerHTML = renderHelp();
  else c.innerHTML = renderLeverage();
  updateStorageStatus();
}
function switchTab(tab){
  currentTab = tab;
  editingTx = null;
  editingTrade = null;
  tradeError = '';
  repayError = '';
  pendingConfirm = null;
  draftError = '';

}

/* ===================== 說明 =====================
   把不直覺的算法寫給使用者看,免得過幾個月自己也忘了數字是怎麼來的。 */
function renderHelp(){
  return `
    <div class="sect">這個 app 在算什麼</div>
    <div class="card doc">
      <p>四件事:<strong>記錄</strong>每一筆收支與買賣、<strong>算出</strong>你的損益與曝險、
      <strong>提醒</strong>什麼時候該加碼或減碼、<strong>保存</strong>資料不會不見。</p>
      <p>所有數字都是你自己填的,app 只負責算。唯一會自己去外面抓的是股票收盤價。</p>
    </div>

    <div class="sect">損益怎麼算</div>
    <div class="card doc">
      <h4>成本用加權平均</h4>
      <p>每次買進把金額與手續費加進總成本,賣出時按<em>當下的平均成本</em>扣掉對應的部分。
      這跟台灣券商對帳單的算法一致。</p>
      <div class="formula">未實現損益 = 目前市值 − 剩餘持股成本
已實現損益 = 賣出淨額 − 賣出部分的平均成本
配息      = 計入已實現損益,不動持股成本與股數
整體損益  = 未實現 + 已實現 − 累積借款利息</div>
      <h4>為什麼一定要扣利息</h4>
      <p>借錢買股,利息每天都在跑。不扣的話,槓桿部位看起來會永遠比實際好看。
      利息從每一筆動用記錄的動用日算到今天,而且是<strong>依實際餘額分段計算</strong> ——
      你記了還款之後,只對剩下的部分繼續算。</p>
      <h4>手續費</h4>
      <p>留空的話自動用 0.1425%(最低 20 元)估算,賣出再加 0.1% 證交稅。填了就用你填的。</p>
    </div>

    <div class="sect">報酬率</div>
    <div class="card doc">
      <h4>年化報酬用 XIRR</h4>
      <p>你是不定期加碼的 —— 有時薪水、有時獎金、有時借房貸。如果用「總報酬率 ÷ 年數」,
      上個月才投入的錢會被當成放了兩年,數字沒有意義。</p>
      <p>XIRR 把每一筆進出<strong>按實際日期折現</strong>:</p>
      <div class="formula">自有資金買進 → 流出
房貸買進     → 0(錢是銀行出的)
賣出、配息   → 流入
還款、每月利息 → 流出
今天結清     → 流入 市值 − 借款餘額</div>
      <p>解出讓這些現金流現值歸零的年化報酬率。資料不足時顯示「—」,不會亂給數字。</p>
      <h4>淨投入 vs 累計投入</h4>
      <div class="formula">淨投入 = 累計自有投入 − 賣出回收 − 配息</div>
      <p>買賣來回幾次,「累計投入」會越滾越大,但你實際還放在裡面的錢沒變那麼多。
      淨投入才是「現在有多少自己的錢在裡面」。</p>
    </div>

    <div class="sect">曝險</div>
    <div class="card doc">
      <h4>正2 ETF 有兩層槓桿</h4>
      <p>00631L、00675L 這類正2 ETF 本身就是 2 倍;你再用房貸借錢買,等於兩層。
      每檔標的可以在<strong>「設定」分頁的「持股與報價」</strong>設定自己的槓桿倍數
      (正2 填 2、一般股票填 1)。</p>
      <div class="formula">實質市場曝險 = Σ(各標的市值 × 該標的槓桿倍數)
曝險比例     = 實質市場曝險 ÷ (部位淨值 + 房貸總額度)
部位淨值     = 部位市值 − 借款餘額        自己的錢
槓桿倍數     = 部位市值 ÷ 部位淨值</div>
      <h4>分母為什麼是這個</h4>
      <p>用「自己的錢 + 還能借的火力」當基準,不用淨資產 —— 房子和現金不會拿去接刀,
      真正的上限是額度。</p>
      <p>分母用<strong>部位淨值</strong>而不是部位市值:已借出的錢同時存在於部位與額度中,
      用市值會把它算兩次,比例看起來比實際安全。額度用得越多,分母越接近自有資金,
      比例會誠實地升高。</p>
    </div>

    <div class="sect">槓桿頁怎麼逛</div>
    <div class="card doc">
      <p>槓桿頁分成四個小分頁,上方可以切換:</p>
      <ul>
        <li><strong>概況</strong> — 每天看這頁就好:整體損益、年化報酬、曝險,以及兩張走勢圖</li>
        <li><strong>訊號</strong> — 今天該不該動:均線趨勢訊號、正2 曝險目標、壓力測試,一次看完</li>
        <li><strong>紀錄</strong> — 買賣、房貸動用、還款,記完就走</li>
        <li><strong>設定</strong> — 很少要動的:持股代號與報價、均線趨勢參數、曝險目標、房貸額度與利率</li>
      </ul>
    </div>

    <div class="sect">整體邏輯</div>
    <div class="card doc">
      <p>用房屋擔保額度買槓桿部位,不是券商融資——大盤再怎麼跌,只要利息付得出來,
      部位就不會在最差的時間點被迫賣掉。所以這裡真正要處理的風險,不是「會不會斷頭」,
      而是<strong>「會不會抱著一個被複利耗損吃掉的槓桿部位,等上超乎預期的時間」</strong>。</p>
      <p>判斷該不該動的,是「訊號」分頁的<strong>均線趨勢訊號</strong>(現在該續抱還是該跑)跟
      <strong>正2 曝險目標</strong>(該投入/該減碼多少錢)這兩層;真正借了多少、什麼時候借的,
      記在「紀錄」分頁的<strong>房貸動用記錄</strong>裡——這是純粹的帳本,不判斷該不該借,
      借款餘額跟利息都是從這本帳算出來的。</p>
    </div>

    <div class="sect">訊號怎麼接到實際買賣</div>
    <div class="card doc">
      <p><strong>訊號分頁只是判斷依據,不會自動下單、不會自動動用或償還房貸。</strong>
      真正的錢要不要動,永遠是你自己決定,程式只負責把訊號算給你看。</p>
      <h4>看到買進訊號(RECOVER / ADD,或曝險目標卡片顯示該加碼)</h4>
      <p>先在現實裡真的買進,再回來<strong>「紀錄」分頁</strong>記一筆買進。如果這筆錢是房貸借來的,
      買賣紀錄的來源要選「房貸借款」,同時在<strong>同一個分頁的「房貸動用記錄」</strong>把對應那筆
      的動用日期與金額更新——借款餘額跟利息都是從動用記錄算出來的,不是從買賣紀錄自動推算,
      這兩邊要自己保持一致。「借款與利息」卡片會在兩邊金額對不起來時跳提醒,可以拿來對帳。</p>
      <h4>看到出場訊號(EXIT,或曝險目標卡片顯示已超過目標)</h4>
      <p>賣掉之後一樣要到「紀錄」分頁記一筆賣出。<strong>賣出的錢要不要拿去還房貸,是你自己的選擇</strong>:
      想降低借款餘額就記一筆還款;想留著現金等下次 RECOVER 訊號再買回,就先不記還款。</p>
      <p>簡單說:趨勢訊號的每一層加碼(ADD),對應到現實裡就是一次動用房貸額度的買進;每一次 EXIT,
      就是一次要不要順便還款的賣出決定。哪一筆買賣該算進哪一筆動用記錄,目前完全靠自己記得住,
      程式不會幫忙配對。</p>
    </div>

    <div class="sect">均線趨勢訊號</div>
    <div class="card doc">
      <p>回答「手上已經有的部位,現在該續抱還是該跑」,跟房貸動用與否無關。
      每檔標的用自己的快線(短天期均線)與慢線(長天期均線)判斷三種狀態:</p>
      <ul>
        <li><strong>HOLD</strong> — 價格站上快線、趨勢確認,續抱</li>
        <li><strong>WAIT_RECOVER</strong> — 出場後還沒重新站上趨勢,依「加碼間距」分批試水</li>
        <li><strong>WATCH</strong> — 歷史價格不夠(還沒回補,或標的太新),算不出均線</li>
      </ul>
      <div class="formula">HOLD 時:收盤 &lt; 快線 × 出場緩衝 → 出場,轉入 WAIT_RECOVER
非 HOLD 時:站回快線且斜率轉正,或強力反彈 → 一次補滿倉位,轉入 HOLD(優先判斷)
           否則,跌破「加碼間距」且還沒加滿層數 → 加碼一層,維持 WAIT_RECOVER</div>
      <p>均線需要的歷史收盤價要先在<strong>「訊號」分頁</strong>按「回補歷史價格」抓一次
      (逐月依序抓,不會同時對證交所發一串請求);之後每次更新報價會順便累積,不用常按。
      快線/慢線天數、出場緩衝、加碼間距與層數都可以在<strong>「設定」分頁</strong>每檔標的自己調,
      改壞了按「重設為預設值」就好。</p>
      <p><strong>這只是訊號顯示,不會自動下單。</strong>該買該賣一樣要自己到「紀錄」分頁記一筆——
      這個分頁只負責告訴你現在是什麼狀態、距離出場線還有多少緩衝。</p>
    </div>

    <div class="sect">正2 曝險目標</div>
    <div class="card doc">
      <p>趨勢訊號告訴你「該不該動」,但沒告訴你「該投入多少錢」——曝險目標補這一塊,只管正2
      (槓桿倍數剛好等於 2 的標的),用「總覽」頁本來就有的曝險比例公式當標準:</p>
      <div class="formula">曝險比例 = (各標的市值 × 槓桿倍數的總和) ÷ (部位淨值 + 房貸總額度)</div>
      <p>兩檔正2 各自算「進度」——0 表示還沒進場或剛出場、1 到 N 表示加碼到第幾層(N 是加碼層數上限)、
      N+1 表示已經確認 HOLD——<strong>取兩檔裡比較保守(數字較小)的那個</strong>當整組現在的階段,
      因為兩檔經濟上幾乎是同一個賭注,一檔先轉弱就該一起保守,不各自獨立判斷。每個階段對應的目標曝險比例
      在<strong>「設定」分頁的「曝險目標設定」</strong>可以調。</p>
      <p>算出目標曝險金額後,拿現在的部位淨值去反推「該投入多少錢」,給兩個方案:</p>
      <ul>
        <li><strong>方案A(現金)</strong>——自己拿新的錢出來買,等於幫這個部位多墊一筆本金(像買房付頭期款),
        部位淨值會跟著漲</li>
        <li><strong>方案B(房貸)</strong>——不拿新錢,直接借房貸額度買,買的東西(市值)跟欠的錢(借款餘額)
        一起增加、互相抵銷,部位淨值不會漲</li>
      </ul>
      <p>同樣的目標曝險比例,方案A 因為部位淨值也跟著墊高,分母跟著變大,要投入的金額會比方案B 多——
      不是算錯,是這兩種資金對「自己在這個部位裡佔多少」的影響本來就不一樣。實際要用哪個、還是兩個混著用,
      自己決定,這個分頁不會幫你自動借款或下單。差額算出來是負的,代表目前曝險已經超過目標,顯示成「可考慮減碼」。</p>
    </div>

    <div class="sect">借款與還款</div>
    <div class="card doc">
      <div class="formula">借款餘額 = 各筆動用記錄的金額 − 已還款
每月利息 = 借款餘額 × 年利率 ÷ 12</div>
      <p>看到買進訊號、實際動用房貸買進之後,到<strong>「紀錄」分頁的「房貸動用記錄」</strong>
      填動用日期與金額(可以順便記下買了什麼)——填了才會計入借款餘額、利息。
      減碼還錢之後<strong>要記一筆還款</strong>,否則餘額不會減、利息會一直累積、曝險也會失真。
      還款一樣記在「紀錄」分頁:選哪一筆動用記錄、填日期與金額,下面會列出所有還款,
      可以修改或刪除,每筆的動用/已還/尚欠也一併顯示。</p>
      <p>全部還清後不再計息,但動用紀錄與還款歷史都保留。</p>
      <p>年利率是你填的假設值,實際以銀行核定為準。打開「每月自動記入支出」的話,
      每月會在記帳自動產生一筆「房貸利息」;你把那筆刪掉,那個月不會被補記。</p>
    </div>

    <div class="sect">報價</div>
    <div class="card doc">
      <p>資料來源是<strong>臺灣證券交易所公開資訊</strong>,抓的是<strong>最近一個交易日的收盤價</strong>,
      不是盤中即時報價。上市櫃代號都查得到。</p>
      <p>開啟 app 時自動更新(一小時最多一次),也可以手動按「從證交所更新收盤價」。
      超過 5 天沒更新會提醒你 —— 因為損益、曝險、曝險目標全都是用那組價算的。</p>
      <p><em>股數不會自動抓。</em>有買賣紀錄的話由紀錄自動加總,沒有的話要自己填。</p>
    </div>

    <div class="sect">壓力測試</div>
    <div class="card doc">
      <p>輸入假設的大盤跌幅,各標的<strong>依自己的槓桿倍數</strong>換算(正2 跌兩倍),
      算出部位市值、部位淨值、曝險比例的前後對照,並拿這個情境下的曝險比例對照目前正2 曝險目標的目標值,
      看是還在目標之內還是會超過。</p>
      <p><em>沒有計入正2 ETF 的波動耗損與追蹤誤差,實際下跌時通常比這裡算的更差。</em></p>
    </div>

    <div class="sect">資料存在哪</div>
    <div class="card doc">
      <p>${STORAGE_NOTE}</p>
      <ul>
        <li><strong>每日快照</strong>:每天第一次開啟、或按「從證交所更新收盤價」時記一筆
        (部位市值、借款餘額、自己的錢、整體損益)。同一天會更新到最新,不會累積。
        槓桿頁「概況」的兩張走勢圖就是用這個畫的,各自的圖上方可切 1 個月 / 3 個月 / 1 年 / 全部,
        兩張圖共用同一個範圍。<strong>圖上任一處都可以點</strong>,會顯示那一天的日期與各條線的數值,
        並畫出垂直游標線。累積不到兩天時會顯示「還在等資料」而不是空白的圖。
        保留最近 1000 個交易日,約四年。</li>
        <li><strong>每月快照</strong>:每月第一次開啟自動記一筆(淨資產、部位市值、借款餘額、
        整體損益)。總覽的淨資產走勢用這個畫;每日紀錄還不夠兩筆時,槓桿頁的圖也會退回用它。
        沒開過 app 的月份會留空,間隔才不會失真。</li>
        <li><strong>每日備份</strong>:每天第一次開啟存一份完整快照,可在總覽的「資料」卡還原。
        雲端留 30 份;本機的份數會隨資料量遞減(一般 7 份,資料超過 150KB 留 5 份、超過 300KB 留 3 份),
        因為手機瀏覽器的空間有限,備份佔太多會讓主資料存不進去。空間用超過 75% 時會提醒你。</li>
        <li><strong>匯出備份</strong>:JSON,換裝置時用「匯入備份」讀回來。
        匯入前會先確認檔案是本 app 匯出的,不相干的 JSON 會被擋下來,
        匯入成功則會回報讀進了幾筆。</li>
        <li><strong>匯出 CSV</strong>:給 Excel 看的,九張表放同一個檔。單向,不能匯回。</li>
      </ul>
      <p>資產分頁的每一筆是<strong>現況</strong>,改了就覆蓋,不會保留舊值;
      歷史只有「每月一筆」的快照這個層級。</p>
    </div>

    <div class="sect">畫面上的提醒</div>
    <div class="card doc">
      <p>看到黃色或紅色的提示框時,意思是:</p>
      <ul>
        <li><strong>兩邊的房貸金額對不起來</strong> — 動用記錄的動用總額,和買賣紀錄裡標成「房貸借款」的
        買進金額差超過 2%。可能是借了還沒買、或買進時忘了選資金來源。利息與曝險以動用紀錄為準。</li>
        <li><strong>有一筆賣出超過當時的持股</strong> — 超出的部分沒有計入損益(不然會憑空多出獲利)。
        檢查股數或日期是不是填錯。</li>
        <li><strong>代號和上面某一列重複了</strong> — 兩列填了同一個股票代號,重複的那列不計入市值,
        否則買賣紀錄會被算兩次。</li>
        <li><strong>報價已經 N 天沒更新</strong> — 損益、曝險、曝險目標都是用那組舊價算的,按更新抓最新的。</li>
        <li><strong>這台裝置的瀏覽器空間快滿了</strong> — 備份份數會自動減少以保住主資料,
        建議登入 Google 帳號改用雲端,或先匯出一份留底。</li>
      </ul>
    </div>

    <div class="sect">免責</div>
    <div class="card doc">
      <p>用房屋擔保額度做槓桿投資,會把投資虧損直接連到房子與每月現金流。
      這個 app 的所有計算都是<strong>簡化試算</strong>,不構成投資或貸款建議。
      實際動用資金前請與銀行確認正式條件。</p>
    </div>`;

/* ===================== 槓桿 ===================== */
function computeLeverage(){
  const L = state.leverage;
  // 有買賣紀錄就以紀錄為準,否則用標的清單裡手填的股數
  // 代號重複時只有第一列計入,否則買賣紀錄會被算兩次
  const seenIds = new Set();
  const holdings = state.instruments.map(it => {
    const dup = it.id && seenIds.has(it.id);
    if (it.id) seenIds.add(it.id);
    const shares = dup ? 0 : (hasTrades() ? heldShares(it.id) : it.shares);
    return { key:it.key, id:it.id, name:it.name, leverage:it.leverage, price:it.price,
             shares, value: shares * it.price, dup };
  });
  const totalValue = sum(holdings, h => h.value);

  const draws = L.draws.map(t => ({
    ...t,
    used: !!t.useDate,
    repaid: repaidOf(t),
    balance: outstanding(t),
    yearsUsed: daysSince(t.useDate)/365.25
  }));

  const usedDraws = draws.filter(t => t.used);
  const usedAmount = sum(draws, t => t.balance);   // 還欠銀行多少
  const drawnAmount = sum(usedDraws, t => t.amount);

  const monthlyInterest = usedAmount * (L.annualRate/100) / 12;

  /* 「自己的錢」(equityValue)給每日/每月快照記錄部位淨值走勢用,不能拿總市值代替:
       總市值含借來的錢,不能反映真正屬於自己的部分;
     自己的錢 = 市值 − 借款餘額 + 已取回的現金 − 已還款 − 動用後新投入的自有資金 */
  const freezeDate = L.draws.filter(t => t.useDate).map(t => t.useDate).sort()[0] || '';
  let cashBack = 0, ownAfter = 0;
  if (freezeDate){
    state.trades.forEach(t => {
      if (t.date < freezeDate) return;
      if (t.action === 'sell') cashBack += t.shares * t.price - t.fee;
      else if (t.action === 'dividend') cashBack += t.amount - t.fee;
      else if (t.source !== 'loan') ownAfter += t.shares * t.price + t.fee;
    });
  }
  const repaidTotal = sum(L.draws, t => repaidOf(t));
  const equityValue = totalValue - usedAmount + cashBack - repaidTotal - ownAfter;

  const positionDeclinePct = L.stressDeclinePct * 2;
  const lossAmount = totalValue * positionDeclinePct/100;

  return { holdings, totalValue, draws, usedAmount, drawnAmount, monthlyInterest,
           equityValue, cashBack, ownAfter, repaidTotal,
           positionDeclinePct, lossAmount,
           remainingNetWorth: netWorth() - lossAmount };
}

/* ===================== 均線趨勢訊號 =====================
   房貸動用記錄管的是「借了多少、什麼時候借的」這本帳,這裡管的是「現在該續抱還是該跑」。
   狀態:WATCH(還沒進場)→ WAIT_RECOVER(接刀中,部分加碼)→ HOLD(趨勢確認,滿倉續抱)。
   HOLD 時只看會不會 EXIT;非 HOLD 時先看會不會 RECOVER(優先),再看會不會 ADD。

   刻意設計成「每次都從完整的 priceHistory 重新回放整個狀態機」,
   不是把 status/pyramidCount 當成逐筆增量修改、存在 state 裡的可變狀態——
   這樣任何一個分支都不可能「忘記重置」pyramidCount,回放到哪一天答案就該是什麼,
   不存在陳舊狀態遺留的問題。*/
function sma(vals, w){
  const out = new Array(vals.length).fill(null);
  let s = 0;
  for (let i = 0; i < vals.length; i++){
    s += vals[i];
    if (i >= w) s -= vals[i - w];
    if (i >= w - 1) out[i] = s / w;
  }
  return out;
}
function computeTrend(it){
  const p = it.trend || defaultTrendParams(it.leverage);
  const hist = it.priceHistory || [];
  const barsNeeded = p.maSlow + 1;   // 至少要能算出一天的慢線,還要前一天的快線才能判斷斜率
  const base = { key: it.key, id: it.id, params: p, barsAvailable: hist.length, barsNeeded };
  if (hist.length < barsNeeded){
    return { ...base, status:'WATCH', pyramidCount:0, basePrice:0,
             maFast:null, maSlow:null, lastClose:null, lastDate:'', cushionPct:null };
  }
  const closes = hist.map(h => h.c);
  const dates = hist.map(h => h.d);
  const maF = sma(closes, p.maFast);
  const maS = sma(closes, p.maSlow);
  const start = p.maSlow - 1;
  let status = 'WATCH', basePrice = 0, pyramidCount = 0;
  for (let i = start + 1; i < closes.length; i++){
    const close = closes[i], f = maF[i], s = maS[i], fy = maF[i - 1];
    if (f == null || s == null || fy == null) continue;
    let action;
    if (status === 'HOLD'){
      action = close < f * p.exitBuffer ? 'EXIT' : 'HOLD';
    }else{
      const priceStable = close > f && closes[i - 1] > maF[i - 1];
      const slopeOk = f >= fy * p.recoverSlopeThreshold;
      const strongRebound = close > f * p.recoverStrongRebound;
      const manualPrice = basePrice > 0 ? basePrice : closes[i - 1];
      const effectiveBase = Math.min(manualPrice, s);
      const gapTriggered = close < effectiveBase * (1 - p.pyramidGap);
      if ((priceStable && slopeOk) || strongRebound) action = 'RECOVER';
      else if (gapTriggered && pyramidCount < p.pyramidLevels) action = 'ADD';
      else action = status;
    }
    if (action === 'RECOVER'){ basePrice = close; pyramidCount = 0; status = 'HOLD'; }
    else if (action === 'ADD'){ basePrice = close; pyramidCount += 1; status = 'WAIT_RECOVER'; }
    else if (action === 'EXIT'){ basePrice = close; pyramidCount = 0; status = 'WAIT_RECOVER'; }
  }
  const last = closes.length - 1;
  const fLast = maF[last], sLast = maS[last], lastClose = closes[last];
  let cushionPct = null;
  if (status === 'HOLD' && fLast){
    const exitLine = fLast * p.exitBuffer;
    cushionPct = exitLine > 0 ? (lastClose / exitLine - 1) * 100 : null;
  }
  return { ...base, status, pyramidCount, basePrice,
           maFast: fLast, maSlow: sLast, lastClose, lastDate: dates[last], cushionPct };
}
const computeAllTrends = () => state.instruments.map(computeTrend);

/* 正2(00631L+00675L)該投入多少錢的曝險目標計算。只管槓桿倍數剛好等於 2 的標的,
   目前策略裡只有正2,之後如果加了別的槓桿倍數的標的,這裡先不處理(不特別去適配)。

   進度值:0=WATCH或剛EXIT(pyramidCount=0)、1..N=加碼到第幾層(N=兩檔裡較小的
   pyramidLevels,防呆用)、N+1=兩檔都HOLD。兩檔各自算,取較小值代表整組現在的階段——
   理由見「說明」分頁,兩檔經濟上幾乎是同一個賭注,一檔先轉弱就該一起保守。

   算出來的 deltaCash/deltaLoan 是兩個邊界(全部用現金 vs 全部用房貸該投入多少),
   實際怎麼混用現金/房貸由使用者自己決定,app 不追蹤「手上現金」這個數字。 */
function computeExposurePlan(){
  const lev2 = state.instruments.filter(it => it.auto && it.leverage === 2);
  if (!lev2.length) return null;
  const trends = lev2.map(computeTrend);
  const N = Math.max(1, Math.min(...lev2.map(it => it.trend.pyramidLevels)));
  const rawProgress = t => t.status === 'HOLD' ? N + 1 : (t.status === 'WAIT_RECOVER' ? t.pyramidCount : 0);
  const progress = Math.min(...trends.map(rawProgress));
  const targets = state.leverage.exposureTargets;
  const targetRatio = progress === 0 ? 0
                     : progress <= N ? (targets.byLayer[progress - 1] ?? targets.hold)
                     : targets.hold;
  const risk = computeRisk();
  const R = targetRatio / 100, L = 2;
  const denomCash = L - R;
  const raw = R * (risk.equity + risk.creditLimit) - risk.exposure;   // 為負代表已經超過目標,該減碼
  return {
    progress, layerCount: N, targetRatio, currentRatio: risk.exposureRatio,
    deltaCash: denomCash > 0.0001 ? raw / denomCash : null,   // null = 這個目標純用現金到不了
    deltaLoan: raw / L,
    instruments: lev2.map(it => it.key)
  };
}

/* 通用折線圖。series: [{name, color, values}],values 對齊 labels,可含 null。
   兩條以上一定畫圖例,末端直接標數字,座標文字都用主題色。 */
const chartData = {};   // 圖表資料暫存,點擊時查得到數值

function lineChart(key, labels, series, opts){
  const o = Object.assign({ height:130, zero:false, fmtVal: v => 'NT$ ' + fmt(v) }, opts || {});
  const w = 320, h = o.height, padL = 8, padR = 8, padT = 14, padB = 20;
  const all = [];
  series.forEach(s2 => s2.values.forEach(v => { if (v !== null && v !== undefined) all.push(v); }));
  // 要有兩個以上的「時間點」才畫得出線。只看值的個數會誤判:
  // 一天的資料有市值和借款兩個值,卻只有一個時間點,畫出來是一張空白的圖。
  const points = labels.filter((_, i) => series.some(s2 => s2.values[i] !== null && s2.values[i] !== undefined)).length;
  if (points < 2 || all.length < 2) return '';
  let lo = Math.min(...all), hi = Math.max(...all);
  if (o.zero){ lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
  if (hi === lo){ hi = lo + Math.abs(lo || 1) * 0.1; lo = lo - Math.abs(lo || 1) * 0.1; }
  const x = i => padL + i * (w - padL - padR) / Math.max(1, labels.length - 1);
  const y = v => (h - padB) - (v - lo) / (hi - lo) * (h - padB - padT);

  chartData[key] = { labels, series, fmtVal: o.fmtVal, x: labels.map((_, i) => x(i)) };

  const paths = series.map(s2 => {
    let d = '', started = false;
    s2.values.forEach((v, i) => {
      if (v === null || v === undefined){ started = false; return; }
      d += (started ? ' L ' : ' M ') + x(i).toFixed(1) + ',' + y(v).toFixed(1);
      started = true;
    });
    return d ? `<path d="${d}" fill="none" stroke="${s2.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` : '';
  }).join('');

  const areaPath = (o.area && series.length === 1) ? (() => {
    const pts = [];
    series[0].values.forEach((v, i) => { if (v !== null && v !== undefined) pts.push([x(i), y(v)]); });
    if (pts.length < 2) return '';
    const base = (h - padB).toFixed(1);
    return `<path d="M ${pts[0][0].toFixed(1)},${base} L `
      + pts.map(pt => pt[0].toFixed(1) + ',' + pt[1].toFixed(1)).join(' L ')
      + ` L ${pts[pts.length-1][0].toFixed(1)},${base} Z" fill="var(--accent-soft)" stroke="none"/>`;
  })() : '';

  const dots = series.map((s2, si) => s2.values.map((v, i) =>
    (v === null || v === undefined) ? '' :
    `<circle class="pt-${key}-${si}" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${i === labels.length - 1 ? 3.5 : 0}" fill="${s2.color}" stroke="var(--card)" stroke-width="2"/>`
  ).join('')).join('');

  // 整欄都可以點,手指好按
  const hits = labels.map((_, i) => {
    const half = (w - padL - padR) / Math.max(1, labels.length - 1) / 2;
    const x0 = Math.max(0, x(i) - half), x1 = Math.min(w, x(i) + half);
    return `<rect x="${x0.toFixed(1)}" y="0" width="${(x1 - x0).toFixed(1)}" height="${h}" fill="transparent" style="cursor:pointer" data-act="chart" data-key="${key}" data-i="${i}"></rect>`;
  }).join('');

  const zeroY = y(0);
  return `
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;margin-top:4px;touch-action:manipulation;" role="img" aria-label="${esc(o.label || '走勢')}">
      ${o.zero ? `<line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${w - padR}" y2="${zeroY.toFixed(1)}" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 3"/>` : ''}
      <line id="mk-${key}" x1="0" y1="${padT - 6}" x2="0" y2="${h - padB}" stroke="var(--sub)" stroke-width="1" stroke-dasharray="2 2" opacity="0"/>
      ${areaPath}${paths}${dots}${hits}
      <text x="${padL}" y="${h - 5}" fill="var(--sub)" font-size="10">${esc(labels[0])}</text>
      <text x="${w - padR}" y="${h - 5}" fill="var(--sub)" font-size="10" text-anchor="end">${esc(labels[labels.length - 1])}</text>
    </svg>
    <div class="row" id="cap-${key}" style="flex-wrap:wrap; gap:4px 14px;">${chartCaption(key, labels.length - 1)}</div>
    <div class="muted" style="font-size:11px;">點圖上任一處看該月數字</div>`;
}

/* 說明列:月份 + 每條線在該點的數值 */
function chartCaption(key, i){
  const d = chartData[key];
  if (!d) return '';
  const parts = d.series.map(s2 => {
    const v = s2.values[i];
    return `<span class="muted"><span class="legend-dot" style="background:${s2.color}"></span>${esc(s2.name)} ${(v === null || v === undefined) ? '—' : d.fmtVal(v)}</span>`;
  }).join('');
  return `<span class="muted" style="font-weight:700; color:var(--text);">${esc(d.labels[i])}</span>${parts}`;
}

/* 點圖:只動說明列與游標線,不整頁重畫 */
function pickChartPoint(key, i){
  const d = chartData[key];
  if (!d) return;
  const cap = document.getElementById('cap-' + key);
  if (cap) cap.innerHTML = chartCaption(key, i);
  const mk = document.getElementById('mk-' + key);
  if (mk){
    mk.setAttribute('x1', d.x[i].toFixed(1));
    mk.setAttribute('x2', d.x[i].toFixed(1));
    mk.setAttribute('opacity', '1');
  }
  d.series.forEach((s2, si) => {
    document.querySelectorAll('.pt-' + key + '-' + si).forEach((el, idx) => {
      el.setAttribute('r', idx === i ? '4' : '0');
    });
  });
}

            <button class="btn danger" data-act="del-trade" data-id="${t.id}">${pendingConfirm === 'del-trade:' + t.id ? '⚠️ 再按一次刪除' : '刪除這筆'}</button>

        <div class="tx" data-act="edit-trade" data-id="${t.id}">
          <div>
            <div class="tx-cat">${t.action === 'sell' ? '賣出' : t.action === 'dividend' ? '配息' : '買進'} ${esc(t.symbol)}
              ${t.action === 'buy' ? `<span class="badge ${t.source === 'loan' ? 'amber' : 'gray'}" style="margin-left:4px;">${t.source === 'loan' ? '房貸' : '自有'}</span>` : ''}</div>
            <div class="tx-desc">${esc(t.date)}${t.action === 'dividend' ? '' : ' · ' + fmt(t.shares) + ' 股 @ ' + t.price}${t.note ? ' · ' + esc(t.note) : ''}</div>
          </div>
          <div class="tx-amt ${t.action === 'buy' ? '' : 'income'}">${t.action === 'buy' ? '−' : '+'}${fmt(t.action === 'dividend' ? t.amount - t.fee : t.shares * t.price + (t.action === 'sell' ? -t.fee : t.fee))}</div>
        </div>`).join('') : `<div class="empty">還沒有紀錄。<br>每次用薪水、獎金或房貸進場都記一筆,損益就會自動算。</div>`}
      ${computePosition().oversold ? `
        <div class="alert amber" style="margin-top:12px;">
          <span class="ai">⚠️</span>

          </div>
        </div>` : ''}
      ${trades.length ? `<div class="notice">點任一筆可以修改或刪除。持股股數會由這些紀錄自動加總。</div>` : ''}
    </div>`;
}

function levTabs(){
  const t = [['overview','概況'], ['signal','訊號'], ['log','紀錄'], ['setup','設定']];
  return `<div class="subtabs"><div class="seg">
    ${t.map(([v, label]) => `<button class="seg-btn ${levTab === v ? 'on' : ''}" data-act="lev-tab" data-v="${v}">${label}</button>`).join('')}
  </div></div>`;
}

/* 房貸動用記錄:借了多少、什麼時候借的這本帳,借款餘額跟利息都是從這裡算出來的。
   純記帳,不判斷該不該借——該不該借看「訊號」分頁的趨勢訊號跟曝險目標。 */
function renderDrawRecords(){
  const L = state.leverage;
  const r = computeLeverage();
  const row = (t) => `
    <div style="margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid var(--line);">
      <div class="row">
        <input class="f-name" style="font-weight:700; color:var(--text); max-width:60%;" data-k="draw-label-${t.id}" value="${esc(t.label)}">

      </div>
      ${t.useDate ? `
        <div class="row"><span class="label">${t.balance ? '尚欠' : '已還清'}</span>
          <span class="val ${t.balance ? '' : 'pos'}" id="out-balance-${t.id}">${t.balance ? 'NT$ ' + fmt(t.balance) : '已還清'}</span></div>
        <div class="row sub"><span class="label">已借 ${Math.floor(t.yearsUsed * 365.25)} 天 · 利息約 ${fmt(accrue(t, L.annualRate))}</span><span class="val"></span></div>
      ` : ''}
      <div class="grid2">
        <div class="field"><label>動用日期${t.useDate ? '' : '(填了才算已動用)'}</label><input type="date" data-k="draw-date-${t.id}" value="${esc(t.useDate)}"></div>
        <div class="field"><label>動用金額</label><input type="number" inputmode="decimal" data-k="draw-amt-${t.id}" value="${t.amount || ''}"></div>
      </div>
      <div class="field"><label>備註(買了什麼)</label><input data-k="draw-note-${t.id}" value="${esc(t.note || '')}" placeholder="00631L 27,000 股"></div>
      <button class="btn" data-act="del-draw" data-id="${t.id}" style="margin-top:8px;">刪除這筆</button>

    <div class="card">
      <h3>房貸動用記錄</h3>
      <details class="tip" style="margin-bottom:10px;"><summary>按「訊號」分頁實際買進之後怎麼記</summary><div class="body">按「訊號」分頁的趨勢/曝險目標實際買進之後,在這裡記一筆動用金額——借款餘額跟利息都是從這裡算的,不是自動推算。</div></details>
      ${r.draws.length ? r.draws.map(row).join('') : `<div class="empty">還沒有動用記錄。</div>`}
      <button class="btn solid" data-act="add-draw">+ 新增一筆動用記錄</button>
    </div>`;
}

/* 還款紀錄:獨立成一張卡,對應 state.leverage.draws 裡任一筆有 useDate 的動用記錄 */
function renderRepayments(){
  const L = state.leverage;
  const items = L.draws.filter(x => x.useDate);
  const ids = items.map(it => it.id);
  if (!ids.includes(repayDraft.target)) repayDraft.target = ids[0] || '';
  const rows = [];
  items.forEach(it => (it.repayments || []).forEach(r => rows.push({ it, r })));
  rows.sort((a, b) => a.r.date < b.r.date ? 1 : -1);
  return `
    <div class="card">
      <h3>記一筆還款</h3>
      ${items.length ? `
        <div class="field"><label>還哪一筆</label>
          <select data-k="rd-target">
            ${items.map(it => `<option value="${it.id}" ${repayDraft.target === it.id ? 'selected' : ''}>${esc(it.label)}(尚欠 ${fmt(outstanding(it))})</option>`).join('')}
          </select>
        </div>
        <div class="grid2">
          <div class="field"><label>日期</label><input type="date" data-k="rd-date" value="${esc(repayDraft.date)}"></div>
          <div class="field"><label>金額</label><input type="number" inputmode="decimal" data-k="rd-amount" value="${esc(repayDraft.amount)}" placeholder="0"></div>
        </div>
        <button class="btn solid" data-act="add-repay2">新增還款</button>
        ${repayError ? `<div class="muted neg" style="text-align:center; margin-top:8px;">${esc(repayError)}</div>` : ''}
      ` : `<div class="empty">還沒有動用中的記錄。<br>在上面「房貸動用記錄」填了動用日期之後,這裡才能記還款。</div>`}
    </div>

    <div class="card">
      <h3>還款紀錄</h3>
      ${items.map(it => `
        <div class="row"><span class="label">${esc(it.label)}</span>
          <span class="val ${outstanding(it) ? '' : 'pos'}">${outstanding(it) ? '尚欠 NT$ ' + fmt(outstanding(it)) : '已還清'}</span></div>
        <div class="row"><span class="muted">動用 ${fmt(it.amount)} · 已還 ${fmt(repaidOf(it))}</span><span class="muted"></span></div>
      `).join('')}
      ${rows.length ? `<div style="margin-top:10px;">${rows.map(({ it, r }) => `
        <div class="erow">
          <input type="date" class="f-name" data-k="rp-date-${it.id}-${r.id}" value="${esc(r.date)}">
          <input class="f-amt" type="number" inputmode="decimal" data-k="rp-amt-${it.id}-${r.id}" value="${r.amount || ''}">
          <button class="xbtn" data-act="del-repay" data-id="${it.id}:${r.id}" aria-label="刪除">✕</button>
        </div>
        <div class="muted" style="margin-top:2px;">${esc(it.label)}</div>`).join('')}</div>`
        : (items.length ? `<div class="empty">還沒有還款紀錄。減碼把錢還給銀行之後記一筆,餘額與利息才會跟著減。</div>` : '')}
    </div>`;
}



/* 壓力測試的內容獨立成函式,輸入跌幅時可以只更新這一塊 */
function stressBody(){
  const L = state.leverage;
  const st = computeStress(L.stressDeclinePct);
  if (!st) return `<div class="empty">先填入持股與股價,或記幾筆買賣,才算得出來。</div>`;
  const plan = computeExposurePlan();
  return `
  <div class="big-num neg">−NT$ ${fmt(st.loss)}</div>
  <div class="big-sub">部位市值 ${fmt(st.pv)} → ${fmt(st.newPv)}</div>
  <div class="row"><span class="label">部位淨值(自己的錢)</span>
    <span class="val ${st.newEquity >= 0 ? '' : 'neg'}">NT$ ${fmt(st.equity)} → ${fmt(st.newEquity)}</span></div>
  <div class="row"><span class="label" style="font-weight:700;">曝險比例</span>
    <span class="val" style="font-weight:800;">${st.ratio.toFixed(0)}% → ${st.newRatio.toFixed(0)}%</span></div>
  ${plan ? `<div class="row sub"><span class="label">對照目前正2曝險目標(${plan.targetRatio}%)</span>
    <span class="val">${st.newRatio > plan.targetRatio ? '會超過目標,是加碼還是減碼自己判斷' : '還在目標之內'}</span></div>` : ''}
  <details class="tip"><summary>試算怎麼算的</summary><div class="body">各標的用自己的槓桿倍數換算(正2 跌兩倍)。未計入正2 ETF 的波動耗損與追蹤誤差,實際下跌時通常更差。</div></details>`;
}

/* 均線趨勢訊號 + 正2 曝險目標,「訊號」分頁的內容。純顯示,不會自動下單——
   買賣還是要自己到「紀錄」分頁記一筆。 */
function trendBadge(status){
  if (status === 'HOLD') return `<span class="badge green">HOLD 續抱</span>`;
  if (status === 'WAIT_RECOVER') return `<span class="badge amber">WAIT_RECOVER 接刀中</span>`;
  return `<span class="badge gray">WATCH 尚未進場</span>`;   // 資料足夠但還沒等到趨勢確認,不等於資料不夠
}
/* 正2 曝險目標卡片:目前曝險 vs 目標曝險,以及該加碼/減碼多少(現金/房貸兩個邊界值,
   兩檔 00631L/00675L 均分)。只在有正2(槓桿2倍)標的時顯示。 */
function renderExposurePlanCard(){
  const p = computeExposurePlan();
  if (!p) return '';
  const n = p.instruments.length;
  const stageLabel = p.progress === 0 ? '尚未進場'
    : p.progress > p.layerCount ? '兩檔都 HOLD'
    : `加碼中(第 ${p.progress} / ${p.layerCount} 層)`;
  const overTarget = p.deltaLoan < -0.5;   // 現值超過目標,允許一點點浮點誤差
  return `
    <div class="card">
      <h3>正2 曝險目標</h3>
      <div class="row"><span class="label">目前階段</span><span class="val">${esc(stageLabel)}</span></div>
      <div class="row"><span class="label">目前曝險</span><span class="val">${p.currentRatio.toFixed(1)}%</span></div>
      <div class="row"><span class="label" style="font-weight:700;">目標曝險</span><span class="val" style="font-weight:800;">${p.targetRatio}%</span></div>
      ${overTarget ? `
        <div class="row sub"><span class="label">已超過目標,可考慮減碼</span>
          <span class="val">約 NT$ ${fmt(Math.abs(p.deltaLoan))}(00631L/00675L 各半約 NT$ ${fmt(Math.abs(p.deltaLoan)/n)})</span></div>
      ` : (p.deltaLoan > 0.5 ? `
        <div class="row sub"><span class="label">方案A:自己拿新的錢出來買(現金)</span>
          <span class="val">${p.deltaCash == null ? '—(純現金到不了)' : 'NT$ ' + fmt(p.deltaCash) + '(各半 NT$ ' + fmt(p.deltaCash/n) + ')'}</span></div>
        <div class="row sub"><span class="label">方案B:直接借房貸額度買(不拿新錢)</span>
          <span class="val">NT$ ${fmt(p.deltaLoan)}(各半 NT$ ${fmt(p.deltaLoan/n)})</span></div>
      ` : `<div class="muted" style="margin-top:6px;">已經在目標曝險附近,不用加碼也不用減碼。</div>`)}
      <details class="tip" style="margin-bottom:0;"><summary>這些數字是什麼意思</summary><div class="body">
        ${(!overTarget && p.deltaLoan > 0.5) ? `方案A、方案B買到的部位一樣,但要花的錢不一樣:自己拿現金出來,等於幫這個部位多墊了一筆本金(像買房付頭期款),要花比較多錢才能把曝險比例撐到目標;直接借房貸,買的東西跟欠的錢一起增加、互相抵銷,不用墊本金,同樣的目標只要比較少的錢。實際要用哪個、還是兩個混著用,自己決定。${p.deltaCash == null ? '這次的目標純用現金到不了,至少要用方案B補足缺口。' : ''}<br><br>` : ''}
        目標依「兩檔裡比較保守的那個」決定,不是各自獨立算。
      </div></details>
    </div>`;
}

/* 哪些標的的趨勢狀態剛改變(跟使用者上次看過的不一樣),總覽頁跟訊號分頁都要用同一份判斷。 */
function trendChanges(){
  return computeAllTrends().filter(t => {
    const it = findInstrumentByKey(t.key);
    return it && it.trend && it.trend.lastSeenStatus && it.trend.lastSeenStatus !== t.status && t.barsAvailable >= t.barsNeeded;
  });
}
function renderTrendChangeAlerts(){
  return trendChanges().map(t => {
    const it = findInstrumentByKey(t.key);
    return `
      <div class="alert amber">
        <span class="ai">🔔</span>
        <div>
          <div class="at">${esc(it.id || it.name)} 狀態變成${t.status === 'HOLD' ? '續抱(HOLD)' : t.status === 'WAIT_RECOVER' ? '接刀中(WAIT_RECOVER)' : t.status}</div>
          <div class="ad">原本是「${esc(it.trend.lastSeenStatus)}」。這只是訊號,買賣要自己到「紀錄」分頁記一筆。</div>
          <button class="go" data-act="ack-trend" data-id="${it.key}">知道了</button>
        </div>
      </div>`;
  }).join('');
}
function renderTrendTab(){
  const trends = computeAllTrends();
  return `
    ${renderTrendChangeAlerts()}
    ${renderExposurePlanCard()}
    <div class="card">
      <h3>均線趨勢訊號</h3>
      <details class="tip" style="margin-bottom:12px;"><summary>這個訊號怎麼用</summary><div class="body">只顯示訊號,不會自動買賣——參考「已加碼層數」跟「距出場緩衝」自己決定要不要動作,實際買賣一樣記在「紀錄」分頁。</div></details>
      ${trends.map(t => {
        const it = findInstrumentByKey(t.key);
        if (!it) return '';
        if (t.barsAvailable < t.barsNeeded){
          return `
          <div style="margin-bottom:14px; padding-bottom:12px; border-bottom:1px solid var(--line);">
            <div class="row"><span class="label" style="font-weight:700; color:var(--text);">${esc(it.id || it.name || '(未命名)')}</span>${trendBadge(t.status)}</div>
            <div class="empty">歷史價格不夠(有 ${t.barsAvailable} 天,至少要 ${t.barsNeeded} 天才能算慢線)。${QUOTES_ENABLED ? '按下面「回補歷史價格」補齊。' : '這個版本不能連線抓報價。'}</div>
          </div>`;
        }
        return `
        <div style="margin-bottom:14px; padding-bottom:12px; border-bottom:1px solid var(--line);">
          <div class="row"><span class="label" style="font-weight:700; color:var(--text);">${esc(it.id || it.name || '(未命名)')}</span>${trendBadge(t.status)}</div>
          <div class="row sub"><span class="label">快線(${t.params.maFast}日) / 慢線(${t.params.maSlow}日)</span><span class="val">${fmt(t.maFast)} / ${fmt(t.maSlow)}</span></div>
          <div class="row sub"><span class="label">收盤(${esc(t.lastDate)})</span><span class="val">${fmt(t.lastClose)}</span></div>
          ${t.status === 'HOLD'
            ? `<div class="row sub"><span class="label">距出場緩衝</span><span class="val">${t.cushionPct == null ? '—' : t.cushionPct.toFixed(1) + '%'}</span></div>`
            : `<div class="row sub"><span class="label">已加碼層數</span><span class="val">${t.pyramidCount} / ${t.params.pyramidLevels}</span></div>`}
        </div>`;
      }).join('')}
      ${QUOTES_ENABLED ? `
        <button class="btn quiet" data-act="backfill-history" ${backfillBusy ? 'disabled' : ''}>${backfillBusy ? '回補中…' : '🔄 回補歷史價格'}</button>
        <div class="muted" style="margin-top:6px;">${backfillMsg ? esc(backfillMsg) : '第一次使用要回補約 14 個月的歷史收盤價,均線才算得出來。之後每次更新報價會自動累積,不用常按。'}</div>
      ` : `<div class="muted" style="margin-top:6px;">這個版本(Artifact 版)不能連線抓報價,無法回補歷史價格。</div>`}
      <button class="why" data-act="go" data-v="help">這個訊號怎麼算 →</button>
    </div>`;
}

function refreshLeverage(){
  const L = state.leverage;
  const r = computeLeverage();
  const set = (id, text) => { const el = document.getElementById(id); if (el) el.textContent = text; };
  r.holdings.forEach(h => set('out-val-' + h.key, 'NT$ ' + fmt(h.value)));
  set('out-totalValue', 'NT$ ' + fmt(r.totalValue));
  r.draws.forEach(t => {
    set('out-balance-' + t.id, t.balance ? 'NT$ ' + fmt(t.balance) : '已還清');
  });
  set('out-usedAmount', 'NT$ ' + fmt(r.usedAmount));
  const bar = document.getElementById('out-usedBar');
