# 每個交易日收盤後檢查均線訊號,狀態改變就開 issue(GitHub 會寄 email / 推播到 GitHub app)。
# 規則跟 app 同一份程式,說明見 scripts/signal-check.js 開頭。
name: 收盤後檢查訊號

on:
  schedule:
    # 台灣時間週一到週五 15:47、19:47、22:13(UTC 07:47、11:47、14:13)。後兩次是備援:證交所資料晚更新、
    # GitHub 排程延遲時補跑;同一天同一個訊號只會開一次 issue,多跑不會重複通知。
    # 刻意避開整點跟半點:GitHub 排程在 :00、:30 最塞,2026-10-08 設 15:30 / 19:30 實際 22:49、隔天 01:56 才跑
    - cron: '47 7 * * 1-5'
    - cron: '47 11 * * 1-5'
    - cron: '13 14 * * 1-5'
  workflow_dispatch:   # Actions 頁面可以手動按「Run workflow」

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/signal-check.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
