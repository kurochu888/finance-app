<title>槓桿投資儀表板</title>
<style>
  :root{
    --bg:#e8ebf0; --card:#ffffff; --raised:#f4f6f9; --text:#1b1f27; --sub:#69707c;
    --line:#dfe3ea; --accent:#2563eb; --accent-soft:#dbeafe; --accent-ink:#ffffff;
    --green:#15803d; --green-soft:#dcfce7;
    --red:#b91c1c; --red-soft:#fee2e2;
    --amber:#b45309; --amber-soft:#fef3c7;
    --bar-track:#dde1e8;
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
    --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948; --s9:#9aa1ac;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b0d11; --card:#1c2029; --raised:#252a34; --text:#e8eaed; --sub:#9aa1ac;
      --line:#30353f; --accent:#4d8dff; --accent-soft:#1c2c4a; --accent-ink:#0b0d11;
      --green:#3ecf6a; --green-soft:#123a20;
      --red:#f87171; --red-soft:#3f1717;
      --amber:#f2b23a; --amber-soft:#3f2f0e;
      --bar-track:#2a2e37;
      --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
      --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s9:#6b7280;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b0d11; --card:#1c2029; --raised:#252a34; --text:#e8eaed; --sub:#9aa1ac;
    --line:#30353f; --accent:#4d8dff; --accent-soft:#1c2c4a; --accent-ink:#0b0d11;
    --green:#3ecf6a; --green-soft:#123a20;
    --red:#f87171; --red-soft:#3f1717;
    --amber:#f2b23a; --amber-soft:#3f2f0e;
    --bar-track:#2a2e37;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s9:#6b7280;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    display:flex; justify-content:center; padding:16px 10px;
    height:100vh; height:100dvh; overflow:hidden;
    font-variant-numeric:tabular-nums;
  }
  /* 框本身不長高,只有中間的內容捲動,上下兩排分頁列永遠看得到 */
  .phone{
    width:100%; max-width:430px; height:100%; background:var(--bg);
    border-radius:24px; box-shadow:0 8px 32px rgba(15,20,35,.14);
    overflow:hidden; display:flex; flex-direction:column;
    border:1px solid var(--line);
  }
  @media (max-height: 560px){ body{padding:0;} .phone{border-radius:0; border:none;} }
  @media (max-width: 359px){
    .erow{flex-wrap:wrap;}
    .erow .f-name, .erow .f-title{flex:1 1 100%;}
    .erow .f-amt{flex:1 1 auto; max-width:none;}
  }
  .topbar{
    flex:0 0 auto; padding:10px 6px 0; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:6px; background:var(--card);
  }
  .toptabs{
    flex:1 1 auto; display:flex; gap:2px; overflow-x:auto; scrollbar-width:none;
  }
  .toptabs::-webkit-scrollbar{display:none;}
  .top-tab{
    flex:1 0 auto; padding:8px 9px 9px; border:none; background:none; cursor:pointer;
    color:var(--sub); font-size:14px; font-family:inherit; white-space:nowrap;
    border-bottom:2px solid transparent; margin-bottom:-1px;
  }
  .top-tab.active{color:var(--accent); font-weight:700; border-bottom-color:var(--accent);}
  .topbar .date{flex:0 0 auto; font-size:11px; color:var(--sub); padding:0 8px 8px 2px;}
  .topbar .eye{flex:0 0 auto; border:none; background:none; cursor:pointer; font-size:15px; padding:0 2px 8px; opacity:.55;}
  .topbar .eye.on{opacity:1;}
  body.privacy .content input[type=number]:not(:focus){filter:blur(5px);}
  .content{
    flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:14px; padding-bottom:10px; overscroll-behavior:contain; overflow-x:hidden;
  }
  .tabbar{flex:0 0 auto; display:flex; border-top:1px solid var(--line); background:var(--card);}
  .tab-btn{
    flex:1; background:none; border:none; padding:9px 2px 11px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    color:var(--sub); font-size:11px; font-family:inherit;
  }
  .tab-btn .ic{font-size:17px; line-height:1.2;}
  .tab-btn.active{color:var(--accent); font-weight:700;}
  button:focus-visible, input:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:16px 15px; margin-bottom:14px;
    box-shadow:0 1px 2px rgba(15,20,35,.06), 0 8px 18px -14px rgba(15,20,35,.35);
  }
  .card h3{
    margin:0 0 12px; font-size:12px; color:var(--sub); font-weight:700;
    letter-spacing:.06em; padding-bottom:9px; border-bottom:1px solid var(--line);
  }
  /* 三層數字:主答案 → 次要指標 → 明細 */
  .big-num{font-size:28px; font-weight:800; margin:2px 0; letter-spacing:-.025em; line-height:1.15;}
  .mid-num{font-size:19px; font-weight:700; margin:2px 0; letter-spacing:-.015em;}
  .big-sub{font-size:12px; color:var(--sub); margin-bottom:6px; line-height:1.5;}
  .row{display:flex; justify-content:space-between; align-items:center; gap:10px; margin:7px 0;}
  .row .label{font-size:13px; color:var(--sub);}
  .row .val{font-size:13px; font-weight:600;}
  /* 次要明細:更小更淡,不跟重點搶 */
  .row.sub{margin:3px 0;}
  .row.sub .label, .row.sub .val{font-size:12px; color:var(--sub); font-weight:400;}
  .row.total{border-top:1px solid var(--line); padding-top:9px; margin-top:9px;}
  .row.total .label{color:var(--text); font-weight:700;}
  .row.total .val{font-size:15px; font-weight:800;}
  .muted{color:var(--sub); font-size:12px;}
  .pos{color:var(--green);} .neg{color:var(--red);}

  .bar-track{height:8px; border-radius:4px; background:var(--bar-track); overflow:hidden; margin:4px 0 2px;}
  .bar-fill{height:100%; border-radius:4px; background:var(--accent); transition:width .18s ease;}
  .bar-fill.over{background:var(--red);}
  @media (prefers-reduced-motion: reduce){ .bar-fill{transition:none;} }

  .badge{display:inline-block; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:700;}
  .badge.green{background:var(--green-soft); color:var(--green);}
  .badge.red{background:var(--red-soft); color:var(--red);}
  .badge.gray{background:var(--bar-track); color:var(--sub);}
  .badge.amber{background:var(--amber-soft); color:var(--amber);}

  .field{margin:8px 0;}
  .field label{display:block; font-size:12px; color:var(--sub); margin-bottom:4px;}
  input{
    width:100%; min-width:0; max-width:100%; padding:10px; border-radius:9px;
    border:1px solid var(--line); background:var(--raised); color:var(--text);
    font-size:16px; font-family:inherit; font-variant-numeric:tabular-nums;
  }
  .field.price-field input{ font-size:20px; font-weight:700; }
  /* iOS 的日期欄位自帶最小寬度,不關掉原生外觀就會撐破格子 */
  input[type="number"]{ -moz-appearance:textfield; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  input[type="date"]{
    -webkit-appearance:none; appearance:none;
    padding-right:8px; text-align:left; display:block;
  }
  input[type="date"]::-webkit-date-and-time-value{ text-align:left; margin:0; }
  input[type="date"]::-webkit-calendar-picker-indicator{ margin-left:auto; padding:0; }
  select{
    width:100%; min-width:0; max-width:100%; padding:10px; border-radius:9px; border:1px solid var(--line);
    background:var(--raised); color:var(--text); font-size:16px; font-family:inherit;
    appearance:none; -webkit-appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);
    background-position:calc(100% - 18px) 50%, calc(100% - 13px) 50%;
    background-size:5px 5px, 5px 5px; background-repeat:no-repeat;
  }
  input:focus, select:focus{outline:2px solid var(--accent); outline-offset:-1px;}
  select:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  .grid2{display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:9px;}
  .grid2 > *{min-width:0;}

  .erow{display:flex; gap:7px; align-items:center; margin-top:10px;}
  .erow{min-width:0;}
  /* 死寬度在窄螢幕會塞不下金額,改成兩欄一起分配空間,並給金額一個下限 */
  .erow .f-name{flex:1 1 90px; min-width:0;}
  .erow .f-code{flex:0 1 88px; min-width:64px;}       /* 股票代號 */
  .erow .f-title{flex:1 1 90px; min-width:0;}         /* 標的名稱 */
  .erow .f-amt{
    flex:0 1 128px; min-width:104px; max-width:150px;   /* 2026-10:以前 140~190,名稱欄被擠到只剩「00631L / 00」 */
    padding-left:8px; padding-right:8px; text-align:right;
  }
  .xbtn{
    flex:0 0 34px; height:38px; border-radius:9px; border:1px solid var(--line);
    background:var(--card); color:var(--sub); font-size:15px; cursor:pointer; font-family:inherit;
  }
  .xbtn:hover{color:var(--red); border-color:var(--red);}
  .xbtn.armed{flex:0 0 auto; padding:0 8px; font-size:12px; color:var(--red); border-color:var(--red); white-space:nowrap;}
  .xbtn.armed.cancel{color:var(--sub); border-color:var(--line);}
  .xbtn.step:hover{color:var(--accent); border-color:var(--accent);}
  .xbtn:disabled{opacity:.4; cursor:default;}
  .xbtn:disabled:hover{color:var(--sub); border-color:var(--line);}

  .btn{
    width:100%; padding:11px; border-radius:10px; border:1px dashed var(--line);
    background:none; color:var(--accent); font-size:14px; font-weight:600;
    font-family:inherit; cursor:pointer; margin-top:10px;
  }
  .btn.solid{
    border:none; background:var(--accent); color:var(--accent-ink); border-style:solid;
  }
  .btn.quiet{border-style:solid; color:var(--sub);}
  .btn.danger{border-style:solid; color:var(--red);}
  .why{
    display:inline-block; margin-top:10px; padding:0; border:none; background:none;
    color:var(--accent); font-size:12px; font-family:inherit; cursor:pointer;
  }
  .btn-row{display:flex; gap:8px;}
  .btn-row .btn{margin-top:8px;}

  /* 槓桿頁的小分頁固定在內容區頂端,滑動時不會跑掉 */
  .subtabs{
    position:sticky; top:0; z-index:3; background:var(--bg);
    margin:-14px -14px 12px; padding:12px 14px 10px;
    box-shadow:0 8px 10px -10px rgba(0,0,0,.35);
  }
  .subtabs .seg{margin:0;}
  .seg{display:flex; background:var(--bar-track); border-radius:9px; padding:3px; gap:3px;}
  .seg-btn{
    flex:1; padding:8px; border:none; border-radius:7px; background:none;
    color:var(--sub); font-size:14px; font-weight:600; font-family:inherit; cursor:pointer;
  }
  .seg-btn.on{background:var(--card); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.12);}

  .mnav{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:8px;}
  .mnav .mlabel{font-size:14px; font-weight:700;}
  .mnav button{
    width:36px; height:32px; border-radius:8px; border:1px solid var(--line);
    background:var(--card); color:var(--text); cursor:pointer; font-family:inherit; font-size:14px;
  }

  .tx{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line); cursor:pointer;}
  .tx:last-child{border-bottom:none;}
  .tx-cat{font-size:14px; font-weight:600;}
  .tx-desc{font-size:11px; color:var(--sub); margin-top:2px;}
  .tx-amt{font-size:15px; font-weight:700; white-space:nowrap;}
  .tx-amt.income{color:var(--green);}
  .tx-edit{padding:10px 0 14px; border-bottom:1px solid var(--line);}

  .alert{
    border-radius:14px; padding:13px 14px; margin-bottom:12px;
    border:1px solid; display:flex; gap:11px; align-items:flex-start;
  }
  .alert .ai{font-size:18px; line-height:1.15;}
  .alert .at{font-size:14px; font-weight:700; margin-bottom:3px;}
  .alert .ad{font-size:12px; line-height:1.65; opacity:.9;}
  .alert.red{background:var(--red-soft); border-color:var(--red); color:var(--red);}
  .alert.amber{background:var(--amber-soft); border-color:var(--amber); color:var(--amber);}
  .alert .go{
    margin-top:8px; padding:5px 11px; border-radius:8px; cursor:pointer;
    border:1px solid currentColor; background:none; color:inherit;
    font-size:12px; font-weight:700; font-family:inherit;
  }
  .sect{
    font-size:12px; font-weight:700; letter-spacing:.1em; color:var(--text);
    margin:24px 2px 10px; display:flex; align-items:center; gap:10px;
  }
  .sect::before{content:''; width:3px; height:13px; border-radius:2px; background:var(--accent);}
  .sect::after{content:''; flex:1; height:1px; background:var(--line);}
  .sect:first-child{margin-top:2px;}
  .doc h4{font-size:14px; font-weight:700; margin:18px 0 6px;}
  .doc h4:first-child{margin-top:0;}
  .doc p{font-size:13px; line-height:1.85; margin:6px 0;}
  .doc ul{margin:6px 0; padding-left:19px; font-size:13px; line-height:1.85;}
  .doc li{margin:3px 0;}
  .doc .formula{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:12px; line-height:1.7; background:var(--raised); color:var(--text);
    border-radius:8px; padding:10px 12px; margin:8px 0;
    overflow-x:auto; white-space:pre;
  }
  .doc em{color:var(--sub); font-style:normal;}
  .legend-dot{width:9px; height:9px; border-radius:3px; display:inline-block; margin-right:6px; vertical-align:-1px;}
  .empty{font-size:13px; color:var(--sub); text-align:center; padding:14px 6px; line-height:1.7;}

  .notice{
    font-size:12px; line-height:1.7; color:var(--sub); background:var(--raised);
    border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-top:12px;
  }
  details.tip{ margin-top:12px; }
  details.tip > summary{
    cursor:pointer; list-style:none; color:var(--accent); font-size:12px; font-family:inherit;
  }
  details.tip > summary::-webkit-details-marker{ display:none; }
  details.tip > summary::before{ content:'說明 ▸ '; }
  details.tip[open] > summary::before{ content:'說明 ▾ '; }
  details.tip .body{
    font-size:12px; line-height:1.7; color:var(--sub); background:var(--raised);
    border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-top:6px;
  }
  details.adv{ margin-top:10px; }
  details.adv > summary{
    cursor:pointer; list-style:none; font-size:12px; font-weight:700; color:var(--text);
  }
  details.adv > summary::-webkit-details-marker{ display:none; }
  details.adv > summary::after{ content:' ▸'; color:var(--sub); font-weight:400; }
  details.adv[open] > summary::after{ content:' ▾'; }
  details.adv > .body{ margin-top:10px; }
  .storage-status{
    font-size:11px; color:var(--sub); text-align:center; padding:7px 10px 5px;
    background:var(--card); border-top:1px solid var(--line);
  }
  svg text{font-family:inherit;}
  .bt-grid{width:100%; border-collapse:collapse; font-size:11px; margin-top:6px; font-variant-numeric:tabular-nums;}
  .bt-grid th, .bt-grid td{border:1px solid var(--line); padding:4px 3px; text-align:center; line-height:1.35;}
  .bt-grid th{color:var(--sub); font-weight:600; background:var(--raised);}
  .bt-grid td span{display:block;}
  .linkish{background:none; border:none; font:inherit; font-size:12px; cursor:pointer; color:inherit; text-align:left;}
  /* 收合區塊(fold()):整列可點,右邊 ▸ / ▾ */
  .fold-head{display:flex; align-items:center; gap:8px; width:100%; background:none; border:none; font:inherit; color:var(--text);
    cursor:pointer; text-align:left; padding:6px 0;}
  .fold-head .ft{font-size:14px; font-weight:700; white-space:nowrap; flex:0 0 auto; max-width:62%; overflow:hidden; text-overflow:ellipsis;}
  .fold-head .fs{font-size:12px; color:var(--sub); flex:1 1 0; min-width:0;}
  .fold-head .fi{font-size:12px; color:var(--sub); flex:0 0 auto; margin-left:auto;}
  .fold-body{margin-top:6px;}
  .update-banner{
    flex:0 0 auto; width:100%; border:none; cursor:pointer; padding:9px 12px; text-align:center;
    background:var(--accent); color:var(--accent-ink); font-size:13px; font-weight:700;
  }
</style>

<div class="phone">
  <button class="update-banner" id="updateBanner" hidden>🔄 有新版本,點這裡更新</button>
  <header class="topbar">
    <nav class="toptabs">
      <button class="top-tab active" data-tab="overview">總覽</button>
      <button class="top-tab" data-tab="assets">資產</button>
      <button class="top-tab" data-tab="leverage">槓桿</button>
      <button class="top-tab" data-tab="ledger">記帳</button>
      <button class="top-tab" data-tab="help">說明</button>
    </nav>
    <button class="eye" id="privacyBtn" aria-label="隱藏金額" title="隱藏金額">👁</button>
    <div class="date" id="todayDate"></div>
  </header>
  <main class="content" id="content"></main>
  <div class="storage-status" id="storageStatus"></div>
  <nav class="tabbar">
    <button class="tab-btn active" data-tab="overview"><span class="ic">📊</span><span>總覽</span></button>
    <button class="tab-btn" data-tab="assets"><span class="ic">🏦</span><span>資產</span></button>
    <button class="tab-btn" data-tab="leverage"><span class="ic">⚡</span><span>槓桿</span></button>
    <button class="tab-btn" data-tab="ledger"><span class="ic">📒</span><span>記帳</span></button>
    <button class="tab-btn" data-tab="help"><span class="ic">📖</span><span>說明</span></button>
  </nav>
</div>

<script>
/* ===================== 小工具 ===================== */
const uid = () => Math.random().toString(36).slice(2,9);
// 非有限值(NaN、Infinity、超出範圍的 1e309)一律當 0。以前只擋 NaN,隨機壓測抓到在淨資產歷史填 1e309
// 會把 Infinity 存進 state,整條走勢跟淨資產計算都壞掉;程式裡沒有任何欄位需要 Infinity,所以直接在這裡擋。
// 另外夾在 ±1 兆以內:1e308 這種有限但極大的值,乘上股數/槓桿就溢位成 Infinity,畫面出現「NaN%」
// (型別錯亂隨機測試抓到)。1 兆元/股遠超過任何實際數字,兩個相乘也不會溢位。
const NUM_MAX = 1e12;
const num = v => { const n = parseFloat(v); return Number.isFinite(n) ? Math.max(-NUM_MAX, Math.min(NUM_MAX, n)) : 0; };
// 快照裡存的是加總出來的值(淨資產、市值…),由已經夾過的輸入算出來,本身不會溢位,但可能超過 1 兆(負債填 1 兆
// 再加別的項目);讀回來時如果用 1 兆再夾一次,當下跟重新整理後的數字就對不起來。這些欄位用寬很多的 ±1000 兆:
// 輸入都在 1 兆以內,要上千項都填滿上限才碰得到;又不會讓匯入的 1e308 把走勢圖的範圍算成 Infinity、座標變 NaN。
const finNum = v => { const n = parseFloat(v); return Number.isFinite(n) ? Math.max(-1e15, Math.min(1e15, n)) : 0; };
// finiteNum:同上,但可以指定不合法時的預設值(normalize() 補均線參數這類欄位用)。
const finiteNum = (v, fallback) => { const n = num(v); return Number.isFinite(n) ? n : fallback; };
/* 隱藏金額(頁首 👁,在外面打開 app 不怕旁邊的人看到):所有金額都經過 fmt,這裡統一換成 ••••。
   只影響畫面;會存進資料的文字(例如自動新增動用的備註)用 fmtRaw,不然隱藏時記下來的就是 ••••。
   百分比、股價不遮(看不出身家)。輸入框裡的數字用 CSS 模糊,點進去編輯時才看得到。 */
let privacy = false;
try{ privacy = localStorage.getItem('financePrivacy') === '1'; }catch(e){}
const fmtRaw = n => (Math.round(n) || 0).toLocaleString('zh-Hant-TW');
const fmt = n => privacy ? '••••' : fmtRaw(n);
const money = v => (v < 0 ? '−' : '') + 'NT$ ' + fmt(Math.abs(v));   // 負數寫成「−NT$ 400,000」,不是「NT$ -400,000」
const fmtPct = n => (n >= 0 ? '+' : '') + n.toFixed(1) + '%';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad2 = n => String(n).padStart(2, '0');
function todayISO(){ const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
/* 診斷紀錄(2026-10 使用者要的):Claude 看不到手機上的真實資料,以前出錯、同步失敗、抓不到報價都只在畫面上閃一下。
   錯誤、同步、證交所、自動記帳這幾類事件記在這台裝置(localStorage DIAG_KEY,不進 state、不同步、不上傳),
   「資料」卡按「複製診斷報告」連同健康檢查(healthCheck)貼給 Claude 查。
   金額一律用 $n() 包成 ⟦…⟧ 存原值,複製那一刻才照 👁 決定要不要換成 ••••(隱藏時記的,之後打開金額再複製也看得到)。
   同一件事連續發生只加次數(×N),最多留 DIAG_MAX 筆。寫入失敗(空間滿)就算了,不能影響正常使用。 */
const DIAG_KEY = 'financeDiagLog_v1', DIAG_MAX = 400;
const $n = v => '⟦' + fmtRaw(v) + '⟧';
const diagMask = s => String(s).replace(/⟦([^⟧]*)⟧/g, (_, x) => privacy ? '••••' : x);
let diagCache = null, diagLastAct = '';
function diagLoad(){
  if (diagCache) return diagCache;
  try{ const a = JSON.parse(localStorage.getItem(DIAG_KEY) || '[]'); diagCache = Array.isArray(a) ? a.filter(x => x && typeof x.m === 'string') : []; }
  catch(e){ diagCache = []; }
  return diagCache;
}
function diag(kind, msg){
  try{
    const list = diagLoad(), d = new Date(), m = String(msg).slice(0, 600);
    const t = todayISO() + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
    const last = list[list.length - 1];
    if (last && last.k === kind && last.m === m){ last.c = (last.c || 1) + 1; last.t = t; }
    else list.push({ t, k: kind, m });
    if (list.length > DIAG_MAX) list.splice(0, list.length - DIAG_MAX);
    localStorage.setItem(DIAG_KEY, JSON.stringify(list));
  }catch(e){}
}
function diagClear(){ diagCache = []; try{ localStorage.removeItem(DIAG_KEY); }catch(e){} }
/* 合法的 YYYY-MM-DD 才收(2 月 30 日這種不存在的日期也擋),不合法就回傳 fallback。手機的日期選擇器本身
   打不出亂碼,但匯入的備份檔、雲端同步來的資料可能帶進任何字串;壞掉的日期會讓記帳的月份分組、
   利息天數算出 NaN(隨機壓測抓到「<b>x</b>年NaN月」),所以所有寫入日期的地方都先過這一關。 */
function isoDate(v, fallback = ''){
  const str = String(v == null ? '' : v).trim().slice(0, 10);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(str)) return fallback;
  const d = new Date(str + 'T00:00:00');
  if (isNaN(d.getTime())) return fallback;
  return (d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate())) === str ? str : fallback;
}
const thisMonth = () => todayISO().slice(0,7);
function monthLabel(m){ const p = m.split('-'); return p[0] + '年' + Number(p[1]) + '月'; }
function shortMonth(m){ return Number(m.split('-')[1]) + '月'; }
function shiftMonth(m, delta){
  const y = Number(m.slice(0,4)), mo = Number(m.slice(5,7)) - 1 + delta;
  const d = new Date(y, mo, 1);
  return d.getFullYear() + '-' + pad2(d.getMonth()+1);
}
function daysBetweenISO(a, b){
  const d1 = new Date(a + 'T00:00:00'), d2 = new Date(b + 'T00:00:00');
  if (isNaN(d1.getTime()) || isNaN(d2.getTime())) return 0;
  // 四捨五入成整天:手機時區有日光節約(出國)時,跨過切換日的那段會差一小時,算出 29.958 天,利息跟著有零頭
  return Math.max(0, Math.round((d2 - d1) / 86400000));
}
function daysSince(dateStr){
  if (!dateStr) return 0;
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d.getTime())) return 0;
  return Math.max(0, (Date.now() - d.getTime()) / 86400000);
}
function canon(v){
  if (Array.isArray(v)) return '[' + v.map(canon).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
  return JSON.stringify(v === undefined ? null : v);
}
const SERIES = ['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)','var(--s6)','var(--s7)','var(--s8)'];
const seriesColor = i => i < SERIES.length ? SERIES[i] : 'var(--s9)';

/* ===================== 預設狀態 ===================== */

     跟均線趨勢訊號的加碼層數(pyramidLevels)搭配用,見 computeExposurePlan()。

  ownBase: { exit:'', amount:0, auto:false }

/* 記帳的預設類別。之後在記帳頁選「新增類別…」加的,會經由交易紀錄進入清單 */
const DEFAULT_CATEGORIES = ['餐飲','房貸 / 房租','交通','娛樂','其他','房貸利息'];
/* 均線趨勢訊號的參數預設值:槓桿倍數 >=2(正2類)用較慢、較寬鬆的組合,
   避免被槓桿本身的波動洗出場;1倍(0050類)用稍快一點的組合。
   這兩組是使用者自己長期在用、驗證過樣本外表現的參數,不是隨便挑的。 */
/* 加碼層數上限:設定頁會照層數列出每一層的曝險目標,打錯成 99999999 會列一百兆格、整個設定頁當掉(隨機壓測抓到) */
const MAX_PYRAMID_LEVELS = 10;
function defaultTrendParams(leverage){
  const base = (num(leverage) >= 2)
    ? { maFast:120, maSlow:240, exitBuffer:0.90, recoverSlopeThreshold:1.002, recoverStrongRebound:1.03, pyramidGap:0.15, pyramidLevels:2 }
    : { maFast:100, maSlow:200, exitBuffer:0.95, recoverSlopeThreshold:1.002, recoverStrongRebound:1.03, pyramidGap:0.15, pyramidLevels:1 };
  return Object.assign(base, { lastSeenStatus:'', lastSeenLayers:-1, lastSeenDate:'' });   // 欄位順序跟 normalize() 一致,存檔往返才不會多出差異
}
const PRICE_HIST_KEEP = 1000;   // 約 4 年份,遠超過 240 日均線需要的長度

/* key 是內部識別碼,id 是股票代號 —— 代號可能空白或重複,不能拿來當 key */
const DEFAULT_INSTRUMENTS = [
  { id:'00631L', name:'元大台灣50正2',   leverage:2, price:0, shares:0, auto:true, trend:defaultTrendParams(2), priceHistory:[], splits:[], splitsAcked:[] },
  { id:'00675L', name:'富邦臺灣加權正2', leverage:2, price:0, shares:0, auto:true, trend:defaultTrendParams(2), priceHistory:[], splits:[], splitsAcked:[] }
];
// trend/priceHistory 是巢狀物件,Object.assign 只會淺拷貝參照 —— 每個新 instrument
// 都要有自己獨立的 trend/priceHistory,不能共用同一份 DEFAULT_INSTRUMENTS 底下的物件,
// 不然改一個標的的均線參數會意外改到共用預設值,下次重置資料就跑掉。
const newInstruments = () => DEFAULT_INSTRUMENTS.map(x => Object.assign({ key: uid() }, JSON.parse(JSON.stringify(x))));

function emptyState(){
  return {
    version:2,
    assets:[], liabilities:[], trades:[], dailyHistory:[],
    instruments: newInstruments(),
    budgets: DEFAULT_CATEGORIES.map(n => ({ id:uid(), name:n, budget:0 })),   // 類別清單
    transactions:[], netWorthHistory:[],
    templates:[],   // 固定收支範本(月薪、保險…),記帳頁按一下記到那個月,見 renderTemplates
    leverage: JSON.parse(JSON.stringify(DEFAULT_LEVERAGE))
  };
}

/* 內部 id/key 只收英數、底線、減號(app 自己產生的 uid() 跟舊版的 't1'、'core' 都符合)。
   id 會原樣放進 HTML 屬性(data-id="…"、data-k="aa-…"),匯入的備份檔或雲端資料如果帶了
   `"><img onerror=…>` 這種 id 就能在頁面裡執行程式——實測過 8 種 id 都能觸發,所以在這一關統一擋掉,
   不合格的換成新的 uid()。顯示給人看的文字(名稱、備註…)本來就都有 esc(),不受影響。 */
const safeId = v => { const str = String(v == null ? '' : v); return /^[A-Za-z0-9_-]{1,64}$/.test(str) ? str : uid(); };

/* 過去各段利率(見 rateAt):日期壞掉的不收,照日期排好,同一天只留最後一筆。理財型跟一般型房貸共用 */
function normalizeRateHistory(v){
  return (Array.isArray(v) ? v : []).filter(e => e && typeof e === 'object')
    .map(e => ({ id: safeId(e.id), until: isoDate(typeof e.until === 'string' ? e.until : '', ''), rate: Math.max(0, num(e.rate)) }))
    .filter(e => e.until)
    .sort((a, b) => a.until < b.until ? -1 : (a.until > b.until ? 1 : 0))
    .filter((e, i, arr) => i === arr.length - 1 || e.until !== arr[i + 1].until);
}
/* 負債細項設成「一般型房貸(本利攤還)」時的參數,null = 一般的負債(金額自己填)。
   有這個欄位時負債金額由 amortize() 算出來的剩餘本金自動更新。新版一定寫出 loan 這個 key(沒設就是 null),
   舊版分頁寫回來的沒有這個 key,keepFieldsOldVersionsDrop() 靠這個分辨。 */
function normalizeLoan(v){
  if (!v || typeof v !== 'object' || Array.isArray(v)) return null;
  return {
    principal: Math.max(0, num(v.principal)),
    start: isoDate(v.start, ''),                                      // 撥款日;之後每個月同一天繳款
    years: Math.min(50, Math.max(0, num(v.years))),
    annualRate: Math.max(0, num(v.annualRate)),
    rateHistory: normalizeRateHistory(v.rateHistory),
    autoInterest: v.autoInterest !== false,
    interestPosted: (Array.isArray(v.interestPosted) ? v.interestPosted : []).filter(m => typeof m === 'string' && isoDate(m + '-01', ''))
  };
}
function normalize(raw){
  const s = emptyState();
  if (!raw || typeof raw !== 'object') return s;
  const arr = v => Array.isArray(v) ? v : [];
  // 清單裡只收物件:匯入的備份檔/雲端資料只要有一筆是 null 或字串,以前讀 x.id 就丟例外,整份資料讀不進來
  // (型別錯亂隨機測試抓到);文字欄位只收字串或數字,不然物件會變成畫面上的「[object Object]」
  const objs = v => arr(v).filter(x => x && typeof x === 'object' && !Array.isArray(x));
  const str = v => typeof v === 'string' ? v : (typeof v === 'number' && Number.isFinite(v)) ? String(v) : '';
  s.assets = objs(raw.assets).map(a => ({ id:safeId(a.id), name:str(a.name), amount:num(a.amount) }));
  s.liabilities = objs(raw.liabilities).map(a => ({ id:safeId(a.id), name:str(a.name), amount:num(a.amount), loan: normalizeLoan(a.loan) }));
  // budgets 現在只當作記帳的類別清單(預算頁已移除,欄位保留以免舊資料的類別消失)
  if (Array.isArray(raw.budgets)) s.budgets = objs(raw.budgets).map(b => ({ id:safeId(b.id), name:str(b.name), budget:num(b.budget) }));
  // 有這個欄位就照收(包括使用者自己刪光的空清單);只有舊資料完全沒有這個欄位才補預設的兩檔。
  // 以前空清單也補預設,刪光標的之後重新整理又冒出 00631L/00675L(壓測比對「當下 vs 重新整理後」抓到的)
  if (Array.isArray(raw.instruments)){
    s.instruments = objs(raw.instruments).map(x => {
      // 0/負數不收(跟設定欄位 in-lev 一樣):匯入的資料帶負倍數,曝險會變成負的
      const leverage = num(x.leverage) > 0 ? num(x.leverage) : 1;
      const def = defaultTrendParams(leverage);
      const t = x.trend && typeof x.trend === 'object' ? x.trend : {};
      const out = {
        key: safeId(x.key),
        id: str(x.id).trim(),          // 代號可以先留空,不要亂數化
        name: str(x.name),
        leverage,
        price: Math.max(0, num(x.price)),
        shares: Math.max(0, num(x.shares)),
        auto: x.auto !== false,
        trend: {
          maFast: Math.max(1, Math.round(finiteNum(t.maFast, 0)) || def.maFast),   // 天數取整數,跟設定欄位一致
          maSlow: Math.max(1, Math.round(finiteNum(t.maSlow, 0)) || def.maSlow),
          exitBuffer: finiteNum(t.exitBuffer, 0) > 0 ? finiteNum(t.exitBuffer, def.exitBuffer) : def.exitBuffer,
          recoverSlopeThreshold: finiteNum(t.recoverSlopeThreshold, 0) > 0 ? finiteNum(t.recoverSlopeThreshold, def.recoverSlopeThreshold) : def.recoverSlopeThreshold,
          recoverStrongRebound: finiteNum(t.recoverStrongRebound, 0) > 0 ? finiteNum(t.recoverStrongRebound, def.recoverStrongRebound) : def.recoverStrongRebound,
          pyramidGap: finiteNum(t.pyramidGap, 0) > 0 ? finiteNum(t.pyramidGap, def.pyramidGap) : def.pyramidGap,
          pyramidLevels: Math.min(MAX_PYRAMID_LEVELS, Math.max(1, Math.round(finiteNum(t.pyramidLevels, 0) || def.pyramidLevels))),
          lastSeenStatus: str(t.lastSeenStatus),
          // 看過的時候已經接刀加碼到第幾層(-1 = 還沒記過)。只記狀態的話,接刀中從第 1 層加到第 2 層狀態都是
          // WAIT_RECOVER,提醒不會跳——照 🔔 執行的話兩次加碼都會漏掉
          lastSeenLayers: Number.isInteger(t.lastSeenLayers) && t.lastSeenLayers >= 0 ? t.lastSeenLayers : -1,
          lastSeenDate: str(t.lastSeenDate)
        },
        // 沒有 splits 欄位 = 舊版存下來的歷史:舊版逐月回補時會把分割前每個月的交界誤判成分割、
        // 抹掉那一天的真實漲跌(見 adjustForSplits),資料已經歪了又無從還原,只能清掉讓它自動重抓。
        priceHistory: objs(Array.isArray(x.splits) || x.auto === false ? x.priceHistory : [])
          .map(h => ({ d: isoDate(str(h.d), ''), c: Math.max(0, finiteNum(h.c, 0)) }))
          .filter(h => /^\d{4}-\d{2}-\d{2}$/.test(h.d) && h.c > 0 && Number.isFinite(h.c))
          .sort((a, b) => a.d < b.d ? -1 : (a.d > b.d ? 1 : 0))
          .filter((h, i, arr) => i === arr.length - 1 || h.d !== arr[i + 1].d)   // 同一天重複只留最後一筆
          .slice(-PRICE_HIST_KEEP),
        splits: normalizeSplits(x.splits),
        // 使用者已經處理過(換算過或確認不用換算)的分割日期,見 splitTradeIssues()
        splitsAcked: arr(x.splitsAcked).map(str).filter(d => isoDate(d))
      };
      applyKnownSplitRatios(out.id, out.priceHistory, out.splits);   // 反推比例存下來的舊歷史改成公告比例
      return out;
    });
  }
  s.trades = objs(raw.trades).map(t => ({
    id: safeId(t.id),
    date: isoDate(t.date, todayISO()),
    symbol: str(t.symbol) || '00631L',
    action: ['sell', 'dividend'].includes(t.action) ? t.action : 'buy',
    shares: Math.max(0, num(t.shares)),
    price: Math.max(0, num(t.price)),
    amount: Math.max(0, num(t.amount)),      // 配息領到的金額
    fee: Math.max(0, num(t.fee)),
    source: t.source === 'loan' ? 'loan' : 'cash',
    note: str(t.note)
  }));
  s.transactions = objs(raw.transactions).map(t => ({
    id:safeId(t.id), date:isoDate(t.date, todayISO()),
    cat:str(t.cat) || '其他', desc:str(t.desc), amount:num(t.amount)
  }));
  // 固定收支範本:金額帶正負號(收入正、支出負),跟 transactions 一樣
  s.templates = objs(raw.templates).map(t => ({ id: safeId(t.id), cat: str(t.cat) || '其他', desc: str(t.desc), amount: num(t.amount) }))
    .filter(t => t.amount);
  s.dailyHistory = objs(raw.dailyHistory)
    .map(h => ({
      d: isoDate(str(h.d), ''),
      pv: finNum(h.pv), loan: finNum(h.loan), eq: finNum(h.eq),
      pnl: h.pnl === undefined || h.pnl === null ? null : finNum(h.pnl)
    }))
    .filter(h => /^\d{4}-\d{2}-\d{2}$/.test(h.d))
    .sort((a, b) => a.d < b.d ? -1 : 1);
  s.netWorthHistory = objs(raw.netWorthHistory)
    .map(h => ({
      id: safeId(h.id),
      m: str(h.m).slice(0, 7),
      v: finNum(h.v),
      // 沒有資料是 null(存檔後就是 JSON 的 null,不是 undefined)——以前只認 undefined,重新整理後 null 變 0,
      // 走勢圖上沒有損益的月份變成一條 0 的線(隨機壓測比對「當下 vs 重新整理後」抓到的)
      pv: h.pv == null ? null : finNum(h.pv),        // 部位市值
      pnl: h.pnl == null ? null : finNum(h.pnl),     // 整體損益
      loan: h.loan == null ? null : finNum(h.loan),  // 借款餘額
      // 當月資產/負債細項(2026-09 起才有;更早的月份沒存過,是空陣列)。id 對應 assets/liabilities 的 id,
      // 改名也接得起來;t:'a' 資產、'l' 負債。

  }catch(e){ return ''; }
}

function readLocal(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
    const legacy = localStorage.getItem(LEGACY_KEY);
    if (legacy) return fromLegacy(JSON.parse(legacy));
    return null;
  }catch(e){ return null; }
}
function writeLocal(data){
  const json = JSON.stringify(data);
  try{
    localStorage.setItem(STORAGE_KEY, json);
    return true;
  }catch(e){
    // 空間不夠時,主資料一定要存得進去。先清可以重抓的回測完整歷史快取(雲端也有一份,記憶體裡這次也還在),
    // 再犧牲最舊的本機備份——以前只會刪備份,壓測看到主資料一大就把唯一一份備份刪掉、回測快取卻還佔著幾百 KB
    try{
      localStorage.removeItem(BACKTEST_HIST_KEY);
      localStorage.removeItem(INDEX_SIM_KEY);   // 加權指數模擬的快取也可以重抓(可拆)
      localStorage.removeItem(DIAG_KEY); diagCache = null;   // 診斷紀錄也比主資料不重要
      localStorage.setItem(STORAGE_KEY, json);
      return true;
    }catch(eBt){ /* 還是不夠,繼續刪備份 */ }
    try{
      const keys = [];
      for (let i = 0; i < localStorage.length; i++){
        const k = localStorage.key(i);
        if (k && k.indexOf(BACKUP_PREFIX) === 0) keys.push(k);
      }
      keys.sort();
      while (keys.length){
        localStorage.removeItem(keys.shift());
        try{ localStorage.setItem(STORAGE_KEY, json); return true; }catch(e2){ /* 再砍一份 */ }
      }
      // 最後才放掉離線修改的合併基準(見 SYNC_BASE_KEY):放掉的話下次打開是雲端整份蓋過來,但主資料這次一定要存得住
      localStorage.removeItem(SYNC_BASE_KEY);
      localStorage.setItem(STORAGE_KEY, json);
      return true;
    }catch(e3){ /* 連清都清不了 */ }
    diag('儲存', '存不進這台裝置(瀏覽器空間滿了),清掉快取跟備份也不夠');
    return false;
  }
}
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 400);
}
async function save(){
  const data = JSON.parse(JSON.stringify(state));
  if (lastSavedObj) recordTombs(lastSavedObj, data);
  lastSavedObj = data;
  if (canon(data) !== syncBase) rememberPendingBase();   // 推成功之前,這份修改只在本機
  const ok = writeLocal(data);
  if (cloud){
    try{
      lastPushed = canon(data);
      recentPushed = recentPushed.concat(lastPushed).slice(-8);
      const pushing = lastPushed, rev = uid();
      rememberRev(rev, pushing);
      myRevs.push(rev); if (myRevs.length > 16) myRevs.shift();
      await cloud.set(Object.assign({}, data, { _rev: rev, _parent: syncRev, _tomb: tombsWire() }));
      syncBase = pushing;
      syncRev = rev;
      if (canon(JSON.parse(JSON.stringify(state))) === pushing) forgetPendingBase();   // 推上去之後又改了的話先留著
      storageMode = 'cloud';
      updateStorageStatus();
      return;
    }catch(e){ diag('同步', '推上雲端失敗(先存本機,下次編輯再試):' + (e && e.message || e)); }
  }
  storageMode = ok ? 'local' : 'none';
  updateStorageStatus();
}
/* 主資料本身佔了多少空間(同樣粗估)。超過一半左右時,主資料加一份一樣大的備份就放不下了——
   這時存檔會把備份刪光來保住主資料,總用量反而掉回五成多,「快滿了」的提醒就不見了,
   使用者卻已經完全沒有本機備份(壓測看到的),所以要另外看這個比例。 */
function mainDataRatio(){
  try{ return ((localStorage.getItem(STORAGE_KEY) || '').length + STORAGE_KEY.length) * 2 / (5 * 1024 * 1024); }
  catch(e){ return 0; }
}
/* 本機空間用了多少(粗估,UTF-16 一個字兩個位元組) */
function localUsageRatio(){
  try{
    let chars = 0;
    for (let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      chars += k.length + (localStorage.getItem(k) || '').length;
    }
    return chars * 2 / (5 * 1024 * 1024);
  }catch(e){ return 0; }
}

/* 收到雲端資料:正在打字就先擱著,等游標離開欄位再套用 */
function onRemote(data){
  if (!data || !looksLikeState(data)) return;   // 壞掉的雲端資料不要拿來蓋本機
  const { clean, rev } = splitRev(data), c = canon(clean);
  // 自己的回音(包括晚到的舊回音)。有版本編號就認編號:別台推的內容剛好跟自己推過的一樣(例如兩邊都刪光)時,
  // 以前照內容當成回音忽略,那一版沒記下來,之後收到從那版改出來的就找不到共同基準,把本機新增的判成被刪掉(壓測抓到)
  if (rev ? myRevs.includes(rev) : (c === lastPushed || recentPushed.includes(c))) return;
  if (document.activeElement && document.activeElement.tagName === 'INPUT'){
    pendingRemote = data;
    return;
  }
  applyRemote(data);
}
function applyRemote(raw){
  clearPosMemo();
  const { clean: data, rev, parent, tomb } = splitRev(raw);
  const prev = state;
  // 按了刪除、還在 400ms 存檔延遲裡就收到雲端:這些刪除還沒記,先記下來,不然下面補齊時會從雲端那份補回來
  if (lastSavedObj) recordTombs(lastSavedObj, JSON.parse(JSON.stringify(prev)));
  mergeTombs(tomb);
  state = normalize(data);
  const restored = keepFieldsOldVersionsDrop(prev, data, state);
  const remoteC = canon(JSON.parse(JSON.stringify(state)));
  // 共同基準:雲端這份是從哪一版改出來的(見 knownRevs 的說明);不知道就用上次一致的那份
  let kept = mergeLocalEdits(prev, state, (parent && knownRevs.get(parent)) || syncBase);
  // 用 id 對應的清單照刪除紀錄補齊:兩邊有的都留、刪過的都刪(交叉合併時單一基準會判錯,見 tombs)
  if (reconcileTombs(state, normalize(data))){
    state = normalize(JSON.parse(JSON.stringify(state)));
    if (canon(JSON.parse(JSON.stringify(state))) !== remoteC) kept = true;
  }
  saveTombs();
  lastSavedObj = JSON.parse(JSON.stringify(state));
  syncBase = remoteC;
  syncRev = rev;
  rememberRev(rev, remoteC);
  if (!kept) forgetPendingBase();   // 本機沒有另外的修改了,這份就是雲端那份
  lastPushed = kept ? lastPushed : remoteC;
  writeLocal(state);
  if (restored || kept) scheduleSave();   // 補回來的東西/本機還沒推上去的修改推回雲端
  diag('同步', '收到別台裝置的改動' + (kept ? ',跟這台還沒推上去的修改合併' : '') + (restored ? ',補回舊版分頁丟掉的欄位' : ''));
  renderAll();
}
/* 收到別台裝置的改動時,本機可能有還沒推上去的修改:打字中收到的會先擱著、離開欄位才套用(那時剛打的字
   已經在 state 裡,但存檔還在 400ms 延遲裡),或是按鈕剛按完就收到。以前整份換成雲端那份,這些修改就不見了。
   以 syncBase(上次兩邊一致的內容)當共同基準做三方合併(merge3):只有本機改的用本機、只有雲端改的用雲端;
   清單逐筆用 id 對應(本機新增/修改/刪除的照本機,雲端新增/修改的照雲端),兩邊改到同一個值時以眼前這台為準。
   不能整個清單二選一:別台自動記的房貸利息(交易 + interestPosted)會被這台剛新增的交易整批蓋掉,
   interestPosted 卻留著,那筆利息就永遠不會再補記。回傳有沒有留下本機的東西。 */
function mergeLocalEdits(local, next, baseStr = syncBase){
  if (!baseStr || !local) return false;
  const localData = JSON.parse(JSON.stringify(local));
  if (canon(localData) === baseStr) return false;   // 從共同基準之後本機沒有另外的修改
  let base;
  try{ base = JSON.parse(baseStr); }catch(e){ return false; }
  const remoteData = JSON.parse(JSON.stringify(next));
  const merged = merge3(localData, base, remoteData);
  dropDuplicateAutoInterest(merged, remoteData, base);
  if (canon(merged) === canon(remoteData)) return false;
  const norm = normalize(merged);
  Object.keys(next).forEach(k => delete next[k]);
  Object.assign(next, norm);
  return true;
}
/* 兩台都開著、換月後各自補記當月房貸利息(maybePostInterest,開 app 或回到前景時):這台記完還沒推上去就收到別台記的,
   兩筆 id 不同、都是「新增的」,三方合併兩筆都會留,同一個月的利息記兩次(壓測抓到)。
   雲端已經有那個月的自動利息時,本機剛新增(基準裡也沒有)的同月自動利息丟掉,以雲端那筆為準。 */
const AUTO_INTEREST_DESC = '槓桿借款利息(自動記入)';
function dropDuplicateAutoInterest(merged, remote, base){
  const isAuto = t => t && t.desc === AUTO_INTEREST_DESC && typeof t.date === 'string';
  dropLocalCopies(merged, remote, base, 'transactions', t => isAuto(t) ? t.date.slice(0, 7) : null);
  // 每月快照同一個道理:兩台換月後各自建當月那筆(id 不同),合併後同一個月兩筆
  dropLocalCopies(merged, remote, base, 'netWorthHistory', h => h && typeof h.m === 'string' ? h.m : null);
}
/* merged[field] 裡「本機剛新增(雲端跟基準都沒有這個 id)、但雲端已經有同一個 key」的那幾筆丟掉 */
function dropLocalCopies(merged, remote, base, field, keyOf){
  const list = x => (x && Array.isArray(x[field]) ? x[field] : []);
  const remoteIds = new Set(list(remote).map(x => x && x.id)), baseIds = new Set(list(base).map(x => x && x.id));
  const remoteKeys = new Set(list(remote).map(keyOf).filter(k => k != null));
  if (!Array.isArray(merged[field]) || !remoteKeys.size) return;
  const now = Date.now();
  merged[field] = merged[field].filter(x => {
    const k = keyOf(x), drop = k != null && remoteKeys.has(k) && !remoteIds.has(x.id) && !baseIds.has(x.id);
    if (drop) tombs[field + '|' + mergeKey(x)] = now;   // 記成刪除,不然合併後的補齊(reconcileTombs)又會把它加回來
    return !drop;
  });
}
const mergeKey = x => (x && typeof x === 'object' && !Array.isArray(x))
  ? (x.id != null ? 'i:' + x.id : x.key != null ? 'k:' + x.key : x.d != null ? 'd:' + x.d : x.m != null ? 'm:' + x.m : null)
  : typeof x === 'string' ? 's:' + x : null;
function merge3(local, base, remote){
  const cl = canon(local), cb = canon(base), cr = canon(remote);
  if (cl === cb || cl === cr) return remote;
  if (cr === cb) return local;
  const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
  if (Array.isArray(local) && Array.isArray(remote)){
    const b = Array.isArray(base) ? base : [];
    const all = local.concat(remote, b);
    const keys = all.map(mergeKey);
    // 每一筆都認得出身分(id/key/日期/月份,或字串清單)才逐筆合併;數字清單(例如各層曝險目標)是照位置的,以本機為準
    if (!all.length || keys.some(k => k === null)) return local;
    const L = new Map(local.map(x => [mergeKey(x), x])), B = new Map(b.map(x => [mergeKey(x), x]));
    const out = [], seen = new Set();
    remote.forEach(r => {
      const k = mergeKey(r);
      if (seen.has(k)) return;
      seen.add(k);
      if (L.has(k)) out.push(B.has(k) ? merge3(L.get(k), B.get(k), r) : L.get(k));
      else if (!B.has(k)) out.push(r);            // 雲端新增的
      /* 本機刪掉的:不放回來 */
    });
    local.forEach(x => {
      const k = mergeKey(x);
      if (!seen.has(k) && !B.has(k)){ seen.add(k); out.push(x); }   // 本機新增的
    });
    return out;
  }
  if (isObj(local) && isObj(remote)){
    const b = isObj(base) ? base : {};
    const out = {};
    new Set([...Object.keys(remote), ...Object.keys(local)]).forEach(k => {
      if (!(k in local)) { if (!(k in b)) out[k] = remote[k]; return; }
      if (!(k in remote)) { if (!(k in b)) out[k] = local[k]; else if (canon(local[k]) !== canon(b[k])) out[k] = local[k]; return; }
      out[k] = merge3(local[k], b[k], remote[k]);
    });
    return out;
  }
  return local;
}
/* 還開著的舊版分頁存檔時,會把它不認得的欄位整個丟掉再寫回雲端(見 CLAUDE.md「常見的坑」)。
   每月快照的細項(items)丟了就補不回來,分割記錄(splits)丟了新版會把歷史價格清掉重抓——
   所以收到雲端資料時,如果某個欄位在雲端那份「根本不存在」(不是空的,是沒有這個欄位,只有舊版會這樣寫),
   而本機有,就保留本機的。新版寫出去的資料一定帶著這些欄位(normalize 會補),不會誤觸。回傳有沒有補。 */
function keepFieldsOldVersionsDrop(prev, raw, next){
  if (!prev || !raw) return false;
  let restored = false;
  const rawHist = Array.isArray(raw.netWorthHistory) ? raw.netWorthHistory : [];
  const remoteHasItems = new Set(rawHist.filter(h => h && Array.isArray(h.items)).map(h => String(h.m || '').slice(0, 7)));
  const prevItems = new Map((prev.netWorthHistory || []).filter(h => h.items && h.items.length).map(h => [h.m, h.items]));
  next.netWorthHistory.forEach(h => {
    if (!remoteHasItems.has(h.m) && prevItems.has(h.m)){
      h.items = JSON.parse(JSON.stringify(prevItems.get(h.m)));
      restored = true;
    }
  });
  // 固定收支範本(2026-10 加):舊版分頁寫回來沒有 templates 這個 key
  if (!Array.isArray(raw.templates) && (prev.templates || []).length){
    next.templates = JSON.parse(JSON.stringify(prev.templates));
    restored = true;
  }
  // 過去各段利率同理:舊版分頁不認得,寫回來整個不見,過去的利息又會照目前利率重算
  const rawL = raw.leverage && typeof raw.leverage === 'object' ? raw.leverage : null;
  if (rawL && !Array.isArray(rawL.rateHistory) && prev.leverage && (prev.leverage.rateHistory || []).length){
    next.leverage.rateHistory = JSON.parse(JSON.stringify(prev.leverage.rateHistory));
    restored = true;
  }
  // 每月還本的設定(千分之幾、開關、已處理月份)同理:舊版寫回來沒有 repayPosted 這個 key
  if (rawL && !('repayPosted' in rawL) && prev.leverage){
    ['autoRepay', 'repayPermille', 'repayPosted', 'payDay', 'payDayFrom'].forEach(k => {
      if (prev.leverage[k] !== undefined) next.leverage[k] = JSON.parse(JSON.stringify(prev.leverage[k]));
    });
    restored = true;
  }
  // 繳款日比還本晚加:認得 repayPosted、不認得 payDay 的版本寫回來也要補
  if (rawL && ('repayPosted' in rawL) && !('payDay' in rawL) && prev.leverage && prev.leverage.payDay !== undefined){
    next.leverage.payDay = prev.leverage.payDay;
    next.leverage.payDayFrom = prev.leverage.payDayFrom || null;
    restored = true;
  }
  // 接刀只用自有資金(2026-10 加):舊版分頁的 normalize 只留 byLayer/hold,寫回來會把模式跟自有資金比例、金額丟掉
  const rawET = rawL && rawL.exposureTargets && typeof rawL.exposureTargets === 'object' ? rawL.exposureTargets : null;
  if (rawL && (!rawET || !('mode' in rawET)) && prev.leverage && prev.leverage.exposureTargets && prev.leverage.exposureTargets.mode === 'own'){
    next.leverage.exposureTargets.mode = 'own';
    next.leverage.exposureTargets.ownByLayer = prev.leverage.exposureTargets.ownByLayer.slice();
    restored = true;
  }
  if (rawL && !('ownBase' in rawL) && prev.leverage && prev.leverage.ownBase && (prev.leverage.ownBase.amount || prev.leverage.ownBase.exit)){
    next.leverage.ownBase = JSON.parse(JSON.stringify(prev.leverage.ownBase));
    restored = true;
  }
  // 動用湊整(2026-10 加):舊版分頁寫回來沒有 drawRound 這個 key
  if (rawL && !('drawRound' in rawL) && prev.leverage && prev.leverage.drawRound){
    next.leverage.drawRound = prev.leverage.drawRound;
    restored = true;
  }
  // 改繳款日那個月的起算日更晚加:認得 payDay、不認得 payDayFrom 的版本寫回來會丟掉,那個月利息又會重複算或漏
  if (rawL && ('payDay' in rawL) && !('payDayFrom' in rawL) && prev.leverage && prev.leverage.payDayFrom){
    next.leverage.payDayFrom = JSON.parse(JSON.stringify(prev.leverage.payDayFrom));
    restored = true;
  }
  // 一般型房貸的參數放在負債細項的 loan 裡,舊版只留 id/name/amount
  const rawLiab = new Map((Array.isArray(raw.liabilities) ? raw.liabilities : []).filter(x => x && typeof x === 'object').map(x => [String(x.id), x]));
  next.liabilities.forEach(l => {
    const r = rawLiab.get(l.id), p = (prev.liabilities || []).find(x => x.id === l.id);
    if (r && !('loan' in r) && p && p.loan){ l.loan = JSON.parse(JSON.stringify(p.loan)); restored = true; }
  });
  const rawInst = new Map((Array.isArray(raw.instruments) ? raw.instruments : []).filter(x => x).map(x => [String(x.key || ''), x]));
  next.instruments.forEach(it => {
    const r = rawInst.get(it.key), p = (prev.instruments || []).find(x => x.key === it.key);
    if (r && !Array.isArray(r.splits) && p && p.id === it.id && Array.isArray(p.splits) && p.priceHistory && p.priceHistory.length){
      it.splits = JSON.parse(JSON.stringify(p.splits));
      it.priceHistory = JSON.parse(JSON.stringify(p.priceHistory));
      restored = true;
    }
  });
  return restored;
}

/* 第一次連上雲端:雲端有資料就拉下來,沒有就把本機的推上去 */
async function syncFirstTime(){
  try{
    if (!syncBase) syncBase = loadPendingBase();   // 上次關掉前有沒推上去的修改:拿當時的基準合併,不要整份被雲端蓋掉
    const remote = await cloud.get();
    storageMode = 'cloud';
    if (remote && !looksLikeState(remote)){
      await save();                              // 雲端那份不像本 app 的資料,用本機的覆蓋回去
    }else if (remote){
      applyRemote(remote);
    }else{
      await save();
    }
    cloud.onChange(onRemote);
    updateStorageStatus();
    maybeDailySnapshot();
    if (maybePostInterest() || maybeSnapshot()) renderAll();
    maybeBackup();
  }catch(e){
    cloud = null;
    storageMode = 'local';
    updateStorageStatus();
  }
  pullBacktestHistoryFromCloud();   // 跟主資料同步失敗與否無關,單獨試,失敗就算了
}

/* 回測完整歷史只在本機沒資料時才從雲端拉——本機已經有(不管是抓過還是剛從雲端拉過)
   就不覆蓋,避免拿舊的雲端資料蓋掉這台裝置剛抓好的新資料。 */
async function pullBacktestHistoryFromCloud(){
  if (!cloudBacktestDoc || Object.keys(backtestFullHistory).length) return;
  try{
    const remote = await cloudBacktestDoc.get();

    if (backtestHistBusy || Object.keys(backtestFullHistory).length) return;

      backtestFullHistory = remote.data;

/* ===================== 衍生計算 ===================== */
const sum = (list, f) => list.reduce((s, x) => s + f(x), 0);
const totalAssets = () => sum(state.assets, a => a.amount);
const totalLiab = () => sum(state.liabilities, l => l.amount);
const netWorth = () => totalAssets() - totalLiab();
const txOfMonth = m => state.transactions.filter(t => t.date.slice(0,7) === m);
function monthFlow(m){
  const tx = txOfMonth(m);
  const income = sum(tx.filter(t => t.amount > 0), t => t.amount);
  const expense = sum(tx.filter(t => t.amount < 0), t => -t.amount);
  return { income, expense, balance: income - expense };
}
function spentByCat(m){
  const map = {};
  txOfMonth(m).filter(t => t.amount < 0).forEach(t => { map[t.cat] = (map[t.cat] || 0) + (-t.amount); });
  return map;
}

function knownCats(){
  const list = [];

  state.budgets.forEach(b => add(b.name));

  return list;
}
