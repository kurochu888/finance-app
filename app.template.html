    <div class="sect">這個 app 在算什麼</div>
    <div class="card doc">
      <p>四件事:<strong>記錄</strong>每一筆收支與買賣、<strong>算出</strong>你的損益與曝險、
      <strong>提醒</strong>什麼時候該加碼或減碼、<strong>保存</strong>資料不會不見。</p>
      <p>所有數字都是你自己填的,app 只負責算。唯一會自己去外面抓的是股票收盤價。</p>
    </div>

    <div class="sect">損益怎麼算</div>
    <div class="card doc">
      <h4>成本用加權平均</h4>
      <p>每次買進把金額與手續費加進總成本,賣出時按<em>當下的平均成本</em>扣掉對應的部分。
      這跟台灣券商對帳單的算法一致。</p>
      <div class="formula">未實現損益 = 目前市值 − 剩餘持股成本
已實現損益 = 賣出淨額 − 賣出部分的平均成本
配息      = 計入已實現損益,不動持股成本與股數
整體損益  = 未實現 + 已實現 − 累積借款利息</div>
      <h4>為什麼一定要扣利息</h4>
      <p>借錢買股,利息每天都在跑。不扣的話,槓桿部位看起來會永遠比實際好看。
      利息從每一筆動用記錄的動用日算到今天,而且是<strong>依實際餘額分段計算</strong> ——
      你記了還款之後,只對剩下的部分繼續算。<strong>利率也分段</strong>:銀行調利率(升降息)時直接改「目前年利率」,
      已經借出去的錢今天以前照舊利率、今天起照新利率,過去的利息不會跟著重算;生效日不是今天的話,改「過去的利率」那段的日期。</p>
      <h4>手續費</h4>
      <p>留空的話自動用 0.1425%(最低 20 元)估算,賣出再加 0.1% 證交稅。填了就用你填的。</p>
    </div>

    <div class="sect">報酬率</div>
    <div class="card doc">
      <h4>年化報酬用 XIRR</h4>
      <p>你是不定期加碼的 —— 有時薪水、有時獎金、有時借房貸。如果用「總報酬率 ÷ 年數」,
      上個月才投入的錢會被當成放了兩年,數字沒有意義。</p>
      <p>XIRR 把每一筆進出<strong>按實際日期折現</strong>:</p>
      <div class="formula">自有資金買進 → 流出
房貸買進     → 0(錢是銀行出的)
賣出、配息   → 流入
還款、每月利息 → 流出
今天結清     → 流入 市值 − 借款餘額</div>
      <p>解出讓這些現金流現值歸零的年化報酬率。資料不足時顯示「—」,不會亂給數字。
      第一筆投入還不滿一年時也顯示「—」:兩週漲 10% 年化會超過 1000%、跌 10% 會變 −93%,短期間年化只會誤導,先看累計報酬。</p>
      <h4>淨投入 vs 累計投入</h4>
      <div class="formula">淨投入 = 累計自有投入 − 賣出回收 − 配息</div>
      <p>買賣來回幾次,「累計投入」會越滾越大,但你實際還放在裡面的錢沒變那麼多。
      淨投入才是「現在有多少自己的錢在裡面」。</p>
      <div class="formula">累計自有投入 = 自有資金買進 + 已還的房貸本金</div>
      <p>還房貸本金是自己口袋出的錢,用房貸買的持股就慢慢變成自有的,所以算進自有投入,「自有資金佔累計投入」也跟著變高
      (跟報酬率 XIRR 把還款算成自有資金流出是同一個看法)。利息是成本,已經從整體損益扣掉,不算投入。
      賣股的錢拿去還房貸的話,賣出回收扣一次、還款加一次,剛好抵銷。</p>
    </div>

    <div class="sect">曝險</div>
    <div class="card doc">
      <h4>正2 ETF 有兩層槓桿</h4>
      <p>00631L、00675L 這類正2 ETF 本身就是 2 倍;你再用房貸借錢買,等於兩層。
      每檔標的可以在<strong>「設定」分頁的「持股與報價」</strong>設定自己的槓桿倍數
      (正2 填 2、一般股票填 1)。</p>
      <div class="formula">實質市場曝險 = Σ(各標的市值 × 該標的槓桿倍數)
曝險比例     = 實質市場曝險 ÷ (部位淨值 + 房貸總額度)
部位淨值     = 部位市值 − 借款餘額        自己的錢
槓桿倍數     = 部位市值 ÷ 部位淨值</div>
      <h4>分母為什麼是這個</h4>
      <p>用「自己的錢 + 還能借的火力」當基準,不用淨資產 —— 房子和現金不會拿去接刀,
      真正的上限是額度。</p>
      <p>分母用<strong>部位淨值</strong>而不是部位市值:已借出的錢同時存在於部位與額度中,
      用市值會把它算兩次,比例看起來比實際安全。額度用得越多,分母越接近自有資金,
      比例會誠實地升高。</p>
      <p><strong>借款餘額含「已經買進、還沒撥款」的預定動用</strong>:用房貸買進記在成交日,股票當天就算進部位市值,
      動用日卻是交割日(T+2),那兩天銀行還沒撥款。只算已撥款的話,自己的錢會多算那筆、曝險比例偏低,
      所以房貸買進超過已撥款動用的部分,先用預定動用補上算進借款。單純先記下、還沒拿去買的預定動用不算。</p>
    </div>

    <div class="sect">槓桿頁怎麼逛</div>
    <div class="card doc">
      <p>槓桿頁分成四個小分頁,上方可以切換:</p>
      <ul>
        <li><strong>概況</strong> — 每天看這頁就好:最上面「今天要做什麼」把要處理的事列成一張卡(收盤價太舊、訊號改變、曝險要調整、分割、帳對不起來、一週內的扣款與預定動用),點了帶到對的分頁;沒事就不出現。下面是整體損益、年化報酬、曝險,以及兩張走勢圖</li>
        <li><strong>訊號</strong> — 今天該不該動:均線趨勢訊號、正2 曝險目標、壓力測試,一次看完;最下面「回測與研究」(策略回測、加權指數模擬 2000/2008、指定期間)平常收著,點了才展開</li>
        <li><strong>紀錄</strong> — 買賣、房貸動用、還款,記完就走</li>
        <li><strong>設定</strong> — 很少要動的:持股代號與報價、均線趨勢參數、曝險目標、房貸額度與利率</li>
      </ul>
    </div>

    <div class="sect">整體邏輯</div>
    <div class="card doc">
      <p>用房屋擔保額度買槓桿部位,不是券商融資——大盤再怎麼跌,只要利息付得出來,
      部位就不會在最差的時間點被迫賣掉。所以這裡真正要處理的風險,不是「會不會斷頭」,
      而是<strong>「會不會抱著一個被複利耗損吃掉的槓桿部位,等上超乎預期的時間」</strong>。</p>
      <p>判斷該不該動的,是「訊號」分頁的<strong>均線趨勢訊號</strong>(現在該續抱還是該跑)跟
      <strong>正2 曝險目標</strong>(該投入/該減碼多少錢)這兩層;真正借了多少、什麼時候借的,
      記在「紀錄」分頁的<strong>房貸動用記錄</strong>裡——這是純粹的帳本,不判斷該不該借,
      借款餘額跟利息都是從這本帳算出來的。</p>
    </div>

    <div class="sect">訊號怎麼接到實際買賣</div>
    <div class="card doc">
      <p><strong>訊號分頁只是判斷依據,不會自動下單、不會自動動用或償還房貸。</strong>
      真正的錢要不要動,永遠是你自己決定,程式只負責把訊號算給你看。</p>
      <h4>看到買進訊號(RECOVER / ADD,或曝險目標卡片顯示該加碼)</h4>
      <p>先在現實裡真的買進,再回來<strong>「紀錄」分頁</strong>記一筆買進。如果這筆錢是房貸借來的,
      買賣紀錄的來源要選「房貸借款」(一部分自己的錢、一部分房貸的話選「兩者都有」,填房貸出的金額,
      會照比例拆成自有、房貸兩筆紀錄,手續費也照股數分),同時在<strong>同一個分頁的「房貸動用記錄」</strong>把對應那筆
      的動用日期與金額更新——借款餘額跟利息都是從動用記錄算出來的,不是從買賣紀錄自動推算,
      這兩邊要自己保持一致。「借款與利息」卡片會在兩邊金額對不起來時跳提醒,可以拿來對帳。</p>
      <h4>看到出場訊號(EXIT,或曝險目標卡片顯示已超過目標)</h4>
      <p>賣掉之後一樣要到「紀錄」分頁記一筆賣出。<strong>賣出的錢要不要拿去還房貸,是你自己的選擇</strong>:
      想降低借款餘額就記一筆還款;想留著現金等下次 RECOVER 訊號再買回,就先不記還款。</p>
      <p>簡單說:趨勢訊號的每一層加碼(ADD),對應到現實裡就是一次動用房貸額度的買進;每一次 EXIT,
      就是一次要不要順便還款的賣出決定。哪一筆買賣該算進哪一筆動用記錄,目前完全靠自己記得住,
      程式不會幫忙配對。</p>
    </div>

    <div class="sect">均線趨勢訊號</div>
    <div class="card doc">
      <p>回答「手上已經有的部位,現在該續抱還是該跑」,跟房貸動用與否無關。
      每檔標的用自己的快線(短天期均線)與慢線(長天期均線)判斷三種狀態:</p>
      <ul>
        <li><strong>HOLD</strong> — 價格站上快線、趨勢確認,續抱</li>
        <li><strong>WAIT_RECOVER</strong> — 出場後還沒重新站上趨勢,依「加碼間距」分批試水</li>
        <li><strong>WATCH</strong> — 歷史價格不夠(還沒回補,或標的太新),算不出均線</li>
      </ul>
      <div class="formula">HOLD 時:收盤 &lt; 快線 × 出場緩衝 → 出場,轉入 WAIT_RECOVER
非 HOLD 時:站回快線且斜率轉正,或強力反彈 → 一次補滿倉位,轉入 HOLD(優先判斷)
           否則,跌破「加碼間距」且還沒加滿層數 → 加碼一層,維持 WAIT_RECOVER</div>
      <p>五個參數各自在管什麼:</p>
      <ul>
        <li><strong>快線/慢線天數</strong>(正2 預設 120/240,1倍標的預設 100/200)——決定多久算一次趨勢,
        天數越長訊號越慢但越不容易被短期雜訊晃動。HOLD/EXIT 只看快線;慢線只當「接刀門檻」的參考之一。</li>
        <li><strong>出場緩衝</strong>(預設 0.90)——HOLD 中不是跌破快線就跑,是要跌破「快線 × 0.90」才算真的破位,
        留一段緩衝不被單日雜訊洗出場。</li>
        <li><strong>回歸斜率門檻</strong>(預設 1.002)——光是收盤價站上快線還不夠,快線本身也要是真的在往上走
        (今天快線 ≥ 昨天快線 × 1.002),排除快線還在下彎、只是價格短暫站上去的假訊號。</li>
        <li><strong>強力反彈門檻</strong>(預設 1.03)——反彈夠猛的話(收盤衝到快線的 103% 以上)不用等斜率確認,
        直接判定 RECOVER,用來抓急殺急拉、均線來不及反應的 V 型反轉。</li>
        <li><strong>加碼間距</strong>(預設 15%)與<strong>加碼層數上限</strong>(正2 預設 2 層)——WAIT_RECOVER 時,
        每跌破「基準價」(上一次動作那天的收盤價,跟慢線取較低者)再 15%,加碼一層,最多加到層數上限,
        之後再跌也不再加碼,留著子彈等真正的 RECOVER。</li>
      </ul>
      <p>舉例(00631L,快線恰好 100):HOLD 中續抱,收盤跌到 89(跌破快線 × 0.90 = 90)觸發 EXIT,
      轉入 WAIT_RECOVER,基準價記為 89。之後續跌到 89 打 85 折 ≈ 75.65 以下,觸發第一次 ADD,
      基準價更新為當天收盤;再跌 15% 觸發第二次 ADD(正2 加碼層數上限是 2,到此不再加碼)。
      之後如果收盤衝到快線 103% 以上、或連兩天站上快線且快線轉為上揚,判定 RECOVER,轉回 HOLD、曝險調到續抱目標(通常是補滿;接刀最後一層的目標設得比續抱高的話,這時反而是減碼),
      加碼層數歸零,整個循環重新開始。同一天如果 RECOVER 和 ADD 的條件都成立,只會回報 RECOVER。</p>
      <p><strong>EXIT 只在 HOLD 狀態下才會檢查</strong>——加碼到層數上限之後,曝險目標(見下面「正2 曝險目標」)
      其實已經可能跟 HOLD 一樣滿、甚至更高,但只要狀態還沒真的轉成 HOLD,就不會有任何自動停損檢查,
      會一路抱著等 RECOVER,不會因為之後又繼續下跌就跳出減碼建議。這是刻意的設計取捨(用房貸不怕斷頭,
      不想在還沒確認真正反轉之前就跟著雜訊反覆進出),不是判斷邏輯漏了這段。</p>
      <p>這裡每次都是拿完整的歷史價格<strong>從頭重新回放一次整個狀態機</strong>,不是把「現在狀態」存起來
      逐日累加更新——所以在「設定」分頁改了均線參數之後,所有標的的狀態會立刻用新參數重新算過一遍,
      不會有「改了參數但舊狀態沒跟著換」這種情況。</p>
      <p>均線需要的歷史收盤價,在<strong>「設定」分頁</strong>按「從證交所更新收盤價」就好——
      歷史不夠時會自動一併回補(逐月依序抓,不會同時對證交所發一串請求),
      不用特地跑去「訊號」分頁按「回補歷史價格」;之後每次更新報價會順便累積,不用常按。
      快線/慢線天數、出場緩衝、加碼間距與層數都可以在<strong>「設定」分頁</strong>每檔標的自己調,
      改壞了按「重設為預設值」就好。</p>
      <p><strong>這只是訊號顯示,不會自動下單。</strong>該買該賣一樣要自己到「紀錄」分頁記一筆——
      這個分頁只負責告訴你現在是什麼狀態、收盤再跌多少就會跌破出場線。</p>
    </div>

    <div class="sect">正2 曝險目標</div>
    <div class="card doc">
      <p>趨勢訊號告訴你「該不該動」,但沒告訴你「該投入多少錢」——曝險目標補這一塊,只管正2
      (槓桿倍數剛好等於 2 的標的),用「總覽」頁本來就有的曝險比例公式當標準:</p>
      <div class="formula">曝險比例 = (各標的市值 × 槓桿倍數的總和) ÷ (部位淨值 + 房貸總額度)</div>
      <p>兩檔正2 各自算「進度」——0 表示還沒進場或剛出場、1 到 N 表示加碼到第幾層(N 是加碼層數上限)、
      N+1 表示已經確認 HOLD——<strong>取兩檔裡比較保守(數字較小)的那個</strong>當整組現在的階段,
      因為兩檔經濟上幾乎是同一個賭注,一檔先轉弱就該一起保守,不各自獨立判斷。每個階段對應的目標曝險比例
      在<strong>「設定」分頁的「曝險目標設定」</strong>可以調。</p>
      <p>算出目標曝險金額後,拿現在的部位淨值去反推「該投入多少錢」,給兩個方案:</p>
      <ul>
        <li><strong>方案A(現金)</strong>——自己拿新的錢出來買,等於幫這個部位多墊一筆本金(像買房付頭期款),
        部位淨值會跟著漲</li>
        <li><strong>方案B(房貸)</strong>——不拿新錢,直接借房貸額度買,買的東西(市值)跟欠的錢(借款餘額)
        一起增加、互相抵銷,部位淨值不會漲</li>
      </ul>
      <p>同樣的目標曝險比例,方案A 因為部位淨值也跟著墊高,分母跟著變大,要投入的金額會比方案B 多——
      不是算錯,是這兩種資金對「自己在這個部位裡佔多少」的影響本來就不一樣。實際要用哪個、還是兩個混著用,
      自己決定,這個分頁不會幫你自動借款或下單。差額算出來是負的,代表目前曝險已經超過目標,顯示成減碼——
      減碼也分兩種:<strong>賣了拿去還房貸</strong>(方案B,賣得少)跟<strong>賣了留著當現金</strong>(方案A,現金不算在分母裡,要賣得多);
      照哪個方案賣,就要照那個方案的金額,不然曝險降不到目標。目標是 0%(出場)時兩者一樣。</p>
      <p><strong>HOLD 的目標只在剛轉成 HOLD 時調整一次。</strong>兩檔都轉成 HOLD 時,卡片會顯示調整到目標要投入(或減碼)多少,
      調整完按「已調整完成」(或狀態提醒上的「知道了」)。之後整段續抱期間<strong>不做再平衡</strong>——漲上去曝險會跟著變高、
      跌下來會變低,都不提示加碼或減碼,只顯示目前的曝險比例,等出場訊號(EXIT)再動作。
      <strong>接刀的每一層也一樣</strong>:剛接到第 1、第 2 層時給一次金額,調整完按「已調整完成」,之後這一層漲跌都不再提示,
      等下一層、轉回續抱或出場。出場(目標 0%)的減碼金額則是賣完之前一直顯示。</p>
      <p><strong>接刀只用自有資金(可選):</strong>「設定」分頁的「接刀各層怎麼算」選「只用自有資金」時,接刀各層不看曝險比例,
      改成「出場後買進正2 的錢」對照「接刀用的自有資金 × 這一層的 %」(例如 50、100:第一層用一半、第二層用完),只用自己的錢、不動用房貸;
      轉回續抱時才照「兩檔都 HOLD」的曝險比例動用房貸。app 不知道帳戶裡的現金,所以出場那一刻記下當時的部位淨值
      (正2 市值 − 借款,就是賣光、還完房貸後手上的錢;0050 這類 1 倍標的照自己的訊號,不算進來)當作接刀用的自有資金;打開 app 前已經記了賣出的話,賣得的錢會算回來;接刀途中才打開(已經買過)、或賣光了卻沒記賣出時記不到,卡片會請你自己填,
      要加上存款也可以直接改。曝險比例的分母含房貸額度,用固定 % 設「不借錢」,自有資金變多之後就不準了,這個模式就是為了這個。</p>
      <p><strong>什麼時候會跳 🔔 提醒:</strong>跌破出場線(續抱 → 接刀中)、接刀中加碼到下一層、轉回續抱,這三種都會跳,
      總覽頁跟訊號分頁都看得到;照著做完按「知道了」。價格歷史中間缺了一段(例如一個多月沒打開 app)時,均線會算錯,
      這時不給訊號也不跳提醒,更新收盤價會自動補齊。</p>
      <p><strong>正2 分割之後:</strong>價格歷史會自動還原,但「紀錄」分頁的買賣紀錄如果是分割前的股數跟價格,持股會少算。
      偵測到分割、而且分割日之前有買賣紀錄時,總覽跟訊號分頁會跳 ✂️ 提醒,選「幫我換算」(股數 × N、價格 ÷ N,成本不變)
      或「已經是分割後的數字」;處理完之前曝險目標卡不給金額。</p>
    </div>

    <div class="sect">借款與還款</div>
    <div class="card doc">
      <div class="formula">借款餘額 = 各筆動用記錄的金額 − 已還款
每天利息 = 當天借款餘額 × 年利率 ÷ 365</div>
      <p>看到買進訊號、實際動用房貸買進之後,到<strong>「紀錄」分頁的「房貸動用記錄」</strong>
      填動用日期與金額(可以順便記下買了什麼)——填了才會計入借款餘額、利息(填未來的日期就等到那天才計入)。在「記一筆買賣」用房貸買進時,預設會順便新增一筆動用:金額 = 用房貸的那部分(含手續費),之前借了沒用完的(動用合計 − 用房貸買進的合計)會先扣掉、不夠的才新增,
      「設定」分頁可以選金額湊整到千元或萬元(自己先轉整數到交割戶的話),多借的下次先扣,動用日 = T+2 交割日(跳過週末跟證交所公布的休市日;還沒抓到那年的休市日時只跳週末);已經先記過動用的話,點「同時新增房貸動用」那顆按鈕關掉。銀行實際撥款日不一樣,到「紀錄」分頁改。
      減碼還錢之後<strong>要記一筆還款</strong>,否則餘額不會減、利息會一直累積、曝險也會失真。
      還款一樣記在「紀錄」分頁:選哪一筆動用記錄、填日期與金額,下面會列出所有還款,
      可以修改或刪除,每筆的動用/已還/尚欠也一併顯示。</p>
      <p>全部還清後不再計息,但動用紀錄與還款歷史都保留。</p>
      <p>年利率是你填的假設值,實際以銀行核定為準。打開「每月自動記入支出」的話,
      每月會在記帳自動產生一筆「房貸利息」;整個月沒打開 app 的話,下次打開時會把漏掉的月份補上。
      利息記在每月繳款日(「設定」分頁填幾號,預設 1 號),繳款日還沒到不記;金額跟銀行一樣以日計息:
      每筆動用從上次繳款日到這次繳款日,每天的餘額 × 年利率 ÷ 365 加總,中途還款、動用、升降息都照日期分段。
      你把某個月那筆刪掉,那個月不會被補記。</p>
      <p><strong>每月最低還本</strong>:理財型房貸每月要還一部分本金。「設定」分頁「借款與利息」填千分之幾(預設 5),
      每月繳款日(跟利息同一天)會在每筆動用底下自動記一筆還款 = 那天的剩餘餘額 × 千分之幾(所以金額逐月遞減),標「自動」。
      繳款日填 31 號、那個月沒有 31 號就記在月底;改繳款日時本月已經記的那幾筆會一起搬到新日期。
      動用當月不還、下個月起;那個月已經自己記過還款就不另外記;刪掉自動那筆不會補回;沒開 app 的月份下次打開補記。
      還掉的本金額度會恢復(循環額度),所以只減借款餘額、不動額度上限。還本不算支出、不進記帳,
      但報酬率(XIRR)把它算成自有資金流出。「本月要繳」= 本月最低還本 + 這期利息;月中自己多還的不算在要繳裡。</p>
      <p><strong>一般型房貸(本利攤還)</strong>:「資產」分頁的負債項目點「本利攤還 ▸」,填原始貸款金額、
      撥款日、年限、目前年利率,這一項的金額就自動等於剩餘本金(之後每月同一天繳一期,沒有那天就是月底)。
      每期月付 = 餘額 × r ÷ (1 − (1 + r)<sup>−剩餘期數</sup>),r = 年利率 ÷ 12;升降息時改「目前年利率」(離開欄位才生效),
      今天以前照舊利率,之後用剩餘本金、剩餘期數、新利率重算月付。每期利息在扣款日自動記一筆「房貸利息」
      (可以關掉;第一次只從本月開始,不回頭補撥款以來的),還本只減負債。總覽會列「本月房貸要繳」。</p>
    </div>

    <div class="sect">報價</div>
    <div class="card doc">
      <p>資料來源是<strong>臺灣證券交易所公開資訊</strong>,抓的是<strong>最近一個交易日的收盤價</strong>,
      不是盤中即時報價。上市櫃代號都查得到。</p>
      <p>開啟 app 時自動更新(一小時最多一次),也可以手動按「從證交所更新收盤價」。
      超過 5 天沒更新會提醒你 —— 因為損益、曝險、曝險目標全都是用那組價算的。</p>
      <p><em>股數不會自動抓。</em>有買賣紀錄的話由紀錄自動加總,沒有的話要自己填。</p>
    </div>

    <div class="sect">壓力測試</div>
    <div class="card doc">
      <p>輸入假設的大盤跌幅,各標的<strong>依自己的槓桿倍數</strong>換算(正2 跌兩倍),
      算出部位市值、部位淨值、曝險比例的前後對照,並拿這個情境下的曝險比例對照目前正2 曝險目標的目標值,
      看是還在目標之內還是會超過。</p>
      <p><em>沒有計入正2 ETF 的波動耗損與追蹤誤差,實際下跌時通常比這裡算的更差。</em></p>
    </div>

    <div class="sect">資料存在哪</div>
    <div class="card doc">
      <p>${STORAGE_NOTE}</p>
      <ul>
        <li><strong>每日快照</strong>:每天第一次開啟、或按「從證交所更新收盤價」時記一筆
        (部位市值、借款餘額、自己的錢、整體損益)。同一天會更新到最新,不會累積。
        槓桿頁「概況」的兩張走勢圖就是用這個畫的,各自的圖上方可切 1 個月 / 3 個月 / 1 年 / 全部,
        兩張圖共用同一個範圍。<strong>圖上任一處都可以點</strong>,會顯示那一天的日期與各條線的數值,
        並畫出垂直游標線。累積不到兩天時會顯示「還在等資料」而不是空白的圖。
        保留最近 1000 個交易日,約四年。</li>
        <li><strong>每月快照</strong>:每月第一次開啟自動記一筆(淨資產、部位市值、借款餘額、
        整體損益),當月之內每次開啟或改資產/負債都會更新,過了月份就固定。總覽的淨資產可以手動改,
        本月改過就不再自動更新,旁邊會出現「改回自動」。總覽的淨資產走勢用這個畫;每日紀錄還不夠兩筆時,槓桿頁的圖也會退回用它。
        沒開過 app 的月份會留空,間隔才不會失真。</li>
        <li><strong>每日備份</strong>:每天第一次開啟存一份完整快照,可在總覽的「資料」卡還原。
        雲端留 30 份;本機的份數會隨資料量遞減(一般 7 份,資料超過 150KB 留 5 份、超過 300KB 留 3 份),
        因為手機瀏覽器的空間有限,備份佔太多會讓主資料存不進去。空間用超過 75% 時會提醒你。</li>
        <li><strong>複製診斷報告</strong>:錯誤、雲端同步、抓報價失敗、自動記帳(還本、利息、自動新增的動用)這些事件會記在這台裝置
          (不同步、不上傳,最多約 400 筆),加上用你的真實資料跑的健康檢查(房貸動用跟買進對不對得上、自動記帳有沒有漏月、價格歷史有沒有缺口…),
          一起複製成文字貼給 Claude 查問題。金額照 👁 開關:隱藏時報告裡也是 ••••,要對帳就先顯示金額再複製。</li>
        <li><strong>匯出備份</strong>:JSON,換裝置時用「匯入備份」讀回來。
        匯入前會先確認檔案是本 app 匯出的,不相干的 JSON 會被擋下來,
        匯入成功則會回報讀進了幾筆。</li>
        <li><strong>匯出 CSV</strong>:給 Excel 看的,九張表放同一個檔。單向,不能匯回。</li>
      </ul>
      <p>資產分頁的每一筆是<strong>現況</strong>,改了就覆蓋,不會保留舊值;
      歷史只有「每月一筆」的快照這個層級。</p>
    </div>

    <div class="sect">其他小功能</div>
    <div class="card doc">
      <ul>
        <li><strong>固定收支</strong>(記帳頁)— 月薪、保險這類每月一樣的,存成範本,每月按「記到 X月」記一筆到正在看的月份,
        一個月只會記一次。刻意不自動記:按了才算數,金額不一樣當月改那筆就好。點範本可以改金額/類別/說明,只影響之後記的。</li>
        <li><strong>隱藏金額</strong>(頁首 👁)— 所有金額換成 ••••、輸入框模糊,在外面打開時用。每台裝置各自記。</li>
        <li><strong>年度總結</strong>(總覽)— 一年的收支、淨資產變化(去年 12 月的快照到今年最新)、投資進出、房貸利息與還本。</li>
        <li><strong>收盤後自動檢查</strong> — 每個交易日收盤後,GitHub Actions 用<em>預設</em>標的與<em>預設</em>訊號參數算一次均線訊號,
        狀態改變、或續抱中離出場線不到 5% 時開 GitHub issue 通知。在這裡改過訊號參數的話,以 app 為準。</li>
      </ul>
    </div>

    <div class="sect">畫面上的提醒</div>
    <div class="card doc">
      <p>看到黃色或紅色的提示框時,意思是:</p>
      <ul>
        <li><strong>兩邊的房貸金額對不起來</strong> — 動用記錄的動用總額,和買賣紀錄裡標成「房貸借款」的
        買進金額差超過 2%。可能是借了還沒買、或買進時忘了選資金來源。利息與曝險以動用紀錄為準。</li>
        <li><strong>有一筆賣出超過當時的持股</strong> — 超出的部分沒有計入損益(不然會憑空多出獲利)。
        檢查股數或日期是不是填錯。</li>
        <li><strong>代號和上面某一列重複了</strong> — 兩列填了同一個股票代號,重複的那列不計入市值,
        否則買賣紀錄會被算兩次。</li>
        <li><strong>報價已經 N 天沒更新</strong> — 損益、曝險、曝險目標都是用那組舊價算的,按更新抓最新的。</li>
        <li><strong>這台裝置的瀏覽器空間快滿了</strong> — 備份份數會自動減少以保住主資料,
        建議登入 Google 帳號改用雲端,或先匯出一份留底。</li>
      </ul>
    </div>

    <div class="sect">免責</div>
    <div class="card doc">
      <p>用房屋擔保額度做槓桿投資,會把投資虧損直接連到房子與每月現金流。
      這個 app 的所有計算都是<strong>簡化試算</strong>,不構成投資或貸款建議。
      實際動用資金前請與銀行確認正式條件。</p>
    </div>
    <div class="muted" style="text-align:center; margin-top:16px;">建置版本 ${BUILD_VERSION}</div>`;
}

/* ===================== 槓桿 ===================== */
function computeLeverage(){
  const L = state.leverage;
  // 有買賣紀錄就以紀錄為準,否則用標的清單裡手填的股數
  // 代號重複時只有第一列計入,否則買賣紀錄會被算兩次
  const seenIds = new Set();
  const holdings = state.instruments.map(it => {
    const dup = it.id && seenIds.has(it.id);
    if (it.id) seenIds.add(it.id);
    const shares = dup ? 0 : (hasTrades() ? heldShares(it.id) : it.shares);
    return { key:it.key, id:it.id, name:it.name, leverage:it.leverage, price:it.price,
             shares, value: shares * it.price, dup };
  });
  const totalValue = sum(holdings, h => h.value);

  const draws = L.draws.map(t => ({
    ...t,
    used: !!t.useDate,
    repaid: repaidOf(t),
    balance: outstanding(t),
    yearsUsed: daysSince(t.useDate)/365.25
  }));

  const usedDraws = draws.filter(t => t.used);
  const usedAmount = sum(draws, t => t.balance);   // 還欠銀行多少
  const drawnAmount = sum(usedDraws, t => t.amount);

  const monthlyInterest = usedAmount * (L.annualRate/100) / 12;

  /* 「自己的錢」(equityValue)給每日/每月快照記錄部位淨值走勢用,不能拿總市值代替:
       總市值含借來的錢,不能反映真正屬於自己的部分;
     自己的錢 = 市值 − 借款餘額 + 已取回的現金 − 已還款 − 動用後新投入的自有資金 */
  const freezeDate = L.draws.filter(t => t.useDate).map(t => t.useDate).sort()[0] || '';
  let cashBack = 0, ownAfter = 0;
  if (freezeDate){
    state.trades.forEach(t => {
      if (t.date < freezeDate) return;
      if (t.action === 'sell') cashBack += t.shares * t.price - t.fee;
      else if (t.action === 'dividend') cashBack += t.amount - t.fee;
      else if (t.source !== 'loan') ownAfter += t.shares * t.price + t.fee;
    });
  }
  const repaidTotal = sum(L.draws, t => repaidOf(t));
  // 已經買進、還沒撥款的預定動用(pendingLoanFunding):股票已經在市值裡,借款也要扣,不然交割前兩天的快照自己的錢多算
  const pendingLoan = pendingLoanFunding();
  const equityValue = totalValue - usedAmount - pendingLoan + cashBack - repaidTotal - ownAfter;

  const positionDeclinePct = L.stressDeclinePct * 2;
  const lossAmount = totalValue * positionDeclinePct/100;

  return { holdings, totalValue, draws, usedAmount, pendingLoan, drawnAmount, monthlyInterest,
           equityValue, cashBack, ownAfter, repaidTotal,
           positionDeclinePct, lossAmount,
           remainingNetWorth: netWorth() - lossAmount };
}

/* ===================== 均線趨勢訊號 =====================
   房貸動用記錄管的是「借了多少、什麼時候借的」這本帳,這裡管的是「現在該續抱還是該跑」。
   狀態:WATCH(還沒進場)→ WAIT_RECOVER(接刀中,部分加碼)→ HOLD(趨勢確認,滿倉續抱)。
   HOLD 時只看會不會 EXIT;非 HOLD 時先看會不會 RECOVER(優先),再看會不會 ADD。

   刻意設計成「每次都從完整的 priceHistory 重新回放整個狀態機」,
   不是把 status/pyramidCount 當成逐筆增量修改、存在 state 裡的可變狀態——
   這樣任何一個分支都不可能「忘記重置」pyramidCount,回放到哪一天答案就該是什麼,
   不存在陳舊狀態遺留的問題。*/
function sma(vals, w){
  const out = new Array(vals.length).fill(null);
  let s = 0;
  for (let i = 0; i < vals.length; i++){
    s += vals[i];
    if (i >= w) s -= vals[i - w];
    if (i >= w - 1) out[i] = s / w;
  }
  return out;
}
function computeTrend(it){
  const p = it.trend || defaultTrendParams(it.leverage);
  const hist = it.priceHistory || [];
  // 至少要能算出一天的慢線,還要前一天的快線才能判斷斜率。用快慢線裡比較長的那條——使用者把快線設得比慢線長時,
  // 只看慢線會算不出快線,畫面拿 null 去 toFixed 整個訊號分頁就壞掉(隨機壓測抓到的)
  const window_ = Math.max(p.maFast, p.maSlow);
  const barsNeeded = window_ + 1;
  const base = { key: it.key, id: it.id, params: p, barsAvailable: hist.length, barsNeeded };
  if (hist.length < barsNeeded){
    return { ...base, status:'WATCH', pyramidCount:0, basePrice:0,
             maFast:null, maSlow:null, lastClose:null, lastDate:'', cushionPct:null, exitDate:'' };
  }
  const closes = hist.map(h => h.c);
  const dates = hist.map(h => h.d);
  const maF = sma(closes, p.maFast);
  const maS = sma(closes, p.maSlow);
  const start = window_ - 1;
  // exitDate:這一輪接刀從哪天開始(接刀只用自有資金時,算出場後買了多少)。通常是出場那天;
  // 歷史剛好從空頭開始、還沒續抱過就從觀望直接加碼的話,用第一次加碼那天(以前留空,已買的永遠扣不掉、卡片一直叫你買)
  let status = 'WATCH', basePrice = 0, pyramidCount = 0, exitDate = '';
  for (let i = start + 1; i < closes.length; i++){
    const close = closes[i], f = maF[i], s = maS[i], fy = maF[i - 1];
    if (f == null || s == null || fy == null) continue;
    let action;
    if (status === 'HOLD'){
      action = close < f * p.exitBuffer ? 'EXIT' : 'HOLD';
    }else{
      const priceStable = close > f && closes[i - 1] > maF[i - 1];
      const slopeOk = f >= fy * p.recoverSlopeThreshold;
      const strongRebound = close > f * p.recoverStrongRebound;
      const manualPrice = basePrice > 0 ? basePrice : closes[i - 1];
      const effectiveBase = Math.min(manualPrice, s);
      const gapTriggered = close < effectiveBase * (1 - p.pyramidGap);
      if ((priceStable && slopeOk) || strongRebound) action = 'RECOVER';
      else if (gapTriggered && pyramidCount < p.pyramidLevels) action = 'ADD';
      else action = status;
    }
    if (action === 'RECOVER'){ basePrice = close; pyramidCount = 0; status = 'HOLD'; }
    else if (action === 'ADD'){ if (status !== 'WAIT_RECOVER') exitDate = dates[i]; basePrice = close; pyramidCount += 1; status = 'WAIT_RECOVER'; }
    else if (action === 'EXIT'){ basePrice = close; pyramidCount = 0; status = 'WAIT_RECOVER'; exitDate = dates[i]; }
  }
  const last = closes.length - 1;
  const fLast = maF[last], sLast = maS[last], lastClose = closes[last];
  let cushionPct = null, exitLine = null;
  if (status === 'HOLD' && fLast){
    exitLine = fLast * p.exitBuffer;
    // 「再跌 X% 就出場」:從收盤往下算(1 − 出場線 ÷ 收盤)。以前是收盤 ÷ 出場線 − 1(從出場線往上算),
    // 收盤高出場線很多時會高估能跌的空間:顯示 +67.9% 其實跌 40% 就出場(2000-02 模擬正2 那次)
    cushionPct = lastClose > 0 && exitLine > 0 ? (1 - exitLine / lastClose) * 100 : null;
  }
  return { ...base, status, pyramidCount, basePrice,
           maFast: fLast, maSlow: sLast, lastClose, lastDate: dates[last], cushionPct, exitLine, exitDate };
}
const computeAllTrends = () => state.instruments.map(computeTrend);

/* ===================== 均線策略回測 =====================
   拿「訊號」分頁同一套均線判斷規則,從頭到尾套用在完整歷史價格上,算出「照訊號進出」
   VS「一開始就全押買進抱到現在」的淨值曲線,回報總報酬與最大回撤(MDD)。
   狀態機判斷邏輯刻意跟 computeTrend 逐行保持一致——同一套規則只能有一個源頭,
   不要在這裡重新描述一次規則再各自維護,不然兩邊分岔是最容易埋 bug 的地方。
   手續費用跟真實交易紀錄同一個 defaultFee(),不是另外開一組數字;初始資金只是拿來
   算報酬率%的基準,不代表真實金額,所以結果只看報酬率跟 MDD,不看金額本身。
   買賣只能整張(1000 股)成交,跟台股實際下單規則一致——零股會讓每次全押/出清的
   資金使用效率比實際能做到的更高,長期複利下來會膨脹回測報酬。 */
const BACKTEST_INITIAL_CASH = 1000000;
const LOT_SIZE = 1000;
function runBacktest(priceHistory, trendParams){
  const p = trendParams;
  const hist = priceHistory || [];
  const window_ = Math.max(p.maFast, p.maSlow);   // 跟 computeTrend 同一套:快線設得比慢線長也要算得出來
  const barsNeeded = window_ + 1;
  if (hist.length < barsNeeded) return null;

  const closes = hist.map(h => h.c);
  const dates = hist.map(h => h.d);
  const maF = sma(closes, p.maFast);
  const maS = sma(closes, p.maSlow);
  const start = window_ - 1;

  let status = 'WATCH', basePrice = 0, pyramidCount = 0;
  let cash = BACKTEST_INITIAL_CASH, shares = 0, cashAtExit = BACKTEST_INITIAL_CASH;
  const bhQty = Math.floor(BACKTEST_INITIAL_CASH / (closes[start] * 1.001425) / LOT_SIZE) * LOT_SIZE;
  const bhShares = bhQty;
  const bhCashLeft = BACKTEST_INITIAL_CASH - bhQty * closes[start] - (bhQty > 0 ? defaultFee('buy', bhQty * closes[start]) : 0);
  const curve = [{ d: dates[start], strat: BACKTEST_INITIAL_CASH, bh: bhCashLeft + bhShares * closes[start] }];
  const events = [];   // 每次策略動作(出場/接刀/轉回續抱)的日期跟價格,給「指定期間」檢視列出來;只記錄,不影響淨值計算

  for (let i = start + 1; i < closes.length; i++){
    const close = closes[i], f = maF[i], s = maS[i], fy = maF[i - 1];
    if (f != null && s != null && fy != null){
      let action;
      if (status === 'HOLD'){
        action = close < f * p.exitBuffer ? 'EXIT' : 'HOLD';
      }else{
        const priceStable = close > f && closes[i - 1] > maF[i - 1];
        const slopeOk = f >= fy * p.recoverSlopeThreshold;
        const strongRebound = close > f * p.recoverStrongRebound;
        const manualPrice = basePrice > 0 ? basePrice : closes[i - 1];
        const effectiveBase = Math.min(manualPrice, s);
        const gapTriggered = close < effectiveBase * (1 - p.pyramidGap);
        if ((priceStable && slopeOk) || strongRebound) action = 'RECOVER';
        else if (gapTriggered && pyramidCount < p.pyramidLevels) action = 'ADD';
        else action = status;
      }

      if (action === 'RECOVER'){
        // 全押 = 把剩下的現金買滿;加碼時已經買進的張數本來就在手上,不能當成重買一次再扣一次手續費。
        const qty = Math.floor(cash / (close * 1.001425) / LOT_SIZE) * LOT_SIZE;
        if (qty > 0){
          const fee = defaultFee('buy', qty * close);
          cash -= qty * close + fee;
          shares += qty;
        }
        basePrice = close; pyramidCount = 0; status = 'HOLD';
        events.push({ d: dates[i], act: 'RECOVER', close });
      }else if (action === 'ADD'){
        const unit = Math.min(cash, cashAtExit / p.pyramidLevels);
        const qty = Math.floor(unit / (close * 1.001425) / LOT_SIZE) * LOT_SIZE;
        if (qty > 0){
          const fee = defaultFee('buy', qty * close);
          cash -= qty * close + fee;
          shares += qty;
        }
        basePrice = close; pyramidCount += 1; status = 'WAIT_RECOVER';
        events.push({ d: dates[i], act: 'ADD', close, n: pyramidCount });
      }else if (action === 'EXIT'){
        const gross = shares * close;
        const fee = defaultFee('sell', gross);
        cash += gross - fee;
        shares = 0;
        cashAtExit = cash;
        basePrice = close; pyramidCount = 0; status = 'WAIT_RECOVER';
        events.push({ d: dates[i], act: 'EXIT', close });
      }
    }
    curve.push({ d: dates[i], strat: cash + shares * close, bh: bhCashLeft + bhShares * close });
  }

  const mdd = vals => {
    let peak = -Infinity, worst = 0;
    vals.forEach(v => { peak = Math.max(peak, v); worst = Math.min(worst, (v - peak) / peak); });
    return worst * 100;
  };
  const final = curve[curve.length - 1];
  return {
    curve, events, from: curve[0].d, to: final.d, status, pyramidCount,
    returnStrat: (final.strat / BACKTEST_INITIAL_CASH - 1) * 100,
    returnBh: (final.bh / BACKTEST_INITIAL_CASH - 1) * 100,
    mddStrat: mdd(curve.map(c => c.strat)),
    mddBh: mdd(curve.map(c => c.bh)),
  };
}

/* 回測畫圖只需要看得出長期走勢,不用每天畫一個點——每個月只留最後一個交易日,
   十年份的日資料點數才不會爆掉(lineChart 一個點要畫圓點加可點區域,點數等於乘三)。 */
function monthEndSample(curve){
  const out = [];
  for (let i = 0; i < curve.length; i++){
    const cur = curve[i].d.slice(0, 7);
    const next = i + 1 < curve.length ? curve[i + 1].d.slice(0, 7) : null;
    if (cur !== next) out.push(curve[i]);
  }
  return out;
}

/* sma() 是照陣列順序算的,不管日期——歷史資料如果中間漏了一整段(逐月回補時某幾個月
   沒抓到),均線會被這種假斷點默默帶偏,算出來的回測數字會失真但不會報錯,很難發現。
   證交所收盤資料本來就有正常間斷(週末、國定假日,農曆年前後最長約 9-10 天),跟
   adjustForSplits() 共用同一個 HISTORY_GAP_DAYS 門檻,兩處判斷「正常間斷 vs 真的斷了」
   的標準要一致,不要各自維護一份數字。 */
function findHistoryGap(hist){
  for (let i = 1; i < hist.length; i++){
    const days = (new Date(hist[i].d) - new Date(hist[i - 1].d)) / 86400000;
    if (days > HISTORY_GAP_DAYS) return { from: hist[i - 1].d, to: hist[i].d, days: Math.round(days) };
  }
  return null;
}

/* 前後兩段分開看:同一條淨值曲線(策略狀態一路延續,不在分界點重來)切成分界日前/後兩段,
   各自算年化報酬跟段內的 MDD。用來確認原策略贏過買進持有不是只靠某一段行情——
   2026-09 試高檔處理時,就是靠這個看出實驗只在後段有用、前段沒有好處。
   注意:分段的年化÷MDD 通常比全期高(每段只碰到自己那段最慘的回撤),前後段可以互相比,不要拿去跟全期比。 */
const BACKTEST_SPLIT_DATE = '2021-01-01';
function periodStats(curve, fromD, toD, key = 'strat'){
  const seg = curve.filter(pt => pt.d >= fromD && pt.d < toD);
  if (seg.length < 2) return null;
  const years = (new Date(seg[seg.length - 1].d) - new Date(seg[0].d)) / (365.25 * 86400000);
  // 未滿一年不年化(門檻 0.95 年:一整個日曆年從第一個到最後一個交易日本來就不到 365 天):剛上市幾個月、或分段只剩幾天時,一天 -0.1% 年化成 -39%,「年化÷MDD」變成 -287 這種數字(壓測抓到)
  const cagr = years >= 0.95 ? (Math.pow(seg[seg.length - 1][key] / seg[0][key], 1 / years) - 1) * 100 : null;
  let peak = -Infinity, worst = 0;
  seg.forEach(pt => { peak = Math.max(peak, pt[key]); worst = Math.min(worst, (pt[key] - peak) / peak); });
  const mdd = worst * 100;
  return { cagr, mdd, calmar: cagr != null && mdd < 0 ? cagr / -mdd : null };
}
const splitStats = (curve, key) => ({
  all: periodStats(curve, '0000', '9999', key),
  early: periodStats(curve, '0000', BACKTEST_SPLIT_DATE, key),
  late: periodStats(curve, BACKTEST_SPLIT_DATE, '9999', key),
});

/* 一份歷史價格 → 一筆回測結果(或錯誤訊息)。標的的回測跟「加權指數模擬」共用,畫面才能用同一套卡片。 */
function backtestFromHistory(id, hist, p, leverage, errMissing, btn = '抓完整歷史'){
  const need = Math.max(p.maFast, p.maSlow) + 1;
  if (!hist || hist.length < need){
    return { id, error: errMissing || `歷史資料不夠(需要至少 ${need} 天),請先按上面「抓完整歷史」。` };
  }
  const gap = findHistoryGap(hist);
  if (gap){
    return { id, error: `歷史價格中間缺了一段(${gap.from} ~ ${gap.to},約 ${gap.days} 天沒有資料),均線會被這段斷點帶偏,回測結果不可靠。請再按一次上面「${btn}」補齊之後再試一次。` };
  }
  const res = runBacktest(hist, p);
  const sampled = monthEndSample(res.curve);
  return {
    id, from: res.from, to: res.to, leverage,
    curve: res.curve, events: res.events,   // 指定期間檢視用
    returnStrat: res.returnStrat, returnBh: res.returnBh,
    mddStrat: res.mddStrat, mddBh: res.mddBh,
    periods: { strat: splitStats(res.curve, 'strat'), bh: splitStats(res.curve, 'bh') },
    labels: sampled.map(pt => pt.d.slice(0, 7)),
    // 圖上畫累積報酬率(%),跟上面「總報酬」同一個單位;以前畫淨值指數(起點=100),圖例的 9076 跟上面的 +8976% 看起來像對不起來
    stratSeries: sampled.map(pt => (pt.strat / BACKTEST_INITIAL_CASH - 1) * 100),
    bhSeries: sampled.map(pt => (pt.bh / BACKTEST_INITIAL_CASH - 1) * 100),
  };
}
function runAllBacktests(){
  const targets = state.instruments.filter(it => it.auto && /^[0-9A-Za-z]{3,8}$/.test(it.id));
  backtestResults = targets.map(it => backtestFromHistory(it.id, backtestFullHistory[it.id], it.trend || defaultTrendParams(it.leverage), it.leverage));
  runIndexSim();   // 加權指數模擬(可拆:見 INDEX_SIM 區塊)
}

/* 正2(00631L+00675L)該投入多少錢的曝險目標計算。只管槓桿倍數剛好等於 2 的標的,
   目前策略裡只有正2,之後如果加了別的槓桿倍數的標的,這裡先不處理(不特別去適配)。

   進度值:0=WATCH或剛EXIT(pyramidCount=0)、1..N=加碼到第幾層(N=兩檔裡較小的
   pyramidLevels,防呆用)、N+1=兩檔都HOLD。兩檔各自算,取較小值代表整組現在的階段——
   理由見「說明」分頁,兩檔經濟上幾乎是同一個賭注,一檔先轉弱就該一起保守。

   算出來的 deltaCash/deltaLoan 是兩個邊界(全部用現金 vs 全部用房貸該投入多少),
   實際怎麼混用現金/房貸由使用者自己決定,app 不追蹤「手上現金」這個數字。 */
/* 接刀第 n 層(1 起算)的目標曝險。設定裡沒有這一層(層數上限改大了,設定頁以前只列得出原本那幾格)時沿用最後一層——
   以前退回續抱目標:第二層 150%、續抱 130% 的人把層數改成 3,接到第三層卡片反而叫他賣(壓測抓到)。 */
function layerTarget(targets, n){
  const list = targets.byLayer || [];
  return list[n - 1] ?? list[list.length - 1] ?? targets.hold;
}
/* 接刀只用自有資金(mode 'own'):第 n 層累計要用掉「接刀用自有資金」的幾 %,沒設的層沿用最後一層 */
function ownLayerPct(targets, n){
  const list = targets.ownByLayer || [];
  return list[n - 1] ?? list[list.length - 1] ?? 100;
}
/* 這一輪接刀從哪天開始:接刀中/已出場的那幾檔裡最早的出場日(兩檔通常同一天;一檔先出場那天整組就算出場了)。
   都沒有(還沒進場過、或都在續抱)回傳 '' */
function ownCycleExit(trends){
  const d = trends.filter(t => t.status === 'WAIT_RECOVER' && t.exitDate).map(t => t.exitDate).sort();
  return d[0] || '';
}
/* 出場後買進正2 花的錢(股數 × 成交價 + 手續費),接刀只用自有資金時用來扣掉已經買的 */
function ownBoughtSince(exitDate, lev2){
  if (!exitDate) return 0;
  const ids = new Set(lev2.map(it => it.id));
  return sum(state.trades.filter(t => t.action === 'buy' && t.date >= exitDate && ids.has(t.symbol)), t => t.shares * t.price + t.fee);
}
/* 出場時記下接刀用的自有資金:app 不知道帳戶裡的現金,出場當下的「正2 市值 − 借款」就是賣光、還完房貸之後手上的錢。
   只算正2:0050 這類 1 倍標的照自己的訊號,正2 出場時不一定賣,算進來會把沒賣的股票當成接刀的現金(買太多、不知不覺借到錢)。
   打開 app 之前已經記了賣出(別台裝置、或出場後隔幾天才打開):賣得的錢加回來、借款用出場前的餘額
   (賣了拿去還的也算在手上的錢裡,扣的是出場前欠的),結果跟「出場那一刻的正2 市值 − 借款」一樣。
   只在「這一輪還沒記過、出場後還沒買過正2」時自動記;接刀途中才打開(已經買過)、或賣光了卻沒記賣出,
   算不出出場時的錢,記 0 讓卡片請使用者自己填。換一輪出場就重記。回傳有沒有改。 */
function captureOwnBase(){
  const L = state.leverage;
  if (L.exposureTargets.mode !== 'own') return false;
  const lev2 = state.instruments.filter(it => it.leverage === 2);
  if (!lev2.length) return false;
  const trends = lev2.map(computeTrend);
  if (trends.some(t => t.barsAvailable < t.barsNeeded) || lev2.some(it => trendHistoryGap(it))) return false;
  const exit = ownCycleExit(trends);
  if (!exit || L.ownBase.exit === exit) return false;
  const keys = new Set(lev2.map(it => it.key)), ids = new Set(lev2.map(it => it.id)), lev = computeLeverage();
  const lev2Value = sum(lev.holdings.filter(h => keys.has(h.key)), h => h.value);
  const sellQty = soldQtyById();
  const sold = sum(state.trades.filter(t => t.action === 'sell' && t.date >= exit && ids.has(t.symbol)), t => (sellQty[t.id] ?? t.shares) * t.price - t.fee);
  const loanBefore = sum(L.draws.filter(d => d.useDate && d.useDate < exit),
    d => Math.max(0, d.amount - sum((d.repayments || []).filter(r => r.date && r.date >= d.useDate && r.date < exit), r => r.amount)));
  const owed = loanBefore + pendingLoanFunding(exit, false);   // 出場前房貸買進、出場後才撥款的也是要還的
  const cash = lev2Value + sold - owed;
  const fresh = ownBoughtSince(exit, lev2) < 1 && lev2Value + sold > 0 && cash > 0;
  L.ownBase = { exit, amount: fresh ? Math.round(cash) : 0, auto: true };
  diag('接刀自有資金', fresh ? `${exit} 出場,自動記下 ${$n(cash)}(正2 市值 ${$n(lev2Value)} + 出場後賣出 ${$n(sold)} − 出場前借款 ${$n(owed)})`
    : `${exit} 出場,記不到(出場後已經買過正2 ${$n(ownBoughtSince(exit, lev2))}、或賣光了沒記賣出),請使用者自己填`);
  return true;
}
/* 設定頁要列幾層:正2 裡最大的加碼層數上限,至少列出已經設過的 */
const expoLayerCount = () => Math.min(MAX_PYRAMID_LEVELS, Math.max(state.leverage.exposureTargets.byLayer.length,
  ...state.instruments.filter(it => it.leverage === 2 && it.trend).map(it => it.trend.pyramidLevels)));
function computeExposurePlan(){
  const lev2 = state.instruments.filter(it => it.leverage === 2);
  if (!lev2.length) return null;
  const trends = lev2.map(computeTrend);
  const N = Math.max(1, Math.min(...lev2.map(it => it.trend.pyramidLevels)));
  const rawProgress = t => t.status === 'HOLD' ? N + 1 : (t.status === 'WAIT_RECOVER' ? t.pyramidCount : 0);
  const progress = Math.min(...trends.map(rawProgress));
  const targets = state.leverage.exposureTargets;
  const targetRatio = progress === 0 ? 0
                     : progress <= N ? layerTarget(targets, progress)
                     : targets.hold;
  const risk = computeRisk();
  const R = targetRatio / 100, L = 2;
  const denomCash = L - R;
  const raw = R * (risk.equity + risk.creditLimit) - risk.exposure;   // 為負代表已經超過目標,該減碼
  // HOLD 的目標(hold)只在「剛轉成 HOLD」時調整一次,之後續抱期間漲跌造成的曝險變化都不再平衡,
  // 等出場訊號。「剛轉成」= 使用者還沒確認過這次 HOLD(沿用狀態改變提醒的 lastSeenStatus,
  // 按提醒的「知道了」或曝險卡片的「已調整完成」都算確認)。
  const holdAdjustPending = progress > N && lev2.some(it => it.trend.lastSeenStatus !== 'HOLD');
  // 接刀的每一層也一樣(2026-09-30 使用者要的):只在剛接到這一層、還沒確認時給金額,確認後這一層漲跌都不再加碼/減碼,
  // 等下一層、轉回續抱或出場。以前接刀期間每天拿目前曝險跟該層目標比,跌一點叫你再買、漲一點叫你賣,
  // 跟續抱的規則、跟回測(每層買一次就不動)都不一致。「沒確認」= 任一檔的狀態或層數跟上次看過的不一樣。
  const layerAdjustPending = progress >= 1 && progress <= N && lev2.some((it, i) => it.trend.lastSeenStatus !== trends[i].status
    || (trends[i].status === 'WAIT_RECOVER' && it.trend.lastSeenLayers !== trends[i].pyramidCount));
  // 接刀只用自有資金(mode 'own'):出場到接完各層,不看曝險比例,改成「出場後買進正2 的錢」對照「接刀用自有資金 × 這一層的 %」
  let own = null;
  if (targets.mode === 'own' && progress <= N){
    const exitDate = ownCycleExit(trends);
    const base = state.leverage.ownBase.exit === exitDate ? state.leverage.ownBase.amount : 0;
    const pct = progress >= 1 ? ownLayerPct(targets, progress) : 0;
    const bought = ownBoughtSince(exitDate, lev2);
    own = { exitDate, base, auto: state.leverage.ownBase.auto, pct, target: base * pct / 100, bought, need: Math.max(0, base * pct / 100 - bought) };
  }
  return {
    progress, layerCount: N, targetRatio, currentRatio: risk.exposureRatio, holdAdjustPending, layerAdjustPending, own,
    deltaCash: denomCash > 0.0001 ? raw / denomCash : null,   // null = 這個目標純用現金到不了
    deltaLoan: raw / L,
    instruments: lev2.map(it => it.key)
  };
}

/* 通用折線圖。series: [{name, color, values}],values 對齊 labels,可含 null。
   兩條以上一定畫圖例,末端直接標數字,座標文字都用主題色。 */
const chartData = {};   // 圖表資料暫存,點擊時查得到數值

function lineChart(key, labels, series, opts){
  const o = Object.assign({ height:130, zero:false, fmtVal: money }, opts || {});
  const w = 320, h = o.height, padL = 8, padR = 8, padT = 14, padB = 20;
  const all = [];
  series.forEach(s2 => s2.values.forEach(v => { if (v !== null && v !== undefined) all.push(v); }));
  // 要有兩個以上的「時間點」才畫得出線。只看值的個數會誤判:
  // 一天的資料有市值和借款兩個值,卻只有一個時間點,畫出來是一張空白的圖。
  const points = labels.filter((_, i) => series.some(s2 => s2.values[i] !== null && s2.values[i] !== undefined)).length;
  if (points < 2 || all.length < 2) return '';
  let lo = Math.min(...all), hi = Math.max(...all);
  if (o.zero){ lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
  if (hi === lo){ hi = lo + Math.abs(lo || 1) * 0.1; lo = lo - Math.abs(lo || 1) * 0.1; }
  const x = i => padL + i * (w - padL - padR) / Math.max(1, labels.length - 1);
  const y = v => (h - padB) - (v - lo) / (hi - lo) * (h - padB - padT);

  chartData[key] = { labels, series, fmtVal: o.fmtVal, x: labels.map((_, i) => x(i)) };

  const paths = series.map(s2 => {
    let d = '', started = false;
    s2.values.forEach((v, i) => {
      if (v === null || v === undefined){ started = false; return; }
      d += (started ? ' L ' : ' M ') + x(i).toFixed(1) + ',' + y(v).toFixed(1);
      started = true;
    });
    return d ? `<path d="${d}" fill="none" stroke="${s2.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` : '';
  }).join('');

  const areaPath = (o.area && series.length === 1) ? (() => {
    const pts = [];
    series[0].values.forEach((v, i) => { if (v !== null && v !== undefined) pts.push([x(i), y(v)]); });
    if (pts.length < 2) return '';
    const base = (h - padB).toFixed(1);
    return `<path d="M ${pts[0][0].toFixed(1)},${base} L `
      + pts.map(pt => pt[0].toFixed(1) + ',' + pt[1].toFixed(1)).join(' L ')
      + ` L ${pts[pts.length-1][0].toFixed(1)},${base} Z" fill="var(--accent-soft)" stroke="none"/>`;
  })() : '';

  const dots = series.map((s2, si) => s2.values.map((v, i) =>
    (v === null || v === undefined) ? '' :
    `<circle class="pt-${key}-${si}" data-i="${i}" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2" fill="${s2.color}" stroke="var(--card)" stroke-width="2"/>`
  ).join('')).join('');

  // 整欄都可以點,手指好按
  const hits = labels.map((_, i) => {
    const half = (w - padL - padR) / Math.max(1, labels.length - 1) / 2;
    const x0 = Math.max(0, x(i) - half), x1 = Math.min(w, x(i) + half);
    return `<rect x="${x0.toFixed(1)}" y="0" width="${(x1 - x0).toFixed(1)}" height="${h}" fill="transparent" style="cursor:pointer" data-act="chart" data-key="${key}" data-i="${i}"></rect>`;
  }).join('');

  const zeroY = y(0);
  return `
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;margin-top:4px;touch-action:manipulation;" role="img" aria-label="${esc(o.label || '走勢')}">
      ${o.zero ? `<line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${w - padR}" y2="${zeroY.toFixed(1)}" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 3"/>` : ''}
      <line id="mk-${key}" x1="0" y1="${padT - 6}" x2="0" y2="${h - padB}" stroke="var(--sub)" stroke-width="1" stroke-dasharray="2 2" opacity="0"/>
      ${areaPath}${paths}${dots}${hits}
      <text x="${padL}" y="${h - 5}" fill="var(--sub)" font-size="10">${esc(labels[0])}</text>
      <text x="${w - padR}" y="${h - 5}" fill="var(--sub)" font-size="10" text-anchor="end">${esc(labels[labels.length - 1])}</text>
    </svg>
    <div class="row" id="cap-${key}" style="flex-wrap:wrap; gap:4px 14px;">${chartCaption(key, labels.length - 1)}</div>
    <div class="muted" style="font-size:11px;">點圖上任一處看該月數字</div>`;
}

/* 說明列:月份 + 每條線在該點的數值 */
function chartCaption(key, i){
  const d = chartData[key];
  if (!d) return '';
  const parts = d.series.map(s2 => {
    const v = s2.values[i];
    return `<span class="muted"><span class="legend-dot" style="background:${s2.color}"></span>${esc(s2.name)} ${(v === null || v === undefined) ? '—' : d.fmtVal(v)}</span>`;
  }).join('');
  return `<span class="muted" style="font-weight:700; color:var(--text);">${esc(d.labels[i])}</span>${parts}`;
}

/* 點圖:只動說明列與游標線,不整頁重畫 */
function pickChartPoint(key, i){
  const d = chartData[key];
  if (!d) return;
  const cap = document.getElementById('cap-' + key);
  if (cap) cap.innerHTML = chartCaption(key, i);
  const mk = document.getElementById('mk-' + key);
  if (mk){
    mk.setAttribute('x1', d.x[i].toFixed(1));
    mk.setAttribute('x2', d.x[i].toFixed(1));
    mk.setAttribute('opacity', '1');
  }
  d.series.forEach((s2, si) => {
    // 用 data-i 對應資料位置:值是 null 的那天沒有圓點,照圓點順序算的話,前面有空值的線會放大到別天的點
    document.querySelectorAll('.pt-' + key + '-' + si).forEach(el => {
      el.setAttribute('r', Number(el.getAttribute('data-i')) === i ? '4' : '2');
    });
  });
}

function renderRisk(){
  const k = computeRisk();
  if (!(k.pv > 0)) return '';
  const expPct = Math.min(100, k.exposureRatio);
  const heavy = k.exposureRatio > 100;
  const hist = monthlyHistory(12);
  const labels = hist.map(h => shortMonth(h.m));
  const dh = dailySlice();
  const useDaily = state.dailyHistory.length >= 2;
  const posChart = useDaily
    ? (dh.length < 2 ? rangeTooShort(dh.length) : lineChart('pos', dh.map(h => dayLabel(h.d)), [
        { name:'部位市值', color:'var(--s1)', values: dh.map(h => h.pv) },
        { name:'借款餘額', color:'var(--s2)', values: dh.map(h => h.loan) }
      ], { label:'部位市值與借款', height:130 }))
    : lineChart('pos', labels, [
        { name:'部位市值', color:'var(--s1)', values: hist.map(h => h.pv === null || h.pv === undefined ? null : h.pv) },
        { name:'借款餘額', color:'var(--s2)', values: hist.map(h => h.loan === null || h.loan === undefined ? null : h.loan) }
      ], { label:'部位市值與借款', height:120 });

  return `
    <div class="card">
      <h3>曝險</h3>
      <div class="mid-num ${heavy ? 'neg' : ''}">${k.capacity > 0 ? k.exposureRatio.toFixed(0) + '%' : '—'}</div>
      <div class="big-sub">實質市場曝險 ÷(部位淨值 + 房貸總額度)</div>
      <div class="bar-track"><div class="bar-fill ${heavy ? 'over' : ''}" style="width:${expPct.toFixed(1)}%"></div></div>
      <div class="row" style="margin-top:12px;"><span class="label">部位市值</span><span class="val">NT$ ${fmt(k.pv)}</span></div>
      <div class="row"><span class="label">借款餘額</span><span class="val neg">−NT$ ${fmt(k.loan)}</span></div>
      ${k.pendingLoan > 0.5 ? `<div class="row sub"><span class="label">含預定動用(已經買進、還沒撥款)</span><span class="val">NT$ ${fmt(k.pendingLoan)}</span></div>` : ''}
      <div class="row total"><span class="label">自己的錢</span><span class="val ${k.equity < 0 ? 'neg' : ''}">${money(k.equity)}</span></div>
      ${k.capacity <= 0 ? `<div class="muted neg" style="margin-top:4px;">借款已經超過「部位市值 + 房貸額度」,曝險比例沒有意義(顯示 —):部位全部賣掉也還不清借款。</div>` : ''}
      <div class="row sub"><span class="label">實質市場曝險(正2 ×2)</span><span class="val">NT$ ${fmt(k.exposure)}</span></div>
      <div class="row sub"><span class="label">槓桿倍數</span><span class="val">${k.leverage ? k.leverage.toFixed(2) + ' 倍' : '—'}</span></div>
      <div class="row sub"><span class="label">分母(自己的錢 + 額度 ${fmt(k.creditLimit)})</span><span class="val">${money(k.capacity)}</span></div>
      <button class="why" data-act="go" data-v="help">曝險怎麼算 →</button>
      ${posChart ? `
      <div style="margin-top:14px; padding-top:12px; border-top:1px solid var(--line);">
        <h3 style="margin-bottom:6px;">部位市值與借款</h3>
        ${useDaily ? rangePicker() : ''}
        ${posChart}
        <div class="muted">兩條線的距離就是自己的錢。</div>
      </div>` : chartPending('部位市值')}
    </div>`;
}

/* 損益走勢圖給部位損益卡用 */
function rangePicker(){
  const opts = [[30,'1 個月'], [90,'3 個月'], [250,'1 年'], [0,'全部']];
  return `<div class="seg" style="margin:0 0 12px;">
    ${opts.map(([v, t]) => `<button class="seg-btn ${chartRange === v ? 'on' : ''}" data-act="range" data-v="${v}">${t}</button>`).join('')}
  </div>`;
}

/* 還畫不出圖時,說清楚在等什麼 —— 不然使用者只會覺得功能不見了 */
function chartPending(what){
  const days = state.dailyHistory.length;
  return `
    <div style="margin-top:14px; padding-top:12px; border-top:1px solid var(--line);">
      <div class="empty">
        ${esc(what)}走勢圖還畫不出來(目前只有 ${days} 天的紀錄)。<br>
        每天開啟 app 或按「🔄 從證交所更新收盤價」會記一筆,<strong>累積兩天就會出現</strong>。
      </div>
    </div>`;
}

function pnlChartBlock(){
  const dh = dailySlice().filter(h => h.pnl !== null);
  const useDaily = state.dailyHistory.filter(h => h.pnl !== null).length >= 2;
  const hist = monthlyHistory(12);
  const chart = useDaily
    ? (dh.length < 2 ? rangeTooShort(dh.length) : lineChart('pnl', dh.map(h => dayLabel(h.d)), [
        { name:'整體損益', color:'var(--s1)', values: dh.map(h => h.pnl) }
      ], { zero:true, label:'整體損益走勢', height:130,
           fmtVal: v => (v >= 0 ? '+' : '−') + 'NT$ ' + fmt(Math.abs(v)) }))
    : lineChart('pnl', hist.map(h => shortMonth(h.m)), [
        { name:'整體損益', color:'var(--s1)', values: hist.map(h => h.pnl === null || h.pnl === undefined ? null : h.pnl) }
      ], { zero:true, label:'整體損益走勢', height:120,
           fmtVal: v => (v >= 0 ? '+' : '−') + 'NT$ ' + fmt(Math.abs(v)) });
  if (!chart) return computePosition().hasData ? chartPending('整體損益') : '';
  return `
    <div style="margin-top:14px; padding-top:12px; border-top:1px solid var(--line);">
      ${useDaily ? rangePicker() : ''}
      ${chart}
      <div class="muted">虛線是損益兩平。</div>
    </div>`;
}

/* 年化報酬(XIRR)那一行。第一筆投入未滿一年時不年化:兩週漲 10% 年化超過 1000%,二分法的上限找不到根,
   這一行以前就直接消失;跌 10% 則顯示 −93%。跟回測分段表同一條規則(未滿 0.95 年不年化) */
function xirrRow(p){
  if (p.years < 0.95) return p.hasData ? `<div class="row total"><span class="label">年化報酬</span><span class="val muted">—(第一筆投入未滿一年,不年化)</span></div>` : '';
  return p.xirr !== null ? `<div class="row total"><span class="label">年化報酬</span><span class="val ${p.xirr >= 0 ? 'pos' : 'neg'}">${fmtPct(p.xirr)}</span></div>` : '';
}
/* 「跌到出場線才賣」的損益:續抱中的標的用現在的出場線(快線 × 出場乘數)當賣價,扣賣出手續費與證交稅;
   接刀中(已經出場過、沒有出場線)、訊號算不出來的標的用目前股價。出場線會跟著快線往上移,這是「現在就開始跌、
   一路跌到出場」的情況,不是保證值:收盤跌破才賣,實際賣價通常再低一點;也不含之後的利息。 */
function exitScenario(p = computePosition()){
  let gross = 0, fees = 0, cost = 0;
  const rows = [];
  Object.keys(p.lots).forEach(sym => {
    const lot = p.lots[sym];
    if (!(lot.shares > 0)) return;
    const it = findInstrument(sym), t = it ? computeTrend(it) : null;
    // 歷史不夠或中間缺一段,訊號分頁會叫你先別照它,出場線也不算數(跟 ackTrend 等同一條規則)
    const valid = !!(t && t.barsAvailable >= t.barsNeeded && !trendHistoryGap(it));
    const hasLine = valid && t.status === 'HOLD' && t.exitLine > 0;
    // 股價已經在出場線下面(盤中、或還沒更新訊號):收盤就會賣,用目前股價
    const px = hasLine ? Math.min(t.exitLine, symbolPrice(sym) || t.exitLine) : symbolPrice(sym);
    const g = lot.shares * px, f = defaultFee('sell', g);
    gross += g; fees += f; cost += lot.cost;
    rows.push({ sym, px, hasLine, unrealized: g - f - lot.cost, status: valid ? t.status : '', drop: symbolPrice(sym) > 0 ? 1 - px / symbolPrice(sym) : null });   // 還沒有股價:不知道要跌幾 %
  });
  const unrealized = gross - fees - cost;
  return { rows, gross, fees, unrealized, total: unrealized + p.realized - p.interest,
    anyLine: rows.some(r => r.hasLine), drop: p.marketValue > 0 ? 1 - gross / p.marketValue : 0 };
}
function renderPnL(){
  const p = computePosition();
  if (!p.hasData){
    return `
      <div class="card">
        <h3>部位損益</h3>
        <div class="empty">還沒有買賣紀錄,所以算不出賺賠。<br>在下面「買賣紀錄」記下每次進場,這裡就會顯示成本與損益。</div>
      </div>`;
  }
  const sign = n => (n >= 0 ? '+' : '−') + 'NT$ ' + fmt(Math.abs(n));
  const cls = n => n >= 0 ? 'pos' : 'neg';
  return `
    <div class="card">
      <h3>整體損益</h3>
      <div class="big-num ${cls(p.total)}">${sign(p.total)}</div>
      <div class="big-sub">已扣掉借款利息</div>
      ${xirrRow(p)}
      <div class="row"><span class="label">目前市值</span><span class="val">NT$ ${fmt(p.marketValue)}</span></div>
      <div class="row"><span class="label">未實現</span><span class="val ${cls(p.unrealized)}">${sign(p.unrealized)}</span></div>
      ${(() => {
        const x = exitScenario(p);
        if (!x.anyLine) return '';
        return `
      <div class="row"><span class="label">跌到出場線才賣的未實現</span><span class="val ${cls(x.unrealized)}">${sign(x.unrealized)}</span></div>
      <div class="row sub"><span class="label">那時的整體損益${p.marketValue > 0 ? `(市值少 ${(x.drop * 100).toFixed(1)}%)` : ''}</span><span class="val ${cls(x.total)}">${sign(x.total)}</span></div>
      ${x.rows.map(r => `<div class="row sub"><span class="label">${esc(r.sym)} ${r.hasLine ? (r.drop === null ? `出場線 ${r.px.toFixed(2)}(還沒有目前股價)` : r.drop > 0 ? `出場線 ${r.px.toFixed(2)}(再跌 ${(r.drop * 100).toFixed(1)}%)` : '已經在出場線下面,用目前股價') : r.status === 'WAIT_RECOVER' ? '接刀中,沒有出場線,用目前股價' : '算不出出場線,用目前股價'}</span><span class="val ${cls(r.unrealized)}">${sign(r.unrealized)}</span></div>`).join('')}
      <details class="tip"><summary>這個數字怎麼看</summary><div class="body">照策略續抱,要等收盤跌破出場線(快線 × 出場乘數)才全部賣出,
        所以這是「現在開始跌、一路跌到出場才賣」時大概還留得住的獲利,已扣賣出手續費與證交稅、沒扣之後的利息。
        出場線會跟著快線慢慢往上移,抱越久通常越高;但收盤跌破才賣,跳空大跌時實際賣價會再低一點。
        在那之前需要用錢而提早賣,就不是這個數字。</div></details>`;
      })()}
      ${p.realized ? `<div class="row"><span class="label">已實現${p.dividends ? '(含配息)' : ''}</span><span class="val ${cls(p.realized)}">${sign(p.realized)}</span></div>` : ''}
      <div class="row"><span class="label">借款利息</span><span class="val neg">−NT$ ${fmt(p.interest)}</span></div>
      <div class="row sub"><span class="label">持股成本</span><span class="val">NT$ ${fmt(p.remainCost)}</span></div>
      ${p.dividends ? `<div class="row sub"><span class="label">其中配息</span><span class="val">+NT$ ${fmt(p.dividends)}</span></div>` : ''}
      ${p.xirr !== null ? `<button class="why" data-act="go" data-v="help">年化報酬怎麼算 →</button>` : ''}
      ${pnlChartBlock()}
    </div>

    <div class="card">
      <h3>投入的錢</h3>

/* 房貸動用記錄:借了多少、什麼時候借的這本帳,借款餘額跟利息都是從這裡算出來的。
   純記帳,不判斷該不該借——該不該借看「訊號」分頁的趨勢訊號跟曝險目標。 */
/* 房貸動用記錄:每筆平常收成一行(名稱、狀態、動用日、金額、尚欠),點了才展開成表單。房貸買進會自動新增動用,
   筆數只會越來越多,以前每筆都攤開成完整表單、一筆就半個畫面(2026-10 手機截圖看到的)。
   還沒填完的(剛新增、沒日期或沒金額)跟刪除待確認的直接打開;已還清的收在最下面。 */
const drawBalanceText = t => !t.balance ? '已還清' : Math.round(t.balance) === Math.round(t.amount) ? 'NT$ ' + fmt(t.amount) : '尚欠 ' + fmt(t.balance) + ' / ' + fmt(t.amount);
function renderDrawRecords(){
  const L = state.leverage;
  const r = computeLeverage(), today = todayISO();
  const badge = t => `<span class="badge ${t.useDate && t.useDate <= today ? (t.balance ? 'amber' : 'gray') : 'gray'}">${
          !t.useDate ? '未動用' : t.useDate > today ? '預定' : t.balance ? '動用中' : '已還清'}</span>`;
  // 尚欠那段帶 id,打字改還款時 refreshLeverage() 不用整頁重畫就能更新(展開或收起都看得到)
  const line = t => [t.useDate ? esc(t.useDate.slice(2).replace(/-/g, '/')) : '',
    t.useDate && t.useDate <= today && t.amount ? `<span id="out-balance-${t.id}">${drawBalanceText(t)}</span>` : t.amount ? 'NT$ ' + fmt(t.amount) : ''].filter(Boolean).join(' · ');
  const item = t => {
    const force = !t.useDate || !t.amount || pendingConfirm === 'del-draw:' + t.id;
    return `<div style="border-bottom:1px solid var(--line); padding:4px 0;">${fold('draw-' + t.id, esc(t.label || '(未命名)') + ' ' + badge(t), row(t), { sub: line(t), force })}</div>`;
  };
  const row = (t) => `
    <div style="margin-bottom:8px;">
      <div class="row">
        <div class="field" style="flex:1; margin:0;"><label>名稱</label><input data-k="draw-label-${t.id}" value="${esc(t.label)}"></div>
      </div>
      ${t.useDate > todayISO() ? `
        <div class="muted" style="margin:4px 0 6px;">未來日期,到 ${esc(t.useDate)} 才計入借款餘額、利息與曝險。</div>
      ` : t.useDate ? `
        <div class="row"><span class="label">${t.balance ? '尚欠' : '已還清'}</span>
          <span class="val ${t.balance ? '' : 'pos'}">${t.balance ? 'NT$ ' + fmt(t.balance) : '已還清'}</span></div>
        <div class="row sub"><span class="label">已借 ${Math.floor(t.yearsUsed * 365.25)} 天 · 利息約 ${fmt(accrue(t, L))}</span><span class="val"></span></div>
      ` : ''}
      <div class="grid2">
        <div class="field"><label>動用日期${t.useDate ? '' : '(填了才算已動用)'}</label><input type="date" data-k="draw-date-${t.id}" value="${esc(t.useDate)}"></div>
        <div class="field"><label>動用金額</label><input type="number" inputmode="decimal" data-k="draw-amt-${t.id}" value="${t.amount || ''}"></div>
      </div>
      <div class="field"><label>備註(買了什麼)</label><input data-k="draw-note-${t.id}" value="${esc(t.note || '')}" placeholder="00631L 27,000 股"></div>
      <button class="btn${pendingConfirm === 'del-draw:' + t.id ? ' danger' : ''}" data-act="del-draw" data-id="${t.id}" style="margin-top:8px;">${pendingConfirm === 'del-draw:' + t.id ? '⚠️ 有還款紀錄,再按一次刪除' : '刪除這筆'}</button>
    </div>`;
  return `
    <div class="card">
      <h3>房貸動用記錄</h3>
      <details class="tip" style="margin-bottom:10px;"><summary>按「訊號」分頁實際買進之後怎麼記</summary><div class="body">按「訊號」分頁的趨勢/曝險目標實際買進之後,在這裡記一筆動用金額——借款餘額跟利息都是從這裡算的,不是自動推算。</div></details>
      ${(() => {
        const paid = r.draws.filter(t => t.useDate && t.useDate <= today && !t.balance && t.amount && pendingConfirm !== 'del-draw:' + t.id);
        const rest = r.draws.filter(t => !paid.includes(t));
        return (rest.length ? rest.map(item).join('') : r.draws.length ? '' : `<div class="empty">還沒有動用記錄。</div>`)
          + (paid.length ? `<div style="margin-top:6px;">${fold('draws-paid', `已還清 ${paid.length} 筆`, () => paid.map(item).join(''))}</div>` : '');
      })()}
      <div class="muted" style="font-size:12px; margin:8px 0;">點一筆展開修改。</div>
      <button class="btn solid" data-act="add-draw">+ 新增一筆動用記錄</button>

/* 這筆還款超過「當時還欠多少」的部分(repaidOf() 會把總還款夾在動用金額以內,多的默默不算)。
   新增時會擋(add-repay2),但事後在清單上改金額/日期就沒擋——這裡標出來,不然看起來像是還清了卻對不上。
   同一天多筆照清單順序算。 */
function overRepaid(item, rp){
  if (!rp.date || rp.date < item.useDate) return 0;
  let owe = item.amount;
  for (const x of (item.repayments || []).filter(x => x.date && x.date >= item.useDate).slice().sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0)){
    const over = Math.max(0, x.amount - owe);
    owe = Math.max(0, owe - x.amount);
    if (x === rp) return over;
  }
  return 0;
}
/* 還款紀錄:獨立成一張卡,對應 state.leverage.draws 裡任一筆有 useDate 的動用記錄 */
function renderRepayments(){
  const L = state.leverage;
  const items = L.draws.filter(x => x.useDate);
  const ids = items.map(it => it.id);
  if (!ids.includes(repayDraft.target)) repayDraft.target = ids[0] || '';
  const rows = [];
  items.forEach(it => (it.repayments || []).forEach(r => rows.push({ it, r })));
  rows.sort((a, b) => a.r.date < b.r.date ? 1 : -1);
  return `
    <div class="card">
      <h3>記一筆還款</h3>
      ${items.length ? `
        <div class="field"><label>還哪一筆</label>
          <select data-k="rd-target">
            ${items.map(it => `<option value="${it.id}" ${repayDraft.target === it.id ? 'selected' : ''}>${esc(it.label)}(${it.useDate > todayISO() ? '預定 ' + esc(it.useDate) + ' 動用' : '尚欠 ' + fmt(outstanding(it))})</option>`).join('')}
          </select>
        </div>
        <div class="grid2">
          <div class="field"><label>日期</label><input type="date" data-k="rd-date" value="${esc(repayDraft.date)}"></div>
          <div class="field"><label>金額</label><input type="number" inputmode="decimal" data-k="rd-amount" value="${esc(repayDraft.amount)}" placeholder="0"></div>
        </div>
        <button class="btn solid" data-act="add-repay2">新增還款</button>
        ${repayError ? `<div class="muted neg" style="text-align:center; margin-top:8px;">${esc(repayError)}</div>` : ''}
      ` : `<div class="empty">還沒有動用中的記錄。<br>在上面「房貸動用記錄」填了動用日期之後,這裡才能記還款。</div>`}
    </div>

    <div class="card">
      <h3>還款紀錄</h3>
      ${(() => {
        // 每筆動用一行,點了才列出它的還款(2026-10:每月自動還本每筆動用各記一筆,一年就幾十列可以改的欄位)。
        // 有問題的還款(沒日期、早於動用日、還超過)或刪除待確認的那筆直接打開
        const bad = (it, r) => !r.date || r.date < it.useDate || overRepaid(it, r) > 0.5;
        const html = items.map(it => {
          const mine = rows.filter(x => x.it === it);
          const st = it.useDate > todayISO() ? '預定 ' + esc(it.useDate.slice(5).replace('-', '/')) + ' 動用' : outstanding(it) ? '尚欠 ' + fmt(outstanding(it)) : '已還清';
          return `<div style="border-bottom:1px solid var(--line); padding:2px 0;">${fold('rp-' + it.id, esc(it.label), () => mine.length ? repayRows(mine) : '<div class="muted">這筆還沒有還款。</div>',
            { sub: `${st} · 已還 ${fmt(repaidOf(it))}(${mine.length} 筆)`,
              force: mine.some(({ r }) => bad(it, r) || pendingConfirm === 'del-repay:' + it.id + ':' + r.id) })}</div>`;
        }).join('');
        return rows.length ? html + `<div class="muted" style="font-size:12px; margin-top:8px;">點一筆動用,列出它的每一筆還款(可以改或刪)。</div>`
          : items.length ? html + `<div class="empty">還沒有還款紀錄。減碼把錢還給銀行之後記一筆,餘額與利息才會跟著減。</div>` : '';
      })()}
    </div>`;
}
function repayRows(rows){
  return `<div>${rows.map(({ it, r }) => `
        <div class="erow">
          <input type="date" class="f-name" data-k="rp-date-${it.id}-${r.id}" value="${esc(r.date)}">${String(r.id).startsWith(AUTO_REPAY_PREFIX) ? '<span class="badge gray" style="flex:0 0 auto;">自動</span>' : ''}
          <input class="f-amt" type="number" inputmode="decimal" data-k="rp-amt-${it.id}-${r.id}" value="${r.amount || ''}">
          ${xDel('del-repay', it.id + ':' + r.id)}
        </div>
        <div class="muted" style="margin-top:2px;">${esc(it.label)}${
          !r.date ? `<span class="neg"> · 沒有日期,這筆不會計入</span>`
          : r.date < it.useDate ? `<span class="neg"> · 早於動用日 ${esc(it.useDate)},這筆不會計入</span>`
          : overRepaid(it, r) > 0.5 ? `<span class="neg"> · 超過當時尚欠 NT$ ${fmt(overRepaid(it, r))},多的部分不會計入</span>`
          : r.date > todayISO() ? ' · 未來日期,到那天才會扣掉餘額' : ''}</div>`).join('')}</div>`;
}



/* 壓力測試的內容獨立成函式,輸入跌幅時可以只更新這一塊 */
function stressBody(){
  const L = state.leverage;
  const st = computeStress(L.stressDeclinePct);
  if (!st) return `<div class="empty">先填入持股與股價,或記幾筆買賣,才算得出來。</div>`;
  const plan = computeExposurePlan();
  return `
  <div class="big-num neg">−NT$ ${fmt(st.loss)}</div>
  <div class="big-sub">部位市值 ${fmt(st.pv)} → ${fmt(st.newPv)}</div>
  <div class="row"><span class="label">部位淨值(自己的錢)</span>
    <span class="val ${st.newEquity >= 0 ? '' : 'neg'}">${money(st.equity)} → ${money(st.newEquity)}</span></div>
  <div class="row"><span class="label" style="font-weight:700;">曝險比例</span>
    <span class="val" style="font-weight:800;">${st.capacity > 0 ? st.ratio.toFixed(0) + '%' : '—'} → ${st.newCapacity > 0 ? st.newRatio.toFixed(0) + '%' : '—'}</span></div>
  ${st.newCapacity <= 0 ? `<div class="muted neg" style="margin-top:4px;">跌完之後借款會超過「部位市值 + 房貸額度」,曝險比例已經沒有意義——
    部位全部賣掉也還不清借款,這是最危險的狀態。</div>`
  : plan ? `<div class="row sub"><span class="label">對照目前正2曝險目標(${plan.targetRatio}%)</span>
    <span class="val">${st.newRatio > plan.targetRatio ? '會超過目標,是加碼還是減碼自己判斷' : '還在目標之內'}</span></div>` : ''}
  <details class="tip"><summary>試算怎麼算的</summary><div class="body">各標的用自己的槓桿倍數換算(正2 跌兩倍)。未計入正2 ETF 的波動耗損與追蹤誤差,實際下跌時通常更差。</div></details>`;
}

/* 均線趨勢訊號 + 正2 曝險目標,「訊號」分頁的內容。純顯示,不會自動下單——
   買賣還是要自己到「紀錄」分頁記一筆。 */
function trendBadge(status){
  if (status === 'HOLD') return `<span class="badge green">HOLD 續抱</span>`;
  if (status === 'WAIT_RECOVER') return `<span class="badge amber">WAIT_RECOVER 接刀中</span>`;
  return `<span class="badge gray">WATCH 尚未進場</span>`;   // 資料足夠但還沒等到趨勢確認,不等於資料不夠
}
/* 正2 曝險目標卡片:目前曝險 vs 目標曝險,以及該加碼/減碼多少(現金/房貸兩個邊界值,
   兩檔 00631L/00675L 均分)。只在有正2(槓桿2倍)標的時顯示。 */
/* 動用紀錄合計跟標「房貸借款」的買進合計差超過 2%(最少 1 萬):設定頁的警告跟「今天要做什麼」共用 */
/* 借了還沒用完的房貸:動用(含預定)合計 − 用房貸買進的合計,不超過還欠銀行的(還掉的就不是手上的錢了)。
   房貸買進順便記動用時先用這筆,不夠的才新增(2026-10 使用者:動用整數 35 萬、買了 348,496,剩的下次先用)。
   exceptId:剛存進去的那筆買進不算 */
function unusedLoanCash(exceptId){
  const ds = state.leverage.draws.filter(d => d.useDate && d.amount > 0);
  const drawn = sum(ds, d => d.amount);
  const owed = sum(ds, d => Math.max(0, d.amount - sum((d.repayments || []).filter(r => r.date && r.date >= d.useDate), r => r.amount)));
  const spent = sum(state.trades.filter(t => t.action === 'buy' && t.source === 'loan' && t.id !== exceptId), t => t.shares * t.price + t.fee);
  return Math.max(0, Math.round(Math.min(drawn - spent, owed)));
}
function loanMismatch(){
  const p = computePosition(), r = computeLeverage();
  if (!p.hasData || !r.drawnAmount) return null;
  const diff = r.drawnAmount - p.buyLoan;
  return Math.abs(diff) > Math.max(10000, r.drawnAmount * 0.02) ? { p, r, diff } : null;
}
/* 有「房貸借款」的買進紀錄,房貸動用紀錄卻一筆都沒有:借款餘額當成 0,部位淨值被高估、曝險比例被低估 */
const loanLedgerMissing = () => state.trades.some(t => t.action === 'buy' && t.source === 'loan') && !state.leverage.draws.some(d => d.amount > 0);
const LOAN_LEDGER_MSG = '有用「房貸借款」買進的紀錄,但「紀錄」分頁還沒有任何房貸動用:借款餘額被當成 0,曝險比例會偏低、曝險目標卡片會叫你多買。先到「紀錄」分頁新增動用。';
function renderExposurePlanCard(){
  const p = computeExposurePlan();
  if (!p) return '';
  if (loanLedgerMissing()){
    return `
    <div class="card">
      <h3>正2 曝險目標</h3>
      <div class="muted neg">${LOAN_LEDGER_MSG}</div>
    </div>`;
  }
  const n = p.instruments.length;
  const lev2 = p.instruments.map(findInstrumentByKey).filter(Boolean);
  // 歷史價格還不夠算慢線的那檔,computeTrend 回的 WATCH 不是真的出場訊號——照算的話目標變 0%,
  // 卡片會叫你把整個部位賣掉(新增標的、回補失敗時就會這樣)。先說清楚在等資料,不給金額。
  const short = lev2.filter(it => { const t = computeTrend(it); return t.barsAvailable < t.barsNeeded || trendHistoryGap(it); });
  // 還沒處理的分割:持股可能少算成 1/N,算出來的加碼金額會大錯,先請使用者處理分割提醒
  if (splitTradeIssues().some(x => p.instruments.includes(x.it.key))){
    return `
    <div class="card">
      <h3>正2 曝險目標</h3>
      <div class="muted neg">上面有「分割過」的提醒還沒處理:持股可能少算,現在算出來的加碼/減碼金額不可靠,先處理那個提醒。</div>
    </div>`;
  }
  // 分母(部位淨值 + 額度)≤ 0:借款已經超過市值 + 額度,比例跟加碼/減碼金額都是拿負的分母解出來的,沒有意義
  if (computeRisk().capacity <= 0 && computeRisk().pv > 0){
    return `
    <div class="card">
      <h3>正2 曝險目標</h3>
      <div class="muted neg">借款已經超過「部位市值 + 房貸額度」,曝險比例沒有意義,算不出該加碼或減碼多少。
        先確認「紀錄」分頁的動用/還款金額跟「設定」分頁的房貸額度是不是填對了。</div>
    </div>`;
  }
  if (short.length){
    return `
    <div class="card">
      <h3>正2 曝險目標</h3>
      <div class="row"><span class="label">目前曝險</span><span class="val">${p.currentRatio.toFixed(1)}%</span></div>
      <div class="muted" style="margin-top:6px;">${short.map(it => esc(it.id || '未命名')).join('、')} 的歷史價格還不夠(或中間缺了一段)算均線,
        算不出目前在第幾層,先不給加碼/減碼金額。到「設定」分頁按「從證交所更新收盤價」會自動回補。</div>
    </div>`;
  }
  // 各檔平分的說明照實際的代號跟檔數寫(以前寫死「00631L/00675L 各半」,只有一檔正2 時金額卻是整筆)
  const split = amt => n > 1 ? `(${lev2.map(it => esc(it.id)).join('/')} ${n === 2 ? '各半' : '每檔'}約 NT$ ${fmt(amt / n)})` : '';
  // 減碼照各檔目前市值的比例分攤:以前也寫「各半」,兩檔市值不一樣時(例如 70 萬 / 30 萬、目標降到 0%)
  // 會叫小的那檔賣 50 萬,根本沒那麼多可以賣。比例分攤每檔都不會超過自己的市值(總減碼 ≤ 正2 總市值)
  const lev2Value = () => sum(computeLeverage().holdings.filter(h => p.instruments.includes(h.key)), h => h.value);
  // 要賣的比正2 全部市值還多:代表其他標的(0050 這類 1 倍)的曝險也算在比例裡,正2 賣光也到不了目標。
  // 以前只寫「全部賣掉也降不到目標」、不給金額,出場訊號當下不知道要賣多少——照訊號就是正2 全部賣掉,寫出來
  const hasOther = computeLeverage().holdings.some(h => !p.instruments.includes(h.key) && h.value > 0);
  const sellAllLev2 = () => `正2 全部賣掉 約 NT$ ${fmt(lev2Value())}${sellSplit(lev2Value())}`
    + (hasOther ? '(其他標的也算在曝險裡,正2 賣光還到不了目標;其他標的照它自己的訊號)' : '(賣光也到不了目標)');
  // 還款/借款的上限:借款餘額、剩下的額度。R = 目標比例,raw = 曝險差額(負 = 要減)
  // 剩下的額度要先扣預定動用(已經講好要轉出、還沒到那天的),不然會叫你借到超過額度
  // 用已撥款的餘額 + 全部預定動用(risk.loan 已經含「買了還沒撥款」的那部分,再扣一次預定動用會重複)
  const loan = computeLeverage().usedAmount, room = Math.max(0, state.leverage.creditLimit - loan - plannedDrawAmount());
  const R = p.targetRatio / 100, raw = p.deltaLoan * 2;
  const sellCash = p.deltaCash == null ? null : Math.abs(p.deltaCash);
  // 賣 x、還 min(x, 借款):借款夠還 → x = |raw|/2;不夠 → 先還清、剩下留現金:x = (−raw − R×借款)/(2 − R)
  const sellRepay = Math.abs(p.deltaLoan) <= loan + 0.5 ? Math.abs(p.deltaLoan) : (2 - R > 0.0001 ? (-raw - R * loan) / (2 - R) : null);
  // 借完剩下的額度 z 還不夠:還要自己出現金 c,(raw − 2z)/(2 − R)
  const mixCash = 2 - R > 0.0001 ? Math.max(0, (raw - 2 * room) / (2 - R)) : null;
  const sellSplit = amt => {
    if (n < 2) return '';
    const hv = computeLeverage().holdings.filter(h => p.instruments.includes(h.key));
    const tot = sum(hv, h => h.value);
    if (!(tot > 0)) return split(amt);
    return '(' + hv.filter(h => h.value > 0).map(h => `${esc(h.id)} 約 NT$ ${fmt(Math.min(h.value, amt * h.value / tot))}`).join('、') + ',照目前市值比例)';
  };
  // 接刀只用自有資金:接刀各層用自己的卡片(出場那一刻照舊叫你賣光,下面多一列記下的自有資金)
  const ownBaseRow = () => `
      <div class="row sub"><span class="label">接刀用的自有資金${p.own.auto && p.own.base ? '(出場時自動記下,可改)' : ''}</span>
        <span class="val"><input class="f-amt" type="number" inputmode="decimal" data-k="ownbase-amt" value="${p.own.base || ''}" placeholder="填金額" style="max-width:9em;"></span></div>`;
  if (p.own && p.progress >= 1){
    const pending = p.layerAdjustPending;
    return `
    <div class="card">
      <h3>正2 曝險目標</h3>
      <div class="row"><span class="label">目前階段</span><span class="val">${pending ? `剛接到第 ${p.progress} / ${p.layerCount} 層` : `加碼中(第 ${p.progress} / ${p.layerCount} 層)`}</span></div>
      ${ownBaseRow()}
      ${!p.own.base ? `<div class="muted neg" style="margin-top:6px;">app 不知道你帳戶裡的現金。填上出場賣掉、還完房貸之後打算拿來接刀的錢,才算得出這一層要買多少。</div>` : `
      <div class="row sub"><span class="label">這一層累計用到自有資金的</span><span class="val">${p.own.pct}%(NT$ ${fmt(p.own.target)})</span></div>
      <div class="row sub"><span class="label">出場後已經買進正2</span><span class="val">NT$ ${fmt(p.own.bought)}</span></div>
      ${pending ? (p.own.need > 0.5 ? `
      <div class="row"><span class="label" style="font-weight:700;">這一層要買(只用自己的錢,不動用房貸)</span>
        <span class="val" style="font-weight:800;">NT$ ${fmt(p.own.need)}</span></div>
      ${n > 1 ? `<div class="row sub"><span class="label"></span><span class="val">${split(p.own.need)}</span></div>` : ''}`
        : `<div class="muted" style="margin-top:6px;">已經買到這一層的金額了,不用再買。</div>`)
      : `<div class="muted" style="margin-top:6px;">這一層已經調整過,等下一層、轉回續抱或出場。接刀期間漲跌都不加碼也不減碼。</div>`}`}
      ${pending ? `
        <div class="muted" style="margin-top:6px;">接刀只用自己的錢:第 ${p.progress} 層累計用到 ${p.own.pct}%。買完按下面這顆,這一層漲跌都不再提示,等下一層、轉回續抱或出場;轉回續抱時才動用房貸,照「兩檔都 HOLD」的 ${state.leverage.exposureTargets.hold}% 調整。</div>
        <button class="btn" data-act="ack-hold" style="margin-top:8px;">✓ 已調整完成</button>` : ''}
    </div>`;
  }
  const stageLabel = p.progress === 0 ? '尚未進場或已出場'
    : p.progress > p.layerCount ? '兩檔都 HOLD'
    : `加碼中(第 ${p.progress} / ${p.layerCount} 層)`;
  const overTarget = p.deltaLoan < -0.5;   // 現值超過目標,允許一點點浮點誤差
  if (p.progress > p.layerCount && !p.holdAdjustPending){
    return `
    <div class="card">
      <h3>正2 曝險目標</h3>
      <div class="row"><span class="label">目前階段</span><span class="val">續抱中(兩檔都 HOLD)</span></div>
      <div class="row"><span class="label">目前曝險</span><span class="val">${p.currentRatio.toFixed(1)}%</span></div>
      <div class="muted" style="margin-top:6px;">續抱期間不做再平衡:${p.targetRatio}% 只在剛轉成 HOLD 時調整一次,之後漲跌造成的曝險變化都不加碼也不減碼,等出場訊號。</div>
    </div>`;
  }
  if (p.progress >= 1 && p.progress <= p.layerCount && !p.layerAdjustPending){
    return `
    <div class="card">
      <h3>正2 曝險目標</h3>
      <div class="row"><span class="label">目前階段</span><span class="val">${esc(stageLabel)}</span></div>
      <div class="row"><span class="label">目前曝險</span><span class="val">${p.currentRatio.toFixed(1)}%</span></div>
      <div class="muted" style="margin-top:6px;">這一層已經調整過:${p.targetRatio}% 只在剛接到這一層時調整一次,之後漲跌造成的曝險變化都不加碼也不減碼,等下一層、轉回續抱或出場。</div>
    </div>`;
  }
  return `
    <div class="card">
      <h3>正2 曝險目標</h3>
      <div class="row"><span class="label">目前階段</span><span class="val">${p.holdAdjustPending ? '剛轉成 HOLD' : p.layerAdjustPending ? `剛接到第 ${p.progress} / ${p.layerCount} 層` : esc(stageLabel)}</span></div>
      <div class="row"><span class="label">目前曝險</span><span class="val">${p.currentRatio.toFixed(1)}%</span></div>
      <div class="row"><span class="label" style="font-weight:700;">目標曝險</span><span class="val" style="font-weight:800;">${p.targetRatio}%</span></div>
      ${p.own && p.progress === 0 && p.own.exitDate ? ownBaseRow() + `<div class="muted" style="margin-top:4px; font-size:12px;">接刀只用自有資金:出場賣掉、還完房貸後,接刀第 1 層用這筆的 ${ownLayerPct(state.leverage.exposureTargets, 1)}%。要加上存款之類的錢就直接改。</div>` : ''}
      ${overTarget && lev2Value() < 1 ? `
        <div class="muted" style="margin-top:6px;">正2 已經沒有持股,不用再減碼;目前的曝險來自其他標的(例如 0050),照它們自己的訊號處理。</div>
      ` : overTarget ? (
        // 減碼有兩個邊界:賣了拿去還房貸(市值跟借款一起減,部位淨值不變)vs 賣了留現金(現金不算在分母裡,要賣更多)。
        // 還房貸最多只能還到借款餘額:沒有借款時只有「留現金」一種;借款比要還的少時,方案B 是「先還清、剩下留現金」
        // (整合模擬抓到:全現金部位照「賣掉還房貸」的金額賣,沒有房貸可還,曝險 68.8% 降不到 65%)。
        // 目標 0%(出場)兩者一樣,只寫一行
        loan < 1 ? `
        <div class="row sub"><span class="label">已超過目標,可考慮減碼(目前沒有房貸,賣掉的錢留著)</span>
          <span class="val">${sellCash == null || sellCash > lev2Value() + 1 ? sellAllLev2() : '約 NT$ ' + fmt(sellCash) + sellSplit(sellCash)}</span></div>
        ` : sellCash != null && Math.abs(sellCash - Math.abs(p.deltaLoan)) > 1 ? `
        <div class="row sub"><span class="label">已超過目標。方案B:賣掉、${Math.abs(p.deltaLoan) <= loan + 0.5 ? '錢拿去還房貸' : `先還清房貸 NT$ ${fmt(loan)}、剩下留現金`}</span>
          <span class="val">${sellRepay == null || sellRepay > lev2Value() + 1 ? sellAllLev2() + '(賣得的錢拿去還房貸,記得記還款)' : '約 NT$ ' + fmt(sellRepay) + sellSplit(sellRepay) + '(記得在「紀錄」分頁記還款)'}</span></div>
        <div class="row sub"><span class="label">方案A:賣掉、錢留著當現金</span>
          <span class="val">${sellCash > lev2Value() + 1 ? sellAllLev2()
            : '約 NT$ ' + fmt(sellCash) + sellSplit(sellCash)}</span></div>
        ` : `
        <div class="row sub"><span class="label">已超過目標,可考慮減碼</span>
          <span class="val">${Math.abs(p.deltaLoan) > lev2Value() + 1 ? sellAllLev2() : '約 NT$ ' + fmt(Math.abs(p.deltaLoan)) + sellSplit(Math.abs(p.deltaLoan))}</span></div>
      `) : (p.deltaLoan > 0.5 ? `
        <div class="row sub"><span class="label">方案A:自己拿新的錢出來買(現金)</span>
          <span class="val">${p.deltaCash == null ? '—(純現金到不了)' : 'NT$ ' + fmt(p.deltaCash) + split(p.deltaCash)}</span></div>
        ${p.deltaLoan <= room + 0.5 ? `
        <div class="row sub"><span class="label">方案B:直接借房貸額度買(不拿新錢)</span>
          <span class="val">NT$ ${fmt(p.deltaLoan)}${split(p.deltaLoan)}</span></div>` : room < 1 ? `
        <div class="row sub"><span class="label">方案B:借房貸額度買</span>
          <span class="val">—(房貸額度已經用完,只能用方案A)</span></div>` : `
        <div class="row sub"><span class="label">方案B:額度只剩 NT$ ${fmt(room)},借完還要自己拿現金</span>
          <span class="val">${mixCash == null ? '—(到不了)' : `借 NT$ ${fmt(room)} + 現金 NT$ ${fmt(mixCash)}(共 NT$ ${fmt(room + mixCash)})${split(room + mixCash)}`}</span></div>`}
      ` : `<div class="muted" style="margin-top:6px;">已經在目標曝險附近,不用加碼也不用減碼。</div>`)}
      ${p.holdAdjustPending || p.layerAdjustPending ? `
        <div class="muted" style="margin-top:6px;">${p.holdAdjustPending ? '這是轉成 HOLD 時唯一一次調整;調整完按下面這顆,之後續抱期間不再提示加碼/減碼。'
          : '這是接到這一層時唯一一次調整;調整完按下面這顆,之後這一層漲跌都不再提示加碼/減碼,等下一層、轉回續抱或出場。'}</div>
        <button class="btn" data-act="ack-hold" style="margin-top:8px;">✓ 已調整完成</button>
      ` : ''}

/* 哪些標的的趨勢狀態剛改變(跟使用者上次看過的不一樣),總覽頁跟訊號分頁都要用同一份判斷。 */
function trendChanges(){
  return computeAllTrends().filter(t => {
    const it = findInstrumentByKey(t.key);
    if (!it || !it.trend || !it.trend.lastSeenStatus || t.barsAvailable < t.barsNeeded || trendHistoryGap(it)) return false;   // 歷史有缺口時訊號不可信,不提醒
    return it.trend.lastSeenStatus !== t.status
      || (t.status === 'WAIT_RECOVER' && it.trend.lastSeenLayers >= 0 && t.pyramidCount !== it.trend.lastSeenLayers);
  });
}
/* 提醒的標題跟該做的事,總覽頁跟訊號分頁共用一份文字 */

  // 所以一檔出場時卡片會叫兩檔都減碼,一檔先加碼時卡片可能顯示不用動。提醒不能只說「這一檔」,不然跟卡片打架

/* 分割 vs 買賣紀錄:價格歷史會自動還原分割,但持股是把買賣紀錄的股數直接加總再乘最新股價。
   分割前記的紀錄(1000 股 @ 400)分割後會被算成 1000 股 × 18,市值只剩 1/22,曝險目標卡叫你大量加碼。
   不能自動換算:使用者可能已經自己把舊紀錄改成分割後的股數,再換一次就變 22 倍。所以偵測到
   「有分割、分割日之前有買賣紀錄、還沒處理過」就提醒,讓使用者選「幫我換算」或「已經是分割後的數字」。 */
const splitTag = d => `(${d} 分割換算)`;
/* 分割的股數倍數:分割(ratio < 1)是 1 拆 N、股數 ×N;反分割(ratio > 1)是 N 合 1、股數 ÷N。
   從價格反推的比例會有一點誤差(1/0.04348 = 22.999),分割本來就是整數比,接近整數就用整數——
   以前提醒寫「×22」、實際乘 22.999,1000 股換成 22999 股;反分割時提醒寫「約 1 拆 0」 */
function splitMultiple(ratio){
  const n = ratio < 1 ? 1 / ratio : ratio, r = Math.round(n);
  const k = r >= 1 && Math.abs(n - r) / r < 0.05 ? r : n;
  return ratio < 1 ? { mult: k, text: `1 拆 ${fmtRatio(k)}`, how: `股數 ×${fmtRatio(k)}、價格 ÷${fmtRatio(k)}` }
                   : { mult: 1 / k, text: `${fmtRatio(k)} 合 1`, how: `股數 ÷${fmtRatio(k)}、價格 ×${fmtRatio(k)}` };
}
const fmtRatio = k => Number.isInteger(k) ? String(k) : k.toFixed(2);
// 已經換算過的(備註有標記)不算、也不再換:還開著的舊版分頁可能把 splitsAcked 丟掉寫回來,提醒再跳一次時
// 重按「幫我換算」不能把同一批紀錄再乘一次
const splitPending = (t, it, d) => t.symbol === it.id && t.date < d && t.action !== 'dividend' && !String(t.note || '').includes(splitTag(d));
function splitTradeIssues(){
  const out = [];
  state.instruments.forEach(it => (it.splits || []).forEach(sp => {
    if ((it.splitsAcked || []).includes(sp.d)) return;
    const n = state.trades.filter(t => splitPending(t, it, sp.d)).length;
    if (n) out.push({ it, sp, n, sm: splitMultiple(sp.ratio) });
  }));
  return out;
}
function renderSplitAlerts(){
  return splitTradeIssues().map(({ it, sp, n, sm }) => `

        <div class="ad">那些紀錄如果是${sp.ratio < 1 ? '分割' : '反分割'}前的股數跟價格,現在的持股會算錯,市值、損益、曝險目標的金額都會錯。
          「幫我換算」會把它們的${sm.how}(成本金額不變,備註會註明);如果你已經自己改成換算後的數字,按「不用換算」。</div>

/* 訊號用的收盤價多久沒更新。照 🔔 執行的人,「沒有提醒」要代表「沒有訊號」,不能是「沒抓到新資料」
   (沒網路、證交所冷卻中、好幾天沒開 app)。以前只有設定分頁有「報價 N 天沒更新」,訊號分頁跟總覽看不到。
   知道休市日時:最後一筆收盤價之後、今天以前,只要有一天有開盤卻沒抓到就警告(今天的收盤價下午才有,不算);
   missed = 少了幾個交易日。不知道(那幾年的休市日沒抓到、Artifact 版)時照舊:超過 4 天才警告(週末只隔 3 天),連假會誤報。 */
function signalStaleness(today = todayISO()){
  const dates = state.instruments
    .filter(it => it.auto && /^[0-9A-Za-z]{3,8}$/.test(it.id) && (it.priceHistory || []).length)
    .map(it => it.priceHistory[it.priceHistory.length - 1].d);
  if (!dates.length) return null;
  const oldest = dates.sort()[0], days = daysBetweenISO(oldest, today);
  let known = true;
  for (let y = Number(oldest.slice(0, 4)); y <= Number(today.slice(0, 4)); y++) if (!holidayYear(y)) known = false;
  if (!known || days > 400) return days > 4 ? { date: oldest, days } : null;
  let missed = 0;
  const d = new Date(oldest + 'T00:00:00');
  for (;;){
    d.setDate(d.getDate() + 1);
    const s = d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
    if (s >= today) break;
    if (!marketClosed(s)) missed++;
  }
  return missed ? { date: oldest, days, missed } : null;
}
// 「(3 天前)」或知道休市日時「(少了 2 個交易日)」
const staleLabel = st => st.missed ? `少了 ${st.missed} 個交易日` : `${st.days} 天前`;
function renderStaleSignalAlert(){
  const st = signalStaleness();

/* 策略 vs 買進持有,全期/前段/後段各自的年化、MDD、年化÷MDD。策略那格的顏色是跟同一段的買進持有比。 */
function renderBacktestPeriods(r){
  const y = BACKTEST_SPLIT_DATE.slice(0, 4);
  // 整段都在切分日之後(或之前)時,另一段沒有資料,標題不能用資料的年份硬湊出「2022~2020」
  const cols = [['all', '全期'],
    ['early', r.from >= BACKTEST_SPLIT_DATE ? `${y} 前` : `${r.from.slice(0, 4)}~${Math.min(Number(y) - 1, Number(r.to.slice(0, 4)))}`],
    ['late', r.to < BACKTEST_SPLIT_DATE ? `${y} 後` : `${Math.max(Number(y), Number(r.from.slice(0, 4)))}~${r.to.slice(0, 4)}`]];
  const cls = (diff, eps) => Math.abs(diff) < eps ? '' : (diff > 0 ? 'pos' : 'neg');
  const cellOf = (st, vs) => !st ? '<td>—</td>' : `<td>`
    + (st.cagr == null ? '<span>—</span>'
       : `<span class="${vs && vs.cagr != null ? cls(st.cagr - vs.cagr, 0.5) : ''}">${st.cagr >= 0 ? '+' : ''}${st.cagr.toFixed(1)}%</span>`)
    + `<span class="${vs ? cls(st.mdd - vs.mdd, 0.5) : ''}">${st.mdd.toFixed(1)}%</span>`
    + `<span class="${vs && st.calmar != null && vs.calmar != null ? cls(st.calmar - vs.calmar, 0.02) : ''}">${st.calmar == null ? '—' : st.calmar.toFixed(2)}</span></td>`;
  return `
    <table class="bt-grid">
      <tr><th></th>${cols.map(([, label]) => `<th>${label}</th>`).join('')}</tr>
      <tr><th>策略</th>${cols.map(([k]) => cellOf(r.periods.strat[k], r.periods.bh[k])).join('')}</tr>
      <tr><th>買進持有</th>${cols.map(([k]) => cellOf(r.periods.bh[k], null)).join('')}</tr>
    </table>
    <div class="muted" style="font-size:11px; margin-top:4px;">每格:年化報酬 / MDD / 年化÷MDD(未滿一年不年化,顯示 —)。策略綠色 = 比同一段的買進持有好。
    分段的數字只在同一段內算,前後段可以互相比,不要拿去跟全期比。</div>`;
}

const nextDay = d => { const x = new Date(d + 'T00:00:00'); x.setDate(x.getDate() + 1); return x.getFullYear() + '-' + pad2(x.getMonth() + 1) + '-' + pad2(x.getDate()); };
const BT_ACT_LABEL = e => e.act === 'EXIT' ? '跌破出場線,全部賣出'
  : e.act === 'ADD' ? `接刀加碼第 ${e.n} 層` : '訊號轉回續抱,剩下的現金全部買進';

function windowStats(r, from, to, key){
  const seg = r.curve.filter(pt => pt.d >= from && pt.d < nextDay(to));
  if (seg.length < 2) return null;
  const st = periodStats(r.curve, from, nextDay(to), key);
  return { ret: (seg[seg.length - 1][key] / seg[0][key] - 1) * 100, mdd: st ? st.mdd : null, first: seg[0].d, last: seg[seg.length - 1].d };
}

function indexSimSeries(){

  const one = src.map(h => ({ d: h.d, c: h.c / 1000 }));
  const two = [{ d: src[0].d, c: 10 }];

/* 每一輪進出的勝率(2026-09 使用者問「策略勝率高嗎」)。一輪 = 從一次出場(全部現金)到下一次出場(又是全部現金),
   中間的接刀、轉回續抱、續抱都算在這一輪裡;頭尾都是全部現金,淨值的比值就是這一輪整體的賺賠(含手續費)。
   第一輪從回測起點(還沒進場,也是全部現金)開始;最後一輪還沒出場的標「進行中」,不算進勝率。
   另外數「出場後買回比較貴」的次數:出場價跟下一次轉回續抱的價格比,買回比較貴 = 那次出場被洗(接刀買的那部分不算在內,
   整輪賺賠看報酬那欄)。只是把 runBacktest 的 events 跟淨值曲線整理出來,不影響回測本身。 */
function tradeRounds(r){
  const at = new Map(r.curve.map(pt => [pt.d, pt]));
  const last = r.curve[r.curve.length - 1];
  const rounds = [];
  let from = r.curve[0].d, adds = 0, pendingExit = null, rebuys = 0, pricier = 0;
  const close = (to, done) => {
    const a = at.get(from), b = at.get(to);
    if (!a || !b) return;
    rounds.push({ from, to, adds, done, ret: (b.strat / a.strat - 1) * 100, bh: (b.bh / a.bh - 1) * 100 });
  };
  (r.events || []).forEach(e => {
    if (e.act === 'ADD') adds++;
    else if (e.act === 'RECOVER' && pendingExit){
      rebuys++;
      if (e.close > pendingExit.close) pricier++;
      pendingExit = null;
    }else if (e.act === 'EXIT'){
      close(e.d, true);
      from = e.d; adds = 0; pendingExit = e;
    }
  });
  if (last.d !== from) close(last.d, false);
  const done = rounds.filter(x => x.done);
  const wins = done.filter(x => x.ret > 0), losses = done.filter(x => x.ret <= 0);
  const avg = list => list.length ? sum(list, x => x.ret) / list.length : null;
  const avgWin = avg(wins), avgLoss = avg(losses);
  return {
    rounds, count: done.length, wins: wins.length,
    winRate: done.length ? wins.length / done.length * 100 : null,
    avgWin, avgLoss, payoff: avgWin != null && avgLoss != null && avgLoss < 0 ? avgWin / -avgLoss : null,
    best: done.length ? Math.max(...done.map(x => x.ret)) : null,
    worst: done.length ? Math.min(...done.map(x => x.ret)) : null,
    rebuys, pricier
  };
}

  if (!t.rounds.length) return '';
  const pct = v => v == null ? '—' : (v > 0 ? '+' : '') + v.toFixed(1) + '%';
  const cls = v => v > 0 ? 'pos' : v < 0 ? 'neg' : '';
  return `
    <div class="row sub"><span class="label">每一輪進出勝率</span><span class="val">${t.count ? `${t.wins} / ${t.count} 輪賺錢(${t.winRate.toFixed(0)}%)` : '還沒有出場過'}</span></div>
    ${t.count ? `<div class="row sub"><span class="label">平均賺 / 平均賠</span><span class="val"><span class="pos">${pct(t.avgWin)}</span> / <span class="neg">${pct(t.avgLoss)}</span>${t.payoff != null ? `(賺賠比 ${t.payoff.toFixed(1)})` : ''}</span></div>` : ''}
    ${t.rebuys ? `<div class="row sub"><span class="label">出場後買回比賣出價貴</span><span class="val">${t.pricier} / ${t.rebuys} 次</span></div>` : ''}
    <details class="adv">
      <summary>每一輪明細(${t.rounds.length} 輪)</summary>
      <div class="body">
        <table class="bt-grid">
          <tr><th>期間</th><th>接刀</th><th>策略</th><th>買進持有</th></tr>
          ${t.rounds.map(x => `<tr><th>${esc(x.from)}<br>~ ${x.done ? esc(x.to) : '進行中'}</th><td>${x.adds ? x.adds + ' 次' : '—'}</td>`
            + `<td class="${cls(x.ret)}">${pct(x.ret)}</td><td>${pct(x.bh)}</td></tr>`).join('')}
        </table>
        <div class="muted" style="font-size:11px; margin-top:4px;">一輪 = 從一次出場到下一次出場(第一輪從回測起點開始),中間接刀、轉回續抱、續抱都算在同一輪;
          「策略」是這一輪整體賺賠(含手續費),「買進持有」是同一段期間一直抱著的漲跌。還沒出場的那輪標「進行中」,不算進勝率。
          「出場後買回比賣出價貴」是被洗的次數:出場之後,轉回續抱時的價格比當初賣的還高。
          均線策略本來就常常小賠(被洗)、偶爾大賺(躲掉大跌、抱完整段多頭),看勝率要一起看平均賺賠。</div>
      </div>
    </details>`;
}

          <div class="row sub"><span class="label">策略總報酬 / MDD</span><span class="val ${r.returnStrat >= 0 ? 'pos' : 'neg'}">${r.returnStrat >= 0 ? '+' : ''}${r.returnStrat.toFixed(1)}% / ${r.mddStrat.toFixed(1)}%</span></div>
          <div class="row sub"><span class="label">買進持有總報酬 / MDD</span><span class="val ${r.returnBh >= 0 ? 'pos' : 'neg'}">${r.returnBh >= 0 ? '+' : ''}${r.returnBh.toFixed(1)}% / ${r.mddBh.toFixed(1)}%</span></div>
