   沒事就說今天不用動。 */
function exposureTodo(){
  const p = computeExposurePlan();
  if (!p || loanLedgerMissing() || computeRisk().capacity <= 0) return null;
  const lev2 = p.instruments.map(findInstrumentByKey).filter(Boolean);
  if (lev2.some(it => { const t = computeTrend(it); return t.barsAvailable < t.barsNeeded || trendHistoryGap(it); })) return null;
  if (splitTradeIssues().some(x => p.instruments.includes(x.it.key))) return null;   // 分割提醒另外列
  if (p.progress > p.layerCount && !p.holdAdjustPending) return null;               // 續抱中,不再平衡
  if (p.progress >= 1 && p.progress <= p.layerCount && !p.layerAdjustPending) return null;   // 這一層調整過了
  if (p.own && p.progress >= 1){                     // 接刀只用自有資金:跟卡片同一套判斷
    if (!p.own.base) return { text: `接刀第 ${p.progress} 層:先填接刀用的自有資金`, sub: 'app 不知道帳戶裡的現金,填了才算得出要買多少', tab: 'signal' };
    if (p.own.need > 0.5) return { text: `接刀第 ${p.progress} 層:用自有資金買正2`, sub: '不動用房貸,要買多少看「正2 曝險目標」卡', tab: 'signal' };
    return { text: '這一層已經買到目標', sub: '到「正2 曝險目標」卡按「已調整完成」', tab: 'signal' };
  }
  const lev2Value = sum(computeLeverage().holdings.filter(h => p.instruments.includes(h.key)), h => h.value);
  const now = `目前 ${p.currentRatio.toFixed(0)}% → 目標 ${p.targetRatio}%`;
  if (p.deltaLoan < -0.5) return lev2Value < 1 ? null
    : { text: p.targetRatio === 0 ? '正2 出場:賣出' : '正2 減碼', sub: now + ',要賣多少看「正2 曝險目標」卡', tab: 'signal' };
  if (p.deltaLoan > 0.5) return { text: p.progress > p.layerCount ? '轉回續抱:正2 加碼' : `接刀第 ${p.progress} 層:正2 加碼`, sub: now + ',要買多少看「正2 曝險目標」卡', tab: 'signal' };
  if (p.holdAdjustPending || p.layerAdjustPending) return { text: '曝險已經在目標附近', sub: '到「正2 曝險目標」卡按「已調整完成」', tab: 'signal' };
  return null;
}
function todoItems(){
  const out = [], today = todayISO();
  const go = (icon, text, sub, tab, html = false) => out.push({ icon, text, sub, tab, html });
  const st = signalStaleness();
  if (st) go('🕘', `收盤價停在 ${st.date}(${staleLabel(st)})`, '先更新收盤價,訊號才是今天的', 'signal');
  splitTradeIssues().forEach(({ it, n }) => go('✂️', `${it.id} 分割過,有 ${n} 筆買賣紀錄要處理`, '處理完持股跟加碼金額才算得對', 'signal'));
  trendChanges().forEach(t => { const it = findInstrumentByKey(t.key); if (it) go('🔔', trendAlertText(t, it).title, '看完按「知道了」', 'signal', true); });   // title 已經跳脫過
  const ex = exposureTodo();
  if (ex) go('⚖️', ex.text, ex.sub, ex.tab);
  if (loanLedgerMissing()) go('📒', '有用房貸買進,但還沒有房貸動用紀錄', '借款餘額被當成 0,曝險比例會偏低', 'log');
  else { const mm = loanMismatch(); if (mm) go('📒', '動用紀錄跟房貸買進金額對不起來', `差 NT$ ${fmt(Math.abs(mm.diff))},詳細在設定分頁`, 'setup'); }
  const future = state.trades.filter(t => t.date > today).length;
  if (future) go('📅', `有 ${future} 筆買賣的日期在未來`, '是不是年份打錯了', 'log');
  monthLoanDues().forEach(d => {
    const days = d.date ? daysBetweenISO(today, d.date) : -1;
    if (d.date >= today && days <= 7) go('🏦', `${d.date.slice(5).replace('-', '/')} ${d.name}扣款 約 NT$ ${fmt(d.principal + d.interest)}`,
      (days === 0 ? '今天' : days + ' 天後') + ',帳戶記得留錢', state.liabilities.some(l => l.name === d.name) ? '' : 'setup');
  });
  state.leverage.draws.filter(d => d.useDate > today && daysBetweenISO(today, d.useDate) <= 7)
    .forEach(d => go('💳', `${d.useDate.slice(5).replace('-', '/')} 預定動用 NT$ ${fmt(d.amount)}`, '銀行到那天才撥款;已經用它買進的,曝險先算進借款', 'log'));
  return out;
}

/* 每月把槓桿利息記成一筆支出。已記過的月份會留在 interestPosted,
   所以你把那筆刪掉之後不會又被加回來。 */
/* 開 app、回到前景、改動用日期時跑的每月工作:理財型每月還本 → 理財型利息 → 一般型房貸的剩餘本金與利息。
   還本要在利息前面:本月利息照「還完本月本金之後」的餘額算。 */
function maybePostInterest(){
  const a = maybeAutoRepay();
  const b = postLeverageInterest();
  const c = syncLoanLiabilities();
  const d = postLoanInterest();
  return a || b || c || d;
}

/* 理財型房貸每月最低還本:每月繳款日(payDay 號)對每筆動用記一筆「當時剩餘餘額 × repayPermille ‰」的還款。
   - 繳款日還沒到不記(那個月不標成已處理,過了繳款日再打開才記)
   - 動用當月不還(動用日要在那個月 1 日之前),下個月起
   - 那個月已經有還款(自己記的)就不另外記
   - 處理過的月份記在 repayPosted(包括使用者刪掉自動那筆的月份),不會重複、也不會補回被刪的
   - 跟利息一樣,第一次只從本月開始,不回頭補更早的;中間沒開 app 的月份會補
   - 還款 id 照月份固定(autorepayYYYYMM):兩台裝置同時補記,合併時是同一筆,不會還兩次。
     id 不能有「-」:還款欄位的 data-k 是 rp-<what>-<動用id>-<還款id>,最後一段當還款 id */
const AUTO_REPAY_PREFIX = 'autorepay';
/* 理財型房貸 m 月的繳款日;那個月沒有那一天(31 號、2 月 30 號)就用月底 */
function levDueDate(m, day = state.leverage.payDay){
  const last = Number(monthEndISO(m).slice(8, 10));
  return m + '-' + pad2(Math.min(Math.max(1, Math.round(day) || 1), last));
}
/* 改繳款日:本月已經自動記的還本跟利息(記在舊繳款日的)搬到新的繳款日;過去月份不動 */
function applyPayDay(value){
  const L = state.leverage;
  if (String(value).trim() === '') return;
  const nd = Math.min(31, Math.max(1, Math.round(num(value)) || 1));
  if (nd === L.payDay) return;
  const m = thisMonth(), oldDue = levDueDate(m), newDue = levDueDate(m, nd), rid = AUTO_REPAY_PREFIX + m.replace('-', '');
  // 上一期算到舊的上月繳款日為止(本月已經記的那筆也是從那天算起),本月改成從那天算到新繳款日。
  // 同一個月改兩次,照第一次改之前的
  if (!(L.payDayFrom && L.payDayFrom.m === m)) L.payDayFrom = { m, d: levDueDate(shiftMonth(m, -1)) };
  L.payDay = nd;
  L.draws.forEach(d => (d.repayments || []).forEach(r => { if (r.id === rid) r.date = newDue; }));
  // 搬到還沒到的日子的利息,postLeverageInterest() 會拿掉、到了繳款日再記(記帳裡不留還沒發生的支出)。
  // 自動還本只搬日期:id 照月份固定,刪掉會留刪除紀錄、到時候補不回來;未來日期的還款本來就不算進餘額
  state.transactions.forEach(t => {
    if (t.desc !== AUTO_INTEREST_DESC || t.date !== oldDue) return;
    t.date = newDue;
    if (newDue <= todayISO()) t.amount = num(-Math.round(levPeriodInterest(m)));   // 期間變了,金額跟著重算
  });
  maybePostInterest();
  scheduleSave();
}
function maybeAutoRepay(){
  const L = state.leverage;
  if (!L.autoRepay || !(L.repayPermille > 0)) return false;
  const cur = thisMonth(), posted = L.repayPosted;
  const last = posted.length ? posted.slice().sort()[posted.length - 1] : '';
  const first = last && last < cur ? shiftMonth(last, 1) : cur;
  const today = todayISO();
  let changed = false;
  // 第一次用、本月繳款日還沒到:上個月標成已處理,下次打開(就算跨月了)才知道要從本月開始記
  if (!posted.length && levDueDate(cur) > today){ posted.push(shiftMonth(cur, -1)); changed = true; }
  for (let m = first, guard = 0; m <= cur && guard < 240; m = shiftMonth(m, 1), guard++){
    if (posted.includes(m)) continue;
    const day = levDueDate(m), rid = AUTO_REPAY_PREFIX + m.replace('-', '');
    if (day > today) break;
    L.draws.forEach(d => {
      if (!d.useDate || d.useDate >= m + '-01') return;
      if ((d.repayments || []).some(r => r.id === rid || (r.date && r.date.slice(0, 7) === m))) return;
      const bal = balanceAt(d, day);
      const amt = Math.min(bal, Math.round(bal * L.repayPermille / 1000));
      if (!(amt > 0)) return;
      d.repayments.push({ id: rid, date: day, amount: amt });
      diag('自動記帳', `${m} 理財型最低還本 ${$n(amt)}(${d.label || d.id},餘額 ${$n(bal)} × 千分之 ${L.repayPermille})`);
      noteAutoPosted('draws/' + mergeKey(d) + '/repayments', { id: rid });
    });
    posted.push(m);
    changed = true;
  }
  if (changed) scheduleSave();
  return changed;
}
/* 理財型 m 月繳款日要繳的利息:每筆動用從上次繳款日到這次繳款日逐日計息(銀行以日計息)。
   中途還款、中途動用、升降息都照日期分段;剛動用的從動用日算起。繳款日那天的還款算下一期 */
// m 月這一期利息從哪天算起(上次繳款日)。改過繳款日的那個月:從舊繳款日接著算,不然新舊兩個日子中間那段會重複算或漏掉
function levPeriodFrom(m){
  const L = state.leverage, due = levDueDate(m);
  return L.payDayFrom && L.payDayFrom.m === m && L.payDayFrom.d < due ? L.payDayFrom.d : levDueDate(shiftMonth(m, -1));
}
/* 設定頁「下一期利息」:還沒到的最近一個繳款日要扣的利息,照目前餘額逐日算(跟總覽「房貸要繳」同一套)。
   2026-10 以前是「餘額 × 年利率 ÷ 12」,跟總覽的逐日計息對不起來(758 vs 919) */
function nextLevInterest(){
  const m0 = thisMonth(), m = levDueDate(m0) > todayISO() ? m0 : shiftMonth(m0, 1), due = levDueDate(m);
  // bank:網路銀行現在看到的(只算已經轉出的;預定動用還沒發生)。2026-10 使用者對過:銀行 1,260、app 1,532,差的就是 10/12 那兩筆預定
  return { amount: Math.round(levPeriodInterest(m)), bank: Math.round(levPeriodInterest(m, true)), label: `下一期利息(${due.slice(5).replace('-', '/')} 扣)` };
}
/* 預定動用(動用日在今天之後)還沒轉出的金額。剩餘可動用要先扣掉:那筆錢已經講好要用了,網路銀行要到那天才看得到 */
function plannedDrawAmount(){
  const today = todayISO();
  return sum(state.leverage.draws.filter(d => d.useDate && d.useDate > today && d.amount > 0), d => d.amount);
}
/* 已經拿去買股票、還沒撥款的預定動用:房貸買進記在成交日,股票當天就算進部位市值,動用日卻是交割日(T+2),
   中間這兩天借款餘額沒有它,「自己的錢」被高估、曝險比例被低估(2026-10 使用者回報:10/12 兩筆預定 77 萬)。
   只算「房貸買進合計 − 已撥款的動用合計」不夠的那部分,上限是預定動用合計;單純先記下來、還沒買的預定動用不算
   (錢還沒借也還沒花)。cut 那天以前(incl = 含那天)為準:今天(曝險)、或出場日前一刻(接刀自有資金) */
function pendingLoanFunding(cut = todayISO(), incl = true){
  const ds = state.leverage.draws.filter(d => d.useDate && d.amount > 0);
  const past = d => incl ? d.useDate <= cut : d.useDate < cut;
  const later = sum(ds.filter(d => !past(d)), d => d.amount);
  if (!(later > 0)) return 0;
  const drawn = sum(ds.filter(past), d => d.amount);
  const spent = sum(state.trades.filter(t => t.action === 'buy' && t.source === 'loan' && (incl ? t.date <= cut : t.date < cut)), t => t.shares * t.price + t.fee);
  return Math.max(0, Math.min(later, spent - drawn));
}
function levPeriodInterest(m, onlyDrawn = false){
  const L = state.leverage, due = levDueDate(m), today = todayISO();
  const from = levPeriodFrom(m);
  return sum(L.draws.filter(d => !onlyDrawn || (d.useDate && d.useDate <= today)), d => Math.max(0, accrue(d, L, due) - accrue(d, L, from)));
}
/* 本月理財型要繳多少本金(最低還本),每筆動用照 maybeAutoRepay 的規則:
   - 本月已經自動記了 → 那筆的金額
   - 本月自己還過(自動就不另外記)→ 最低還本跟自己還的取小的:月中自己把整筆還清,不能顯示成「本月要繳 100 萬」
   - 都還沒有 → 動用當月不還;否則預估繳款日那天的餘額 × ‰ */
/* 本月最低還本。base = 拿來乘千分之幾的餘額合計(總覽列「餘額 × 千分之 5」用);manual = 有一筆是自己記的還款,
   算式對不上就不列;newDraws = 本月才動用、下個月起才還的筆數 */
function leverageMonthPrincipal(){
  const L = state.leverage, m = thisMonth(), due = levDueDate(m), rid = AUTO_REPAY_PREFIX + m.replace('-', '');
  let amount = 0, estimate = false, base = 0, manual = false, newDraws = 0;
  L.draws.forEach(d => {
    const rs = (d.repayments || []).filter(r => r.date && r.date.slice(0, 7) === m);
    const auto = rs.find(r => r.id === rid);
    if (auto){ amount += auto.amount; base += balanceAt(d, due) + auto.amount; return; }   // 自動那筆是用扣之前的餘額算的
    if (!d.useDate) return;
    if (d.useDate >= m + '-01'){ if (d.useDate <= due && d.amount > 0) newDraws++; return; }
    if (rs.length){
      const min = Math.round(balanceAt(d, monthEndISO(shiftMonth(m, -1))) * L.repayPermille / 1000);
      amount += Math.min(min, sum(rs, r => r.amount));
      manual = true;
      return;
    }
    if (!(balanceAt(d, due) > 0)) return;
    amount += Math.round(balanceAt(d, due) * L.repayPermille / 1000);
    base += balanceAt(d, due);
    estimate = true;
  });
  return { amount, estimate, base, manual, newDraws };
}

/* ---------- 一般型房貸(本利攤還) ---------- */
/* 撥款日往後 k 個月的同一天(那個月沒有這天就用月底) */
function addMonthsISO(iso, k){
  const y = Number(iso.slice(0, 4)), mo = Number(iso.slice(5, 7)) - 1, d = Number(iso.slice(8, 10));
  const t = new Date(y, mo + k, 1);
  const last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
  return t.getFullYear() + '-' + pad2(t.getMonth() + 1) + '-' + pad2(Math.min(d, last));
}
/* 本利攤還(等額本息):每期月付 = 餘額 × r ÷ (1 − (1+r)^−剩餘期數),r = 那一期開始時的年利率 ÷ 12。
   每期都用「當時餘額、剩餘期數、當時利率」重算,所以升降息之後月付會跟著變(銀行的做法),利率沒變時每期一樣。
   回傳到 until(含)為止繳過的每一期跟繳完的餘額;還沒撥款(start 在 until 之後)餘額是 0。 */
function amortize(loan, until = todayISO()){
  const N = Math.round((loan && loan.years || 0) * 12);
  const out = { rows: [], balance: 0, N };
  if (!loan || !loan.start || !(loan.principal > 0) || !(N > 0) || loan.start > until) return out;
  let B = loan.principal;
  for (let k = 1; k <= N; k++){
    const date = addMonthsISO(loan.start, k);
    if (date > until) break;
    const r = rateAt(loan, addMonthsISO(loan.start, k - 1)) / 1200, n = N - k + 1;
    const pay = r > 0 ? B * r / (1 - Math.pow(1 + r, -n)) : B / n;
    const interest = B * r, principal = Math.min(B, pay - interest);
    B = Math.max(0, B - principal);
    out.rows.push({ k, date, payment: interest + principal, interest, principal, balance: B });
  }
  out.balance = B;
  return out;
}
/* 下一期(今天之後第一期)要繳多少:用目前餘額、剩餘期數、目前利率算 */
function nextLoanPayment(loan){
  const a = amortize(loan);
  const k = a.rows.length + 1;
  if (!loan || !loan.start || !(a.N > 0) || k > a.N || !(loan.principal > 0)) return null;
  const B = loan.start > todayISO() ? loan.principal : a.balance;
  if (!(B > 0)) return null;
  const r = rateAt(loan, todayISO()) / 1200, n = a.N - k + 1;
  const pay = r > 0 ? B * r / (1 - Math.pow(1 + r, -n)) : B / n;
  return { k, N: a.N, date: addMonthsISO(loan.start, k), payment: pay, interest: B * r, principal: pay - B * r, balance: B };
}
const loanReady = l => !!(l && l.loan && l.loan.start && l.loan.principal > 0 && l.loan.years > 0);
/* 設成本利攤還的負債,金額 = 今天的剩餘本金(還沒撥款就是貸款金額) */
function syncLoanLiabilities(){
  let changed = false;
  state.liabilities.forEach(l => {
    if (!loanReady(l)) return;
    const v = Math.round(l.loan.start > todayISO() ? l.loan.principal : amortize(l.loan).balance);
    if (l.amount !== v){ l.amount = v; changed = true; }
  });
  if (changed){ maybeSnapshot(); scheduleSave(); }
  return changed;
}
/* 一般型房貸每期的利息記成一筆「房貸利息」支出(只記利息,還本只減負債,不算支出),記在繳款日。
   跟理財型的利息一樣:第一次只從本月開始、中間沒開 app 的月份補記、刪掉的不補回;
   本月的繳款日還沒到就先不記也不標已處理。交易 id 照負債跟月份固定,兩台同時記合併後是同一筆。 */
function postLoanInterest(){
  let changed = false;
  const cur = thisMonth(), today = todayISO();
  state.liabilities.forEach(l => {
    if (!loanReady(l) || !l.loan.autoInterest) return;
    const lo = l.loan, posted = lo.interestPosted;
    // 第一次:上個月標成已處理,不回頭補,但本月繳款日還沒到、下次跨月才打開時,本月那期不會漏(跟理財型同一條規則)
    if (!posted.length){ posted.push(shiftMonth(cur, -1)); changed = true; }
    const rows = amortize(lo).rows;
    const last = posted.length ? posted.slice().sort()[posted.length - 1] : '';
    const first = last && last < cur ? shiftMonth(last, 1) : cur;
    for (let m = first, guard = 0; m <= cur && guard < 240; m = shiftMonth(m, 1), guard++){
      if (posted.includes(m)) continue;
      const row = rows.find(x => x.date.slice(0, 7) === m);
      if (!row || row.date > today){                // 這個月沒有要繳的(還沒撥款/已繳完),或本月繳款日還沒到
        if (m < cur){ posted.push(m); changed = true; }
        continue;
      }
      const id = ('li-' + l.id).slice(0, 50) + '-' + m.replace('-', '');
      if (row.interest >= 0.5 && !state.transactions.some(t => t.id === id)){
        noteAutoPosted('transactions', { id });
        state.transactions.push({ id, date: row.date, cat: '房貸利息', desc: (l.name || '房貸') + '利息(自動記入)', amount: num(-Math.round(row.interest)) });
        diag('自動記帳', `${m} ${l.name || '房貸'}(一般型)利息 ${$n(row.interest)}`);   // num():夾在 ±1 兆,跟存檔再讀回來一樣
      }
      posted.push(m);
      changed = true;
    }
  });
  if (changed) scheduleSave();
  return changed;
}

function postLeverageInterest(){
  const L = state.leverage;
  if (!L.autoInterest) return false;
  const cur = thisMonth();
  let changed = false;
  // 日期還沒到的自動利息(上一版改繳款日時搬到未來日期的)拿掉、那個月改回未處理,到了繳款日再記。
  // 「最近一次」會因此往前退,中間沒記的月份(使用者關掉/刪掉的)要標成已處理,不然會被補記
  const today0 = todayISO(), future = state.transactions.filter(t => t.desc === AUTO_INTEREST_DESC && t.date > today0);
  let redo = '';
  if (future.length){
    const ms = new Set(future.map(t => t.date.slice(0, 7)));
    state.transactions = state.transactions.filter(t => !future.includes(t));
    redo = [...ms].sort()[0];
    L.interestPosted = L.interestPosted.filter(x => !ms.has(x));
    const rest = L.interestPosted.slice().sort(), prevLast = rest[rest.length - 1];
    if (prevLast){
      for (let m = shiftMonth(prevLast, 1), guard = 0; m < redo && guard < 240; m = shiftMonth(m, 1), guard++) L.interestPosted.push(m);
    } else L.interestPosted.push(shiftMonth(redo, -1));
    changed = true;
  }
  const posted = L.interestPosted;
  // 從「最近一次記入」的下個月開始,中間整個月沒開 app 的月份也要補記——以前只記「打開的那個月」,
  // 某個月沒開就永遠漏記那個月的利息,記帳支出少算(壓測抓到 10 月、12 月沒開就沒有利息)。
  // 只補最近一次之後的空檔,不回頭補更早的歷史空檔:那可能是使用者刻意關掉自動記入的期間(自己手動記),
  // 補了會重複。重新打開開關時,關掉期間的月份會被標成已處理(見 toggle-autointerest)。
  // 已經記過(包括使用者自己刪掉那筆)的月份都在 interestPosted 裡,不會重複記、也不會補回被刪的。
  // 記在每月繳款日(跟還本同一天),繳款日還沒到不記;金額 = 上次繳款日到這次繳款日逐日算的利息(levPeriodInterest)。
  const last = posted.length ? posted.slice().sort()[posted.length - 1] : '';
  const first = last && last < cur ? shiftMonth(last, 1) : cur;
  const today = todayISO();
  // 第一次用、本月繳款日還沒到:上個月標成已處理,下次打開(就算跨月了)才知道要從本月開始記
  if (!posted.length && levDueDate(cur) > today){ posted.push(shiftMonth(cur, -1)); changed = true; }
  for (let m = first, guard = 0; m <= cur && guard < 240; m = shiftMonth(m, 1), guard++){
    if (posted.includes(m)) continue;
    const due = levDueDate(m);
    if (due > today) break;
    const amt = levPeriodInterest(m);
    if (!(amt > 0)) continue;
    // id 照繳款日固定:兩台裝置同一天各自記,合併時是同一筆(以前用 uid() 會變兩筆)。
    // 帶日期不只月份:改繳款日時舊的那筆被拿掉、新日期重記,只用月份的話會被刪除紀錄擋掉
    const id = 'levi-' + due.replace(/-/g, '');
    if (state.transactions.some(t => t.id === id)){ posted.push(m); changed = true; continue; }
    noteAutoPosted('transactions', { id });
    state.transactions.push({
      id,
      date: due,
      cat: '房貸利息',
      desc: AUTO_INTEREST_DESC,
      amount: num(-Math.round(amt))   // num():夾在 ±1 兆,跟存檔再讀回來一樣
    });
    diag('自動記帳', `${m} 理財型利息 ${$n(amt)}(${levPeriodFrom(m)}~${due} 逐日計息)`);
    posted.push(m);
    changed = true;
  }
  if (changed) scheduleSave();
  return changed;
}

/* ===================== 診斷報告:健康檢查 ===================== */
/* 用這台裝置上的真實資料檢查幾件測試碰不到的事(假資料測不出「時間差」這類問題,2026-10 使用者貼畫面才抓到預定動用的 bug)。
   每項 { lv: 'ok' | 'warn' | 'info', t: 文字 },金額用 $n()。只讀不改。新增檢查時,抓到的問題修好後也要加進自動測試。 */
function healthCheck(){
  const out = [], ok = t => out.push({ lv:'ok', t }), warn = t => out.push({ lv:'warn', t }), info = t => out.push({ lv:'info', t });
  const L = state.leverage, today = todayISO(), cur = thisMonth();
  const p = computePosition(), r = computeLeverage(), k = computeRisk();
  // 部位市值:買賣紀錄回放(損益卡)跟持股 × 股價(曝險卡)兩套算法要一樣
  if (p.hasData){
    if (Math.abs(p.marketValue - r.totalValue) > 1) warn(`部位市值兩套算法不一致:損益 ${$n(p.marketValue)}、曝險 ${$n(r.totalValue)}`);
    else ok(`部位市值 ${$n(k.pv)}(損益卡、曝險卡一致)`);
  }
  // 借款
  info(`借款:銀行已撥款 ${$n(r.usedAmount)}、已買進還沒撥款 ${$n(r.pendingLoan)}、預定動用合計 ${$n(plannedDrawAmount())}、額度 ${$n(L.creditLimit)}`);
  info(`曝險 ${k.exposureRatio.toFixed(1)}% = 實質曝險 ${$n(k.exposure)} ÷(自己的錢 ${$n(k.equity)} + 額度 ${$n(L.creditLimit)})`);
  if (k.capacity <= 0) warn('分母(自己的錢 + 額度)≤ 0,曝險比例沒有意義');
  if (loanLedgerMissing()) warn('有用房貸買進的紀錄,但一筆動用都沒有');
  const mm = loanMismatch();
  if (mm) warn(`動用合計跟房貸買進合計差 ${$n(mm.diff)}(動用 ${$n(mm.r.drawnAmount)}、房貸買進 ${$n(mm.p.buyLoan)})`);
  const unused = unusedLoanCash();
  if (unused > 0) info(`借了還沒用完 ${$n(unused)}(下次房貸買進會先扣)`);
  // 動用紀錄本身
  L.draws.forEach(d => {
    const name = d.label || d.id;
    if (d.amount > 0 && !d.useDate) warn(`動用「${name}」${$n(d.amount)} 沒填動用日,不算借款`);
    (d.repayments || []).forEach(x => {
      if (d.useDate && x.date && x.date < d.useDate) warn(`動用「${name}」有一筆還款(${x.date} ${$n(x.amount)})早於動用日 ${d.useDate},被忽略`);
      if (x.date > today) info(`動用「${name}」有未來日期的還款 ${x.date} ${$n(x.amount)}(到那天才算)`);
    });
    const rep = sum(d.repayments || [], x => x.amount);
    if (rep > d.amount + 0.5) warn(`動用「${name}」還款合計 ${$n(rep)} 超過動用 ${$n(d.amount)}`);
  });
  // 一般型房貸:負債金額要等於剩餘本金
  state.liabilities.forEach(l => {
    if (!loanReady(l)) return;
    const v = Math.round(l.loan.start > today ? l.loan.principal : amortize(l.loan).balance);
    if (Math.abs(l.amount - v) > 1) warn(`一般型房貸「${l.name}」負債金額 ${$n(l.amount)} 跟剩餘本金 ${$n(v)} 不一樣`);
  });
  // 自動記帳:處理過的月份中間不能有洞(有洞 = 那個月漏記,或被標成處理過卻沒記)
  const holes = (list, label) => {
    const ms = [...new Set(list || [])].sort();
    if (!ms.length) return;
    const miss = [];
    for (let m = ms[0], g = 0; m < ms[ms.length - 1] && g < 600; m = shiftMonth(m, 1), g++) if (!ms.includes(m)) miss.push(m);
    if (miss.length) warn(`${label}處理過的月份中間缺 ${miss.join('、')}`);
    else ok(`${label}:${ms[0]} 起每個月都處理過(最近 ${ms[ms.length - 1]})`);
  };
  if (L.autoRepay) holes(L.repayPosted, '理財型自動還本');
  if (L.autoInterest) holes(L.interestPosted, '理財型自動利息');
  state.liabilities.forEach(l => { if (loanReady(l) && l.loan.autoInterest) holes(l.loan.interestPosted, `「${l.name}」自動利息`); });
  const autoByMonth = {};
  state.transactions.filter(t => t.desc === AUTO_INTEREST_DESC).forEach(t => { const m = t.date.slice(0, 7); autoByMonth[m] = (autoByMonth[m] || 0) + 1; });
  Object.keys(autoByMonth).filter(m => autoByMonth[m] > 1).forEach(m => warn(`${m} 理財型自動利息記了 ${autoByMonth[m]} 筆`));
  // 買賣紀錄
  const sq = soldQtyById();
  state.trades.filter(t => t.action === 'sell' && sq[t.id] != null && sq[t.id] < t.shares - 1e-9)
    .forEach(t => warn(`${t.date} 賣出 ${t.symbol} ${t.shares} 股,當時只持有 ${sq[t.id]} 股(賣超,只算得掉持有的)`));
  const fut = state.trades.filter(t => t.date > today).length, futTx = state.transactions.filter(t => t.date > today).length;
  if (fut || futTx) info(`未來日期:買賣 ${fut} 筆、記帳 ${futTx} 筆`);
  // 價格與訊號
  state.instruments.filter(it => it.auto && it.id).forEach(it => {
    const t = computeTrend(it), gap = trendHistoryGap(it);
    if (t.barsAvailable < t.barsNeeded) warn(`${it.id} 價格歷史 ${t.barsAvailable} 筆,算均線要 ${t.barsNeeded} 筆`);
    else if (gap) warn(`${it.id} 價格歷史中間缺一段(${gap.from || ''}~${gap.to || ''}),訊號不可信`);
    else ok(`${it.id} ${t.lastDate} 收盤 ${t.lastClose}:${t.status}${t.status === 'WAIT_RECOVER' ? ` 第 ${t.pyramidCount} 層` : ''}${t.cushionPct != null ? `,再跌 ${t.cushionPct.toFixed(1)}% 出場` : ''}`);
  });
  const st = signalStaleness();
  if (st) warn(`收盤價停在 ${st.date}(${staleLabel(st)})`);
  splitTradeIssues().forEach(x => warn(`${x.it.id} ${x.sp.d} 分割前有 ${x.n} 筆買賣還沒選要不要換算`));
  // 接刀只用自有資金
  const plan = computeExposurePlan();
  if (plan && plan.own && plan.progress >= 1) {
    if (!plan.own.base) warn(`接刀第 ${plan.progress} 層,還沒有接刀用的自有資金(出場 ${plan.own.exitDate || '?'})`);
    else info(`接刀用自有資金 ${$n(plan.own.base)}(${plan.own.auto ? '自動記' : '自己填'}),出場後已買 ${$n(plan.own.bought)}`);
  }
  // 每月快照
  const hist = state.netWorthHistory.slice().sort((a, b) => a.m < b.m ? -1 : 1);
  if (hist.length){
    const miss = [];
    for (let m = hist[0].m, g = 0; m < cur && g < 600; m = shiftMonth(m, 1), g++) if (!hist.some(h => h.m === m)) miss.push(m);
    if (miss.length) info(`每月快照缺 ${miss.length} 個月(沒打開 app 的月份):${miss.slice(-6).join('、')}`);
    const now = hist.find(h => h.m === cur);
    if (now && now.auto && Math.abs(now.v - Math.round(netWorth())) > 1) warn(`本月快照淨資產 ${$n(now.v)} 跟目前 ${$n(netWorth())} 不一樣`);
  }
  // id 重複(normalize 會修,出現代表修的地方漏了)
  const dup = (list, label) => { const seen = new Set(); (list || []).forEach(x => { if (seen.has(x.id)) warn(`${label}有重複的 id ${x.id}`); seen.add(x.id); }); };
  dup(state.transactions, '記帳'); dup(state.trades, '買賣'); dup(state.leverage.draws, '動用');
  return out;
}
/* 資料卡上的摘要跟展開內容(畫面上的金額一樣照 👁 遮) */
// 收著時只數紀錄(健康檢查每次總覽重畫都跑會拖慢 4~5 成,展開或複製時才跑)

const findById = (list, id) => list.find(x => x.id === id);
const idEditStash = new Map();   // 改標的代號途中收起來的原本歷史(見 onField 的 in-id),改回原代號就還回去

function applyLoanRate(lid, value){
  const l = findById(state.liabilities, lid);
  if (!l || !l.loan || String(value).trim() === '') return;
  setCurrentRate(l.loan, Math.max(0, num(value)));
  syncLoanLiabilities();

function onField(key, el){
  diagLastAct = 'field ' + key;
  const dash = key.indexOf('-');
  const kind = key.slice(0, dash);
  const rest = key.slice(dash + 1);
  let structural = false;

  if (kind === 'an'){ const a = findById(state.assets, rest); if (a) a.name = el.value; }
  else if (kind === 'aa'){ const a = findById(state.assets, rest); if (a) a.amount = Math.max(0, num(el.value)); }
  else if (kind === 'ln'){ const l = findById(state.liabilities, rest); if (l) l.name = el.value; }
  else if (kind === 'la'){ const l = findById(state.liabilities, rest); if (l && !loanReady(l)) l.amount = Math.max(0, num(el.value)); }
  else if (kind === 'lo'){                        // 一般型房貸設定:lo-<欄位>-<負債 id>
    const cut = rest.indexOf('-'), what = rest.slice(0, cut), l = findById(state.liabilities, rest.slice(cut + 1));
    if (!l || !l.loan || what === 'rate') return;  // 利率在 change(離開欄位)才處理,見 applyLoanRate
    if (what === 'start'){ const d = isoDate(el.value, ''); if (d) l.loan.start = d; }
    else if (String(el.value).trim() === '') return;
    else if (what === 'years') l.loan.years = Math.min(50, Math.max(0, num(el.value)));
    else if (what === 'principal') l.loan.principal = Math.max(0, num(el.value));
    syncLoanLiabilities();
  }
  else if (kind === 'lr'){                        // 一般型房貸過去各段利率:lr-until|val-<負債 id>.<段 id>
    const cut = rest.indexOf('-'), what = rest.slice(0, cut), ids = rest.slice(cut + 1), dot = ids.indexOf('.');
    const l = findById(state.liabilities, ids.slice(0, dot)), e = l && l.loan && findById(l.loan.rateHistory, ids.slice(dot + 1));
    if (e){
      if (what === 'until'){ const d = isoDate(el.value, ''); if (d) e.until = d; l.loan.rateHistory.sort((a, b) => a.until < b.until ? -1 : 1); }
      else if (String(el.value).trim() !== '') e.rate = Math.max(0, num(el.value));
      syncLoanLiabilities();
    }
  }
  else if (kind === 'ih'){                        // 資產頁「每月紀錄」改過去月份的某一項:ih-<快照 id>.<細項 id>(id 裡不會有點)
    const dot = rest.indexOf('.');
    if (String(el.value).trim() === '') return;    // 清空準備打新數字的那一下不算,不然那個月的總數會先被算成少了這一項
    setPastItemAmount(rest.slice(0, dot), rest.slice(dot + 1), el.value);
  }
  else if (kind === 'nh'){
    const h = findById(state.netWorthHistory, rest);
    if (h){ h.v = num(el.value); h.auto = false; }   // 自己改過就不再被自動快照覆寫
  }
  else if (kind === 'lev' && rest === 'annualRate'){
    if (String(el.value).trim() === '') return;          // 清空準備打新數字的那一下不算
    setCurrentRate(state.leverage, Math.max(0, num(el.value)));
  }
  else if (kind === 'rate'){                       // 過去各段利率:rate-until-<id> / rate-val-<id>
    const cut = rest.indexOf('-'), what = rest.slice(0, cut), rid = rest.slice(cut + 1);
    const e = findById(state.leverage.rateHistory || [], rid);
    if (e){
      if (what === 'until'){ const d = isoDate(el.value, ''); if (d) e.until = d; state.leverage.rateHistory.sort((a, b) => a.until < b.until ? -1 : 1); }
      else if (String(el.value).trim() !== '') e.rate = Math.max(0, num(el.value));
    }
  }
  else if (kind === 'lev' && rest === 'payDay'){ /* 離開欄位才套用,見 change 的 applyPayDay */ }
  else if (kind === 'lev' && rest === 'repayPermille'){ state.leverage.repayPermille = Math.min(1000, Math.max(0, num(el.value))); }
  else if (kind === 'lev'){ state.leverage[rest] = Math.max(0, num(el.value)); }
  else if (kind === 'in'){                       // 標的清單,用內部 key 定位
    const cut = rest.indexOf('-');
    const what = rest.slice(0, cut), ikey = rest.slice(cut + 1);
    const it = findInstrumentByKey(ikey);
    if (it){
      if (what === 'id'){
        const next = el.value.trim();
        const taken = state.instruments.some(x => x.key !== it.key && x.id === next);
        if (next && next === it.id){
          // 代號其實沒變(多打一個空白又刪掉):什麼都不做。以前照樣清掉價格歷史跟「上次看過的狀態」
        }else if (next && !taken){
          const prev = it.id;
          state.trades.forEach(t => { if (t.symbol === prev) t.symbol = next; });
          if (tradeDraft.symbol === prev) tradeDraft.symbol = next;
          // 欄位是每打一個字就處理一次:改「00631L」刪掉 L 再打回去,中間的「00631」會把歷史清掉,
          // 最後代號沒變、歷史卻沒了(訊號跟曝險卡片變「歷史不夠」,提醒的基準也丟了)。第一次改之前先收起來,改回原代號就還回去
          if (!idEditStash.has(it.key)) idEditStash.set(it.key, JSON.parse(JSON.stringify({ id: prev, priceHistory: it.priceHistory,
            splits: it.splits, splitsAcked: it.splitsAcked, lastSeenStatus: it.trend.lastSeenStatus, lastSeenLayers: it.trend.lastSeenLayers, lastSeenDate: it.trend.lastSeenDate })));
          const back = idEditStash.get(it.key);
          it.id = next;
          if (back.id === next){
            it.priceHistory = back.priceHistory; it.splits = back.splits; it.splitsAcked = back.splitsAcked;
            Object.assign(it.trend, { lastSeenStatus: back.lastSeenStatus, lastSeenLayers: back.lastSeenLayers, lastSeenDate: back.lastSeenDate });
            idEditStash.delete(it.key);
          }else{
            it.priceHistory = [];   // 舊歷史是抓舊代號的,換代號後不再有效
            it.splits = [];
            // 「上次看過的狀態」也是舊代號的:留著的話,新代號的歷史補齊後會跳「狀態從(舊代號的)X 變成 Y」的提醒
            it.splitsAcked = [];
            it.trend.lastSeenStatus = '';
            it.trend.lastSeenLayers = -1;
            it.trend.lastSeenDate = '';
          }
          levMsg = '';
          structural = true;
        }else if (taken){
          levMsg = '代號「' + next + '」已經有了。';
        }
      }
      else if (what === 'name') it.name = el.value;
      else if (what === 'lev'){ const v = num(el.value); if (v > 0) it.leverage = v; }   // 空白/0 保留原值:清空的那一下正2 會變 0 倍,曝險卡片漏掉這檔
      else if (what === 'price') it.price = Math.max(0, num(el.value));
      else if (what === 'shares') it.shares = Math.max(0, num(el.value));
    }
  }
  else if (kind === 'sig'){                      // 趨勢訊號參數,用內部 key 定位
    const cut = rest.indexOf('-');
    const what = rest.slice(0, cut), ikey = rest.slice(cut + 1);
    const it = findInstrumentByKey(ikey);
    if (it && it.trend){
      const v = num(el.value);
      // 空白/0 保留原值(跟曝險目標設定一樣):欄位是每打一個字就存,想把 120 改成 100 先全選刪掉的那一下,
      // 以前會存成 1 日均線/1 層,這時候離開欄位或 app 被關掉,訊號就照 1 日均線算(壓測抓到)
      if (['maFast', 'maSlow', 'pyramidLevels'].includes(what) && !(v > 0)) return;
      if (what === 'maFast' || what === 'maSlow') it.trend[what] = Math.max(1, Math.round(v));
      else if (what === 'pyramidLevels') it.trend[what] = Math.min(MAX_PYRAMID_LEVELS, Math.max(1, Math.round(v)));
      else if (['exitBuffer','recoverSlopeThreshold','recoverStrongRebound','pyramidGap'].includes(what)) it.trend[what] = v > 0 ? v : it.trend[what];
    }
  }
  else if (kind === 'ownbase'){                  // 曝險卡的「接刀用的自有資金」:使用者自己改的,記在這一輪出場上
    if (String(el.value).trim() === '') return;
    const lev2 = state.instruments.filter(it => it.leverage === 2);
    state.leverage.ownBase = { exit: ownCycleExit(lev2.map(computeTrend)) || state.leverage.ownBase.exit, amount: Math.max(0, num(el.value)), auto: false };
  }
  else if (kind === 'expo'){                     // 正2 曝險目標設定
    // 0/空白保留原值:normalize() 會把 0 當「沒填」換回預設,這裡如果收 0,當下照 0 算、重新整理又變回 130%
    const raw = num(el.value);
    if (!(raw > 0)) return;
    const v = raw;
    if (rest === 'hold') state.leverage.exposureTargets.hold = v;
    else if (rest.indexOf('own-') === 0){        // 接刀只用自有資金:第 i 層累計用掉幾 %
      const i = Number(rest.slice(4));
      if (Number.isInteger(i) && i >= 0 && i < MAX_PYRAMID_LEVELS){
        const list = state.leverage.exposureTargets.ownByLayer;
        for (let k = list.length; k < i; k++) list[k] = ownLayerPct(state.leverage.exposureTargets, k + 1);
        list[i] = v;
      }
    }
    else if (rest.indexOf('layer-') === 0){
      const i = Number(rest.slice(6));
      if (Number.isInteger(i) && i >= 0 && i < MAX_PYRAMID_LEVELS){
        const list = state.leverage.exposureTargets.byLayer;
        // 前面還沒存過的層先補成畫面上顯示的值(沿用最後一層),不要留空洞
        for (let k = list.length; k < i; k++) list[k] = layerTarget(state.leverage.exposureTargets, k + 1);
        list[i] = v;
      }
    }
  }
  else if (kind === 'draw'){
    const p = rest.indexOf('-');
    const what = rest.slice(0, p), id = rest.slice(p + 1);
    const t = findById(state.leverage.draws, id);
    if (t){
      if (what === 'amt') t.amount = Math.max(0, num(el.value));
      else if (what === 'note') t.note = el.value;
      else if (what === 'label') t.label = el.value;
      else t.useDate = isoDate(el.value, '');
    }
  }
  else if (kind === 'rp'){                       // 還款紀錄 rp-<what>-<動用記錄id>-<還款id>
    const bits = rest.split('-');
    const what = bits[0], rid = bits[bits.length - 1], tid = bits.slice(1, -1).join('-');
    const target = findById(state.leverage.draws, tid);
    const rp = target && (target.repayments || []).find(x => x.id === rid);
    if (rp){
      if (what === 'date') rp.date = isoDate(el.value, '');
      else rp.amount = Math.max(0, num(el.value));
    }
  }
  else if (kind === 'd'){
    if (rest === 'cat' && el.value === '__new__'){   // 下拉選到「新增類別…」
      draft.cat = '';
      draft.newCat = true;
      renderAll();
      return;
    }
    draft[rest] = rest === 'date' ? isoDate(el.value, '') : el.value;
    return;                                          // 草稿不入庫
  }
  else if (kind === 'rd'){                                          // 還款草稿
    repayDraft[rest] = rest === 'date' ? isoDate(el.value, '') : el.value;
    if (rest === 'target') renderAll();
    return;
  }
  else if (kind === 'btw'){                                         // 回測「指定期間」:不是資料,不存檔
    const v = isoDate(el.value, '');
    if (v) setBtWindow(rest === 'from' ? v : btWindow.from, rest === 'to' ? v : btWindow.to);
    return;
  }
  else if (kind === 'pd'){                                          // 買賣草稿
    tradeDraft[rest] = rest === 'date' ? isoDate(el.value, '') : el.value;
    if (['shares', 'price', 'fee', 'loanAmt'].includes(rest)) refreshTradeDraft();  // 更新成交金額預估,不整頁重畫
    return;
  }
  else if (kind === 'pt'){                                          // 修改既有買賣紀錄
    const cut = rest.indexOf('-');
    const what = rest.slice(0, cut), tid = rest.slice(cut + 1);
    const t = findById(state.trades, tid);
    if (t){
      // 日期選擇器按「清除」會送空字串:保留原日期。以前換成今天,那筆的日期就回不去了
      if (what === 'date'){ const d = isoDate(el.value, ''); if (d) t.date = d; }
      else if (what === 'note') t.note = el.value;
      else t[what] = Math.max(0, num(el.value));   // 股數、價格、費用都不會是負的
    }
    structural = true;
  }
  else if (kind === 'tpl'){                                         // 修改固定收支範本:tpl-amt|cat|desc-<範本 id>
    const cut = rest.indexOf('-'), what = rest.slice(0, cut), t = findById(state.templates || [], rest.slice(cut + 1));
    if (t){
      if (what === 'amt'){ const v = Math.abs(num(el.value)); if (v) t.amount = t.amount < 0 ? -v : v; }   // 清空準備重打的那一下不算;收入/支出不變
      else if (what === 'cat') t.cat = el.value || '其他';
      else if (what === 'desc') t.desc = el.value;
    }
    structural = true;
  }
  else if (kind === 'tdate' || kind === 'tamt' || kind === 'tcat' || kind === 'tdesc'){
    const t = findById(state.transactions, rest);
    if (t){
      if (kind === 'tdate'){ const d = isoDate(el.value, ''); if (d) t.date = d; }   // 清除日期:保留原日期(同買賣紀錄)
      else if (kind === 'tamt') t.amount = num(el.value);
      else if (kind === 'tcat') t.cat = el.value || '其他';   // 跟 normalize() 一致,空的類別就是「其他」
      else t.desc = el.value;
    }
    structural = true;
  }

  // 資產/負債細項一改就更新本月快照——不然月底最後一天改的數字,要等下個月打開才會存,那時已經算到下個月了
  if (['an', 'aa', 'ln', 'la', 'lo', 'lr'].includes(kind)) maybeSnapshot();
  scheduleSave();
  if (kind === 'draw' && rest.startsWith('date-')){   // 以前欄位叫 tr-,改名成 draw- 時這裡沒跟著改,一直沒執行到
    maybePostInterest();
    renderAll();                                // 動用日期會長出/收起動用紀錄欄位
    return;
  }
  if (structural) return;                       // 交易編輯:離開欄位時才重畫
  if (currentTab === 'assets') refreshAssets();
  else if (currentTab === 'leverage') refreshLeverage();
}

/* 範例資料用:生出一段看起來合理的歷史收盤價(緩緩上漲、帶一點波動),
   讓「趨勢」分頁載入範例資料後就有均線可以算,不用真的連線抓報價。
   最後一筆固定等於 endPrice,跟畫面上「股價」欄位顯示的數字對得上。 */
function genSamplePriceHistory(endPrice, tradingDays){
  const dates = [];
  const d = new Date();
  while (dates.length < tradingDays - 1){
    d.setDate(d.getDate() - 1);
    const dow = d.getDay();
    if (dow !== 0 && dow !== 6) dates.push(d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()));   // 本地日期,不用 toISOString(UTC,台灣早上 8 點前會差一天)
  }
  dates.reverse();
  dates.push(todayISO());
  const n = dates.length;
  return dates.map((iso, i) => {
    const t = i / (n - 1);
    const drift = 0.72 + 0.28 * t;                 // 一路緩漲到今天
    const wiggle = i === n - 1 ? 1 : 1 + 0.03 * Math.sin(i / 4.5);
    return { d: iso, c: Math.round(endPrice * drift * wiggle * 100) / 100 };
  });
}

/* 列表上的 ✕ 刪除鈕:第一次按變成紅色「確定刪除」+「取消」,再按一次才刪(needsConfirm 的 token = act:id)。
   以前只有「確定刪除」,反悔只能去按別的按鈕,使用者看不出怎麼取消;現在點空白處也會取消。 */
const xDel = (act, id) => { const armed = pendingConfirm === act + ':' + id;
  return `<button class="xbtn${armed ? ' armed' : ''}" data-act="${act}" data-id="${id}" aria-label="${armed ? '再按一次確定刪除' : '刪除'}">${armed ? '確定刪除' : '✕'}</button>`
    + (armed ? `<button class="xbtn armed cancel" data-act="cancel-confirm">取消</button>` : ''); };
function needsConfirm(token){
  if (pendingConfirm === token){ pendingConfirm = null; return false; }
  pendingConfirm = token;
  renderAll();
  return true;
}

/* 匯出成 CSV 給 Excel。多張表放同一個檔,以空行和標題分隔。
   開頭加 BOM,Excel 開繁中才不會變亂碼。 */
function csvCell(v){
  let t = String(v === null || v === undefined ? '' : v);
  // 文字欄位以 = + - @ 開頭,Excel 會當成公式執行(CSV 公式注入);前面加 ' 讓它當純文字。數字(負數金額)不動。
  if (typeof v === 'string' && /^[=+\-@\t\r]/.test(t)) t = "'" + t;
  return /[",\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
}
function csvTable(title, headers, rows){
  if (!rows.length) return '';
  return title + '\n' + headers.join(',') + '\n'
    + rows.map(r => r.map(csvCell).join(',')).join('\n') + '\n\n';
}

      .map(t => [t.date, t.cat, t.desc, t.amount]));

  out += csvTable('# 買賣紀錄',
    ['日期', '標的', '動作', '股數', '成交價', '手續費', '配息金額', '資金來源', '備註'],
    state.trades.slice().sort((a, b) => a.date < b.date ? 1 : -1)
      .map(t => [t.date, t.symbol,
                 t.action === 'sell' ? '賣出' : t.action === 'dividend' ? '配息' : '買進',
                 t.shares, t.price, t.fee, t.amount,
                 t.action === 'buy' ? (t.source === 'loan' ? '房貸借款' : '自有資金') : '',
                 t.note]));

  const r = computeLeverage();
  // 用 holdings:代號重複的那列算 0 股,跟畫面上的市值一致,不會同一批持股列兩次
  out += csvTable('# 持股', ['代號', '名稱', '槓桿倍數', '股數', '股價', '市值'],
    r.holdings.map(h => [h.id, h.name, h.leverage, h.shares, h.price, Math.round(h.value)]));

  out += csvTable('# 房貸動用',
    ['項目', '動用日期', '動用金額', '已還', '餘額', '備註'],
    r.draws.filter(t => t.useDate)
      .map(t => [t.label, t.useDate, t.amount, t.repaid, t.balance, t.note]));

  const repays = [];
  L.draws.forEach(t => {
    (t.repayments || []).forEach(rp => { if (rp.date) repays.push([t.label, rp.date, rp.amount]); });
  });
  out += csvTable('# 還款紀錄', ['項目', '日期', '金額'],
    repays.sort((a, b) => a[1] < b[1] ? 1 : -1));

  out += csvTable('# 資產', ['名稱', '金額'], state.assets.map(a => [a.name, a.amount]));
  out += csvTable('# 負債', ['名稱', '金額'], state.liabilities.map(l => [l.name, l.amount]));

  out += csvTable('# 每月快照', ['月份', '淨資產', '部位市值', '借款餘額', '整體損益'],
    state.netWorthHistory.slice().sort((a, b) => a.m < b.m ? 1 : -1)
      .map(h => [h.m, h.v, h.pv === null ? '' : h.pv, h.loan === null ? '' : h.loan, h.pnl === null ? '' : h.pnl]));

  // 每月資產/負債細項(2026-09 起才有):一列一項,用 Excel 樞紐分析就看得到每一項每個月怎麼變
  const itemRows = [];
  state.netWorthHistory.slice().sort((a, b) => a.m < b.m ? 1 : -1).forEach(h => {
    (h.items || []).forEach(it => itemRows.push([h.m, it.t === 'l' ? '負債' : '資產', it.name, it.amount]));
  });
  out += csvTable('# 每月資產負債細項', ['月份', '類型', '項目', '金額'], itemRows);

  const p = computePosition();
  out += csvTable('# 目前損益', ['項目', '金額'], [
    ['目前市值', Math.round(p.marketValue)],
    ['持股成本', Math.round(p.remainCost)],
    ['未實現損益', Math.round(p.unrealized)],
    ['已實現損益(含配息)', Math.round(p.realized)],
    ['其中配息', Math.round(p.dividends)],
    ['累積借款利息', Math.round(p.interest)],
    ['整體損益', Math.round(p.total)],
    ['自有資金投入', Math.round(p.buyCash)],
    ['已還房貸本金', Math.round(p.repaid)],
    ['房貸投入', Math.round(p.buyLoan)]
  ]);

  return '\ufeff' + out;
}

async function saveFile(filename, text, mime){
  if (downloadsNs){
    try{
      const res = await downloadsNs.save({ filename, data: text });
      dataMsg = res && res.status === 'delivered' ? '已送出 ' + filename : '已匯出 ' + filename;
      renderAll();
      return;
    }catch(e){
      if (e && e.code === 'cancelled') return;
    }
  }
  try{
    const url = URL.createObjectURL(new Blob([text], { type: mime }));
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    dataMsg = '已匯出 ' + filename;
  }catch(e){
    dataMsg = '這個瀏覽器擋下了下載,請改用「複製成文字」';
  }
  renderAll();
}

async function exportJSON(){
  await saveFile('finance-' + todayISO() + '.json', stateJSON(), 'application/json');
}
async function exportCSV(){
  await saveFile('finance-' + todayISO() + '.csv', stateCSV(), 'text/csv;charset=utf-8');
}

/* 匯入前先確認這真的是本 app 的檔案 —— 不然一個不相干的 JSON
   就會把資料清光,而且還會同步上雲端把雲端那份也蓋掉 */
function looksLikeState(raw){
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return false;
  const lists = ['assets', 'liabilities', 'trades', 'transactions', 'netWorthHistory', 'instruments', 'budgets'];
  if (lists.some(k => Array.isArray(raw[k]))) return true;
  return !!(raw.leverage && typeof raw.leverage === 'object' && !Array.isArray(raw.leverage));
}

function importJSON(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const raw = JSON.parse(String(reader.result));
      if (!looksLikeState(raw)){
        dataMsg = '這個檔案不是本 app 匯出的資料,沒有匯入任何東西。';
        renderAll();
        return;
      }
      state = normalize(raw);
      viewMonth = thisMonth();
      dataMsg = '已匯入 ' + file.name + ':交易 ' + state.transactions.length
              + ' 筆、買賣 ' + state.trades.length + ' 筆、資產 ' + state.assets.length + ' 項';
      save();
      renderAll();
    }catch(e){
      dataMsg = '這個檔案讀不出來,請確認是本 app 匯出的 JSON';
      renderAll();
    }
  };
  reader.onerror = () => { dataMsg = '讀取檔案失敗'; renderAll(); };
  reader.readAsText(file);
}

const CONFIRM_ACTS = ['diag-clear', 'del-tpl', 'load-sample', 'clear-all', 'del-tx', 'del-trade', 'restore', 'del-draw', 'del-asset', 'del-liab', 'del-hist', 'del-instrument', 'del-rate', 'loan-off', 'del-loan-rate', 'del-repay'];
function onClick(el){
  diagLastAct = 'click ' + (el && el.dataset && el.dataset.act || '?');
  const act = el.dataset.act;
  const id = el.dataset.id;
  let rerender = true;
  // 要按兩次確認的動作不能在這裡清掉「待確認」,不然第二次按又從頭開始、永遠刪不掉
  // (以前 del-draw 不在名單裡:有還款紀錄的動用紀錄怎麼按都刪不掉,壓測抓到)
  if (!CONFIRM_ACTS.includes(act)) pendingConfirm = null;
  if (!['export', 'export-csv', 'import', 'copy-json', 'diag-copy'].includes(act)) dataMsg = '';
  if (act !== 'diag-copy' && act !== 'fold') diagText = '';

  switch (act){
    case 'cancel-confirm': break;   // 上面已經清掉 pendingConfirm,重畫就恢復成 ✕
    case 'month': viewMonth = shiftMonth(viewMonth, Number(el.dataset.v)); break;
    case 'go': switchTab(el.dataset.v); return;
    case 'add-asset': state.assets.push({ id:uid(), name:'', amount:0 }); break;
    // 刪資產/負債/每月紀錄/標的要再按一次確認(以前按一下 ✕ 就刪,手機捲動時很容易誤觸);剛新增還沒填的空白列直接刪
    case 'del-asset': { const a = findById(state.assets, id); if (a && (a.name || a.amount) && needsConfirm('del-asset:' + id)) return;
      state.assets = state.assets.filter(a => a.id !== id); break; }
    case 'add-liab': state.liabilities.push({ id:uid(), name:'', amount:0, loan:null }); break;
    case 'del-liab': { const l = findById(state.liabilities, id); if (l && (l.name || l.amount) && needsConfirm('del-liab:' + id)) return;
      state.liabilities = state.liabilities.filter(l => l.id !== id); break; }
    case 'item-hist': itemHistOpen = itemHistOpen === id ? '' : id; break;
    case 'draw-round': { const v = Number(el.dataset.v); state.leverage.drawRound = [1000, 10000].includes(v) ? v : 0; scheduleSave(); break; }
    case 'fold': { const k = el.dataset.v; if (openFolds.has(k)) openFolds.delete(k); else openFolds.add(k); break; }
    case 'del-rate':   // 刪掉一段過去的利率:那段期間改照下一段(或目前)的利率算
      if (needsConfirm('del-rate:' + id)) return;
      state.leverage.rateHistory = (state.leverage.rateHistory || []).filter(e => e.id !== id);
      break;
    case 'del-hist': if (needsConfirm('del-hist:' + id)) return; state.netWorthHistory = state.netWorthHistory.filter(h => h.id !== id); break;
    case 'hist-auto': {                  // 本月那筆手動改過(auto:false)之後,改回跟著目前數字自動更新
      const found = findById(state.netWorthHistory, id);
      if (found && found.m === thisMonth()){ found.auto = true; maybeSnapshot(); }
      break;
    }
    case 'export': exportJSON(); return;
    case 'import': {
      const f = document.getElementById('importFile');
      if (f) f.click();
      return;
    }
    case 'copy-json': copyJSON(); return;
    case 'copy-backtest': copyBacktestReport(); return;
    case 'export-csv': exportCSV(); return;
    case 'add-repay': {
      const target = findById(state.leverage.draws, id);
      if (target){
        if (!Array.isArray(target.repayments)) target.repayments = [];
        target.repayments.push({ id: uid(), date: todayISO(), amount: 0 });
      }
      break;
    }
    case 'del-repay': {
      // 跟其他 ✕ 一樣要再按一次:誤刪會讓借款餘額、利息跟著變,刪掉自動還本那個月也不會再補記;剛新增還沒填的空白列直接刪
      const [tid, rid] = String(id).split(':');
      const r0 = (findById(state.leverage.draws, tid) || { repayments: [] }).repayments.find(x => x.id === rid);
      if (r0 && r0.amount && needsConfirm('del-repay:' + id)) return;
      const target = findById(state.leverage.draws, tid);
      if (target) target.repayments = (target.repayments || []).filter(x => x.id !== rid);
      break;
    }
    case 'add-draw':
      state.leverage.draws.push({ id: uid(), label: '動用記錄', amount: 0, useDate: '', note: '', repayments: [] });
      break;
    case 'del-draw': {
      const d = findById(state.leverage.draws, id);
      if (!d) break;
      // 填了金額或日期就要再按一次確認(以前只看有沒有還款,一筆 100 萬、還沒還過的動用按一下就沒了,借款餘額跟利息跟著消失);
      // 剛新增還沒填的空白列直接刪
      if ((d.amount || d.useDate || (d.repayments || []).length) && needsConfirm('del-draw:' + id)) return;
      state.leverage.draws = state.leverage.draws.filter(x => x.id !== id);
      break;
    }
    case 'add-instrument':
      state.instruments.push({ key: uid(), id:'', name:'', leverage:1, price:0, shares:0, auto:true,
        trend: defaultTrendParams(1), priceHistory:[], splits:[], splitsAcked:[] });
      levMsg = '新的一列請填股票代號,填了才抓得到報價。';
      break;
    case 'del-instrument': {
      const it = findInstrumentByKey(id);
      if (!it) break;
      // 還有另一列同代號(重複列)的話,刪掉這列紀錄還是有地方算,不用擋——不然畫面叫你處理重複列,卻刪不掉
      const twin = state.instruments.some(x => x.key !== it.key && x.id === it.id);
      const used = twin ? 0 : state.trades.filter(t => t.symbol === it.id).length;
      if (used){
        levMsg = '「' + (it.id || '未命名') + '」還有 ' + used + ' 筆買賣紀錄,先把那些紀錄刪掉或改成別的代號。';
        break;
      }
      if ((it.id || (it.priceHistory || []).length) && needsConfirm('del-instrument:' + id)) return;
      state.instruments = state.instruments.filter(x => x.key !== id);
      break;
    }
    case 'draft-action': tradeDraft.action = el.dataset.v; break;
    case 'cat-pick': draft.newCat = false; draft.cat = knownCats()[0] || ''; break;
    case 'cat-up': case 'cat-down': {
      const cats = knownCats();
      const i = cats.indexOf(id);
      const j = act === 'cat-up' ? i - 1 : i + 1;
      if (i < 0 || j < 0 || j >= cats.length) break;
      [cats[i], cats[j]] = [cats[j], cats[i]];
      // 移過的類別如果只存在於交易紀錄裡(還沒真的進 budgets),這裡順便把它補成正式的一筆
      state.budgets = cats.map(name => state.budgets.find(b => b.name === name) || { id: uid(), name, budget: 0 });
      break;
    }
    case 'draft-source': tradeDraft.source = el.dataset.v; break;
    case 'draft-autodraw': tradeDraft.autoDraw = tradeDraft.autoDraw === false; break;
    case 'add-trade': {
      const d0 = tradeDraft;
      // 沒有對應標的(標的全刪光、選單是空的)時不能記:空的代號重新整理後會被補成 00631L,等於默默算到別檔頭上
      if (!d0.symbol || !findInstrument(d0.symbol)){ tradeError = '請先選標的(「設定」分頁可以新增)'; renderAll(); return; }
      const base = {
        id: uid(),
        date: d0.date || todayISO(),
        symbol: d0.symbol,
        action: d0.action,
        note: d0.note.trim(),
        source: d0.action === 'buy' && d0.source === 'loan' ? 'loan' : 'cash'
      };
      let mixNote = '';
      if (d0.action === 'dividend'){
        const amount = Math.abs(num(d0.amount));
        if (!amount){ tradeError = '請填領到的金額'; renderAll(); return; }
        state.trades.push(Object.assign(base, { shares:0, price:0, amount, fee: Math.abs(num(d0.fee)) }));
      }else{
        const shares = Math.abs(num(d0.shares));
        const price = draftPrice(d0);
        if (!shares || !price){ tradeError = '請填股數與成交價'; renderAll(); return; }
        const gross = shares * price;
        const fee = d0.fee === '' ? num(defaultFee(d0.action, gross)) : Math.abs(num(d0.fee));   // 估出來的也要過 num():金額極大時會超過 1 兆,存檔再讀回來不一樣(fuzz 抓到)
        if (d0.action === 'buy' && d0.source === 'mix'){
          const loanAmt = Math.abs(num(d0.loanAmt));
          if (!loanAmt){ tradeError = '請填其中房貸出的金額(全部自有資金就選「自有資金」)'; renderAll(); return; }
          const sp = splitMixedBuy(shares, price, fee, loanAmt);
          if (sp){
            // 自有那筆先記、房貸那筆最後記:下面的提醒跟 tradeNote 都看最後一筆
            state.trades.push(Object.assign({}, base, { shares: sp.cashShares, price, amount: 0, fee: sp.cashFee }));
            Object.assign(base, { id: uid(), source: 'loan', shares: sp.loanShares, price, amount: 0, fee: sp.loanFee });
            mixNote = `拆成兩筆:自有 ${fmt(sp.cashShares)} 股、房貸 ${fmt(sp.loanShares)} 股。`;
          }else if (loanAmt >= gross + fee){
            Object.assign(base, { source: 'loan', shares, price, amount: 0, fee });
          }else{
            Object.assign(base, { shares, price, amount: 0, fee });
            mixNote = `房貸金額不到一股,整筆記成自有資金。`;
          }
          state.trades.push(base);
        }else{
          state.trades.push(Object.assign(base, { shares, price, amount: 0, fee }));
        }
      }
      tradeError = '';
      // 借款餘額、利息、曝險比例都靠「紀錄」分頁的動用紀錄;忘了記的話曝險比例被低估,曝險卡片會叫你再多借多買
      const last = state.trades[state.trades.length - 1];
      const loanAmt = Math.round(last.shares * last.price + last.fee);
      if (last.source === 'loan' && d0.autoDraw !== false){
        // 房貸買進順便記動用,不用兩邊各打一次(以前只提醒,忘了記就是「兩邊對不起來」)。動用日預設交割日(T+2),
        // 動用日到之前不算借款、不算利息;銀行實際撥款日不一樣的話到「紀錄」分頁改。之前借了沒用完的先扣掉
        const useDate = settleDate(last.date), unused = unusedLoanCash(last.id), short = loanAmt - unused;
        // num():夾在 ±1 兆,跟存檔再讀回來一樣(股數 × 價格可以大到超過上限,fuzz 抓到 52 兆存檔後變 1 兆)
        const unit = state.leverage.drawRound, need = num(unit && short > 0 ? Math.ceil(short / unit) * unit : short);
        if (need > 0){
          diag('自動記帳', `房貸買進 ${last.symbol} ${$n(loanAmt)},自動新增動用 ${$n(need)}(動用日 ${useDate}${unused ? `,先用掉之前沒用完的 ${$n(unused)}` : ''})`);
          state.leverage.draws.push({ id: uid(), label: last.symbol + ' 買進', amount: need, useDate,
            note: `${last.symbol} ${fmtRaw(last.shares)} 股 @ ${last.price}(${last.date} 成交,自動新增${unused ? `;先用掉之前沒用完的 ${fmtRaw(unused)}` : ''})`, repayments: [] });
          tradeNote = mixNote + (unused
            ? `買進 NT$ ${fmt(loanAmt)} 先用掉之前借了沒用完的 NT$ ${fmt(unused)},另外新增一筆房貸動用 NT$ ${fmt(need)}`
            : `已同時新增一筆房貸動用 NT$ ${fmt(need)}`) + (need > short ? `(湊整到${unit === 10000 ? '萬' : '千'}元,多的 NT$ ${fmt(need - short)} 下次房貸買進先扣)` : '')
            + `,動用日 ${useDate}(交割日);金額或日期不對到「紀錄」分頁的房貸動用記錄改。`;
        }else{
          tradeNote = mixNote + `買進 NT$ ${fmt(loanAmt)} 用之前借了沒用完的房貸就夠(還剩 NT$ ${fmt(unused - loanAmt)}),不用新增動用。`;
        }
      }else{
        tradeNote = mixNote + (last.source === 'loan' ? `用房貸買的,記得到「紀錄」分頁新增一筆房貸動用(約 NT$ ${fmt(loanAmt)}),借款餘額跟曝險比例才會算對。` : '');
      }
      tradeDraft = { date: d0.date, symbol: d0.symbol, action: d0.action, source: d0.source,
                     shares:'', price:'', amount:'', fee:'', note:'', loanAmt:'', autoDraw: d0.autoDraw };
      break;
    }
    case 'edit-trade': editingTrade = id; break;
    case 'trade-source': {                 // 修改既有買進的資金來源(標錯的話以前只能刪掉重記)
      const t = findById(state.trades, id);
      if (t && t.action === 'buy') t.source = el.dataset.v === 'loan' ? 'loan' : 'cash';
      break;
    }
    case 'close-trade': editingTrade = null; break;
    case 'del-trade':
      if (needsConfirm('del-trade:' + id)) return;
      state.trades = state.trades.filter(t => t.id !== id);
      editingTrade = null;
      break;
    case 'chart': pickChartPoint(el.dataset.key, Number(el.dataset.i)); return;
    case 'range': chartRange = Number(el.dataset.v); break;
    case 'lev-tab':
      levTab = el.dataset.v;
      document.getElementById('content').scrollTop = 0;
      break;
    case 'add-repay2': {
      const L2 = state.leverage;
      const tid = repayDraft.target || (L2.draws.find(t => t.useDate) || {}).id || '';
      const target = findById(L2.draws, tid);
      const amt = Math.abs(num(repayDraft.amount));
      if (!target || !target.useDate){ repayError = '請先選一筆動用中的記錄'; renderAll(); return; }
      if (!amt){ repayError = '請填還款金額'; renderAll(); return; }
      const rdate = repayDraft.date || todayISO();
      // 早於動用日的還款會被 effectiveRepayments() 整筆忽略、超過尚欠的部分也會被默默吃掉——
      // 使用者看不出來打錯了,所以在這裡直接擋下並說明
      if (rdate < target.useDate){ repayError = `還款日期不能早於這筆的動用日期(${target.useDate})`; renderAll(); return; }
      const owe = balanceAt(target, rdate);
      if (amt > owe + 0.5){ repayError = `還款金額超過 ${rdate} 當時尚欠的 NT$ ${fmt(owe)},請確認金額`; renderAll(); return; }
      if (!Array.isArray(target.repayments)) target.repayments = [];
      target.repayments.push({ id: uid(), date: rdate, amount: amt });
      repayError = '';
      repayDraft = { target: tid, date: repayDraft.date, amount:'' };
      break;
    }
    case 'split-convert': case 'split-keep': {
      const [key, d] = String(id).split('|');
      const it = findInstrumentByKey(key);
      const sp = it && (it.splits || []).find(x => x.d === d);
      if (!sp) break;
      if (act === 'split-convert'){
        const { mult } = splitMultiple(sp.ratio);
        state.trades.forEach(t => {
          if (!splitPending(t, it, d)) return;
          t.shares = num(Math.round(t.shares * mult));   // num():夾在 ±1 兆,跟存檔再讀回來一樣(跟其他自動改的數字同一條規矩)
          t.price = Math.round(t.price / mult * 10000) / 10000;   // 成本(股數 × 價格)不變
          t.note = (t.note ? t.note + ' ' : '') + splitTag(d);
        });
      }
      if (!Array.isArray(it.splitsAcked)) it.splitsAcked = [];
      if (!it.splitsAcked.includes(d)) it.splitsAcked.push(d);
      break;
    }
    case 'fetch-quotes': fetchQuotes(true); return;
    case 'backfill-history': backfillHistory(); return;
    case 'backfill-backtest-history': backfillFullHistory(); return;
    case 'run-backtest': runAllBacktests(); btCopyMsg = ''; btCopyText = ''; break;
    case 'sim-fetch': fetchIndexSim(); return;   // 加權指數模擬(可拆)
    case 'btw-preset': { const [f, t] = String(el.dataset.v).split('|'); btWindow = { from: f, to: t }; setBtWindow(f, t); break; }
    case 'reset-trend-params': {
      const it = findInstrumentByKey(id);
      if (it) it.trend = Object.assign(defaultTrendParams(it.leverage), { lastSeenStatus: it.trend.lastSeenStatus, lastSeenLayers: it.trend.lastSeenLayers, lastSeenDate: it.trend.lastSeenDate });
      break;
    }
    case 'expo-mode':  // 接刀各層:曝險比例 / 只用自有資金
      state.leverage.exposureTargets.mode = el.dataset.v === 'own' ? 'own' : 'exposure';
      break;
    case 'ack-hold':   // 曝險卡片的「已調整完成」:兩檔正2 一起確認,跟按提醒的「知道了」效果一樣
      state.instruments.filter(it => it.leverage === 2).forEach(ackTrend);
      break;
    case 'ack-trend': {
      const it = findInstrumentByKey(id);
      if (it) ackTrend(it);
      break;
    }
    case 'show-backups':
      if (backupOpen){ backupOpen = false; break; }
      loadBackups();
      return;
    case 'restore':
      if (needsConfirm('restore:' + id)) return;
      restoreBackup(id);
      return;
    case 'loan-on': {
      const l = findById(state.liabilities, id);
      if (l && !l.loan){ l.loan = normalizeLoan({ principal: l.amount, years: 20 }); loanOpen = id; }
      break;
    }
    case 'loan-open': loanOpen = loanOpen === id ? '' : id; break;
    case 'loan-off': {
      const l = findById(state.liabilities, id);
      if (!l || !l.loan) break;
      if (needsConfirm('loan-off:' + id)) return;
      l.loan = null;                                     // 金額留在最後算出來的剩餘本金,之後自己填
      loanOpen = '';
      break;
    }
    case 'del-loan-rate': {
      if (needsConfirm('del-loan-rate:' + id)) return;
      const [lid, rid] = String(id).split('.');
      const l = findById(state.liabilities, lid);
      if (l && l.loan){ l.loan.rateHistory = l.loan.rateHistory.filter(e => e.id !== rid); syncLoanLiabilities(); }
      break;
    }
    case 'toggle-loan-interest': {
      const l = findById(state.liabilities, id);
      if (!l || !l.loan) break;
      const lo = l.loan;
      lo.autoInterest = !lo.autoInterest;
      if (lo.autoInterest){
        // 同理財型:關掉那段期間不補記
        const cur = thisMonth(), last = lo.interestPosted.length ? lo.interestPosted.slice().sort()[lo.interestPosted.length - 1] : '';
        for (let m = last ? shiftMonth(last, 1) : cur, guard = 0; m < cur && guard < 240; m = shiftMonth(m, 1), guard++){
          if (!lo.interestPosted.includes(m)) lo.interestPosted.push(m);
        }
        maybePostInterest();
      }
      break;
    }
    case 'toggle-autorepay':
      state.leverage.autoRepay = !state.leverage.autoRepay;
      if (state.leverage.autoRepay){
        // 關掉期間是使用者自己決定不自動記的(可能自己記了),重新打開時那段標成已處理,不補記
        const L = state.leverage, cur = thisMonth();
        const last = L.repayPosted.length ? L.repayPosted.slice().sort()[L.repayPosted.length - 1] : '';
        for (let m = last ? shiftMonth(last, 1) : cur, guard = 0; m < cur && guard < 240; m = shiftMonth(m, 1), guard++){
          if (!L.repayPosted.includes(m)) L.repayPosted.push(m);
        }
        maybePostInterest();
      }
      break;
    case 'toggle-autointerest':
      state.leverage.autoInterest = !state.leverage.autoInterest;
      if (state.leverage.autoInterest){
        // 關掉的那段期間是使用者自己決定不自動記的,重新打開時標成已處理,不要補記(會跟手動記的重複)
        const L = state.leverage, cur = thisMonth();
        const last = L.interestPosted.length ? L.interestPosted.slice().sort()[L.interestPosted.length - 1] : '';
        for (let m = last ? shiftMonth(last, 1) : cur, guard = 0; m < cur && guard < 240; m = shiftMonth(m, 1), guard++){
          if (!L.interestPosted.includes(m)) L.interestPosted.push(m);
        }
        maybePostInterest();
      }
      break;
    case 'sign-in': signInCloud(); return;
    case 'sign-out': signOutCloud(); return;
    case 'draft-type': draft.type = el.dataset.v; break;
    case 'save-tpl': {                      // 把「新增一筆」填的內容存成固定收支範本
      const amt = Math.abs(num(draft.amount));
      if (!amt){ draftError = '先填金額,才能存成固定收支'; renderAll(); return; }
      const cat = (draft.newCat ? (draft.cat || '').trim() : draft.cat) || knownCats()[0] || '其他';
      const t = { id: uid(), cat, desc: draft.desc.trim(), amount: draft.type === 'income' ? amt : -amt };
      if ((state.templates || []).some(x => x.cat === t.cat && x.desc === t.desc && x.amount === t.amount)){ draftError = '已經有一樣的固定收支了'; renderAll(); return; }
      draftError = '';
      state.templates.push(t);
      break;
    }
    case 'use-tpl': {                       // 用範本記一筆到正在看的月份,一個月一次
      const t = findById(state.templates || [], id);
      if (!t) break;
      const m = viewMonth, txid = tplTxId(t, m);
      if (state.transactions.some(x => x.id === txid)) break;
      state.transactions.push({ id: txid, date: m === thisMonth() ? todayISO() : m + '-01', cat: t.cat, desc: t.desc, amount: t.amount });
      break;
    }
    case 'sum-year': summaryYear += Number(el.dataset.v) || 0; break;
    case 'edit-tpl': editingTpl = editingTpl === id ? null : id; break;
    case 'close-tpl': editingTpl = null; break;
    case 'del-tpl':
      if (needsConfirm('del-tpl:' + id)) return;
      state.templates = (state.templates || []).filter(t => t.id !== id);
      editingTpl = null;
      break;
    case 'add-tx': {
      const amt = Math.abs(num(draft.amount));
      if (!amt){ draftError = '請先填金額'; renderAll(); return; }
      draftError = '';
      state.transactions.push({
        id:uid(),
        date: draft.date || todayISO(),
        cat: (draft.cat || '').trim() || knownCats()[0] || (draft.type === 'income' ? '收入' : '其他'),
        desc: draft.desc.trim(),
        amount: draft.type === 'income' ? amt : -amt
      });
      viewMonth = (draft.date || todayISO()).slice(0,7);
      draft = { date: draft.date || todayISO(), type: draft.type, cat: draft.cat, desc:'', amount:'', newCat:false };
      break;
    }
    case 'edit-tx': editingTx = id; break;
    case 'close-tx': editingTx = null; break;
    case 'del-tx':
      if (needsConfirm('del-tx:' + id)) return;
      state.transactions = state.transactions.filter(t => t.id !== id);
      editingTx = null;
      break;
    case 'load-sample':
      if (needsConfirm('load-sample')) return;
      state = sampleData();
      viewMonth = thisMonth();
      maybeSnapshot();          // 範例裡本月那筆快照是寫死的數字,載入後跟實際算出來的對齊(不然走勢圖最後一點跟上面的總數不一樣)
      maybeDailySnapshot();
      break;
    case 'diag-copy': copyDiag(); return;
    case 'diag-clear':
      if (needsConfirm('diag-clear')) return;
      diagClear();
      break;
    case 'clear-all':
      if (needsConfirm('clear-all')) return;
      state = emptyState();
      viewMonth = thisMonth();
      break;
    default: rerender = false;
  }
  if (!['month', 'sum-year', 'edit-tpl', 'close-tpl', 'edit-tx', 'close-tx', 'edit-trade', 'close-trade', 'run-backtest', 'item-hist'].includes(act)) scheduleSave();
  if (rerender) renderAll();
}

/* ===================== 啟動 ===================== */
/* 手機的 PWA 切到背景不會被關掉,隔天切回來是同一個頁面繼續跑,init() 裡「每次打開」該做的事都不會再做:
   不抓新收盤價(🔔 還是前一天的訊號;「收盤價停在…」不知道休市日時要 4 天後才跳)、不記當月利息跟快照、
   標題日期跟記帳/買賣的預設日期停在前一天(沒注意就把今天的交易記成昨天)。回到前景時補做。 */
let foregroundDay = todayISO();
function applyPrivacy(){
  if (document.body && document.body.classList) document.body.classList.toggle('privacy', privacy);
  const eye = document.getElementById('privacyBtn');
  if (eye){
    if (eye.classList) eye.classList.toggle('on', privacy);
    if (eye.setAttribute) eye.setAttribute('aria-label', privacy ? '顯示金額' : '隱藏金額');
    eye.title = privacy ? '顯示金額' : '隱藏金額';
  }
}
function togglePrivacy(){
  privacy = !privacy;
  try{ localStorage.setItem('financePrivacy', privacy ? '1' : '0'); }catch(e){}   // 每台裝置各自記,不同步
  applyPrivacy();
  renderAll();
}
function showTodayDate(){
  const d = new Date();
  // 分頁列旁邊只放短日期,免得窄螢幕擠不下
  const el = document.getElementById('todayDate');
  if (el) el.textContent = (d.getMonth()+1) + '/' + d.getDate();
}
function onForeground(fromTimer = false){
  const today = todayISO();
  if (today !== foregroundDay){
    const prev = foregroundDay;
    foregroundDay = today;
    showTodayDate();
    // 使用者自己改過的日期(補記前幾天的)不動,只換掉還停在「那天的今天」的預設值
    if (draft.date === prev) draft.date = today;
    if (tradeDraft.date === prev) tradeDraft.date = today;
    if (repayDraft.date === prev) repayDraft.date = today;   // 還款草稿也一樣(漏掉的話隔天記的還款日期是昨天)
    if (viewMonth === prev.slice(0, 7)) viewMonth = thisMonth();
    maybePostInterest();
    maybeSnapshot();
    maybeDailySnapshot();
    if (!(document.activeElement && document.activeElement.tagName === 'INPUT')) renderAll();
  }
  // 計時器(桌機分頁一直開在前景)只在收盤後抓一次,不要整天每小時問證交所
  maybeAutoQuote(fromTimer);
}

function init(){
  showTodayDate();
  // 沒接住的錯誤記進診斷紀錄,附上最後一個操作跟分頁(手機上出錯以前只會看到畫面不動)
  if (typeof window.addEventListener === 'function'){
    window.addEventListener('error', e => diag('錯誤', `${e && e.message || e}${e && e.lineno ? ` @${e.lineno}:${e.colno || 0}` : ''}(分頁 ${currentTab}、最後操作 ${diagLastAct || '無'})`));
    window.addEventListener('unhandledrejection', e => diag('錯誤', `非同步:${e && e.reason && (e.reason.message || e.reason) || '?'}(分頁 ${currentTab}、最後操作 ${diagLastAct || '無'})`));
  }
  diag('啟動', '打開 app,版本 ' + BUILD_VERSION.split(' · ').pop());

  const local = readLocal();
  if (local) state = normalize(local);
  lastSavedObj = JSON.parse(JSON.stringify(state));   // 刪除紀錄從這裡開始比(見 recordTombs)
  loadBacktestHistoryCache();

  const content = document.getElementById('content');
  content.addEventListener('input', e => {
    const k = e.target.dataset && e.target.dataset.k;
    if (k) onField(k, e.target);
  });
  content.addEventListener('change', e => {
    if (e.target.id === 'importFile' && e.target.files && e.target.files[0]){
      importJSON(e.target.files[0]);
      e.target.value = '';
      return;
    }
    // 一般型房貸的利率:一個字一個字打的時候(2 → 2.3)不能每一下都當成「升降息」記一段過去利率,離開欄位才算數
    const dk = e.target.dataset && String(e.target.dataset.k || '');
    if (dk.startsWith('lo-rate-')){ applyLoanRate(dk.slice(8), e.target.value); renderAll(); return; }
    // 繳款日:打「1 → 15」途中的「1」不能先把本月的自動還本搬到 1 號,離開欄位才算數
    if (dk === 'lev-payDay'){ applyPayDay(e.target.value); renderAll(); return; }
    if ((dk.startsWith('lo-') || dk.startsWith('lr-')) && !(document.activeElement && document.activeElement.tagName === 'INPUT')){ renderAll(); return; }
    // 資產頁改過去月份的細項:離開欄位後重畫,圖跟每個月的增減才會跟著變
    if (e.target.dataset && String(e.target.dataset.k || '').startsWith('ih-') && !(document.activeElement && document.activeElement.tagName === 'INPUT')){
      renderAll();
      return;
    }
    if (e.target.dataset && e.target.dataset.k && currentTab === 'leverage'){
      refreshLeverage();
      // 損益卡不是靠 id 局部更新的,沒有游標停在欄位上時整頁重畫一次
      if (!(document.activeElement && document.activeElement.tagName === 'INPUT')) renderAll();
    }
  });
  content.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (el) onClick(el);
    // 等著「再按一次確認」時點空白處 = 取消;點輸入框不算(重畫會把游標弄掉)
    else if (pendingConfirm && !e.target.closest('input, select, textarea, label, summary')){ pendingConfirm = null; renderAll(); }
  });
  content.addEventListener('focusout', () => {
    setTimeout(() => {
      if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
      if (pendingRemote){ const d2 = pendingRemote; pendingRemote = null; applyRemote(d2); }
      else if (editingTx || editingTrade) renderAll();
    }, 60);
  });
  document.querySelectorAll('[data-tab]').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });
  applyPrivacy();
  const eye = document.getElementById('privacyBtn');
  if (eye) eye.addEventListener('click', togglePrivacy);

  storageMode = 'local';
  maybePostInterest();
  maybeSnapshot();
  maybeDailySnapshot();
  renderAll();
  maybeAutoQuote();
  connectCloud();   // 連上雲端後會自動接手並更新畫面
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') onForeground(); });
  // 桌機分頁可能一直開著、一直在前景,不會有 visibilitychange
  const fg = setInterval(() => { if (document.visibilityState !== 'hidden') onForeground(true); }, 10 * 60000);
  if (fg && fg.unref) fg.unref();   // 瀏覽器回傳數字沒有 unref;node 跑測試時不讓計時器卡住結束
  if (UPDATE_CHECK_ENABLED){
    document.getElementById('updateBanner').addEventListener('click', applyUpdate);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkForUpdate(); });
    setInterval(checkForUpdate, 30 * 60000);   // 桌機分頁可能一直開著、一直在前景
    checkForUpdate();
  }
  setTimeout(maybeBackup, 4000);   // 讓畫面與雲端先就緒
  if (window.claude && typeof window.claude.use === 'function'){
    window.claude.use('downloads').then(ns => { downloadsNs = ns; }).catch(() => {});
  }
}

init();
</script>
